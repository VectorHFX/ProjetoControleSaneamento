<script>
window.CPTFechamento=(()=>{"use strict";const ic=(n,e)=>window.CPTic?window.CPTic(n,e):e;let ui=null,ticket=0,operacao=null,gerando=false,entregas=null;const INTRO=["Entregas do m\xEAs","Relat\xF3rio, anexos, Programa Parceiros e atendimentos: o que falta, quem cuida e o prazo de cada um."];const PASSOS=["afazer","preparo","revisao","entregue"];const hoje=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Sao_Paulo"}).format(new Date);const op=()=>"OP-"+(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));const $=id=>document.getElementById(id);const rotulo={ok:"OK",atencao:"Aten\xE7\xE3o",pendente:"Pendente"};const cor={ok:"green",atencao:"orange",pendente:"orange"};async function render(){const mine=++ticket,mes=ui.state.mes;ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"loading-label\"><span class=\"spinner\"></span>Conferindo a compet\xEAncia\u2026</div><div class=\"skel-list\" aria-hidden=\"true\"><div class=\"skeleton\"></div><div class=\"skeleton\"></div></div>";const pedidoEntregas=ui.call("carregarEntregasDoMesCPT",mes).then(r=>{entregas=r},e=>{entregas={erro:e.message}});try{const d=await ui.call("conferirFechamentoCPT",mes);if(mine!==ticket||ui.state.route!=="fechamento")return;draw(d)}catch(e){if(mine===ticket)ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"notice\">".concat(ui.esc(e.message),"</div>");return}await pedidoEntregas;if(mine===ticket&&ui.state.route==="fechamento")desenharEntregas()}function numero(rot,valor,nota){return"<div class=\"kpi\" style=\"--accent:#12678f;--tint:#e6f1f7\"><div class=\"kpi-top\"><span>".concat(rot,"</span></div><div class=\"kpi-value\">").concat(ui.num(valor),"</div><div class=\"kpi-note\">").concat(nota,"</div></div>")}function draw(d){const n=d.numeros,s=d.satisfacao;ui.view.innerHTML=ui.intro(...INTRO)+"<section id=\"entregasMes\" class=\"entregas-mes\" aria-label=\"As quatro entregas do m\xEAs\"><div class=\"entrega-grid\">".concat("<div class=\"skeleton entrega-skel\"></div>".repeat(4),"</div></section>\n      <section class=\"kpis\" aria-label=\"N\xFAmeros do m\xEAs\">\n        ").concat(numero("Atividades",n.atividades,ui.num(n.participantes)+" participa\xE7\xF5es \xB7 "+ui.num(n.frentes)+" frentes"),"\n        ").concat(numero("Relatos prontos",n.relatosProntos,"de "+ui.num(n.relatos)+" relatos de atividade"),"\n        ").concat(numero("Pesquisas de satisfa\xE7\xE3o",n.satisfacao,"meta de "+s.meta+" no m\xEAs"),"\n        ").concat(numero("Manifesta\xE7\xF5es",n.casosAbertos,"em andamento \xB7 "+ui.num(n.casosConcluidos)+" conclu\xEDdas no m\xEAs"),"\n      </section>\n      <section class=\"panel\"><div class=\"panel-head\"><div><h2>O que conferir antes de gerar</h2><p>Itens \u201CPendente\u201D afetam n\xFAmeros do relat\xF3rio; \u201CAten\xE7\xE3o\u201D pede revis\xE3o.</p></div></div>\n        <div class=\"fechamento-lista\">").concat(d.verificacoes.map(v=>"<div class=\"fechamento-item\"><span class=\"badge ".concat(cor[v.situacao],"\">").concat(rotulo[v.situacao],"</span><div><strong>").concat(ui.esc(v.nome),"</strong><p>").concat(ui.esc(v.detalhe),"</p></div>").concat(v.acao?"<button class=\"button ghost\" data-fechamento-ir='".concat(ui.esc(JSON.stringify(v.acao)),"'>Abrir ").concat(ui.icon("arrow"),"</button>"):"<span></span>","</div>")).join(""),"</div>\n      </section>\n      <section class=\"panel\"><div class=\"panel-head\"><div><h2>Pesquisa de satisfa\xE7\xE3o por semana</h2><p>Meta de 15 por semana e 60 no m\xEAs, contadas separadamente. Semanas parciais est\xE3o marcadas.</p></div></div>\n        <table class=\"simple-table\"><thead><tr><th>Semana</th><th>Realizadas</th><th>Meta semanal</th></tr></thead><tbody>").concat(s.semanas.map(w=>"<tr><td>".concat(ui.date(w.de)," a ").concat(ui.date(w.ate)).concat(w.parcial?" (parcial)":"","</td><td>").concat(w.total,"</td><td>").concat(w.total>=w.meta?"Atingida":"Faltam "+(w.meta-w.total),"</td></tr>")).join(""),"</tbody><tfoot><tr><th>M\xEAs</th><th>").concat(s.total,"</th><th>").concat(s.total>=s.meta?"Meta mensal atingida":"Faltam "+(s.meta-s.total)+" para 60","</th></tr></tfoot></table>\n      </section>\n      <section class=\"panel\" id=\"gerarRelatorio\"><div class=\"panel-head\"><div><h2>Gerar base do relat\xF3rio</h2><p>Cria um Google Docs novo, no formato do Orientador (itens 1 a 13), e a planilha de manifesta\xE7\xF5es. Nada \xE9 sobrescrito: cada gera\xE7\xE3o \xE9 uma nova vers\xE3o.</p></div></div>\n        <form id=\"gerarForm\" class=\"gerar-form\"><label class=\"field\">N\xFAmero do relat\xF3rio<input name=\"numero\" type=\"number\" min=\"1\" max=\"999\" value=\"").concat(ui.esc(d.numeroSugerido||""),"\" placeholder=\"Ex.: 15\"><span class=\"small muted\">Sugerido pela sequ\xEAncia (n\xBA 14 = setembro/2026).</span></label>\n        <button class=\"button\" type=\"submit\">Gerar base de ").concat(ui.esc(monthName(d.mes)),"</button></form>\n        <p class=\"small muted\">Leva de 1 a 4 minutos, conforme a quantidade de fotos. Textos que dependem de an\xE1lise ficam marcados com [COMPLETAR] no documento.</p>\n        <div id=\"gerarResultado\" aria-live=\"polite\"></div>\n        ").concat(d.historico.length?"<h3 class=\"answers-head\">Gera\xE7\xF5es deste m\xEAs</h3>".concat(d.historico.map(h=>"<p>Vers\xE3o ".concat(ui.esc(h.versao)," \xB7 ").concat(new Date(h.em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short",timeZone:"America/Sao_Paulo"})," \xB7 ").concat(ui.esc(h.autor)," \xB7 <a href=\"").concat(ui.esc(h.documento),"\" target=\"_blank\" rel=\"noopener noreferrer\">Documento</a> \xB7 <a href=\"").concat(ui.esc(h.planilha),"\" target=\"_blank\" rel=\"noopener noreferrer\">Manifesta\xE7\xF5es</a></p>")).join("")):"","\n      </section>\n      <section class=\"panel\" id=\"gerarFichas\"><div class=\"panel-head\"><div><h2>Fichas oficiais do m\xEAs (ANEXO 4)</h2><p>Gera no modelo Sabesp a ficha de cada caso em aberto no fim do m\xEAs e de cada caso conclu\xEDdo no m\xEAs, e junta os PDFs na pasta do m\xEAs. Fichas sem mudan\xE7a n\xE3o s\xE3o refeitas.</p></div></div>\n        <div class=\"dialog-actions\"><button class=\"button secondary\" id=\"pacoteFichas\">").concat(ui.icon("file"),"Gerar fichas de ").concat(ui.esc(monthName(d.mes)),"</button></div><div id=\"pacoteResultado\" aria-live=\"polite\"></div>\n      </section>");$("pacoteFichas").onclick=ev=>pacote(d.mes,ev.currentTarget,false);$("gerarForm").onsubmit=ev=>{ev.preventDefault();gerar(d.mes,ev.target)}}function desenharEntregas(){const box=$("entregasMes");if(!box||!entregas)return;if(entregas.erro){box.innerHTML="<div class=\"notice\">".concat(ui.esc(entregas.erro),"</div>");return}const e=entregas,feitas=e.cartoes.filter(c=>c.situacao==="entregue").length;box.innerHTML="<div class=\"entregas-topo\"><h2>".concat(feitas===4?"Tudo entregue em "+ui.esc(monthName(e.mes))+" "+ic("sparkle","\uD83C\uDF89"):ui.num(feitas)+" de 4 entregas feitas","</h2>\n        <div class=\"entregas-barra\" role=\"meter\" aria-valuemin=\"0\" aria-valuemax=\"4\" aria-valuenow=\"").concat(feitas,"\" aria-label=\"").concat(feitas," de 4 entregues\"><span style=\"width:").concat(feitas*25,"%\"></span></div>\n        ").concat(e.podeAlterar?"":"<p class=\"small muted\">Durante os testes, s\xF3 a administra\xE7\xE3o t\xE9cnica altera as entregas. Voc\xEA acompanha por aqui.</p>","</div>\n      <div class=\"entrega-grid\">").concat(e.cartoes.map(cartao).join(""),"</div>")}function cartao(c){const e=entregas,nomes=e.nomes,i=PASSOS.indexOf(c.situacao),atrasada=c.situacao!=="entregue"&&c.prazo&&c.prazo<hoje();const resp=e.pessoas.find(p=>p.email===c.responsavel),a=c.arquivo;const ir=c.rota?"<button class=\"button ghost\" data-route=\"".concat(ui.esc(c.rota),"\">Abrir ").concat(ui.icon("arrow"),"</button>"):"<button class=\"button ghost\" data-entrega-rolar=\"".concat(c.tipo==="relatorio"?"gerarRelatorio":"gerarFichas","\">Gerar aqui \u2193</button>");return"<article class=\"entrega-card s-".concat(c.situacao,"\" data-entrega= wait ui.call("salvarEntregaDoMesCPT",{mes:e.mes,tipo,situacao:f.get("situacao"),responsavel:f.get("responsavel"),prazo:f.get("prazo"),versao:c.versao,operacaoId:op()});const k=e.cartoes.findIndex(x=>x.tipo===tipo);e.cartoes[k]=r.cartao;$("detailDialog").close();ui.toast(r.resultado);desenharEntregas();if(r.cartao.situacao==="entregue"&&c.situacao!=="entregue"){const el=document.querySelector("[data-entrega=\"".concat(tipo,"\"]"));if(el)el.classList.add("acabou-de-entregar")}}catch(err){erro.textContent=err.message;erro.hidden=false;b.disabled=false;b.textContent="Salvar"}}}function recarregarEntregas(){if(!entregas||entregas.erro)return;ui.call("carregarEntregasDoMesCPT",entregas.mes).then(r=>{entregas=r;desenharEntregas()},()=>{})}async function montarZip(b){if(gerando)return;gerando=true;const rotulo=b.textContent;b.disabled=true;b.textContent="Montando .zip\u2026";try{const r=await ui.call("zipFichasDoMesCPT",entregas.mes);ui.toast(r.resultado);entregas=await ui.call("carregarEntregasDoMesCPT",entregas.mes);desenharEntregas()}catch(e){ui.toast(e.message);b.disabled=false;b.textContent=rotulo}finally{gerando=false}}function monthName(m){return new Date(m+"-15T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}async function gerar(mes,form){if(gerando)return;gerando=true;const b=form.querySelector("button"),box=$("gerarResultado"),numeroRel=form.elements.numero.value;if(!operacao||operacao.mes!==mes||operacao.numero!==numeroRel)operacao={id:"OP-"+crypto.randomUUID(),mes,numero:numeroRel};b.disabled=true;b.textContent="Gerando\u2026 n\xE3o feche esta p\xE1gina";box.innerHTML="<div class=\"loading-label\"><span class=\"spinner\"></span>Montando o documento e inserindo as fotos dos relatos preparados\u2026</div>";try{const r=await ui.call("gerarBaseRelatorioCPT",{mes,numero:numeroRel,operacaoId:operacao.id});operacao=null;recarregarEntregas();box.innerHTML="<div class=\"notice\" role=\"status\">".concat(ui.esc(r.resultado),"</div><div class=\"dialog-actions\"><a class=\"button\" href=\"").concat(ui.esc(r.documento),"\" target=\"_blank\" rel=\"noopener noreferrer\">").concat(ui.icon("file"),"Abrir documento</a><a class=\"button secondary\" href=\"").concat(ui.esc(r.planilha),"\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir planilha de manifesta\xE7\xF5es</a></div>").concat(r.avisos&&r.avisos.length?"<details><summary>".concat(r.avisos.length," avisos</summary><p>").concat(r.avisos.map(ui.esc).join("<br>"),"</p></details>"):"")}catch(e){box.innerHTML="<div class=\"notice\">".concat(ui.esc(e.message)," Se o tempo esgotou, aguarde 2 minutos e reabra o fechamento: a gera\xE7\xE3o pode ter sido conclu\xEDda e aparecer\xE1 em \u201CGera\xE7\xF5es deste m\xEAs\u201D.</div>")}finally{gerando=false;b.disabled=false;b.textContent="Gerar base de "+monthName(mes)}}async function pacote(mes,b,continuar){if(gerando)return;gerando=true;const box=$("pacoteResultado"),rotulo=b.innerHTML;b.disabled=true;b.textContent="Gerando fichas\u2026 n\xE3o feche esta p\xE1gina";box.innerHTML="<div class=\"loading-label\"><span class=\"spinner\"></span>Preenchendo o modelo oficial e convertendo em PDF\u2026</div>";try{const r=await ui.call("gerarPacoteFichasCPT",{mes,continuar});recarregarEntregas();box.innerHTML="<div class=\"notice\" role=\"status\">".concat(ui.esc(r.resultado)," ").concat(ui.num(r.prontas)," de ").concat(ui.num(r.total)," prontas (").concat(ui.num(r.novas)," geradas agora).</div>\n        <div class=\"dialog-actions\"><a class=\"button\" href=\"").concat(ui.esc(r.pasta),"\" target=\"_blank\" rel=\"noopener noreferrer\">").concat(ui.icon("file"),"Abrir pasta das fichas</a>").concat(r.pendentes?"<button class=\"button secondary\" id=\"pacoteContinuar\">Continuar</button>":"","</div>\n        ").concat(r.erros.length?"<details open><summary>".concat(r.erros.length," ficha(s) a corrigir</summary><p>").concat(r.erros.map(x=>ui.esc(x.protocolo+": "+x.erro)).join("<br>"),"</p></details>"):"");const c=$("pacoteContinuar");if(c)c.onclick=()=>{gerando=false;pacote(mes,c,true)}}catch(e){box.innerHTML="<div class=\"notice\">".concat(ui.esc(e.message)," Clique de novo: as fichas j\xE1 geradas n\xE3o s\xE3o refeitas.</div>")}finally{gerando=false;b.disabled=false;b.innerHTML=rotulo}}function init(api){ui=api;document.addEventListener("click",ev=>{const ed=ev.target.closest("[data-entrega-editar]");if(ed){editarEntrega(ed.dataset.entregaEditar);return}const z=ev.target.closest("[data-entrega-zip]");if(z){montarZip(z);return}const ro=ev.target.closest("[data-entrega-rolar]");if(ro){const alvo=$(ro.dataset.entregaRolar);if(alvo)alvo.scrollIntoView({behavior:document.documentElement.dataset.motion==="reduce"?"auto":"smooth",block:"start"});return}const ir=ev.target.closest("[data-fechamento-ir]");if(!ir)return;const a=JSON.parse(ir.dataset.fechamentoIr);if(a.route==="registros")ui.state.filters={busca:"",procedimento:a.procedimento||"",bairro:"",obra:"",pendencia:a.pendencia||""};ui.navigate(a.route)})}return{init,render}})();
