<script>
/*
 * Recados e Contatos 2.8.0 — ferramentas comuns a toda a equipe.
 * 2.30: Recados moram no Meu espaço (aba "Recados" e cartão dos novos no "Meu dia"); embutir(el) desenha a lista ali.
 * Recados: para uma frente ou pessoa, com aviso na lateral, leitura registrada, resposta e "resolvido".
 *   Não envia e-mail nem WhatsApp. Pode levar um vínculo (material, protocolo, registro, lembrete, obra).
 * Contatos: matriz comum com observação interna e o caderno de conversas de cada contato.
 * 2.40: aba "Matriz Sabesp" — a Matriz de Contatos do cliente: todos consultam e propõem (novo, alteração, inativar);
 *      Gestão e Administrativo aprovam ou recusam com motivo; cada contato mostra o histórico; aprovado vai para a planilha.
 * Formulários abrem na janela de detalhes; o texto digitado fica na tela se algo falhar.
 */
window.CPTRecados = (() => {
  'use strict';
  const ic = (n, e) => window.CPTic ? window.CPTic(n, e) : e; // ícone no visual novo, emoji no atual
  let ui = null, ticket = 0, abaCon = 'equipe', mat = null, filtroMat = {busca: '', secao: '', limite: 50}, abrirMat = '', rec = null, alvo = null, aba = 'recebidos', con = null, filtroCon = {busca: '', tipo: '', limite: 50}, rascunhoVinculo = null;
  const LIMITE_CON = 50; // contatos por vez (2.13: linhas); "Mostrar mais" traz o resto aos poucos
  const $ = id => document.getElementById(id);
  const ops = new Map(), opId = (k, c) => { const s = JSON.stringify(c), a = ops.get(k); if (a && a.s === s) return a.id; const id = 'OP-' + crypto.randomUUID(); ops.set(k, {s, id}); return id; };
  const NOMES = {atendimento: 'Atendimento', socioambiental: 'Socioambiental', comunicacao: 'Comunicação', comercializacao: 'Comercialização', gestao: 'Gestão', administrativo: 'Administrativo'};
  const quando = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit', timeZone: 'America/Sao_Paulo'}) + ' ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'}); };
  const dialogo = (tipo, titulo, html) => { $('detailType').textContent = tipo; $('detailTitle').textContent = titulo; $('detailContent').innerHTML = html; if (!$('detailDialog').open) $('detailDialog').showModal(); };
  const fechar = () => { if ($('detailDialog').open) $('closeDialog').click(); };
  const erro = (id, e) => { const b = $(id); if (b) { b.hidden = false; b.textContent = e.message; } };

  // ---------------- Avisos (contador na lateral) ----------------
  let ultimaContagem = 0; // evita perguntar ao servidor de novo a cada troca de aba do navegador
  let avisos = null; // última contagem, para repor os números quando a barra de atalhos do celular é remontada
  /** Números de recados e lembretes na lateral e na barra de atalhos do celular. */
  function marcar() {
    if (!avisos) return;
    // 2.30: recados novos e tarefas de hoje (lembretes) somam no "Meu espaço".
    [['meuespaco', (avisos.recados || 0) + (avisos.lembretes || 0)]].forEach(([rota, n]) => {
      document.querySelectorAll('.nav-item[data-route="' + rota + '"], .tab-item[data-route="' + rota + '"]').forEach(b => {
        let s = b.querySelector('.nav-badge'); if (!n) { if (s) s.remove(); return; }
        if (!s) { s = document.createElement('span'); s.className = 'nav-badge'; b.append(s); } s.textContent = n > 99 ? '99+' : n; s.setAttribute('aria-label', [avisos.recados ? avisos.recados + (avisos.recados === 1 ? ' recado novo' : ' recados novos') : '', avisos.lembretes ? avisos.lembretes + (avisos.lembretes === 1 ? ' tarefa recebida para hoje' : ' tarefas recebidas para hoje') : ''].filter(Boolean).join(' e '));
      });
    });
  }
  async function contar(silencioso) {
    ultimaContagem = Date.now();
    try {
      const r = await ui.call('contarAvisosCPT'); avisos = r; marcar();
      // Aviso de baixa prioridade: não apaga a mensagem de uma ação que a pessoa acabou de fazer.
      if (!silencioso && r.recados && document.getElementById('toast').hidden) ui.toast(r.recados === 1 ? 'Você tem 1 recado novo.' : 'Você tem ' + r.recados + ' recados novos.');
    } catch (_) {}
  }

  // ---------------- Recados ----------------
  /** Lista de recados dentro de outro lugar (o Meu espaço). Usa a última lista e atualiza em seguida. */
  async function embutir(el) {
    alvo = el; const mine = ++ticket;
    if (rec) desenhar(); else el.innerHTML = '<div class="loading-label"><span class="spinner"></span>Abrindo seus recados…</div>';
    try { const r = await ui.call('listarRecadosCPT'); if (mine !== ticket || alvo !== el || !el.isConnected) return; rec = r; desenhar(); }
    catch (e) { if (mine === ticket && el.isConnected && !rec) el.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  const visivel = () => alvo && alvo.isConnected;
  const destino = r => [...r.para.frentes.map(f => NOMES[f] || f), ...r.para.pessoas.map(e => (rec.pessoas.find(p => p.email === e) || {nome: e}).nome)].join(', ');
  function desenhar() {
    if (!visivel() || !rec) return;
    const filtros = {recebidos: r => r.paraMim && r.situacao !== 'resolvido', enviados: r => r.meu && r.situacao !== 'resolvido', resolvidos: r => r.situacao === 'resolvido'};
    const lista = rec.itens.filter(filtros[aba]), n = k => rec.itens.filter(filtros[k]).length;
    alvo.innerHTML = `<div class="tool-head"><div class="segmented painel-tabs" role="tablist">${[['recebidos', 'Para mim'], ['enviados', 'Que enviei'], ['resolvidos', 'Resolvidos']].map(([k, t]) => `<button role="tab" aria-selected="${aba === k}" class="${aba === k ? 'chosen' : ''}" data-rec-aba="${k}">${t} <span class="count-pill">${n(k)}</span></button>`).join('')}</div>
      <button class="button" data-rec-novo>${ui.icon('plus')}Novo recado</button></div>
      <div class="simple-list">${lista.map(r => `<button class="simple-row ${r.paraMim && !r.lido ? 'is-new' : ''}" data-rec-abrir="${ui.esc(r.id)}"><span class="row-dot" aria-hidden="true"></span>
        <span class="row-main"><strong>${r.importante ? '<span class="tag-important">Importante</span> ' : ''}${ui.esc(r.assunto)}</strong><small>${r.meu ? 'Para ' + ui.esc(destino(r)) : 'De ' + ui.esc(r.nomeAutor || r.criadoPor)} · ${ui.esc(quando(r.atualizadoEm))}${r.respostas.length ? ' · ' + r.respostas.length + (r.respostas.length === 1 ? ' resposta' : ' respostas') : ''}${r.prazo ? ' · prazo ' + ui.date(r.prazo) : ''}</small></span>
        ${r.paraMim && !r.lido ? '<span class="badge orange">Novo</span>' : ''}</button>`).join('') || `<p class="empty-line">${aba === 'recebidos' ? 'Nenhum recado esperando por você.' : aba === 'enviados' ? 'Você não tem recados em aberto.' : 'Nenhum recado resolvido ainda.'}</p>`}</div>`;
  }
  function vinculoHtml(v) {
    if (!v) return '';
    const rot = {link: 'Material', protocolo: 'Atendimento', obra: 'Obra', lembrete: 'Lembrete', registro: 'Registro'}[v.tipo];
    const acao = v.tipo === 'protocolo' ? `data-case="${ui.esc(v.id)}"` : v.tipo === 'registro' ? `data-record="${ui.esc(v.id)}"` : v.tipo === 'obra' ? 'data-route="obras"' : v.tipo === 'lembrete' ? 'data-route="meuespaco"' : '';
    return `<div class="link-chip"><span>${rot}: <strong>${ui.esc(v.titulo || v.id)}</strong></span>${v.url ? `<a class="button ghost" href="${ui.esc(ui.safeURL(v.url))}" target="_blank" rel="noopener noreferrer">Abrir link</a>` : acao ? `<button class="button ghost" ${acao}>Abrir</button>` : ''}</div>`;
  }
  async function abrir(id) {
    if (!rec) { try { rec = await ui.call('listarRecadosCPT'); } catch (e) { ui.toast(e.message); return; } }
    const r = rec.itens.find(x => x.id === id); if (!r) return;
    const corpo = () => {
      const x = rec.itens.find(y => y.id === id);
      return `<p class="small muted">De ${ui.esc(x.nomeAutor || x.criadoPor)} para ${ui.esc(destino(x))} · ${ui.esc(quando(x.criadoEm))}${x.prazo ? ' · prazo ' + ui.date(x.prazo) : ''}</p>${vinculoHtml(x.vinculo)}
        <div class="message"><p>${ui.esc(x.texto)}</p></div>${x.respostas.map(a => `<div class="message reply"><small>${ui.esc(a.nome || a.autor)} · ${ui.esc(quando(a.em))}</small><p>${ui.esc(a.texto)}</p></div>`).join('')}
        <div id="recErro" class="notice" hidden></div>
        <form id="recResposta" class="stack-form"><label class="field">Responder<textarea name="texto" rows="3" maxlength="2000" placeholder="Escreva sua resposta" required></textarea></label>
        <div class="dialog-actions"><button class="button" type="submit">Enviar resposta</button><button class="button secondary" type="button" data-rec-situacao="${x.situacao === 'resolvido' ? 'reabrir' : 'resolver'}">${x.situacao === 'resolvido' ? 'Reabrir' : 'Marcar como resolvido'}</button></div></form>`;
    };
    dialogo('RECADO', r.assunto, corpo()); $('detailContent').dataset.recado = id;
    if (r.paraMim && !r.lido) try { const x = await ui.call('agirRecadoCPT', {id, acao: 'lido'}); atualizarItem(x.recado); contar(true); } catch (_) {}
    $('detailContent').__corpo = corpo;
  }
  function atualizarItem(r) { const i = rec.itens.findIndex(x => x.id === r.id); if (i >= 0) rec.itens[i] = r; else rec.itens.unshift(r); document.dispatchEvent(new CustomEvent('cpt:recado', {detail: r})); }
  async function agir(acao, texto) {
    const id = $('detailContent').dataset.recado; const dados = {id, acao, texto};
    try { const r = await ui.call('agirRecadoCPT', {...dados, operacaoId: opId('rec-' + acao + id, dados)}); atualizarItem(r.recado); ui.toast(r.resultado); if ($('detailContent').__corpo) $('detailContent').innerHTML = $('detailContent').__corpo(); desenhar(); contar(true); }
    catch (e) { erro('recErro', e); }
  }
  /** Novo recado. vinculo opcional: {tipo,id,titulo,url}; usado por materiais e lembretes ("Avisar por recado"). */
  async function novo(vinculo, sugestao) {
    if (!rec) { try { rec = await ui.call('listarRecadosCPT'); } catch (e) { ui.toast(e.message); return; } }
    rascunhoVinculo = vinculo || null; const s = sugestao || {};
    dialogo('RECADO', 'Novo recado', `<form id="recForm" class="stack-form"><div id="recErro" class="notice" hidden></div>
      <fieldset class="choice-group"><legend>Para qual frente?</legend>${Object.entries(NOMES).map(([k, n]) => `<label class="choice"><input type="checkbox" name="frente" value="${k}" ${(s.frentes || []).includes(k) ? 'checked' : ''}>${n}</label>`).join('')}</fieldset>
      <details class="people-pick" ${s.pessoas && s.pessoas.length ? 'open' : ''}><summary>Ou escolher pessoas</summary>${rec.pessoas.filter(p => p.email !== (ui.state.perfil || {}).email).map(p => `<label class="choice"><input type="checkbox" name="pessoa" value="${ui.esc(p.email)}" ${(s.pessoas || []).includes(p.email) ? 'checked' : ''}>${ui.esc(p.nome)}</label>`).join('')}</details>
      ${vinculo ? vinculoHtml(vinculo) : ''}
      <label class="field">Assunto<input name="assunto" maxlength="120" required value="${ui.esc(s.assunto || '')}" placeholder="Ex.: Fotos da ação na escola"></label>
      <label class="field">Mensagem<textarea name="texto" rows="5" maxlength="2000" required placeholder="Escreva o que a pessoa precisa saber ou fazer.">${ui.esc(s.texto || '')}</textarea></label>
      <details class="mais-detalhes"><summary>Mais detalhes <small>prazo e importante</small></summary><div class="mais-detalhes-corpo"><div class="form-row"><label class="field">Prazo (se tiver)<input type="date" name="prazo"></label><label class="choice"><input type="checkbox" name="importante">Marcar como importante</label></div></div></details>
      <div class="dialog-actions"><button class="button" type="submit">Enviar recado</button></div></form>`);
  }
  async function enviar(f) {
    const b = f.querySelector('[type=submit]'), dados = {para: {frentes: [...f.querySelectorAll('[name=frente]:checked')].map(x => x.value), pessoas: [...f.querySelectorAll('[name=pessoa]:checked')].map(x => x.value)},
      assunto: f.elements.assunto.value, texto: f.elements.texto.value, prazo: f.elements.prazo.value, importante: f.elements.importante.checked, vinculo: rascunhoVinculo};
    b.disabled = true;
    try { const r = await ui.call('enviarRecadoCPT', {...dados, operacaoId: opId('recNovo', dados)}); atualizarItem(r.recado); ops.delete('recNovo'); ui.toast(r.resultado); fechar(); if (visivel()) { aba = 'enviados'; desenhar(); } }
    catch (e) { erro('recErro', e); } finally { b.disabled = false; }
  }

  // ---------------- Contatos ----------------
  const INTRO_C = ['Contatos', 'Matriz de contatos da equipe. Procure antes de cadastrar e registre cada conversa no contato.'];
  const abasCon = () => `<div class="segmented painel-tabs" role="tablist" aria-label="Partes de contatos">${[['equipe', 'Equipe'], ['matriz', 'Matriz Sabesp']].map(([k, n]) => `<button role="tab" aria-selected="${abaCon === k}" class="${abaCon === k ? 'chosen' : ''}" data-con-aba="${k}">${n}</button>`).join('')}</div>`;
  async function renderContatos() {
    if (abaCon === 'matriz') { renderMatriz(); return; }
    const mine = ++ticket; ui.view.innerHTML = ui.intro(...INTRO_C) + '<div class="loading-label"><span class="spinner"></span>Abrindo a matriz de contatos…</div><div class="skel-list" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';
    try { con = await ui.call('listarContatosCPT'); if (mine !== ticket || ui.state.route !== 'contatos') return; desenharContatos(); }
    catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro(...INTRO_C) + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  const fone = t => String(t || '').replace(/\D/g, '');
  function desenharContatos(manterFoco) {
    const b = ui.norm(filtroCon.busca), lista = con.itens.filter(c => (!filtroCon.tipo || c.tipo === filtroCon.tipo) && (!b || ui.norm([c.nome, c.instituicao, c.bairro, c.etiquetas, c.frente, c.telefone, c.email].join(' ')).includes(b)));
    const vis = lista.slice(0, filtroCon.limite || LIMITE_CON);
    // 2.13: uma linha por contato — Nome · Instituição · Tipo · Bairro, com Ligar e WhatsApp na própria linha.
    const acoes = c => { const f = fone(c.telefone); return (c.telefone ? `<a class="row-icon" href="tel:${ui.esc(f)}" aria-label="Ligar para ${ui.esc(c.nome || c.instituicao)}" title="Ligar">${ic('phone', '📞')}</a>` : '') + (f.length >= 10 ? `<a class="row-icon" href="https://wa.me/55${ui.esc(f.replace(/^55/, ''))}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp de ${ui.esc(c.nome || c.instituicao)}" title="WhatsApp">${ic('message', '💬')}</a>` : ''); };
    const lista_ = vis.map(c => `<div class="list-row cor-${ui.esc(c.cor)}" role="button" tabindex="0" data-con-abrir="${ui.esc(c.id)}" aria-label="${ui.esc(c.nome || c.instituicao)}"><span class="c-nome">${ui.esc(c.nome || c.instituicao)}${c.registros && c.registros.length ? ` <small class="muted">· ${c.registros.length} ${c.registros.length === 1 ? 'conversa' : 'conversas'}</small>` : ''}</span><span class="c-inst">${ui.esc(c.nome ? c.instituicao || '—' : '—')}</span><span class="c-tipo">${ui.esc(c.tipo)}</span><span class="c-bairro">${ui.esc([c.bairro, c.frente].filter(Boolean).join(' · ') || '—')}</span><span class="c-acoes">${acoes(c)}</span></div>`).join('');
    const cabCon = '<div class="list-head" aria-hidden="true"><span data-col>Nome</span><span data-col>Instituição</span><span data-col>Tipo</span><span data-col>Bairro</span><span data-col></span></div>';
    const html = ui.intro(...INTRO_C) + abasCon() + `<section class="panel filter-panel"><form id="conFiltro" class="filters"><label class="field">Procurar<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroCon.busca)}" placeholder="Nome, instituição, bairro, telefone…" maxlength="100"></span></label>
      <label class="field">Tipo<select name="tipo"><option value="">Todos</option>${con.tipos.map(t => `<option ${filtroCon.tipo === t ? 'selected' : ''}>${ui.esc(t)}</option>`).join('')}</select></label><button class="button" type="button" data-con-novo>${ui.icon('plus')}Novo contato</button></form></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'contato' : 'contatos'}</span><span>Dados de pessoas: use só para o trabalho</span></div>${lista_ ? `<div class="list-table contacts-table">${cabCon}${lista_}</div>` : '<p class="empty-line">Nenhum contato encontrado. Cadastre com "Novo contato".</p>'}${lista.length > vis.length ? `<div class="load-more"><button class="button secondary" data-con-mais>Mostrar mais ${Math.min(LIMITE_CON, lista.length - vis.length)}</button></div>` : ''}`;
    const pos = manterFoco ? document.activeElement.selectionStart : null; ui.view.innerHTML = html;
    if (manterFoco) { const i = $('conFiltro').elements.busca; i.focus(); i.setSelectionRange(pos, pos); }
  }
  function abrirContato(id) {
    const c = con.itens.find(x => x.id === id); if (!c) return;
    window.CPTDetalhe.abrir(document.querySelector('.contacts-table .list-row[data-con-abrir="' + String(id).replace(/"/g, '') + '"]'));
    const hoje = new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
    dialogo('CONTATO', c.nome || c.instituicao, `<dl class="detail-summary">${[['Instituição, função ou cargo', c.instituicao], ['Tipo', c.tipo], ['Telefone', c.telefone], ['E-mail', c.email], ['Endereço', c.endereco], ['Bairro', c.bairro], ['Frente de obra', c.frente], ['Etiquetas', c.etiquetas]].filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${ui.esc(v)}</dd></div>`).join('')}</dl>
      ${c.observacao ? `<h3 class="answers-head">Observação interna</h3><p class="message">${ui.esc(c.observacao)}</p>` : ''}
      <h3 class="answers-head">Conversas registradas</h3>${(c.registros || []).slice().reverse().map(r => `<div class="message reply"><small>${ui.date(r.em)} · ${ui.esc(r.canal)} · ${ui.esc(r.nome || r.autor)}</small><p>${ui.esc(r.texto)}</p></div>`).join('') || '<p class="muted">Nenhuma conversa registrada ainda.</p>'}
      <div id="conErro" class="notice" hidden></div>
      <form id="conConversa" class="stack-form" data-id="${ui.esc(c.id)}"><div class="form-row"><label class="field">Data<input type="date" name="data" value="${hoje}" required></label><label class="field">Canal<select name="canal">${con.canais.map(x => `<option>${x}</option>`).join('')}</select></label></div>
        <label class="field">O que foi conversado<textarea name="texto" rows="3" maxlength="1500" required placeholder="Resumo curto: assunto, combinado e próximo passo."></textarea></label>
        <div class="dialog-actions"><button class="button" type="submit">Registrar conversa</button>${c.podeEditar ? `<button class="button secondary" type="button" data-con-editar="${ui.esc(c.id)}">Editar cadastro</button>` : ''}</div></form>`);
  }
  function formContato(c) {
    c = c || {cor: 'azul', tipo: ''};
    dialogo('CONTATO', c.id ? 'Editar contato' : 'Novo contato', `<form id="conForm" class="stack-form" data-id="${ui.esc(c.id || '')}" data-versao="${c.versao || 0}"><div id="conErro" class="notice" hidden></div>
      <div class="form-row"><label class="field">Nome da pessoa<input name="nome" maxlength="120" value="${ui.esc(c.nome || '')}"></label><label class="field">Instituição, função ou cargo<input name="instituicao" maxlength="200" value="${ui.esc(c.instituicao || '')}"></label></div>
      <div class="form-row"><label class="field">Tipo<select name="tipo" required><option value="">Escolha</option>${con.tipos.map(t => `<option ${c.tipo === t ? 'selected' : ''}>${ui.esc(t)}</option>`).join('')}</select></label><label class="field">Telefone<input name="telefone" maxlength="60" inputmode="tel" value="${ui.esc(c.telefone || '')}"></label></div>
      <details class="mais-detalhes" ${c.id && (c.email || c.endereco || c.bairro || c.frente || c.etiquetas || c.observacao || (c.cor && c.cor !== 'azul')) ? 'open' : ''}><summary>Mais detalhes <small>e-mail, endereço, etiquetas, sinalizador e observação</small></summary><div class="mais-detalhes-corpo">
      <div class="form-row"><label class="field">E-mail<input name="email" type="email" maxlength="160" value="${ui.esc(c.email || '')}"></label><label class="field">Sinalizador<select name="cor">${[['azul', 'Azul (padrão)'], ['verde', 'Verde (parceiro)'], ['amarelo', 'Amarelo (atenção)'], ['vermelho', 'Vermelho (cuidado)'], ['cinza', 'Cinza (inativo)']].map(([k, n]) => `<option value="${k}" ${c.cor === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <div class="form-row"><label class="field">Endereço<input name="endereco" maxlength="300" value="${ui.esc(c.endereco || '')}"></label><label class="field">Bairro<input name="bairro" maxlength="120" value="${ui.esc(c.bairro || '')}"></label></div>
      <div class="form-row"><label class="field">Frente de obra<input name="frente" maxlength="200" value="${ui.esc(c.frente || '')}"></label><label class="field">Etiquetas<input name="etiquetas" maxlength="200" value="${ui.esc(c.etiquetas || '')}" placeholder="Ex.: escola, horta, imprensa"></label></div>
      <label class="field">Observação interna<textarea name="observacao" rows="3" maxlength="2000" placeholder="Como abordar, melhor horário, cuidados.">${ui.esc(c.observacao || '')}</textarea></label></div></details>
      <div class="dialog-actions"><button class="button" type="submit">Salvar contato</button>${c.id ? '<button class="button ghost" type="button" data-con-arquivar>Arquivar</button>' : ''}</div></form>`);
  }
  async function salvarContato(f, arquivar) {
    const b = f.querySelector('[type=submit]'), dados = Object.fromEntries(new FormData(f)); dados.id = f.dataset.id; dados.versao = Number(f.dataset.versao); dados.arquivado = !!arquivar; dados.confirmarDuplicado = f.dataset.dup === '1';
    b.disabled = true;
    try { const r = await ui.call('salvarContatoCPT', {...dados, operacaoId: opId('con' + dados.id, dados)}); const i = con.itens.findIndex(x => x.id === r.contato.id); if (r.contato.arquivado) con.itens.splice(i, 1); else if (i >= 0) con.itens[i] = r.contato; else con.itens.push(r.contato); ui.toast(r.resultado); fechar(); desenharContatos(); }
    catch (e) { if (/Já existe/.test(e.message)) { f.dataset.dup = '1'; e.message += ' Se for outra pessoa, clique em Salvar de novo.'; } erro('conErro', e); } finally { b.disabled = false; }
  }
  async function registrarConversa(f) {
    const b = f.querySelector('[type=submit]'), dados = {id: f.dataset.id, data: f.elements.data.value, canal: f.elements.canal.value, texto: f.elements.texto.value}; b.disabled = true;
    try { const r = await ui.call('registrarConversaContatoCPT', {...dados, operacaoId: opId('conv' + dados.id, dados)}); const i = con.itens.findIndex(x => x.id === r.contato.id); con.itens[i] = r.contato; ui.toast(r.resultado); abrirContato(r.contato.id); desenharContatos(); }
    catch (e) { erro('conErro', e); } finally { b.disabled = false; }
  }

  // ---------------- Matriz Sabesp (2.40) ----------------
  const INTRO_M = ['Contatos', 'Matriz de Contatos da Sabesp: documento do cliente. Todos consultam e propõem; a Gestão ou o Administrativo aprovam antes de valer.'];
  const TIPOS_P = {novo: 'Contato novo', alteracao: 'Alteração', inativar: 'Inativar', reativar: 'Reativar'};
  async function renderMatriz() {
    const mine = ++ticket;
    ui.view.innerHTML = ui.intro(...INTRO_M) + abasCon() + '<div class="loading-label"><span class="spinner"></span>Abrindo a Matriz de Contatos…</div>';
    try {
      mat = await ui.call('listarMatrizCPT'); if (mine !== ticket || ui.state.route !== 'contatos' || abaCon !== 'matriz') return;
      desenharMatriz(); if (abrirMat) { const id = abrirMat; abrirMat = ''; abrirMatriz(id); }
    } catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro(...INTRO_M) + abasCon() + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  const nomeMat = c => (c.situacao === 'pendente' && c.proposta ? c.proposta.campos.nome : c.nome) || 'Contato';
  /** O que a proposta muda: campos do contato novo, ou "antes → depois" na alteração. */
  function diff(c) {
    const p = c.proposta; if (!p) return '';
    if (p.tipo === 'novo') return `<dl class="mat-diff">${Object.entries(mat.campos).filter(([k]) => p.campos[k]).map(([k, n]) => `<div><dt>${n}</dt><dd>${ui.esc(p.campos[k])}</dd></div>`).join('')}<div><dt>Seção</dt><dd>${ui.esc(p.secao)}</dd></div></dl>`;
    if (p.tipo === 'alteracao') return `<dl class="mat-diff">${Object.entries(mat.campos).filter(([k]) => String(p.campos[k] || '') !== String(c[k] || '')).map(([k, n]) => `<div><dt>${n}</dt><dd><del>${ui.esc(c[k] || '—')}</del> → <ins>${ui.esc(p.campos[k] || '—')}</ins></dd></div>`).join('')}</dl>`;
    return p.motivo ? `<p class="small">Motivo: ${ui.esc(p.motivo)}</p>` : '';
  }
  function desenharMatriz(manterFoco) {
    const m = mat, b = ui.norm(filtroMat.busca);
    if (!m.importada) {
      ui.view.innerHTML = ui.intro(...INTRO_M) + abasCon() + `<section class="panel"><div class="panel-head"><div><span class="eyebrow">PRIMEIRO PASSO</span><h2>Trazer a Matriz para a aplicação</h2><p>Uma vez só: cada contato da aba "Matriz de Contatos" vira um contato aprovado, com a seção de origem. A planilha não é alterada na importação. Depois disso, a aplicação passa a ser a fonte e grava na planilha o que for aprovado.</p></div></div>
        ${m.podeAprovar ? '<div id="msErro" class="notice" hidden></div><button class="button" data-ms-importar>Importar a Matriz</button>' : '<p class="muted">A Gestão ou o Administrativo fazem a importação.</p>'}</section>`;
      return;
    }
    const pend = m.itens.filter(c => c.proposta), lista = m.itens.filter(c => c.situacao !== 'pendente' && (!filtroMat.secao || c.secao === filtroMat.secao) && (!b || ui.norm([c.nome, c.pessoa, c.secao, c.telefone, c.email, c.endereco].join(' ')).includes(b)));
    const vis = lista.slice(0, filtroMat.limite), num = t => String(t || '').replace(/\D/g, '');
    const selos = c => (c.ativo ? '' : ' <span class="badge">Inativo</span>') + (c.proposta ? ' <span class="badge orange">Proposta aguardando</span>' : '') + (c.aGravar ? ' <span class="badge orange">A gravar na planilha</span>' : '');
    const acoes = c => { const n = num(c.telefone); return n ? `<a class="row-icon" href="tel:${ui.esc(n)}" aria-label="Ligar para ${ui.esc(c.nome)}" title="Ligar">${ic('phone', '📞')}</a>` + (n.length >= 10 ? `<a class="row-icon" href="https://wa.me/55${ui.esc(n.replace(/^55/, ''))}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp de ${ui.esc(c.nome)}" title="WhatsApp">${ic('message', '💬')}</a>` : '') : ''; };
    const linhas = vis.map(c => `<div class="list-row ${c.ativo ? '' : 'is-inativo'}" role="button" tabindex="0" data-ms-abrir="${ui.esc(c.id)}" aria-label="${ui.esc(c.nome)}"><span class="c-nome">${ui.esc(c.nome)}${selos(c)}</span><span class="c-inst">${ui.esc(c.pessoa || '—')}</span><span class="c-tipo">${ui.esc(c.secao)}</span><span class="c-bairro">${ui.esc(c.telefone || c.email || '—')}</span><span class="c-acoes">${acoes(c)}</span></div>`).join('');
    const fila = pend.length ? `<section class="panel mat-fila"><div class="panel-head"><div><span class="eyebrow">AGUARDANDO APROVAÇÃO</span><h2>${pend.length} ${pend.length === 1 ? 'proposta' : 'propostas'}</h2><p>${m.podeAprovar ? 'Confira e aprove ou recuse (com motivo). O aprovado vai para a planilha do cliente com a data de hoje.' : 'A Gestão ou o Administrativo vão conferir.'}</p></div></div>
      ${pend.map(c => `<article class="mat-proposta" data-ms-prop="${ui.esc(c.id)}"><header><strong>${ui.esc(TIPOS_P[c.proposta.tipo])} · ${ui.esc(nomeMat(c))}</strong><small class="muted">por ${ui.esc(c.proposta.nome || c.proposta.por)} · ${ui.esc(quando(c.proposta.em))}</small></header>${diff(c)}
        ${m.podeAprovar ? `<div class="dialog-actions"><button class="button" data-ms-decidir data-id="${ui.esc(c.id)}">${ui.icon('check')}Aprovar</button><button class="button secondary" data-ms-recusar="${ui.esc(c.id)}">Recusar</button></div>` : ''}</article>`).join('')}</section>` : '';
    const html = ui.intro(...INTRO_M) + abasCon() + fila + `<section class="panel filter-panel"><form id="msFiltro" class="filters"><label class="field">Procurar<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroMat.busca)}" placeholder="Nome, pessoa, seção, telefone…" maxlength="100"></span></label>
      <label class="field">Seção<select name="secao"><option value="">Todas</option>${m.secoes.map(x => `<option ${filtroMat.secao === x ? 'selected' : ''}>${ui.esc(x)}</option>`).join('')}</select></label><button class="button" type="button" data-ms-novo>${ui.icon('plus')}Propor contato</button></form></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'contato' : 'contatos'} na Matriz</span><span>Documento do cliente: mudanças só com aprovação</span></div>
      ${linhas ? `<div class="list-table contacts-table mat-table"><div class="list-head" aria-hidden="true"><span data-col>Nome / função</span><span data-col>Pessoa de contato</span><span data-col>Seção</span><span data-col>Telefone ou e-mail</span><span data-col></span></div>${linhas}</div>` : '<p class="empty-line">Nenhum contato encontrado.</p>'}
      ${lista.length > vis.length ? `<div class="load-more"><button class="button secondary" data-ms-mais>Mostrar mais ${Math.min(50, lista.length - vis.length)}</button></div>` : ''}`;
    const pos = manterFoco ? document.activeElement.selectionStart : null; ui.view.innerHTML = html;
    if (manterFoco) { const i = $('msFiltro').elements.busca; i.focus(); i.setSelectionRange(pos, pos); }
  }
  function abrirMatriz(id) {
    const c = mat && mat.itens.find(x => x.id === id); if (!c) return;
    const hist = c.historico.slice().reverse().map(h => `<li><strong>${ui.esc(h.acao)}</strong> · ${ui.esc(quando(h.em))} · ${ui.esc(h.nome || h.por)}${h.detalhe ? `<small>${ui.esc(h.detalhe)}</small>` : ''}</li>`).join('');
    dialogo('MATRIZ SABESP', c.nome, `<dl class="detail-summary">${[['Seção', c.secao], ['Pessoa de contato', c.pessoa], ['Telefone', c.telefone], ['E-mail', c.email], ['Endereço', c.endereco], ['Observação', c.observacao], ['Atualização', c.atualizacao ? ui.date(c.atualizacao) : ''], ['Situação', c.ativo ? 'Ativo' : 'Inativo']].filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${ui.esc(v)}</dd></div>`).join('')}</dl>
      ${c.aGravar ? `<div class="notice warning">Aprovado, mas ainda não gravado na planilha.${c.erroPlanilha ? ' ' + ui.esc(c.erroPlanilha) : ''} A rotina das 12h e 0h tenta de novo.</div>` : ''}
      ${c.proposta ? `<div class="notice">Há uma proposta (${ui.esc(TIPOS_P[c.proposta.tipo])}) aguardando aprovação.</div>` : `<div class="dialog-actions"><button class="button" data-ms-alterar="${ui.esc(c.id)}">${ui.icon('pencil')}Propor alteração</button><button class="button secondary" data-ms-ativo="${ui.esc(c.id)}">${c.ativo ? 'Propor inativar' : 'Propor reativar'}</button></div>`}
      <h3 class="answers-head">Histórico (auditoria)</h3><ul class="mat-historico">${hist || '<li class="muted">Sem registros.</li>'}</ul>`);
  }
  function formMatriz(c) {
    const novo = !c, v = c || {};
    dialogo('MATRIZ SABESP', novo ? 'Propor contato' : 'Propor alteração', `<form id="msForm" class="stack-form" data-id="${ui.esc(v.id || '')}" data-versao="${v.versao || 0}"><div id="msErro" class="notice" hidden></div>
      <p class="small muted">A proposta só vale depois que a Gestão ou o Administrativo aprovar.</p>
      ${novo ? `<label class="field">Seção da Matriz<select name="secao" required><option value="">Escolha</option>${mat.secoes.map(x => `<option ${filtroMat.secao === x ? 'selected' : ''}>${ui.esc(x)}</option>`).join('')}</select></label>` : ''}
      <div class="form-row"><label class="field">Nome / função / cargo<input name="nome" maxlength="200" required value="${ui.esc(v.nome || '')}"></label><label class="field">Pessoa de contato<input name="pessoa" maxlength="160" value="${ui.esc(v.pessoa || '')}"></label></div>
      <label class="field">Telefone<input name="telefone" maxlength="80" inputmode="tel" value="${ui.esc(v.telefone || '')}"></label>
      <details class="mais-detalhes" ${v.email || v.endereco || v.observacao ? 'open' : ''}><summary>Mais detalhes <small>e-mail, endereço e observação</small></summary><div class="mais-detalhes-corpo">
        <div class="form-row"><label class="field">E-mail<input name="email" type="email" maxlength="160" value="${ui.esc(v.email || '')}"></label><label class="field">Endereço<input name="endereco" maxlength="300" value="${ui.esc(v.endereco || '')}"></label></div>
        <label class="field">Observação (vai para a planilha do cliente)<textarea name="observacao" rows="2" maxlength="1000">${ui.esc(v.observacao || '')}</textarea></label></div></details>
      <div class="dialog-actions"><button class="button" type="submit">Enviar para aprovação</button></div></form>`);
  }
  function formMotivo(c, tipo) {
    const titulo = {recusar: 'Recusar proposta', inativar: 'Propor inativar', reativar: 'Propor reativar'}[tipo] + ' · ' + nomeMat(c);
    dialogo('MATRIZ SABESP', titulo, `<form id="msMotivo" class="stack-form" data-id="${ui.esc(c.id)}" data-versao="${c.versao}" data-tipo="${tipo}"><div id="msErro" class="notice" hidden></div>
      ${tipo === 'inativar' ? '<p class="small muted">A linha continua na planilha; a observação passa a dizer desde quando o contato está inativo.</p>' : ''}
      <label class="field">${tipo === 'recusar' ? 'Motivo da recusa' : 'Motivo'}<textarea name="motivo" rows="2" maxlength="500" ${tipo === 'reativar' ? '' : 'required'}></textarea></label>
      <div class="dialog-actions"><button class="button" type="submit">${tipo === 'recusar' ? 'Recusar' : 'Enviar para aprovação'}</button></div></form>`);
  }
  function trocar(c) { const i = mat.itens.findIndex(x => x.id === c.id); if (c.situacao === 'recusado') { if (i >= 0) mat.itens.splice(i, 1); } else if (i >= 0) mat.itens[i] = c; else mat.itens.push(c); }
  async function enviarMatriz(f) {
    const b = f.querySelector('[type=submit]'), d = Object.fromEntries(new FormData(f)), id = f.dataset.id, versao = Number(f.dataset.versao); let fn = 'proporMatrizCPT', p;
    if (f.id === 'msForm') p = {...d, id, tipo: id ? 'alteracao' : 'novo', versao};
    else if (f.dataset.tipo === 'recusar') { fn = 'decidirMatrizCPT'; p = {id, decisao: 'recusar', motivo: d.motivo, versao}; }
    else p = {id, tipo: f.dataset.tipo, motivo: d.motivo, versao};
    b.disabled = true;
    try { const r = await ui.call(fn, {...p, operacaoId: opId('mat-' + fn + id, p)}); trocar(r.contato); ui.toast(r.resultado); fechar(); desenharMatriz(); }
    catch (e) { erro('msErro', e); } finally { b.disabled = false; }
  }
  async function aprovarMatriz(btn) {
    const c = mat.itens.find(x => x.id === btn.dataset.id); if (!c) return; btn.disabled = true;
    try { const p = {id: c.id, decisao: 'aprovar', versao: c.versao}, r = await ui.call('decidirMatrizCPT', {...p, operacaoId: opId('mat-ap' + c.id, p)}); trocar(r.contato); ui.toast(r.resultado); desenharMatriz(); }
    catch (e) { ui.toast(e.message); btn.disabled = false; }
  }
  async function importarMatriz(btn) {
    btn.disabled = true; btn.textContent = 'Importando…';
    try { const r = await ui.call('importarMatrizCPT'); ui.toast(r.resultado); renderMatriz(); }
    catch (e) { erro('msErro', e); btn.disabled = false; btn.textContent = 'Importar a Matriz'; }
  }

  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-rec-aba]'); if (t) { aba = t.dataset.recAba; desenhar(); return; }
      if (e.target.closest('[data-rec-novo]')) { novo(); return; }
      const a = e.target.closest('[data-rec-abrir]'); if (a) { abrir(a.dataset.recAbrir); return; }
      const s = e.target.closest('[data-rec-situacao]'); if (s) { agir(s.dataset.recSituacao); return; }
      if (e.target.closest('[data-con-novo]')) { formContato(); return; }
      const ca = e.target.closest('[data-con-aba]'); if (ca) { abaCon = ca.dataset.conAba; renderContatos(); return; }
      const mi = e.target.closest('[data-ms-importar]'); if (mi) { importarMatriz(mi); return; }
      if (e.target.closest('[data-ms-novo]')) { formMatriz(); return; }
      if (e.target.closest('[data-ms-mais]')) { filtroMat.limite += 50; desenharMatriz(); return; }
      const ma = e.target.closest('[data-ms-abrir]'); if (ma && !e.target.closest('a')) { abrirMatriz(ma.dataset.msAbrir); return; }
      const mal = e.target.closest('[data-ms-alterar]'); if (mal) { formMatriz(mat.itens.find(x => x.id === mal.dataset.msAlterar)); return; }
      const mt = e.target.closest('[data-ms-ativo]'); if (mt) { const c = mat.itens.find(x => x.id === mt.dataset.msAtivo); formMotivo(c, c.ativo ? 'inativar' : 'reativar'); return; }
      const md = e.target.closest('[data-ms-decidir]'); if (md) { aprovarMatriz(md); return; }
      const mr = e.target.closest('[data-ms-recusar]'); if (mr) { formMotivo(mat.itens.find(x => x.id === mr.dataset.msRecusar), 'recusar'); return; }
      if (e.target.closest('[data-con-mais]')) { filtroCon.limite = (filtroCon.limite || LIMITE_CON) + LIMITE_CON; const y = window.scrollY; desenharContatos(); window.scrollTo({top: y, behavior: 'auto'}); return; }
      const c = e.target.closest('[data-con-abrir]'); if (c && !e.target.closest('a')) { abrirContato(c.dataset.conAbrir); return; }
      const ed = e.target.closest('[data-con-editar]'); if (ed) { formContato(con.itens.find(x => x.id === ed.dataset.conEditar)); return; }
      if (e.target.closest('[data-con-arquivar]') && confirm('Arquivar este contato? Ele sai da lista, mas continua no histórico.')) salvarContato($('conForm'), true);
    });
    document.addEventListener('submit', e => {
      const f = e.target; if (f.id === 'msForm' || f.id === 'msMotivo') { e.preventDefault(); enviarMatriz(f); return; }
      if (!['recForm', 'recResposta', 'conForm', 'conConversa'].includes(f.id)) return; e.preventDefault();
      if (f.id === 'recForm') enviar(f); else if (f.id === 'recResposta') agir('responder', f.elements.texto.value); else if (f.id === 'conForm') salvarContato(f); else registrarConversa(f);
    });
    let buscaTimer = null; // debounce: redesenha quando a pessoa para de digitar
    document.addEventListener('input', e => { const f = e.target.closest('#conFiltro'); if (f && e.target.name === 'busca') { filtroCon.busca = e.target.value; filtroCon.limite = LIMITE_CON; clearTimeout(buscaTimer); buscaTimer = setTimeout(() => { const ff = $('conFiltro'); if (ff) desenharContatos(document.activeElement === ff.elements.busca); }, 220); } });
    document.addEventListener('input', e => { const f = e.target.closest('#msFiltro'); if (f && e.target.name === 'busca') { filtroMat.busca = e.target.value; filtroMat.limite = 50; clearTimeout(buscaTimer); buscaTimer = setTimeout(() => { const ff = $('msFiltro'); if (ff) desenharMatriz(document.activeElement === ff.elements.busca); }, 220); } });
    document.addEventListener('change', e => { const f = e.target.closest('#msFiltro'); if (f && e.target.name === 'secao') { filtroMat.secao = e.target.value; filtroMat.limite = 50; desenharMatriz(); } });
    document.addEventListener('change', e => { const f = e.target.closest('#conFiltro'); if (f && e.target.name === 'tipo') { filtroCon.tipo = e.target.value; filtroCon.limite = LIMITE_CON; desenharContatos(); } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ui.state.perfil && Date.now() - ultimaContagem > 60000) contar(true); });
  }
  /** Recados novos para mim (mais recentes primeiro), ou null se a lista ainda não foi carregada. */
  const novos = () => rec ? rec.itens.filter(r => r.paraMim && !r.meu && !r.lido && r.situacao !== 'resolvido').sort((a, b) => b.atualizadoEm.localeCompare(a.atualizadoEm)) : null;
  /** Busca geral: a próxima abertura de Contatos vai para a aba Matriz Sabesp com o contato aberto. */
  const irMatriz = id => { abaCon = 'matriz'; abrirMat = id; };
  return {init, embutir, abrir, novos, renderContatos, novo, contar, copiarAvisos: marcar, irMatriz};
})();
</script>
