<script>
window.CPTMiniaturas=(()=>{"use strict";let chamar=null,timer=null,mesAtual=()=>"";const prontas=new Map,semJeito=new Set,fila=new Map;const drive=(id,sz)=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(sz||400);const src=(id,sz)=>prontas.get(id)||drive(id,sz);function tentar(img,falhou){const id=img&&img.dataset.mini;if(!id||!chamar||semJeito.has(id)||img.dataset.servidor){if(falhou)falhou();return false}img.dataset.servidor="1";if(prontas.has(id)){img.src=prontas.get(id);return true}const origem=img.dataset.miniOrigem==="galeria"?"galeria":"album",chave=origem+"|"+id;if(!fila.has(chave))fila.set(chave,[]);fila.get(chave).push({img,falhou});clearTimeout(timer);timer=setTimeout(enviar,120);return true}async function enviar(){const primeira=[...fila.keys()][0];if(!primeira)return;const origem=primeira.split("|")[0],chaves=[...fila.keys()].filter(k=>k.startsWith(origem+"|")).slice(0,12);const ids=chaves.map(k=>k.slice(origem.length+1)),espera=chaves.map((k,i)=>[ids[i],fila.get(k)]);chaves.forEach(k=>fila.delete(k));let r={};try{r=(await chamar(origem==="galeria"?"miniaturasGaleriaCPT":"miniaturasAlbumCPT",{ids,mes:mesAtual()})).miniaturas||{}}catch(_){}espera.forEach(([id,lista])=>{const u=r[id];if(u)prontas.set(id,u);else semJeito.add(id);lista.forEach(({img,falhou})=>{if(u){img.src=u;const fig=img.closest(".album-foto");if(fig)fig.classList.remove("sem-imagem")}else if(falhou)falhou()})});if(fila.size)timer=setTimeout(enviar,0)}function ligar(call,mes){chamar=call;mesAtual=mes}const daAplicacao=id=>prontas.get(id)||"";return{src,tentar,ligar,daAplicacao}})();window.CPTAlbum=(()=>{"use strict";const ic=(n,e)=>window.CPTic?window.CPTic(n,e):e;let ui=null,d=null,ticket=0,enviando=false;const $=id=>document.getElementById(id);const op=()=>"OP-"+crypto.randomUUID();const INTRO=["\xC1lbum da equipe","Cada pessoa escolhe at\xE9 2 fotos favoritas por dia, entre as fotos dos relatos do m\xEAs e dos dois meses anteriores. As mais favoritadas da semana viram destaque. Ningu\xE9m v\xEA quem favoritou."];const thumb=(id,sz)=>window.CPTMiniaturas.src(id,sz);const dataCurta=x=>x?x.slice(8,10)+"/"+x.slice(5,7):"";function cartao(f,tipo){const cheio=d.usadasHoje>=d.porDia&&!f.meu;return"<figure class=\"album-foto ".concat(f.meu?"is-meu":"","\" data-album-foto=\"").concat(ui.esc(f.fileId),"\">\n      <button class=\"album-ver\" data-album-ver=\"").concat(ui.esc(f.fileId),"\" aria-label=\"Ampliar: ").concat(ui.esc(f.legenda),"\"><img loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\" alt=\"\" data-mini=\"").concat(ui.esc(f.fileId),"\" src=\"").concat(ui.esc(thumb(f.fileId)),"\"><span class=\"album-sem\" aria-hidden=\"true\">").concat(ic("photo","\uD83D\uDCF7"),"</span></button>\n      <figcaption><span class=\"album-legenda\"><strong>").concat(ui.esc(f.atividade),"</strong><small>").concat(ui.esc([dataCurta(f.data),f.local].filter(Boolean).join(" \xB7 ")),"</small></span>\n      <button class=\"album-coracao ").concat(f.meu?"is-on":"","\" data-album-fav=\"").concat(ui.esc(f.fileId),"\" aria-pressed=\"").concat(f.meu,"\" ").concat(cheio?"aria-disabled=\"true\"":""," aria-label=\"").concat(f.meu?"Tirar das favoritas":"Favoritar"," (").concat(f.coracoes," ").concat(f.coracoes===1?"cora\xE7\xE3o":"cora\xE7\xF5es",")\"><span aria-hidden=\"true\">").concat(f.meu?ic("heart","\u2764"):ic("heart","\u2661"),"</span><b>").concat(f.coracoes||"","</b></button></figcaption></figure>")}const grade=(lista,tipo,vazio)=>lista.length?"<div class=\"album-grade ".concat(tipo==="destaque"?"is-destaque":"","\">").concat(lista.map(f=>cartao(f,tipo)).join(""),"</div>"):"<p class=\"empty-line\">".concat(vazio,"</p>");function contador(){const n=d.porDia-d.usadasHoje;return"<span class=\"album-vagas\" id=\"albumVagas\">".concat(n>0?"".concat(ic("heart","\u2764")," ").concat(n," ").concat(n===1?"favorita":"favoritas"," para escolher hoje"):ic("heart","\u2764")+" Favoritas de hoje escolhidas. Amanh\xE3 tem mais!","</span>")}function desenhar(){ui.view.innerHTML=ui.intro(...INTRO)+"<section class=\"panel album-topo\"><div><span class=\"card-kicker\">".concat(ic("star","\u2B50")," Destaque</span><h2>Fotos da semana</h2><p class=\"small muted\">As mais favoritadas pela equipe nesta semana (segunda a domingo).</p></div>").concat(contador(),"</section>\n      ").concat(grade(d.semana.fotos,"destaque","Ainda sem favoritas nesta semana. Escolha as suas l\xE1 embaixo!"),"\n      <section class=\"panel album-bloco\"><div class=\"panel-head\"><div><span class=\"card-kicker\">").concat(ic("people","\uD83D\uDCDA")," Da equipe</span><h2>\xC1lbum do m\xEAs</h2></div></div>").concat(grade(d.album,"album","O \xE1lbum deste m\xEAs ainda est\xE1 vazio."),"</section>\n      <section class=\"panel album-bloco\"><div class=\"panel-head\"><div><span class=\"card-kicker\">").concat(ic("photo","\uD83D\uDCF7")," Relatos dos \xFAltimos meses</span><h2>Escolha suas favoritas</h2></div><span class=\"small muted\">").concat(d.fotos.length," ").concat(d.fotos.length===1?"foto":"fotos","</span></div>").concat(porMes(),"</section>")}const nomeMes=m=>{const s=new Date(m+"-15T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)};function porMes(){const meses=d.meses&&d.meses.length?d.meses:[d.mes];return meses.map(m=>{const l=d.fotos.filter(f=>String(f.data).slice(0,7)===m);return"<h3 class=\"album-mes\">".concat(ui.esc(nomeMes(m))," <span class=\"small muted\">\xB7 ").concat(l.length," ").concat(l.length===1?"foto":"fotos","</span></h3>").concat(grade(l,"fotos","Nenhuma foto nos relatos deste m\xEAs."))}).join("")}async function render(){const mine=++ticket;ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"loading-label\"><span class=\"spinner\"></span>Abrindo o \xE1lbum\u2026</div><div class=\"album-grade\" aria-hidden=\"true\">"+"<div class=\"skeleton album-skel\"></div>".repeat(6)+"</div>";try{const r=await ui.call("carregarAlbumCPT",{mes:ui.state.mes});if(mine!==ticket||ui.state.route!=="album")return;d=r;desenhar()}catch(e){if(mine===ticket)ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"notice\">".concat(ui.esc(e.message),"</div>")}}function aplicar(r){d.usadasHoje=r.usadasHoje;[d.semana.fotos,d.album,d.fotos].forEach(l=>l.forEach(f=>{if(f.fileId===r.fileId){f.meu=r.meu;f.coracoes=r.coracoes}}));const f=d.fotos.find(x=>x.fileId===r.fileId);if(r.meu&&f&&!d.album.some(x=>x.fileId===r.fileId))d.album.push({...f});if(r.meu&&f&&!d.semana.fotos.some(x=>x.fileId===r.fileId))d.semana.fotos.push({...f});if(!r.coracoes){d.album=d.album.filter(x=>x.fileId!==r.fileId);d.semana.fotos=d.semana.fotos.filter(x=>x.fileId!==r.fileId)}const ordem=(a,b)=>b.coracoes-a.coracoes||String(b.data).localeCompare(String(a.data));d.album.sort(ordem);d.semana.fotos=d.semana.fotos.sort(ordem).slice(0,6);desenhar()}async function favoritar(b){if(enviando)return;const fileId=b.dataset.albumFav,f=d.fotos.find(x=>x.fileId===fileId)||d.album.find(x=>x.fileId===fileId)||d.semana.fotos.find(x=>x.fileId===fileId);if(!f)return;if(!f.meu&&d.usadasHoje>=d.porDia){ui.toast("Voc\xEA j\xE1 escolheu "+d.porDia+" favoritas hoje. Amanh\xE3 tem mais!");return}enviando=true;b.classList.add("is-enviando");try{const r=await ui.call("favoritarAlbumCPT",{fileId,ativo:!f.meu,mes:f.data?f.data.slice(0,7):ui.state.mes,operacaoId:op()});ui.toast(r.resultado);aplicar(r)}catch(e){ui.toast(e.message);b.classList.remove("is-enviando")}finally{enviando=false}}function ampliar(fileId){const f=d.fotos.find(x=>x.fileId===fileId)||d.album.find(x=>x.fileId===fileId)||d.semana.fotos.find(x=>x.fileId===fileId);if(!f)return;$("detailType").textContent="\xC1LBUM DA EQUIPE";$("detailTitle").textContent=f.atividade;$("detailContent").innerHTML="<figure class=\"album-grande\"><img decoding=\"async\" referrerpolicy=\"no-referrer\" alt=\"".concat(ui.esc(f.legenda),"\" data-mini=\"").concat(ui.esc(f.fileId),"\" src=\"").concat(ui.esc(thumb(f.fileId,1200)),"\"><figcaption>").concat(ui.esc(f.legenda),"</figcaption></figure>\n      <div class=\"dialog-actions\"><a class=\"button ghost\" href=\"https://drive.google.com/file/d/").concat(encodeURIComponent(f.fileId),"/view\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir no Drive \u2197</a></div>");if(!$("detailDialog").open)$("detailDialog").showModal()}function init(api){ui=api;window.CPTMiniaturas.ligar(ui.call,()=>ui.state.mes);document.addEventListener("click",e=>{if(ui.state.route!=="album"||!d)return;const b=e.target.closest("[data-album-fav]");if(b){favoritar(b);return}const v=e.target.closest("[data-album-ver]");if(v)ampliar(v.dataset.albumVer)});document.addEventListener("error",e=>{const t=e.target;if(!t||t.tagName!=="IMG")return;const fig=t.closest(".album-foto");if(fig){fig.classList.add("sem-imagem");window.CPTMiniaturas.tentar(t);return}if(t.closest(".album-grande"))window.CPTMiniaturas.tentar(t)},true)}return{init,render}})();
</script>
