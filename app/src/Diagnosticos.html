<script>
window.CPTDiagnosticos=(()=>{let ui=null,dados=null,lidoEm=0,prefixo="",ativo=()=>false,ticket=0,aberta=null;const $=id=>document.getElementById(id),br=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):d||"";const DOC={sem:["Sem documento",""],mudou:["Mudou desde o documento","orange"],ok:["Documento em dia","green"]};async function render(o){prefixo=o.prefixo;ativo=o.ativo;const mine=++ticket;if(!dados||o.forcar||Date.now()-lidoEm>300000){ui.view.innerHTML=prefixo+"<div class=\"loading-label\"><span class=\"spinner\"></span>Reunindo os diagn\xF3sticos por obra\u2026</div><div class=\"skel-list\" aria-hidden=\"true\"><div class=\"skeleton\"></div></div>";try{const d=await ui.call("listarDiagnosticosCPT",{});if(mine!==ticket||!ativo())return;dados=d;lidoEm=Date.now()}catch(e){if(mine===ticket&&ativo())ui.view.innerHTML=prefixo+"<div class=\"notice\">".concat(ui.esc(e.message),"</div>");return}}desenhar()}function desenhar(){if(!ativo()||!dados)return;const tile=(r,n,nota)=>"<div class=\"stat-tile\"><span class=\"stat-label\">".concat(r,"</span><span class=\"stat-value\">").concat(ui.num(n),"</span><span class=\"stat-note\">").concat(nota,"</span></div>");const card=o=>{const[t,cor]=DOC[o.situacaoDoc];return"<article class=\"relato-card rel-card dg-card\"><div class=\"card-top\"><span class=\"badge\">".concat(ui.esc(o.situacao),"</span><span class=\"badge ").concat(cor,"\">").concat(t,"</span></div>\n      <h4>").concat(ui.esc(o.nome),"</h4><p class=\"small muted\">").concat(ui.esc(o.bairros.join(", ")||"Bairro n\xE3o informado"),"</p>\n      <p class=\"small\"><strong>").concat(o.total,"</strong> ").concat(o.total===1?"diagn\xF3stico":"diagn\xF3sticos"," \xB7 ").concat(o.primeiro===o.ultimo?br(o.ultimo):br(o.primeiro)+" a "+br(o.ultimo),"</p>\n      ").concat(o.geradoPor?"<p class=\"small muted\">Documento v".concat(o.versaoDoc," por ").concat(ui.esc(o.geradoPor),".</p>"):"","\n      <div class=\"card-bottom\"><span>").concat(o.doc?"<a class=\"button ghost\" href=\"".concat(ui.esc(o.doc),"\" target=\"_blank\" rel=\"noopener\">Abrir documento</a>"):"","</span><span><button class=\"button secondary\" type=\"button\" data-dg-obra=\"").concat(ui.esc(o.obraId),"\">Ver tabela</button></span></div></article>")};const opcoes=dados.catalogo.map(o=>"<option value=\"".concat(ui.esc(o.id),"\">").concat(ui.esc(o.exibir)).concat(o.situacao==="Finalizada"?" (finalizada)":"","</option>")).join("");const sem=d=>"<li class=\"dg-sem-linha\"><div><strong>".concat(ui.esc(br(d.data))," \xB7 ").concat(ui.esc(d.trecho||"Trecho n\xE3o informado"),"</strong><span class=\"small muted\">").concat(ui.esc([d.obraTexto?"Obra informada: "+d.obraTexto:"Sem obra informada",d.responsavel].filter(Boolean).join(" \xB7 ")),"</span></div>\n      <div class=\"dg-sem-acoes\"><button class=\"button ghost\" type=\"button\" data-dg-ver=\"").concat(ui.esc(d.id),"\">Ver</button>").concat(dados.podeVincular?"<label class=\"sr-only\" for=\"dgObra-".concat(ui.esc(d.id),"\">Obra do diagn\xF3stico</label><select id=\"dgObra-").concat(ui.esc(d.id),"\"><option value=\"\">Escolha a obra\u2026</option>").concat(opcoes,"</select><button class=\"button\" type=\"button\" data-dg-vincular=\"").concat(ui.esc(d.id),"\">Vincular</button>"):"","</div></li>");ui.view.innerHTML=prefixo+"<section class=\"stat-row\" aria-label=\"Diagn\xF3sticos\">".concat(tile("Diagn\xF3sticos",dados.total,"Diagn\xF3sticos de \xE1rea registrados.")).concat(tile("Obras com diagn\xF3stico",dados.obras.length,"Cada uma com a sua tabela-resumo.")).concat(tile("Sem obra",dados.semObra.length,dados.podeVincular?"Vincule a uma obra do cat\xE1logo.":"A gest\xE3o vincula a uma obra."),"</section>\n      <div class=\"results-head dg-head\"><span>").concat(dados.obras.length," ").concat(dados.obras.length===1?"obra":"obras"," \xB7 do diagn\xF3stico mais recente para o mais antigo</span>").concat(dados.pasta?"<a class=\"button ghost\" href=\"".concat(ui.esc(dados.pasta),"\" target=\"_blank\" rel=\"noopener\">Abrir pasta dos documentos</a>"):"","</div>\n      <div class=\"rel-cards\">").concat(dados.obras.map(card).join("")||"<p class=\"empty-line\">Nenhum diagn\xF3stico ligado a uma obra do cat\xE1logo ainda.</p>","</div>\n      ").concat(dados.semObra.length?"<section class=\"panel dg-sem\"><div class=\"panel-head\"><div><h3>Sem obra do cat\xE1logo</h3><p>".concat(dados.podeVincular?"Escolha a obra para o diagn\xF3stico entrar na tabela e no documento dela. A linha da base n\xE3o muda.":"A Gest\xE3o ou o Administrativo vinculam estes diagn\xF3sticos a uma obra.","</p></div></div><ul class=\"dg-sem-lista\">").concat(dados.semObra.map(sem).join(""),"</ul></section>"):"")}const COLS=[["data","Data"],["trecho","Trecho"],["ipvs","IPVS"],["perfil","Perfil socioecon\xF4mico"],["imoveis","Im\xF3veis (res. / com.)"],["escolas","Escolas"],["ubs","UBS"],["pontos","Pontos cr\xEDticos"]];const celula=(l,k)=>k==="data"?br(l.data):k==="imoveis"?(l.residenciais||"\u2014")+" / "+(l.comerciais||"\u2014"):l[k]||"\u2014";function tabelaHtml(o,simples){const th=simples?"style=\"border:1px solid #D9E3EA;background:#EAF4F8;padding:4px 6px;text-align:left\"":"scope=\"col\"",td=simples?"style=\"border:1px solid #D9E3EA;padding:4px 6px;vertical-align:top\"":"";return"<table class=\"dg-tabela\"".concat(simples?" style=\"border-collapse:collapse;font-family:Arial;font-size:12px\"":"","><caption").concat(simples?"":" class=\"sr-only\"",">").concat(ui.esc(o.nome)," \xB7 diagn\xF3sticos</caption><thead><tr>").concat(COLS.map(([,t])=>"<th ".concat(th,">").concat(t,"</th>")).join("")).concat(simples?"":"<th scope=\"col\"><span class=\"sr-only\">Abrir</span></th>","</tr></thead>\n      <tbody>").concat(o.linhas.map(l=>"<tr>".concat(COLS.map(([k])=>"<td ".concat(td,">").concat(ui.esc(celula(l,k)),"</td>")).join("")).concat(simples?"":"<td><button class=\"button ghost\" type=\"button\" data-dg-ver=\"".concat(ui.esc(l.id),"\">Ver</button></td>"),"</tr>")).join(""),"</tbody></table>")}function abrirObra(id){const o=dados&&dados.obras.find(x=>x.obraId===id);if(!o)return;aberta=o;const[t,cor]=DOC[o.situacaoDoc];$("detailType").textContent="DIAGN\xD3STICOS DA OBRA";$("detailTitle").textContent=o.nome;$("detailContent").innerHTML="<p class=\"small muted\">".concat(ui.esc(o.bairros.join(", ")||"Bairro n\xE3o informado")," \xB7 ").concat(o.total," ").concat(o.total===1?"diagn\xF3stico":"diagn\xF3sticos"," \xB7 <span class=\"badge ").concat(cor,"\">").concat(t,"</span></p>\n      ").concat(o.situacaoDoc==="mudou"?"<div class=\"notice warning\">Entrou diagn\xF3stico novo ou um registro mudou depois do documento. Gere de novo para atualizar.</div>":"","\n      <div class=\"tabela-rolagem\">").concat(tabelaHtml(o,false),"</div>\n      <div class=\"dialog-actions\"><button class=\"button secondary\" type=\"button\" data-dg-copiar>").concat(ui.icon("file"),"Copiar tabela</button>").concat(o.doc?"<a class=\"button ghost\" href=\"".concat(ui.esc(o.doc),"\" target=\"_blank\" rel=\"noopener\">Abrir documento</a>"):"","\n        ").concat(dados.podeGerar?"<button class=\"button\" type=\"button\" data-dg-gerar=\"".concat(ui.esc(o.obraId),"\">").concat(ui.icon("check")).concat(o.doc?"Gerar de novo":"Gerar documento da obra","</button>"):"","</div>\n      ").concat(dados.podeGerar?"<p class=\"small muted\">O documento junta os dados da obra, esta tabela e um bloco por diagn\xF3stico (com at\xE9 4 fotos cada), no modelo limpo da aplica\xE7\xE3o. A vers\xE3o anterior fica guardada.</p>":"");if(!$("detailDialog").open)$("detailDialog").showModal()}async function copiar(){const o=aberta;if(!o)return;const html=tabelaHtml(o,true),texto=[COLS.map(c=>c[1]).join("\t")].concat(o.linhas.map(l=>COLS.map(([k])=>celula(l,k)).join("\t"))).join("\n");try{if(navigator.clipboard&&window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([texto],{type:"text/plain"})})]);else await navigator.clipboard.writeText(texto);ui.toast("Tabela copiada. Cole no Docs, no e-mail ou na planilha.")}catch(_){ui.toast("N\xE3o deu para copiar a tabela neste navegador.")}}async function gerar(btn){const id=btn.dataset.dgGerar,txt=btn.innerHTML;btn.disabled=true;btn.textContent="Gerando o documento\u2026 (at\xE9 1 minuto)";try{const r=await ui.call("gerarDiagnosticoObraCPT",{obraId:id,operacaoId:"OP-"+crypto.randomUUID()});ui.toast(r.resultado);const o=dados.obras.find(x=>x.obraId===id);if(o){o.doc=r.doc;o.versaoDoc=r.versaoDoc;o.geradoPor=r.geradoPor;o.geradoEm=r.geradoEm;o.situacaoDoc="ok"}abrirObra(id);desenhar()}catch(e){ui.toast(e.message);btn.disabled=false;btn.innerHTML=txt}}async function ver(id){$("detailType").textContent="DIAGN\xD3STICO DE \xC1REA";$("detailTitle").textContent="Abrindo o diagn\xF3stico\u2026";$("detailContent").innerHTML="<div class=\"loading-label\"><span class=\"spinner\"></span>Lendo o registro\u2026</div>";if(!$("detailDialog").open)$("detailDialog").showModal();try{const d=await ui.call("abrirDiagnosticoCPT",{id});$("detailTitle").textContent=br(d.data)+" \xB7 "+(d.endereco||d.frente||d.bairro||"Diagn\xF3stico");const bloco=(t,corpo)=>"<section class=\"dg-bloco\"><h3>".concat(ui.esc(t),"</h3>").concat(corpo,"</section>");$("detailContent").innerHTML="<p class=\"small muted\">".concat(ui.esc([d.bairro,d.obraTexto,d.responsavel?"Equipe: "+d.responsavel:""].filter(Boolean).join(" \xB7 ")),"</p>\n        ").concat(d.relato?bloco("Relato do diagn\xF3stico","<p class=\"dg-texto\">".concat(ui.esc(d.relato),"</p>")):"","\n        ").concat(d.campos.map(([t,l])=>bloco(t,"<dl class=\"dg-campos\">".concat(l.map(([k,v])=>"<div><dt>".concat(ui.esc(k),"</dt><dd>").concat(ui.esc(v),"</dd></div>")).join(""),"</dl>"))).join(""),"\n        ").concat(d.observacao?bloco("Observa\xE7\xE3o final","<p class=\"dg-texto\">".concat(ui.esc(d.observacao),"</p>")):"","\n        ").concat(d.fotos.length?bloco("Fotos","<div class=\"dg-fotos\">".concat(d.fotos.map((f,i)=>"<a href=\"".concat(ui.esc(f.url),"\" target=\"_blank\" rel=\"noopener\"><img src=\"").concat(ui.esc(f.thumb),"\" alt=\"Foto ").concat(i+1," do diagn\xF3stico\" loading=\"lazy\" referrerpolicy=\"no-referrer\"></a>")).join(""),"</div>")):"","\n        <div class=\"dialog-actions\"><button class=\"button ghost\" type=\"button\" data-record=\"").concat(ui.esc(d.id),"\">Registro completo</button></div>")}catch(e){$("detailContent").innerHTML="<div class=\"notice\">".concat(ui.esc(e.message),"</div>")}}async function vincular(btn){const id=btn.dataset.dgVincular,sel=$("dgObra-"+id);if(!sel||!sel.value){ui.toast("Escolha a obra antes de vincular.");if(sel)sel.focus();return}btn.disabled=true;btn.textContent="Vinculando\u2026";try{const r=await ui.call("vincularDiagnosticoCPT",{registroId:id,obraId:sel.value,operacaoId:"OP-"+crypto.randomUUID()});ui.toast(r.resultado);render({prefixo,ativo,forcar:true})}catch(e){ui.toast(e.message);btn.disabled=false;btn.textContent="Vincular"}}function init(api){ui=api;document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-dg-obra],[data-dg-ver],[data-dg-gerar],[data-dg-vincular],[data-dg-copiar]");if(!t)return;if(t.dataset.dgObra)abrirObra(t.dataset.dgObra);else if(t.dataset.dgVer)ver(t.dataset.dgVer);else if(t.dataset.dgGerar)gerar(t);else if(t.dataset.dgVincular)vincular(t);else copiar()})}return{init,render,limpar:()=>{dados=null}}})();
</script>
