<script>
/*
 * Organograma 2.26.0 — quem é quem na equipe, por área, e a quem cada pessoa responde (OrganogramaCPT).
 * O desenho é um SVG montado aqui mesmo: o que aparece na tela é o que sai no download (imagem PNG, SVG ou PDF pela impressão).
 * Todos veem; Gestão e Administrativo editam (nos testes, só o proprietário). Sem nomes no código: tudo vem da planilha de dados.
 */
window.CPTOrganograma = (() => {
  'use strict';
  const ic = (n, e) => window.CPTic ? window.CPTic(n, e) : e; // ícone no visual novo, emoji no atual
  let ui = null, d = null, ticket = 0, enviando = false;
  const $ = id => document.getElementById(id);
  const op = () => 'OP-' + crypto.randomUUID();
  const INTRO = ['Organograma', 'Quem é quem na equipe, em que área e a quem cada pessoa responde. Baixe em imagem, SVG ou PDF para apresentações e para quem está chegando.'];
  /** Cor de cada área (a mesma na tela, na legenda e no arquivo baixado). */
  const COR = {gestao: '#1f5f8b', administrativo: '#55606e', socioambiental: '#2d6a4f', comunicacao: '#b4532f', atendimento: '#2f7cbf', comercializacao: '#9a6a1f', campo: '#5f8a2e', parceiros: '#6f55a3'};
  const W = 240, H = 100, GX = 26, GY = 60, PAD = 36, TOPO = 104, RECUO = 30;
  const xml = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;'}[c]));
  const corta = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trim() + '…' : s; };
  const iniciais = nome => (String(nome || '').replace(/[^\p{L}\s]/gu, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('') || '?').toUpperCase();
  const mesAno = iso => { if (!iso) return ''; const s = new Date(iso).toLocaleDateString('pt-BR', {month: 'long', year: 'numeric', timeZone: 'America/Sao_Paulo'}); return s.charAt(0).toUpperCase() + s.slice(1); };

  // ---------- Desenho ----------
  /** Monta a árvore: quem não responde a ninguém (ou a alguém fora do organograma) fica no topo. */
  function arvore(pessoas) {
    const mapa = new Map(pessoas.map(p => [p.id, {...p, filhos: []}])), raizes = [];
    mapa.forEach(n => { const pai = n.chefia && n.chefia !== n.id && mapa.get(n.chefia); if (pai) pai.filhos.push(n); else raizes.push(n); });
    const ord = (a, b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome, 'pt-BR');
    mapa.forEach(n => n.filhos.sort(ord)); return raizes.sort(ord);
  }
  /** Largura de cada ramo. Mais de 3 pessoas sem equipe abaixo viram uma coluna (o desenho não fica largo demais). */
  function medir(n) {
    n.filhos.forEach(medir);
    n.pilha = n.filhos.length > 3 && n.filhos.every(f => !f.filhos.length);
    n.w = !n.filhos.length ? W : n.pilha ? W + RECUO : Math.max(W, n.filhos.reduce((s, f) => s + f.w, 0) + GX * (n.filhos.length - 1));
  }
  function posicionar(n, x, y, L, todos) {
    todos.push(n); n.y = y;
    if (n.pilha) {
      n.x = x; n.filhos.forEach((f, i) => { f.x = x + RECUO; f.y = y + H + 20 + i * (H + 14); f.pilha = false; todos.push(f); });
      const ult = n.filhos[n.filhos.length - 1]; L.push(`M${x + 16},${y + H} V${ult.y + H / 2}`); n.filhos.forEach(f => L.push(`M${x + 16},${f.y + H / 2} H${f.x}`));
      return;
    }
    n.x = x + (n.w - W) / 2; if (!n.filhos.length) return;
    const soma = n.filhos.reduce((s, f) => s + f.w, 0) + GX * (n.filhos.length - 1); let cx = x + (n.w - soma) / 2;
    const meio = y + H + GY / 2, centros = [];
    n.filhos.forEach(f => { posicionar(f, cx, y + H + GY, L, todos); centros.push(f.x + W / 2); cx += f.w + GX; });
    L.push(`M${n.x + W / 2},${y + H} V${meio}`); if (centros.length > 1) L.push(`M${centros[0]},${meio} H${centros[centros.length - 1]}`);
    centros.forEach(c => L.push(`M${c},${meio} V${y + H + GY}`));
  }
  function cartaoSVG(n) {
    const cor = COR[n.area] || '#55606e', area = (d.areas[n.area] || '').toUpperCase();
    return `<g class="org-no" data-org-id="${xml(n.id)}" transform="translate(${n.x},${n.y})"><rect width="${W}" height="${H}" rx="14" fill="#ffffff" stroke="#d9dee3"/><rect width="7" height="${H}" fill="${cor}" clip-path="url(#orgCartao)"/>
      <circle cx="40" cy="${H / 2}" r="22" fill="${cor}"/><text x="40" y="${H / 2 + 5.5}" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">${xml(iniciais(n.nome))}</text>
      <text x="72" y="28" font-size="14.5" font-weight="700" fill="#1d2a33">${xml(corta(n.nome, 22))}</text><text x="72" y="47" font-size="12.5" fill="#3d4a55">${xml(corta(n.cargo, 26))}</text>
      <text x="72" y="68" font-size="9.5" font-weight="700" letter-spacing=".8" fill="${cor}">${xml(corta(area, 24))}</text>${n.desde ? `<text x="72" y="86" font-size="10.5" fill="#7a8691">desde ${xml(corta(n.desde, 20))}</text>` : ''}</g>`;
  }
  /** SVG completo (com título e legenda): o mesmo da tela e dos downloads. */
  function montar() {
    const raizes = arvore(d.pessoas); raizes.forEach(medir);
    const L = [], todos = []; let x = PAD;
    raizes.forEach(r => { posicionar(r, x, TOPO, L, todos); x += r.w + GX * 2; });
    const largura = Math.max(760, x - GX * 2 + PAD), fundo = todos.reduce((m, n) => Math.max(m, n.y + H), TOPO + H);
    const usadas = Object.keys(d.areas).filter(k => d.pessoas.some(p => p.area === k)), yL = fundo + 44;
    // legenda em mais de uma linha quando não cabe
    let linhaLeg = 0, acum = PAD; const legPos = usadas.map(k => { const t = d.areas[k] + ' (' + d.pessoas.filter(p => p.area === k).length + ')', w = 34 + t.length * 7; if (acum + w > largura - PAD && acum > PAD) { linhaLeg++; acum = PAD; } const pos = [acum, yL + linhaLeg * 24]; acum += w; return [k, t, pos]; });
    const altura = yL + linhaLeg * 24 + 40, data = mesAno(d.atualizadoEm);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Organograma da equipe">
      <defs><clipPath id="orgCartao"><rect width="${W}" height="${H}" rx="14"/></clipPath></defs><rect width="${largura}" height="${altura}" fill="#fbfaf6"/><rect x="0" y="0" width="${largura}" height="6" fill="#2d6a4f"/>
      <text x="${PAD}" y="46" font-size="24" font-weight="700" fill="#1d2a33">Organograma da equipe</text>
      <text x="${PAD}" y="70" font-size="13" fill="#55606e">Consórcio Performance Tamanduateí · Socioambiental, Comunicação e Atendimento${data ? ' · atualizado em ' + xml(data.toLowerCase()) : ''}</text>
      <path d="${L.join(' ')}" fill="none" stroke="#a9b4bd" stroke-width="2" stroke-linejoin="round"/>${todos.map(cartaoSVG).join('')}
      <text x="${PAD}" y="${yL - 22}" font-size="11.5" fill="#7a8691">Cada cor é uma área. As linhas mostram a quem cada pessoa responde. ${d.pessoas.length} ${d.pessoas.length === 1 ? 'pessoa' : 'pessoas'} em ${usadas.length} ${usadas.length === 1 ? 'área' : 'áreas'}.</text>
      ${legPos.map(([k, t, [px, py]]) => `<g transform="translate(${px},${py})"><circle cx="7" cy="-4" r="7" fill="${COR[k]}"/><text x="20" y="0" font-size="12.5" fill="#3d4a55">${xml(t)}</text></g>`).join('')}</svg>`;
    return {svg, largura, altura};
  }

  // ---------- Downloads ----------
  function baixarBlob(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  const nomeArquivo = ext => 'Organograma CPT ' + new Date().toISOString().slice(0, 10) + '.' + ext;
  function baixarSVG() { baixarBlob(new Blob([montar().svg], {type: 'image/svg+xml'}), nomeArquivo('svg')); ui.toast('SVG baixado: abre no navegador e em editores de imagem.'); }
  function baixarPNG() {
    const m = montar(), img = new Image(), k = 2;
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = m.largura * k; c.height = m.altura * k; const g = c.getContext('2d'); g.scale(k, k); g.drawImage(img, 0, 0, m.largura, m.altura);
      c.toBlob(b => { if (b) { baixarBlob(b, nomeArquivo('png')); ui.toast('Imagem baixada (PNG em alta resolução).'); } else ui.toast('Não foi possível gerar a imagem. Use o SVG ou o PDF.'); }, 'image/png');
    };
    img.onerror = () => ui.toast('Não foi possível gerar a imagem. Use o SVG ou o PDF.');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(m.svg);
  }
  /** PDF: imprime só o organograma (A4 deitado). No diálogo, escolha "Salvar como PDF". */
  function imprimir() {
    let box = $('orgImpressao'); if (!box) { box = document.createElement('div'); box.id = 'orgImpressao'; document.body.append(box); }
    box.innerHTML = montar().svg; document.documentElement.classList.add('org-imprimindo');
    const fim = () => { document.documentElement.classList.remove('org-imprimindo'); box.innerHTML = ''; window.removeEventListener('afterprint', fim); };
    window.addEventListener('afterprint', fim); window.print(); setTimeout(fim, 60000);
  }

  // ---------- Tela ----------
  function desenhar() {
    const vazio = !d.pessoas.length, ed = d.podeEditar;
    const barra = `<div class="org-acoes">${vazio ? '' : `<button class="button" data-org-png>${ic('photo', '🖼')} Baixar imagem (PNG)</button><button class="button secondary" data-org-pdf>${ic('file', '📄')} PDF (imprimir)</button><button class="button secondary" data-org-svg>SVG</button>`}
      ${ed ? `<button class="button secondary" data-org-novo>${ic('people', '👤')} Adicionar pessoa</button>${d.foraDoOrganograma ? `<button class="button secondary" data-org-importar>Trazer da equipe (${d.foraDoOrganograma})</button>` : ''}` : ''}</div>`;
    const corpo = vazio ? `<div class="empty">${ic('people', '👥')}<h3>O organograma ainda está vazio</h3><p>${ed ? 'Comece trazendo as pessoas cadastradas em Equipe e acessos; depois ajuste o cargo e a quem cada uma responde.' : 'A Gestão ainda vai montar o organograma da equipe.'}</p></div>`
      : `<div class="org-quadro ${ed ? 'pode-editar' : ''}" id="orgQuadro">${montar().svg}</div><p class="small muted">${ed ? 'Toque num cartão para editar. ' : ''}Dica: o PDF sai em A4 deitado; no diálogo de impressão, escolha "Salvar como PDF".</p>`;
    const lista = ed && !vazio ? `<details class="panel org-lista"><summary><strong>Pessoas no organograma (${d.pessoas.length})</strong></summary><table class="simple-table"><thead><tr><th>Nome</th><th>Cargo</th><th>Área</th><th>Responde a</th><th></th></tr></thead><tbody>${d.pessoas.map(p => `<tr><td>${ui.esc(p.nome)}</td><td>${ui.esc(p.cargo)}</td><td><i class="org-ponto" style="background:${COR[p.area]}"></i>${ui.esc(d.areas[p.area] || '')}</td><td>${ui.esc((d.pessoas.find(x => x.id === p.chefia) || {}).nome || '—')}</td><td><button class="link-button" data-org-editar="${ui.esc(p.id)}">Editar</button></td></tr>`).join('')}</tbody></table></details>` : '';
    ui.view.innerHTML = ui.intro(...INTRO) + `<section class="panel org-painel">${barra}${corpo}</section>${lista}`;
  }
  async function render() {
    const mine = ++ticket;
    ui.view.innerHTML = ui.intro(...INTRO) + '<div class="loading-label"><span class="spinner"></span>Montando o organograma…</div><div class="skeleton" style="height:360px"></div>';
    try { const r = await ui.call('carregarOrganogramaCPT'); if (mine !== ticket || ui.state.route !== 'organograma') return; d = r; desenhar(); }
    catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro(...INTRO) + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  function editar(id) {
    const p = d.pessoas.find(x => x.id === id) || {nome: '', cargo: '', area: 'socioambiental', chefia: '', desde: '', ordem: 0, versao: 0};
    const outros = d.pessoas.filter(x => x.id !== p.id);
    $('detailType').textContent = 'ORGANOGRAMA'; $('detailTitle').textContent = p.id ? 'Editar ' + p.nome : 'Adicionar pessoa';
    $('detailContent').innerHTML = `<form id="orgForm" class="org-form" data-id="${ui.esc(p.id || '')}" data-versao="${p.versao || 0}"><div id="orgErro" class="notice" hidden></div>
      <div class="form-row"><label class="field">Nome<input name="nome" maxlength="80" required value="${ui.esc(p.nome)}"></label><label class="field">Cargo ou função<input name="cargo" maxlength="80" required value="${ui.esc(p.cargo)}" placeholder="Ex.: Mobilizadora"></label></div>
      <div class="form-row"><label class="field">Área<select name="area">${Object.entries(d.areas).map(([k, n]) => `<option value="${k}" ${p.area === k ? 'selected' : ''}>${ui.esc(n)}</option>`).join('')}</select></label>
        <label class="field">Responde a<select name="chefia"><option value="">Ninguém (topo do organograma)</option>${outros.map(x => `<option value="${ui.esc(x.id)}" ${p.chefia === x.id ? 'selected' : ''}>${ui.esc(x.nome)} · ${ui.esc(x.cargo)}</option>`).join('')}</select></label></div>
      <div class="form-row"><label class="field">Desde (opcional)<input name="desde" maxlength="30" value="${ui.esc(p.desde)}" placeholder="Ex.: ago/2025"></label><label class="field">Ordem entre colegas (opcional)<input name="ordem" type="number" min="0" max="99" value="${p.ordem || 0}"></label></div>
      <div class="dialog-actions"><button class="button" type="submit">Salvar</button>${p.id ? '<button class="button ghost" type="button" data-org-tirar>Tirar do organograma</button>' : ''}</div></form>`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
  }
  async function salvar(form, ativo) {
    if (enviando) return; enviando = true; const f = form.elements, erro = $('orgErro');
    try {
      const r = await ui.call('salvarOrganogramaCPT', {id: form.dataset.id || '', versao: Number(form.dataset.versao) || 0, nome: f.nome.value, cargo: f.cargo.value, area: f.area.value, chefia: f.chefia.value, desde: f.desde.value, ordem: Number(f.ordem.value) || 0, ativo, operacaoId: op()});
      ui.toast(r.resultado); $('detailDialog').close(); await render();
    } catch (e) { erro.hidden = false; erro.textContent = e.message; } finally { enviando = false; }
  }
  async function importar() {
    if (enviando) return; enviando = true;
    try { const r = await ui.call('importarOrganogramaCPT', {operacaoId: op()}); ui.toast(r.resultado); d = r; desenhar(); } catch (e) { ui.toast(e.message); } finally { enviando = false; }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      if (ui.state.route !== 'organograma' || !d) return; const t = e.target;
      if (t.closest('[data-org-png]')) { baixarPNG(); return; }
      if (t.closest('[data-org-svg]')) { baixarSVG(); return; }
      if (t.closest('[data-org-pdf]')) { imprimir(); return; }
      if (t.closest('[data-org-novo]')) { editar(''); return; }
      if (t.closest('[data-org-importar]')) { importar(); return; }
      const ed = t.closest('[data-org-editar]'); if (ed) { editar(ed.dataset.orgEditar); return; }
      const no = t.closest('#orgQuadro .org-no'); if (no && d.podeEditar) { editar(no.dataset.orgId); return; }
      if (t.closest('[data-org-tirar]')) { const form = $('orgForm'); if (form && confirm('Tirar esta pessoa do organograma? Ela continua no histórico.')) salvar(form, false); }
    });
    document.addEventListener('submit', e => { if (e.target.id !== 'orgForm') return; e.preventDefault(); salvar(e.target, true); });
  }
  return {init, render, montar: () => d ? montar() : null};
})();
</script>
