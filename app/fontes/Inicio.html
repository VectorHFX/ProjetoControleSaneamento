<script>
/*
 * Visão geral (Início) 2.6.0.
 * Ordem de leitura: o que é do dia → números do relatório → como o mês andou → o que vem pela frente.
 * Os destaques são os números que o relatório usa: ações e pessoas alcançadas (item 3), pesquisas,
 * manifestações (item 10) e o preparo de cada item (2, 4.1–4.5, 7, 9). A contagem bruta de registros saiu.
 * 2.7: a visão escolhida (Atendimento, Socioambiental, Gestão…) muda os atalhos do topo e o que a página destaca.
 * Gráficos em SVG próprio (sem biblioteca): uma série por gráfico, uma cor (--blue), barras finas
 * presas à base, grade discreta, valor ao passar o mouse/tocar e resumo em texto para leitor de tela.
 */
window.CPTInicio = (() => {
  'use strict';
  let ui = null, agenda = {mes: null, itens: null, pedido: null}, medida = 'acoes'; // 2.35: 'acoes' ou 'pessoas' no gráfico por dia
  const $ = id => document.getElementById(id);
  const hojeISO = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
  const diaSemana = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('pt-BR', {weekday: 'short', timeZone: 'UTC'}).replace('.', '');
  const nomeMes = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long'});

  /** A agenda é pedida junto com a Visão do mês (em paralelo), não depois dela. */
  function prefetchAgenda(mes, inicial) {
    if (inicial && inicial.mes === mes && Array.isArray(inicial.itens)) agenda = {mes, itens: inicial.itens, pedido: null};
    if (agenda.mes === mes && agenda.pedido) return agenda.pedido;
    const pedido = ui.call('carregarCronogramaCPT', {mes}).then(d => { if (agenda.pedido === pedido) { agenda = {mes, itens: d.itens, pedido: null}; if (window.CPTAgenda && window.CPTAgenda.definir) window.CPTAgenda.definir(d); } return d.itens; });
    agenda = {mes, itens: agenda.mes === mes ? agenda.itens : null, pedido};
    pedido.catch(() => { if (agenda.pedido === pedido) agenda.pedido = null; }).then(() => { if (ui.state.route === 'inicio' && $('homeAgenda')) desenharAgenda(); });
    return pedido;
  }

  function delta(atual, anterior, mesAnterior) {
    if (!mesAnterior) return 'Ações com data de realização no mês.';
    if (!anterior) return 'Sem ações em ' + nomeMes(mesAnterior) + '.';
    const d = atual - anterior;
    return (d === 0 ? 'Igual a ' : (d > 0 ? '+' : '−') + ui.num(Math.abs(d)) + ' em relação a ') + nomeMes(mesAnterior) + (atual && ui.state.mes === hojeISO().slice(0, 7) ? ' (mês em andamento)' : '') + '.';
  }
  function medidor(valor, meta) {
    const pct = Math.min(100, Math.round(valor / meta * 100));
    return `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${valor}" aria-label="${valor} de ${meta}"><span style="width:${pct}%"></span></div>`;
  }
  function tile(rotulo, valor, nota, extra = '', rota = '', filtro = '') {
    const tag = rota ? 'button' : 'div';
    return `<${tag} class="stat-tile" ${rota ? `data-route="${rota}"` : ''} ${filtro ? `data-filter="${filtro}"` : ''}><span class="stat-label">${rotulo}</span><span class="stat-value">${ui.num(valor)}</span>${extra}<span class="stat-note">${nota}</span></${tag}>`;
  }

  /** Barras por dia (ações ou pessoas alcançadas): fins de semana marcados, hoje destacado, valor no hover/foco. */
  function graficoDias(d) {
    const mes = d.mes, ultimo = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0).getDate(), hoje = hojeISO(), pes = medida === 'pessoas';
    const por = new Map(d.dias.map(x => [x.data, x])), unid = n => pes ? n + (n === 1 ? ' pessoa' : ' pessoas') : n + (n === 1 ? ' ação' : ' ações');
    const dias = Array.from({length: ultimo}, (_, i) => { const iso = mes + '-' + String(i + 1).padStart(2, '0'), dow = new Date(iso + 'T12:00:00Z').getUTCDay(), x = por.get(iso) || {}; return {iso, n: (pes ? x.pessoas : x.quantidade) || 0, acoes: x.quantidade || 0, pessoas: x.pessoas || 0, fds: dow === 0 || dow === 6, futuro: iso > hoje}; });
    const max = Math.max(4, ...dias.map(x => x.n)), topo = Math.ceil(max / 2) * 2, W = window.matchMedia('(max-width:640px)').matches ? 360 : 640, H = 180, base = 150, alto = 130, passo = W / ultimo, larg = Math.max(4, passo - 4);
    const y = v => base - v / topo * alto;
    const barras = dias.map((x, i) => {
      const cx = i * passo + 2, h = base - y(x.n), r = Math.min(4, h / 2, larg / 2);
      const forma = x.n ? `<path class="bar" d="M${cx},${base}V${base - h + r}Q${cx},${base - h} ${cx + r},${base - h}H${cx + larg - r}Q${cx + larg},${base - h} ${cx + larg},${base - h + r}V${base}Z"/>` : '';
      return `${x.fds ? `<rect class="weekend" x="${i * passo}" y="${base - alto - 6}" width="${passo}" height="${alto + 6}"/>` : ''}${forma}${x.iso === hoje ? `<line class="today" x1="${cx + larg / 2}" x2="${cx + larg / 2}" y1="${base - alto - 6}" y2="${base}"/>` : ''}<rect class="hit" x="${i * passo}" y="0" width="${passo}" height="${base}" tabindex="-1" data-tip="${ui.esc(diaSemana(x.iso) + ', ' + ui.date(x.iso) + ' · ' + (x.futuro ? 'ainda não chegou' : unid(x.n)))}"/>`;
    }).join('');
    const marcas = [1, 8, 15, 22, ultimo].map(n => `<text class="axis" x="${(n - 1) * passo + passo / 2}" y="${H - 8}" text-anchor="middle">${String(n).padStart(2, '0')}</text>`).join('');
    const resumo = dias.filter(x => x.n).map(x => ui.date(x.iso) + ': ' + x.n).join('; ') || (pes ? 'Nenhuma pessoa alcançada no mês' : 'Nenhuma ação no mês'), titulo = pes ? 'Pessoas alcançadas por dia' : 'Ações por dia';
    const passados = dias.filter(x => !x.futuro), copiar = window.CPTGraficos ? window.CPTGraficos.acoes({titulo, subtitulo: nomeMes(mes), tipo: 'colunas', rotulos: dias.map(x => x.iso.slice(8)),
      series: [{nome: pes ? 'Pessoas' : 'Ações', valores: dias.map(x => x.futuro ? null : x.n)}], eixo: [0, 7, 14, 21, ultimo - 1],
      tabela: {cab: ['Dia', 'Ações', 'Pessoas alcançadas'], linhas: passados.map(x => [ui.date(x.iso), x.acoes, x.pessoas]).concat([['Total', passados.reduce((s, x) => s + x.acoes, 0), passados.reduce((s, x) => s + x.pessoas, 0)]])}}) : '';
    return `<div class="chart-wrap"><svg class="day-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${titulo} em ${ui.esc(nomeMes(mes))}. ${ui.esc(resumo)}">
      <line class="grid" x1="0" x2="${W}" y1="${y(topo)}" y2="${y(topo)}"/><line class="grid" x1="0" x2="${W}" y1="${y(topo / 2)}" y2="${y(topo / 2)}"/><line class="baseline" x1="0" x2="${W}" y1="${base}" y2="${base}"/>
      <text class="axis" x="${W}" y="${y(topo) - 4}" text-anchor="end">${topo}</text><text class="axis" x="${W}" y="${y(topo / 2) - 4}" text-anchor="end">${topo / 2}</text>${barras}${marcas}</svg>
      <div class="chart-tip" hidden></div></div>
      <p class="chart-key"><span class="key-weekend"></span>Fim de semana${hoje.startsWith(mes) ? '<span class="key-today"></span>Hoje' : ''}</p>${copiar}`;
  }
  /** Cabeçalho do cartão "por dia": título da medida e a troca Ações/Pessoas. */
  function cabecalhoDias(d) {
    const pes = medida === 'pessoas', total = d.dias.reduce((s, x) => s + (x.pessoas || 0), 0);
    return `<div class="panel-head"><div><h2>${pes ? 'Pessoas alcançadas por dia' : 'Ações por dia'}</h2><p>${pes ? ui.num(total) + ' pessoas alcançadas' : ui.num(d.dias.length) + (d.dias.length === 1 ? ' dia com ação' : ' dias com ação')} em ${ui.esc(nomeMes(d.mes))}</p></div>
      <div class="segmented dias-medida" role="group" aria-label="O que mostrar por dia">${[['acoes', 'Ações'], ['pessoas', 'Pessoas']].map(([k, t]) => `<button type="button" data-dias-medida="${k}" aria-pressed="${medida === k}" class="${medida === k ? 'chosen' : ''}">${t}</button>`).join('')}</div></div>`;
  }
  function desenharAgenda() {
    const box = $('homeAgenda'); if (!box) return;
    if (!agenda.itens) { box.innerHTML = agenda.pedido ? '<p class="muted">Carregando a agenda…</p>' : '<p class="muted">Agenda indisponível no momento.</p>'; return; }
    const hoje = hojeISO(), papel = $('roleView').value, todos = ['administrador', 'administrativo', 'gestao'].includes(papel);
    const itens = agenda.itens.filter(e => e.status !== 'cancelada' && (todos || e.frentes.includes(papel)) && (ui.state.mes !== hoje.slice(0, 7) || e.data >= hoje));
    const doDia = itens.filter(e => e.data === hoje), proximos = itens.filter(e => e.data !== hoje).slice(0, 4);
    const linha = e => `<button class="peek-row" data-agenda-id="${ui.esc(e.id)}"><span class="peek-date">${e.data.slice(8)}<small>${e.inicio || 'DIA TODO'}</small></span><span><strong>${ui.esc(e.titulo)}</strong><small>${ui.esc([e.obra, e.bairro].filter(Boolean).join(' · ') || (window.CPTAgenda.names[e.frentes[0]] || ''))}</small></span></button>`;
    box.innerHTML = (ui.state.mes === hoje.slice(0, 7) ? `<h3 class="peek-title">Hoje</h3>${doDia.length ? doDia.map(linha).join('') : '<p class="muted">Nada marcado para hoje' + (todos ? '' : ' na sua frente') + '.</p>'}` : '') +
      `<h3 class="peek-title">${ui.state.mes === hoje.slice(0, 7) ? 'Próximos' : 'No mês'}</h3>${proximos.length ? proximos.map(linha).join('') : '<p class="muted">Sem outras atividades no cronograma.</p>'}`;
  }
  /** Atalhos do trabalho de cada visão: o que essa pessoa costuma abrir primeiro. */
  function atalhos(v, d) {
    const k = d.indicadores, s = d.satisfacao || {mes: 0, meta: 60, semana: null};
    const b = (rota, titulo, nota, filtro = '') => ui.podeVer(rota) ? `<button class="shortcut" data-route="${rota}" ${filtro ? `data-filter="${filtro}"` : ''}><strong>${titulo}</strong><small>${nota}</small></button>` : '';
    const pesq = s.semana ? s.semana.total + ' de ' + s.semana.meta + ' nesta semana' : s.mes + ' de ' + s.meta + ' no mês';
    const mapa = {
      atendimento: [b('atendimentos', 'Casos em aberto', ui.num(k.abertos) + ' em tratativa', 'abertos'), b('atendimentos', 'Auditoria das fichas', 'O que conferir na carteira', 'auditoria'), b('cronograma', 'Cronograma', 'Agenda da equipe'), b('obras', 'Obras e endereços', 'Frentes de serviço')],
      socioambiental: [b('registros', 'Relatos do mês', 'O que a equipe registrou', 'relatos'), b('meuespaco', 'Tarefas do dia', 'Checklist e tarefas recebidas'), b('registros', 'Pesquisas de satisfação', pesq), b('recados', 'Recados', 'Avisar outra frente')],
      comunicacao: [b('materiais', 'Materiais', 'Prazos e publicações'), b('galeria', 'Galeria', 'Fotos do mês'), b('contatos', 'Contatos', 'Imprensa e parceiros'), b('recados', 'Recados', 'Avisar outra frente')],
      comercializacao: [b('obras', 'Obras e endereços', 'Onde estão as frentes'), b('cronograma', 'Cronograma', 'Agenda da equipe'), b('atendimentos', 'Consultar atendimentos', 'Casos e observações'), b('registros', 'Relatos', 'O que a equipe registrou')],
      gestao: [b('registros', 'Relatos do mês', 'O que a equipe registrou', 'relatos'), b('atendimentos', 'Auditoria de atendimentos', ui.num(k.abertos) + (k.abertos === 1 ? ' caso em aberto' : ' casos em aberto'), 'auditoria'), b('obras', 'Obras e frentes', 'Catálogo e obras de hoje'), b('cronograma', 'Cronograma', 'Agenda da equipe')]
    };
    mapa.administrativo = mapa.gestao;
    const lista = (mapa[v] || mapa.atendimento).filter(Boolean);
    return lista.length ? `<nav class="shortcuts" aria-label="Atalhos do seu trabalho">${lista.join('')}</nav>` : '';
  }
  function render(d) {
    // 2.29: abas da Visão do mês para todos (Resumo · Cronograma); Gestão e Administrativo também Contrato · Frentes · Relatos.
    const abasMes = window.CPTGestao && window.CPTGestao.abas ? window.CPTGestao.abas('resumo') : '';
    if (!d) { ui.view.innerHTML = abasMes + '<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Buscando as informações do mês…</div><div class="skeleton hero-loading"></div><div class="kpis">' + '<div class="skeleton"></div>'.repeat(4) + '</div>'; return; }
    const k = d.indicadores, s = d.satisfacao || {mes: 0, meta: 60, semana: null}, perfil = ui.state.perfil || d.perfil, nome = (perfil?.nome || '').split(' ')[0];
    const visao = ui.visao();
    if (agenda.mes !== d.mes) prefetchAgenda(d.mes);
    ui.view.innerHTML = abasMes + `<section class="home-hero"><div class="home-hero-art" aria-hidden="true">${window.CPTArte ? window.CPTArte.pagina('inicio') : ''}</div><div><span class="eyebrow">${nome ? 'OLÁ, ' + ui.esc(nome.toUpperCase()) : 'VISÃO GERAL'} · TELA DE ${ui.esc((window.CPTAgenda.names[visao] || '').toUpperCase())}</span><h1>${ui.esc(nomeMes(d.mes).replace(/^./, c => c.toUpperCase()))} <span>${d.mes.slice(0, 4)}</span></h1>
        <p class="home-phrase">${ui.esc(k.frase || 'Números pela data em que cada atividade foi realizada.')}</p>${k.relatosSemPublico ? `<p><button class="chip-alert" data-pending="publico">${ui.num(k.relatosSemPublico)} ${k.relatosSemPublico === 1 ? 'ação' : 'ações'} sem público informado · conferir</button></p>` : ''}</div>
        <div class="hero-actions">${ui.formLink().replace('button white', 'button')}</div></section>
      ${atalhos(visao, d)}${ui.podeVer('painel') ? '<div id="homeAlertas"></div>' : ''}
      <section class="stat-row" aria-label="Números do mês">
        ${tile('Ações socioambientais', k.acoes ?? k.registros, delta(k.acoes ?? k.registros, d.comparacao?.anterior, d.comparacao?.mesAnterior), '', 'registros', 'relatos')}
        ${tile('Pessoas alcançadas', k.pessoas ?? k.participacoes, ui.num(k.frentes || 0) + ' frentes acompanhadas · ' + ui.num(k.diagnosticos || 0) + ' diagnósticos.', '', 'registros', 'relatos')}
        ${tile('Pesquisas de satisfação', s.mes, s.semana ? 'Esta semana: ' + s.semana.total + ' de ' + s.semana.meta + '.' : 'Meta mensal: ' + s.meta + '.', medidor(s.mes, s.meta))}
        ${tile('Manifestações em tratativa', k.abertos, ui.num(k.recebidasNoMes || 0) + ' recebidas e ' + ui.num(k.concluidosNoMes || 0) + ' concluídas no mês.', '', 'atendimentos', 'abertos')}
      </section>
      <div class="home-grid"><div class="home-main">
        <section class="panel panel-dias">${cabecalhoDias(d)}${graficoDias(d)}</section>

      </div><aside class="home-side">
        <section class="panel panel-agenda"><div class="panel-head"><div><span class="eyebrow">EM EQUIPE</span><h2>Agenda</h2></div><button class="icon-button" data-route="cronograma" aria-label="Abrir cronograma">↗</button></div><div id="homeAgenda"></div></section>
        <section class="panel panel-recentes"><div class="panel-head"><div><h2>Últimos registros</h2></div><button class="button ghost" data-route="registros">Ver todos</button></div><div class="mini-list">${d.recentes.length ? d.recentes.map(r => `<button class="mini-row" data-record="${ui.esc(r.id)}"><strong>${ui.esc(r.atividade || r.procedimento)}</strong><small>${ui.date(r.data)} · ${ui.esc(r.bairro || 'Bairro não informado')}</small></button>`).join('') : '<p class="muted">Os novos registros aparecem aqui depois do processamento.</p>'}</div></section>
      </aside></div>`;
    desenharAgenda(); carregarAlertas();
  }
  /** 2.36: cartão "Pede atenção" (Gestão e Administrativo): os mesmos alertas das missões, pedido à parte e guardado por 10 minutos. */
  let alertas = {em: 0, itens: null, pedido: null};
  function cartaoAlertas(l) {
    if (!l.length) return '<p class="ok-line home-ok">Nada pedindo atenção hoje. Bom trabalho da equipe.</p>';
    const botao = a => a.pendente ? `<button class="button ghost" data-pending="${ui.esc(a.pendente)}">Abrir</button>` : a.rota === 'painel' ? `<button class="button ghost" data-route="painel" data-painel-ir="${ui.esc(a.aba || 'contrato')}">Ver</button>` : a.rota && a.rota !== 'inicio' ? `<button class="button ghost" data-route="${ui.esc(a.rota)}">Abrir</button>` : '';
    return `<section class="panel attention home-alertas" aria-label="Pede atenção"><div class="panel-head"><div><span class="eyebrow">PEDE ATENÇÃO</span><h2>${l.length} ${l.length === 1 ? 'ponto' : 'pontos'}</h2></div></div>
      <ul class="alert-list">${l.map(a => `<li class="alert-${ui.esc(a.nivel)}"><span class="alert-dot" aria-hidden="true"></span><span>${ui.esc(a.titulo)}<small class="alert-detalhe">${ui.esc(a.texto)}</small></span>${botao(a)}</li>`).join('')}</ul></section>`;
  }
  async function carregarAlertas() {
    if (!document.getElementById('homeAlertas')) return;
    const desenhar = () => { const b = document.getElementById('homeAlertas'); if (b && alertas.itens) b.innerHTML = cartaoAlertas(alertas.itens); };
    if (alertas.itens && Date.now() - alertas.em < 600000) { desenhar(); return; }
    if (!alertas.pedido) alertas.pedido = ui.call('alertasGestaoCPT').then(r => { alertas = {em: Date.now(), itens: (r && r.alertas) || [], pedido: null}; }).catch(() => { alertas.pedido = null; });
    await alertas.pedido; desenhar();
  }
  function tooltip(ev) {
    const alvo = ev.target.closest && ev.target.closest('.day-chart .hit'), wrap = alvo && alvo.closest('.chart-wrap');
    document.querySelectorAll('.chart-tip').forEach(t => { if (!wrap || !wrap.contains(t)) t.hidden = true; });
    if (!alvo) return;
    const tip = wrap.querySelector('.chart-tip'), a = alvo.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    tip.textContent = alvo.dataset.tip; tip.hidden = false;
    tip.style.left = Math.min(w.width - tip.offsetWidth, Math.max(0, a.left - w.left + a.width / 2 - tip.offsetWidth / 2)) + 'px';
  }
  function init(api) {
    ui = api;
    document.addEventListener('pointerover', tooltip); document.addEventListener('pointerdown', tooltip);
    document.addEventListener('click', e => { const b = e.target.closest('[data-dias-medida]'), box = b && b.closest('.panel-dias'), d = ui.state.home; if (!b || !box || !d || b.dataset.diasMedida === medida) return; medida = b.dataset.diasMedida; box.innerHTML = cabecalhoDias(d) + graficoDias(d); });
    document.addEventListener('pointerleave', () => document.querySelectorAll('.chart-tip').forEach(t => t.hidden = true), true);
  }
  /** Itens do cronograma de um mês, reaproveitando o que já foi buscado (usado pela página inicial do Meu espaço). */
  function agendaDoMes(mes) {
    if (agenda.mes === mes && agenda.pedido) return agenda.pedido;
    if (agenda.mes === mes && Array.isArray(agenda.itens)) return Promise.resolve(agenda.itens);
    return prefetchAgenda(mes);
  }
  return {init, render, prefetchAgenda, agendaDoMes};
})();
</script>
