<script>
/*
 * Mapa 2.17.0 — Santo André com obras, ações socioambientais, atendimentos e bairros.
 * Leaflet (biblioteca livre) é carregado só quando o mapa abre, da CDN unpkg, com verificação de integridade.
 * Fundo: as imagens oficiais do OpenStreetMap (livres, com atribuição; sem chave e sem custo, inclusive para uso por empresa).
 * No tema escuro, as mesmas imagens recebem um filtro de cor (não há fundo escuro oficial gratuito para uso comercial).
 * Só contagens agregadas por obra e por bairro chegam aqui: nenhum endereço, nome ou protocolo.
 * Sem internet para a biblioteca, mostra as mesmas contagens em lista.
 */
window.CPTMapa = (() => {
  'use strict';
  const LEAFLET = {js: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', css: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
    jsSri: 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=', cssSri: 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='};
  const FUNDO = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const COR = {obra: '#1f6fb2', hoje: '#e07a1f', acao: '#2e9e7d', caso: '#c2552f', bairro: '#7a8b99'};
  const INTRO = ['Mapa de Santo André', 'Onde estão as obras e onde a equipe atuou. Só números por obra e por bairro: nenhum endereço de munícipe aparece aqui.'];
  let ui = null, ticket = 0, dados = null, periodo = 'mes', camadas = {obras: true, acoes: true, casos: true, bairros: true}, mapa = null, grupos = null, posicionando = null, leaflet = null;
  const $ = id => document.getElementById(id);
  const movimento = () => document.documentElement.dataset.motion !== 'reduce' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /** Carrega o Leaflet uma vez (CSS e JS com integridade). Falha ou demora de 10 s → lista. */
  function carregarLeaflet() {
    if (window.L && window.L.map) return Promise.resolve(window.L);
    if (leaflet) return leaflet;
    leaflet = new Promise((ok, falha) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = LEAFLET.css; css.integrity = LEAFLET.cssSri; css.crossOrigin = ''; document.head.appendChild(css);
      const js = document.createElement('script'); js.src = LEAFLET.js; js.integrity = LEAFLET.jsSri; js.crossOrigin = ''; js.async = true;
      const t = setTimeout(() => falha(new Error('tempo')), 10000);
      js.onload = () => { clearTimeout(t); window.L && window.L.map ? ok(window.L) : falha(new Error('vazio')); };
      js.onerror = () => { clearTimeout(t); falha(new Error('rede')); };
      document.head.appendChild(js);
    }).catch(e => { leaflet = null; throw e; });
    return leaflet;
  }

  async function render(atualizar) {
    const mine = ++ticket; sair();
    ui.view.innerHTML = ui.intro(...INTRO) + barra() + `<div class="mapa-wrap"><div id="mapaCanvas" class="mapa-canvas" role="region" aria-label="Mapa de Santo André"><div class="mapa-carregando"><span class="spinner"></span>Montando o mapa…</div></div><aside id="mapaLado" class="mapa-lado" aria-live="polite"><div class="skeleton" style="height:180px"></div></aside></div>`;
    const pedido = ui.call('carregarMapaCPT', {periodo, mes: ui.state.mes, atualizar: !!atualizar});
    let L = null; try { L = await carregarLeaflet(); } catch (_) { L = null; }
    try { const d = await pedido; if (mine !== ticket || ui.state.route !== 'mapa') return; dados = d; }
    catch (e) { if (mine === ticket) $('mapaCanvas').innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    lado();
    if (L) desenhar(L); else lista();
  }
  function barra() {
    const p = [['hoje', 'Hoje'], ['semana', '7 dias'], ['mes', 'Mês da competência']], c = [['obras', 'Obras', COR.obra], ['acoes', 'Ações socioambientais', COR.acao], ['casos', 'Atendimentos', COR.caso], ['bairros', 'Bairros', COR.bairro]];
    return `<div class="mapa-barra"><div class="segmented" role="tablist" aria-label="Período">${p.map(([k, t]) => `<button role="tab" aria-selected="${periodo === k}" class="${periodo === k ? 'chosen' : ''}" data-mapa-periodo="${k}">${t}</button>`).join('')}</div>
      <div class="mapa-camadas" role="group" aria-label="Camadas">${c.map(([k, t, cor]) => `<label class="mapa-camada"><input type="checkbox" data-mapa-camada="${k}" ${camadas[k] ? 'checked' : ''}><span class="bola" style="--cor:${cor}"></span>${t}</label>`).join('')}</div></div>`;
  }
  function raio(n, max) { return n ? 7 + Math.round(18 * Math.sqrt(n / Math.max(1, max))) : 0; }
  function desenhar(L) {
    const box = $('mapaCanvas'); if (!box) return; box.innerHTML = '';
    const lim = dados.limites;
    mapa = L.map(box, {zoomControl: true, zoomAnimation: movimento(), fadeAnimation: movimento(), markerZoomAnimation: movimento(), maxBounds: [[lim.latMin - 0.05, lim.lngMin - 0.05], [lim.latMax + 0.05, lim.lngMax + 0.05]], minZoom: 11});
    L.tileLayer(FUNDO, {maxZoom: 19, className: 'mapa-fundo', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores do OpenStreetMap</a>'}).addTo(mapa);
    mapa.fitBounds([[-23.70, -46.58], [-23.60, -46.47]]);
    grupos = {bairros: L.layerGroup(), acoes: L.layerGroup(), casos: L.layerGroup(), obras: L.layerGroup()};
    const maxA = Math.max(...dados.bairros.map(b => b.acoes), 1), maxC = Math.max(...dados.bairros.map(b => b.casos), ...dados.obras.map(o => o.casos), 1), plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);
    dados.bairros.filter(b => b.lat != null).forEach(b => {
      L.circleMarker([b.lat, b.lng], {radius: 4, color: COR.bairro, weight: 1, fillOpacity: 0.5, className: 'mapa-ponto-bairro'}).bindTooltip(ui.esc(b.nome), {direction: 'top'}).addTo(grupos.bairros);
      if (b.acoes) L.circleMarker([b.lat, b.lng], {radius: raio(b.acoes, maxA), color: COR.acao, weight: 2, fillColor: COR.acao, fillOpacity: 0.28, className: 'mapa-bolha-acao'})
        .bindTooltip(`<strong>${ui.esc(b.nome)}</strong><br>${plural(b.acoes, 'ação', 'ações')} · ${plural(b.pessoas, 'pessoa', 'pessoas')}`, {direction: 'top'}).addTo(grupos.acoes);
      // Atendimentos ligeiramente deslocados para não cobrir a bolha de ações no mesmo bairro.
      if (b.casos) L.circleMarker([b.lat - 0.0012, b.lng + 0.0016], {radius: raio(b.casos, maxC), color: COR.caso, weight: 2, fillColor: COR.caso, fillOpacity: 0.25, className: 'mapa-bolha-caso'})
        .bindTooltip(`<strong>${ui.esc(b.nome)}</strong><br>${plural(b.casos, 'atendimento', 'atendimentos')}`, {direction: 'top'}).addTo(grupos.casos);
    });
    dados.obras.filter(o => o.lat != null).forEach(o => {
      if (o.casos) L.circleMarker([o.lat - 0.0012, o.lng + 0.0016], {radius: raio(o.casos, maxC), color: COR.caso, weight: 2, fillColor: COR.caso, fillOpacity: 0.25, className: 'mapa-bolha-caso'})
        .bindTooltip(`<strong>${ui.esc(o.nome)}</strong><br>${plural(o.casos, 'atendimento', 'atendimentos')}`, {direction: 'top'}).addTo(grupos.casos);
      L.circleMarker([o.lat, o.lng], {radius: o.hoje ? 9 : 6, color: '#fff', weight: 2, fillColor: o.hoje ? COR.hoje : COR.obra, fillOpacity: 1, className: 'mapa-obra' + (o.hoje ? ' mapa-obra-hoje' : '')})
        .bindTooltip(`<strong>${ui.esc(o.nome)}</strong><br>${ui.esc(o.situacao || 'Sem situação')}${o.hoje ? ' · <b>frente hoje</b>' : ''}<br>${plural(o.acoes, 'ação', 'ações')} · ${plural(o.casos, 'atendimento', 'atendimentos')}`, {direction: 'top'}).addTo(grupos.obras);
    });
    ['bairros', 'casos', 'acoes', 'obras'].forEach(k => { if (camadas[k]) grupos[k].addTo(mapa); });
    mapa.on('click', ev => clique(ev.latlng));
    box.classList.toggle('is-posicionando', !!posicionando);
  }
  /** Sem a biblioteca (sem internet ou bloqueio): as mesmas contagens em lista. */
  function lista() {
    const box = $('mapaCanvas'); if (!box) return;
    const b = dados.bairros.filter(x => x.acoes || x.casos).sort((x, y) => (y.acoes + y.casos) - (x.acoes + x.casos));
    box.innerHTML = `<div class="mapa-lista"><div class="notice">O mapa não carregou (sem acesso à biblioteca de mapas). As contagens continuam aqui em lista.</div>
      <table class="simple-table"><thead><tr><th>Bairro</th><th>Ações</th><th>Pessoas</th><th>Atendimentos</th></tr></thead><tbody>${b.map(x => `<tr><td>${ui.esc(x.nome)}</td><td>${x.acoes}</td><td>${x.pessoas}</td><td>${x.casos}</td></tr>`).join('') || '<tr><td colspan="4">Nada no período.</td></tr>'}</tbody></table></div>`;
  }
  function lado() {
    const box = $('mapaLado'); if (!box) return; const d = dados, t = d.totais, per = d.periodo;
    const top = d.bairros.filter(b => b.acoes).sort((a, b) => b.acoes - a.acoes).slice(0, 5), hoje = d.obras.filter(o => o.hoje);
    const semPontoObras = d.obras.filter(o => o.lat == null && ['Em andamento', 'Paralisada'].includes(o.situacao)), semPontoBairros = d.bairros.filter(b => b.lat == null);
    box.innerHTML = `<p class="eyebrow">${per.de === per.ate ? ui.date(per.de) : ui.date(per.de) + ' a ' + ui.date(per.ate)}</p>
      <dl class="mapa-totais"><div><dt><span class="bola" style="--cor:${COR.acao}"></span>Ações</dt><dd>${ui.num(t.acoes)}</dd></div><div><dt>Pessoas</dt><dd>${ui.num(t.pessoas)}</dd></div><div><dt><span class="bola" style="--cor:${COR.caso}"></span>Atendimentos</dt><dd>${ui.num(t.casos)}</dd></div></dl>
      ${d.semLocal.acoes || d.semLocal.casos ? `<p class="small muted">Sem local no mapa: ${ui.num(d.semLocal.acoes)} ações e ${ui.num(d.semLocal.casos)} atendimentos (bairro sem ponto ou não identificado).</p>` : ''}
      <h3 class="mapa-sub">Frentes hoje</h3>${hoje.length ? `<ul class="mapa-mini">${hoje.map(o => `<li><span class="bola" style="--cor:${COR.hoje}"></span>${ui.esc(o.nome)}${o.lat == null ? ' <small class="muted">(sem ponto)</small>' : ''}</li>`).join('')}</ul>` : '<p class="small muted">Nenhuma obra confirmada hoje (Obras → Obras de hoje).</p>'}
      ${top.length ? `<h3 class="mapa-sub">Onde houve mais ação</h3><ul class="mapa-mini">${top.map(b => `<li><span>${ui.esc(b.nome)}</span><strong>${b.acoes}</strong></li>`).join('')}</ul>` : ''}
      ${d.podePosicionar ? `<details class="mapa-posicionar" ${posicionando || semPontoObras.length + semPontoBairros.length ? 'open' : ''}><summary><strong>Posicionar no mapa</strong> <span class="muted">${ui.num(semPontoObras.length)} obras e ${ui.num(semPontoBairros.length)} bairros sem ponto</span></summary>
        <label class="field">Escolha e clique no mapa<select id="mapaAlvo"><option value="">—</option>
          <optgroup label="Obras ativas">${d.obras.filter(o => ['Em andamento', 'Paralisada', 'A confirmar'].includes(o.situacao)).sort((a, b) => (a.lat == null ? 0 : 1) - (b.lat == null ? 0 : 1) || a.nome.localeCompare(b.nome, 'pt-BR')).map(o => `<option value="obra|${ui.esc(o.id)}" ${posicionando && posicionando.id === o.id ? 'selected' : ''}>${o.lat == null ? '○ ' : '● '}${ui.esc(o.nome)}</option>`).join('')}</optgroup>
          <optgroup label="Bairros">${d.bairros.slice().sort((a, b) => (a.lat == null ? 0 : 1) - (b.lat == null ? 0 : 1) || a.nome.localeCompare(b.nome, 'pt-BR')).map(b => `<option value="bairro|${ui.esc(b.id)}" ${posicionando && posicionando.id === b.id ? 'selected' : ''}>${b.lat == null ? '○ ' : '● '}${ui.esc(b.nome)}</option>`).join('')}</optgroup></select></label>
        <p class="small muted">${posicionando ? 'Agora clique no ponto de <strong>' + ui.esc(posicionando.nome) + '</strong> no mapa.' : '○ sem ponto · ● já posicionado (clicar de novo corrige).'}</p>
        ${semPontoBairros.length ? '<button type="button" class="button secondary" id="mapaSugerir">Sugerir pontos dos bairros (pesquisa do Google)</button>' : ''}</details>` : ''}`;
    const alvo = $('mapaAlvo');
    if (alvo) alvo.addEventListener('change', () => {
      const [tipo, id] = alvo.value.split('|'), item = tipo === 'obra' ? dados.obras.find(o => o.id === id) : dados.bairros.find(b => b.id === id);
      posicionando = item ? {tipo, id, nome: item.nome} : null; lado(); const c = $('mapaCanvas'); if (c) c.classList.toggle('is-posicionando', !!posicionando);
      if (posicionando) ui.toast('Clique no mapa onde fica ' + posicionando.nome + '.');
    });
  }
  async function clique(ll) {
    if (!posicionando) return;
    const alvo = posicionando; posicionando = null; $('mapaCanvas').classList.remove('is-posicionando');
    try {
      const r = await ui.call('posicionarNoMapaCPT', {tipo: alvo.tipo, id: alvo.id, lat: ll.lat, lng: ll.lng}); ui.toast(r.resultado);
      const item = alvo.tipo === 'obra' ? dados.obras.find(o => o.id === alvo.id) : dados.bairros.find(b => b.id === alvo.id); item.lat = r.lat; item.lng = r.lng;
      lado(); if (window.L && mapa) { sairMapa(); desenhar(window.L); }
    } catch (e) { ui.toast(e.message); posicionando = alvo; lado(); }
  }
  function sairMapa() { if (mapa) { try { mapa.remove(); } catch (_) {} mapa = null; } }
  function sair() { sairMapa(); posicionando = null; }
  function init(api) {
    ui = api;
    document.addEventListener('click', async ev => {
      const p = ev.target.closest('[data-mapa-periodo]'); if (p) { periodo = p.dataset.mapaPeriodo; render(); return; }
      if (ev.target.closest('#mapaSugerir')) {
        const b = $('mapaSugerir'); b.disabled = true; b.textContent = 'Pesquisando os bairros…';
        try { const r = await ui.call('sugerirBairrosNoMapaCPT'); ui.toast(r.resultado); render(true); } catch (e) { ui.toast(e.message); b.disabled = false; b.textContent = 'Sugerir pontos dos bairros (pesquisa do Google)'; }
      }
    });
    document.addEventListener('change', ev => {
      const c = ev.target.closest('[data-mapa-camada]'); if (!c) return; camadas[c.dataset.mapaCamada] = c.checked;
      if (mapa && grupos) { const g = grupos[c.dataset.mapaCamada]; if (c.checked) g.addTo(mapa); else mapa.removeLayer(g); }
    });
  }
  return {init, render, sair};
})();
</script>
