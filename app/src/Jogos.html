<script>
window.CPTJogos=(()=>{"use strict";let ui=null,e=null,aoMudar=()=>{},mascote=()=>"",p=null,letras=[],trocas=[],ordem=[],marcada=null,enviando=false,imagem="";const $=id=>document.getElementById(id);const op=()=>"OP-"+crypto.randomUUID();const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();const LETRAS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");const INFO={forca:{nome:"Forca do saneamento",icone:"\uD83D\uDCA7",meta:n=>"".concat(n," dias de checklist pontuado"),texto:"Adivinhe palavras do nosso trabalho. Cada erro seca uma gotinha."},quebra:{nome:"Quebra-cabe\xE7a",icone:"\uD83E\uDDE9",meta:n=>"".concat(n," fotos favoritas no \xC1lbum"),texto:"Monte uma foto do \xE1lbum da equipe trocando as pe\xE7as de lugar."}};function cartao(jogo){const x=e[jogo],i=INFO[jogo],resta=x.limite-x.partidasHoje;const corpo=!x.liberado?"<p class=\"small\">Libera com ".concat(i.meta(x.precisa),".</p><span class=\"meter\" role=\"meter\" aria-valuemin=\"0\" aria-valuemax=\"").concat(x.precisa,"\" aria-valuenow=\"").concat(Math.min(x.tem,x.precisa),"\" aria-label=\"Progresso para liberar\"><span style=\"width:").concat(Math.min(100,x.tem/x.precisa*100),"%\"></span></span><small class=\"muted\">").concat(Math.min(x.tem,x.precisa)," de ").concat(x.precisa,"</small>"):"<p class=\"small\">".concat(i.texto,"</p><p class=\"small muted\">").concat(x.aberta?"Voc\xEA tem uma partida em andamento.":resta>0?"".concat(resta," ").concat(resta===1?"partida":"partidas"," hoje"):"Partidas de hoje encerradas. Amanh\xE3 tem mais!"," \xB7 ").concat(x.ganhouPontosHoje?"pontos de hoje j\xE1 ganhos":"\u2B50 +"+e.regras.pontos+" na 1\xAA vit\xF3ria do dia","</p>\n         <button class=\"button\" data-jogo-abrir=\"").concat(jogo,"\" ").concat(!x.aberta&&resta<=0?"disabled":"",">").concat(x.aberta?"Continuar":"Jogar","</button>");return"<article class=\"jogo-card ".concat(x.liberado?"":"is-travado","\"><span class=\"jogo-icone\" aria-hidden=\"true\">").concat(x.liberado?i.icone:"\uD83D\uDD12","</span><div><h3>").concat(i.nome,"</h3>").concat(corpo,"</div></article>")}function painel(estado){e=estado;if(!e)return"";return"<section class=\"panel home-jogos\" id=\"espJogos\"><div class=\"panel-head\"><div><span class=\"card-kicker\">\uD83C\uDFAE Joguinhos</span><h2>Uma pausa r\xE1pida</h2></div></div><div class=\"jogos-grade\">".concat(cartao("forca")).concat(cartao("quebra"),"</div></section>")}function redesenhar(){const el=$("espJogos");if(el)el.outerHTML=painel(e)}function janela(titulo,html){$("detailType").textContent="JOGUINHOS";$("detailTitle").textContent=titulo;$("detailContent").innerHTML=html;if(!$("detailDialog").open)$("detailDialog").showModal()}async function abrir(jogo){if(enviando)return;enviando=true;try{const r=await ui.call("iniciarJogoCPT",{jogo,operacaoId:op()});e=r.estado;p=r.partida;redesenhar();letras=[];trocas=[];marcada=null;if(jogo==="forca")forca();else{ordem=p.ordem.slice();await prepararImagem();quebra()}}catch(err){ui.toast(err.message)}finally{enviando=false}}const palavra=()=>p.codigo.map(n=>String.fromCharCode(n-7)).reverse().join("");function contas(){const w=palavra(),alvo=new Set(norm(w).replace(/[^A-Z]/g,"")),erros=letras.filter(l=>!alvo.has(l)).length;return{w,alvo,erros,venceu:[...alvo].every(a=>letras.includes(a)),perdeu:erros>=p.erros}}function forca(final){const c=contas(),fim=final||c.venceu||c.perdeu;const casas=c.w.split("").map(ch=>ch===" "?"<span class=\"forca-espaco\"></span>":"<span class=\"forca-casa\">".concat(letras.includes(norm(ch))||fim?ui.esc(ch):"","</span>")).join("");const gotas=Array.from({length:p.erros},(_,i)=>"<span class=\"forca-gota ".concat(i<c.erros?"is-seca":"","\" aria-hidden=\"true\">").concat(i<c.erros?"\uD83C\uDF42":"\uD83D\uDCA7","</span>")).join("");janela(INFO.forca.nome,"<p class=\"forca-dica\"><strong>Dica:</strong> ".concat(ui.esc(p.dica),"</p><div class=\"forca-palavra\" aria-label=\"Palavra\">").concat(casas,"</div>\n      <div class=\"forca-gotas\" role=\"img\" aria-label=\"").concat(p.erros-c.erros," de ").concat(p.erros," gotinhas\">").concat(gotas,"</div>\n      ").concat(final?"<div class=\"quiz-resultado ".concat(final.situacao==="venceu"?"is-ok":"is-nao","\" aria-live=\"polite\"><strong>").concat(ui.esc(final.resultado),"</strong></div>").concat(maisUma("forca")):"<div class=\"forca-teclado\">".concat(LETRAS.map(l=>"<button class=\"forca-tecla ".concat(letras.includes(l)?c.alvo.has(l)?"is-certa":"is-errada":"","\" data-forca-letra=\"").concat(l,"\" ").concat(letras.includes(l)||fim?"disabled":"",">").concat(l,"</button>")).join(""),"</div>")));if(!final&&fim)terminar({letras})}function prepararImagem(){const fallback="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(mascote()||"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 3 3\"><rect width=\"3\" height=\"3\" fill=\"#7cc0ea\"/></svg>");if(!p.foto){imagem=fallback;return Promise.resolve()}const url="https://drive.google.com/thumbnail?id="+encodeURIComponent(p.foto.fileId)+"&sz=w600";return new Promise(res=>{let feito=false;const fim=u=>{if(!feito){feito=true;imagem=u;res()}};const im=new Image;im.referrerPolicy="no-referrer";im.onload=()=>fim(url);im.onerror=()=>fim(fallback);im.src=url;setTimeout(()=>fim(fallback),6000)})}const resolvido=()=>ordem.every((v,i)=>v===i);function quebra(final){const fim=final||resolvido();const pecas=ordem.map((v,i)=>"<button class=\"quebra-peca ".concat(marcada===i?"is-marcada":""," ").concat(v===i?"is-no-lugar":"","\" data-quebra-peca=\"").concat(i,"\" ").concat(fim?"disabled":""," aria-label=\"Pe\xE7a ").concat(v+1," na casa ").concat(i+1,"\" style=\"background-image:url('").concat(imagem.replace(/'/g,"%27"),"');background-position:").concat(v%3*50,"% ").concat(Math.floor(v/3)*50,"%\"><small>").concat(v+1,"</small></button>")).join("");janela(INFO.quebra.nome,"<p class=\"small muted\">".concat(p.foto?ui.esc(p.foto.legenda||"Foto do \xE1lbum da equipe"):"Seu mascote"," \xB7 toque em duas pe\xE7as para trocar \xB7 ").concat(trocas.length," ").concat(trocas.length===1?"troca":"trocas","</p>\n      <div class=\"quebra-tabuleiro ").concat(fim?"is-pronto":"","\">").concat(pecas,"</div>\n      ").concat(final?"<div class=\"quiz-resultado ".concat(final.situacao==="venceu"?"is-ok":"is-nao","\" aria-live=\"polite\"><strong>").concat(ui.esc(final.resultado),"</strong></div>").concat(maisUma("quebra")):"<div class=\"dialog-actions\"><button class=\"button ghost\" data-quebra-desistir>Desistir desta partida</button></div>"));if(!final&&resolvido())terminar({trocas})}function maisUma(jogo){const x=e[jogo];return x.partidasHoje<x.limite?"<div class=\"dialog-actions\"><button class=\"button\" data-jogo-abrir=\"".concat(jogo,"\">Jogar de novo (").concat(x.limite-x.partidasHoje," hoje)</button></div>"):"<p class=\"small muted\">Partidas de hoje encerradas. Amanh\xE3 tem mais!</p>"}async function terminar(jogada){if(enviando)return;enviando=true;const jogo=p.jogo;try{const r=await ui.call("terminarJogoCPT",{partida:p.id,...jogada,operacaoId:op()});e=r.estado;redesenhar();ui.toast(r.resultado);aoMudar({pontos:r.pontos,venceu:r.situacao==="venceu"});if(jogo==="forca")forca(r);else quebra(r)}catch(err){ui.toast(err.message)}finally{enviando=false}}function init(api){ui=api;document.addEventListener("click",ev=>{const a=ev.target.closest("[data-jogo-abrir]");if(a){abrir(a.dataset.jogoAbrir);return}const l=ev.target.closest("[data-forca-letra]");if(l&&p&&p.jogo==="forca"&&!enviando){if(!letras.includes(l.dataset.forcaLetra)){letras.push(l.dataset.forcaLetra);forca()}return}const q=ev.target.closest("[data-quebra-peca]");if(q&&p&&p.jogo==="quebra"&&!enviando){const i=Number(q.dataset.quebraPeca);if(marcada===null)marcada=i;else if(marcada===i)marcada=null;else{[ordem[marcada],ordem[i]]=[ordem[i],ordem[marcada]];trocas.push([marcada,i]);marcada=null}quebra();return}if(ev.target.closest("[data-quebra-desistir]")&&p)terminar({trocas})});document.addEventListener("keydown",ev=>{if(!p||p.jogo!=="forca"||!$("detailDialog").open||enviando||!document.querySelector(".forca-teclado"))return;const L=norm(ev.key);if(/^[A-Z]$/.test(L)&&!letras.includes(L)){letras.push(L);forca()}})}return{init,painel,aoMudar:fn=>{aoMudar=fn},mascote:fn=>{mascote=fn}}})();
</script>
