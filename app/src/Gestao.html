ainel,renderConectores,colunas,barrasH,abas,irPara:k=>{aba=k}}})();window.CPTGuiaRelato=(()=>{"use strict";const PONTOS=[["O qu\xEA","A atividade e o tema.","Roda de conversa sobre descarte correto de \xF3leo de cozinha."],["Onde","Rua, escola, pra\xE7a ou equipamento, al\xE9m do bairro.","Na EMEF Jardim Ipanema, Rua das Flores, 120 (Vila Linda)."],["P\xFAblico","Quem participou e quantas pessoas, em n\xFAmero.","22 alunos do 5\xBA ano e 2 professoras."],["Resultado","O que aconteceu: d\xFAvidas, o que entenderam, o que foi entregue.","As crian\xE7as perguntaram para onde vai o \xF3leo e levaram folhetos para casa."],["Encaminhamento","O que fica para depois. Se nada, escreva \"sem encaminhamentos\".","Ficou combinado o ponto de coleta na escola a partir de 10/11."],["Tamanho","Pelo menos 5 linhas: o relato vira texto do relat\xF3rio para a Sabesp.",""]];function html(faltam){const f=new Set(faltam||[]);return"<div class=\"guia-relato\"><p>Um bom relato responde a seis perguntas. Escreva como se contasse para algu\xE9m que n\xE3o estava l\xE1.</p>\n      <ol class=\"guia-pontos\">".concat(PONTOS.map(([t,d,ex])=>"<li class=\"".concat(f.has(t)?"falta":"","\"><strong>").concat(t).concat(f.has(t)?" <span class=\"guia-falta\">faltou aqui</span>":"","</strong><span>").concat(d,"</span>").concat(ex?"<em>Ex.: ".concat(ex,"</em>"):"","</li>")).join(""),"</ol>\n      <details><summary>Exemplo completo</summary><p class=\"guia-exemplo\">Realizamos uma roda de conversa sobre descarte correto de \xF3leo de cozinha na EMEF Jardim Ipanema (Rua das Flores, 120, Vila Linda), com 22 alunos do 5\xBA ano e 2 professoras. As crian\xE7as perguntaram para onde vai o \xF3leo depois da coleta e por que ele n\xE3o pode ir para a pia; explicamos o entupimento da rede e a contamina\xE7\xE3o do c\xF3rrego. Cada aluno levou um folheto para casa. Ficou combinado com a dire\xE7\xE3o um ponto de coleta na escola a partir de 10/11, que a equipe vai acompanhar.</p></details>\n      <p class=\"small muted\">A confer\xEAncia autom\xE1tica \xE9 uma ajuda para escrever. Ningu\xE9m recebe nota e n\xE3o existe ranking.</p></div>")}function abrir(faltam){document.getElementById("detailType").textContent="GUIA";document.getElementById("detailTitle").textContent="Como escrever um bom relato";document.getElementById("detailContent").innerHTML=html(faltam);const d=document.getElementById("detailDialog");if(!d.open)d.showModal()}document.addEventListener("click",ev=>{const g=ev.target.closest("[data-guia-relato]");if(g)abrir((g.dataset.guiaRelato||"").split("|").filter(Boolean))});return{abrir,html}})();
