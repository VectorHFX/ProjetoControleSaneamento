<script>
/* Obras 2.14.0 — consulta para todos; cadastro, revisão diária e bairros para Administrativo e Gestão.
   Nome de uso em destaque (o oficial fica abaixo); apelidos entram na busca. */
window.CPTObras = (() => {
  'use strict';
  let ui = null, dados = null, ticket = 0, filtro = {busca: '', situacao: 'ativas'}, bairrosAberto = false, aba = 'catalogo', hojeDados = null, vinculos = null;
  const op = () => 'OP-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  const $ = id => document.getElementById(id);
  const hoje = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
  const dias = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
  const exibir = o => o.exibir || o.nomeUso || o.nome;
  const separar = v => String(v || '').split(',').map(x => x.trim()).filter(Boolean);
  const cadastroBairros = () => dados.bairrosCadastro || dados.bairros.map(nome => ({id: '', nome, noFormulario: true, apelidos: []}));
  const corSituacao = s => ({'Em andamento': 'green', 'Paralisada': 'orange', 'Finalizada': '', 'A confirmar': 'orange'}[s] ?? 'orange');

  function revisao(o) {
    const d = dias(o.atualizadoEm);
    if (d == null) return 'Sem revisão registrada';
    return d === 0 ? 'Revisada hoje' : d === 1 ? 'Revisada ontem' : 'Revisada há ' + d + ' dias';
  }
  function visiveis() {
    const b = ui.norm(filtro.busca);
    return dados.obras.filter(o => (filtro.situacao === 'todas' || (filtro.situacao === 'ativas' ? ['Em andamento', 'Paralisada', 'A confirmar', ''].includes(o.situacao) : o.situacao === filtro.situacao)) &&
      (!b || ui.norm([o.id, o.nome, o.nomeUso, (o.apelidos || []).join(' '), o.bairros.join(' '), o.endereco, o.logradouroPAC16].join(' ')).includes(b)));
  }
  function statusFormulario(f) {
    if (!f || f.situacao === 'desconhecida') return '';
    const texto = {pendente: 'Há alterações aguardando o formulário. As listas são atualizadas em até 1 hora.', erro: 'A última atualização do formulário falhou: ' + f.texto, ok: 'Formulário em dia. ' + f.texto}[f.situacao];
    return `<div class="notice" role="status">${ui.esc(texto)}</div>`;
  }
  async function render() {
    const mine = ++ticket;
    ui.view.innerHTML = ui.intro('Obras e frentes de serviço', 'Situação, endereço e bairros de cada obra. É daqui que saem a lista do formulário e o item 1 do relatório.') + '<div class="loading-label"><span class="spinner"></span>Carregando obras…</div><div class="skel-list" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';
    try { dados = await ui.call('listarObrasCPT'); if (mine !== ticket || ui.state.route !== 'obras') return; draw(); }
    catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro('Obras e frentes de serviço', '') + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  /** Gerência: Catálogo · Obras de hoje · Para vincular. Demais perfis: só o catálogo. */
  function abas() {
    if (!dados.gerencia) return '';
    const n = vinculos ? vinculos.pendentes.length : null;
    return `<div class="segmented obra-tabs" role="tablist" aria-label="Partes de Obras">${[['catalogo', 'Catálogo'], ['hoje', 'Obras de hoje'], ['vincular', 'Para vincular' + (n ? ' (' + n + ')' : '')]].map(([k, t]) => `<button role="tab" aria-selected="${aba === k}" class="${aba === k ? 'chosen' : ''}" data-obra-aba="${k}">${t}</button>`).join('')}</div>`;
  }
  function draw() {
    if (!dados.gerencia) aba = 'catalogo';
    const topo = ui.intro('Obras e frentes de serviço', 'Situação, endereço e bairros de cada obra. É daqui que saem a lista do formulário e o item 1 do relatório.') + statusFormulario(dados.formulario) + abas();
    if (aba === 'hoje') { ui.view.innerHTML = topo + '<div id="obrasHoje"></div>'; carregarHoje(); return; }
    if (aba === 'vincular') { ui.view.innerHTML = topo + '<div id="obrasVincular"></div>'; carregarVinculos(); return; }
    const lista = visiveis(), ativas = dados.obras.filter(o => ['Em andamento', 'Paralisada'].includes(o.situacao));
    const atrasadas = ativas.filter(o => (dias(o.atualizadoEm) ?? 99) > 7).length;
    ui.view.innerHTML = topo +
      `<section class="panel filter-panel"><form id="obraFiltros" class="filters cases">
        <label class="field">Localizar obra<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtro.busca)}" placeholder="Nome, bairro, endereço ou ID" maxlength="120"></span></label>
        <label class="field">Mostrar<select name="situacao">${[['ativas', 'Ativas e a confirmar'], ['Em andamento', 'Em andamento'], ['Paralisada', 'Paralisadas'], ['Finalizada', 'Finalizadas'], ['todas', 'Todas']].map(([v, t]) => `<option value="${v}" ${filtro.situacao === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        ${dados.podeEditar ? `<button type="button" class="button" data-obra-acao="nova">${ui.icon('plus')}Cadastrar obra</button>` : ''}
      </form></section>
      <div class="results-head"><span>${ui.num(lista.length)} obras exibidas · ${ui.num(ativas.length)} ativas</span>${dados.podeEditar && atrasadas ? `<span>${ui.num(atrasadas)} ativas sem revisão há mais de 7 dias</span>` : ''}</div>
      <div class="obra-lista" role="list">${lista.map(linha).join('') || '<p class="muted">Nenhuma obra com estes filtros.</p>'}</div>
      ${painelBairros()}`;
    $('bairrosPainel').addEventListener('toggle', e => { bairrosAberto = e.target.open; });
    const f = $('obraFiltros');
    f.addEventListener('change', () => { filtro = Object.fromEntries(new FormData(f)); draw(); });
    f.elements.busca.addEventListener('input', e => { filtro.busca = e.target.value; clearTimeout(f._t); f._t = setTimeout(() => { const pos = e.target.selectionStart; draw(); const i = $('obraFiltros').elements.busca; i.focus(); i.setSelectionRange(pos, pos); }, 250); });
  }
  function linha(o) {
    const atraso = ['Em andamento', 'Paralisada'].includes(o.situacao) && (dias(o.atualizadoEm) ?? 99) > 7;
    return `<article class="entry-card obra-card" role="listitem"><div class="card-top"><span class="badge ${corSituacao(o.situacao)}">${ui.esc(o.situacao || 'Sem situação')}</span><span class="date">${ui.esc(o.id)}</span></div>
      <h3>${ui.esc(exibir(o))}</h3>${o.nomeUso && o.nomeUso !== o.nome ? `<p class="obra-oficial small muted">Nome oficial: ${ui.esc(o.nome)}</p>` : ''}<p>${ui.esc(o.bairros.join(' · ') || 'Bairros não informados')}<br>${ui.esc(o.endereco || o.logradouroPAC16 || 'Endereço não informado')}</p>
      <p class="small muted">${o.inicioObra ? 'Início ' + ui.date(o.inicioObra) : 'Início não informado'}${o.publico ? ' · Público ' + ui.esc(o.publico) : ''}${o.impacto ? ' · Impacto ' + ui.esc(o.impacto) : ''} · ${o.noFormularioAgora ? 'No formulário' : 'Fora do formulário'}</p>
      <div class="card-bottom"><span class="${atraso ? 'text-warning' : ''}">${revisao(o)}</span><span>
      ${dados.podeEditar && ['Em andamento', 'Paralisada'].includes(o.situacao) ? `<button class="button ghost" data-obra-confirmar="${ui.esc(o.id)}" title="Confirma que a situação continua a mesma hoje">Continua igual</button>` : ''}
      <button class="button ghost" data-obra="${ui.esc(o.id)}">${dados.podeEditar ? 'Abrir e editar' : 'Ver detalhes'} ${ui.icon('arrow')}</button></span></div></article>`;
  }
  function painelBairros() {
    const lista = cadastroBairros(), fora = lista.filter(b => !b.noFormulario).length;
    return `<details id="bairrosPainel" class="panel bairros-panel" ${bairrosAberto ? 'open' : ''}><summary><strong>Bairros</strong> <span class="muted">${ui.num(lista.length)} cadastrados${fora ? ' · ' + ui.num(fora) + ' fora do formulário' : ''}</span></summary>
      ${dados.podeEditar ? `<div class="bairros-acoes"><button type="button" class="button secondary" data-bairro-novo>${ui.icon('plus')}Cadastrar bairro</button></div>` : ''}
      <div class="bairros-lista" role="list">${lista.map(b => `<div class="bairro-row" role="listitem"><span><strong>${ui.esc(b.nome)}</strong>${b.apelidos.length ? `<small class="muted"> · também chamado de ${ui.esc(b.apelidos.join(', '))}</small>` : ''}</span>
        <span class="badge ${b.noFormulario ? 'green' : ''}">${b.noFormulario ? 'No formulário' : 'Fora do formulário'}</span>${dados.podeEditar && b.id ? `<button type="button" class="button ghost" data-bairro="${ui.esc(b.nome)}">Editar</button>` : ''}</div>`).join('')}</div></details>`;
  }
  function editorBairro(b) {
    const novo = !b, e = b || {id: '', nome: '', noFormulario: true, apelidos: []};
    $('detailType').textContent = novo ? 'NOVO BAIRRO' : 'BAIRRO ' + e.id; $('detailTitle').textContent = novo ? 'Cadastrar bairro' : e.nome;
    $('detailContent').innerHTML = `<form id="bairroForm"><div id="bairroErro" class="notice" hidden></div><div class="editor-grid">
      ${campo('Nome do bairro', `<input name="nome" required maxlength="80" value="${ui.esc(e.nome)}" ${novo ? '' : 'disabled'}>`, true)}
      ${novo ? '' : '<p class="small muted wide">O nome não muda pela aplicação: obras e registros guardam o bairro pelo nome. Use "também chamado de" para outros nomes.</p>'}
      ${campo('Também chamado de (separe por vírgula)', `<input name="apelidos" maxlength="400" value="${ui.esc(e.apelidos.join(', '))}">`, true)}
      <label class="check-inline"><input type="checkbox" name="noFormulario" ${e.noFormulario ? 'checked' : ''}> Mostrar no formulário de campo</label>
      </div><div class="dialog-actions"><button class="button" type="submit">${novo ? 'Cadastrar bairro' : 'Salvar alterações'}</button></div></form>`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
    $('bairroForm').onsubmit = async ev => {
      ev.preventDefault(); const f = new FormData(ev.target), b2 = ev.target.querySelector('button[type=submit]'), erro = $('bairroErro');
      b2.disabled = true; b2.textContent = 'Salvando…'; erro.hidden = true;
      try { const r = await ui.call('salvarBairroCPT', {id: e.id, nome: novo ? f.get('nome') : e.nome, noFormulario: f.has('noFormulario'), apelidos: separar(f.get('apelidos'))}); ui.toast(r.resultado); $('detailDialog').close(); bairrosAberto = true; render(); }
      catch (err) { erro.textContent = err.message + ' Seus dados continuam no formulário.'; erro.hidden = false; b2.disabled = false; b2.textContent = novo ? 'Cadastrar bairro' : 'Salvar alterações'; }
    };
  }
  // ---------- Obras de hoje ----------
  async function carregarHoje(dia) {
    const box = $('obrasHoje'); if (!box) return;
    box.innerHTML = '<div class="loading-label"><span class="spinner"></span>Buscando as obras do dia…</div>';
    try { hojeDados = await ui.call('obrasDeHojeCPT', dia ? {dia} : {}); } catch (e) { box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    if (ui.state.route === 'obras' && aba === 'hoje') desenharHoje();
  }
  function desenharHoje() {
    const box = $('obrasHoje'), h = hojeDados; if (!box || !h) return;
    const c = h.confirmado, marcadas = new Set(c ? c.obras : h.sugestao), sug = new Set(h.sugestao), ehHoje = h.dia === h.hoje;
    const estado = c ? (c.nenhuma ? 'Registrado: nenhuma obra neste dia.' : 'Confirmado: ' + c.obras.length + (c.obras.length === 1 ? ' obra' : ' obras') + '.') + (c.por ? ' Por ' + ui.esc(c.por) + '.' : '') : 'Ainda não informado. Sem confirmação, o dia aparece como "não informado" no painel da gestão.';
    box.innerHTML = `<section class="panel obras-hoje"><div class="panel-head"><div><span class="eyebrow">${ehHoje ? 'HOJE' : 'DIA ANTERIOR'}</span><h2>Obras com frente de serviço em ${ui.date(h.dia)}</h2>
        <p class="small ${c ? 'muted' : 'text-warning'}">${estado}</p></div>
        <label class="field compact">Outro dia<input type="date" id="obrasHojeDia" value="${ui.esc(h.dia)}" max="${ui.esc(h.hoje)}"></label></div>
      ${h.antesDoHorario ? '<div class="notice">A confirmação de hoje abre às 7h, quando a engenharia avisa as frentes do dia.</div>' : ''}
      <form id="obrasHojeForm"><div class="hoje-lista" role="group" aria-label="Obras ativas">${h.obras.map(o => `<label class="hoje-obra ${marcadas.has(o.id) && !(c && c.nenhuma) ? 'is-on' : ''}"><input type="checkbox" name="obra" value="${ui.esc(o.id)}" ${marcadas.has(o.id) && !(c && c.nenhuma) ? 'checked' : ''} ${h.podeConfirmar ? '' : 'disabled'}><span><strong>${ui.esc(o.exibir)}</strong><small>${ui.esc((o.bairros || []).join(' · ') || o.situacao)}</small></span>${sug.has(o.id) ? '<em class="hoje-sugerida" title="Pelo cronograma do dia ou pelo dia anterior">sugerida</em>' : ''}</label>`).join('') || '<p class="muted">Nenhuma obra ativa no catálogo.</p>'}</div>
        <label class="check-inline hoje-nenhuma"><input type="checkbox" name="nenhuma" ${c && c.nenhuma ? 'checked' : ''} ${h.podeConfirmar ? '' : 'disabled'}> Nenhuma obra neste dia</label>
        ${h.podeConfirmar ? `<div class="dialog-actions"><button class="button" type="submit">${c ? 'Atualizar confirmação' : 'Confirmar obras'}</button></div>` : ''}</form></section>`;
    $('obrasHojeDia').addEventListener('change', e => { if (e.target.value) carregarHoje(e.target.value); });
    const f = $('obrasHojeForm');
    f.addEventListener('change', e => {
      if (e.target.name === 'nenhuma' && e.target.checked) f.querySelectorAll('[name=obra]').forEach(x => { x.checked = false; });
      if (e.target.name === 'obra' && e.target.checked) f.elements.nenhuma.checked = false;
      f.querySelectorAll('.hoje-obra').forEach(l => l.classList.toggle('is-on', l.querySelector('input').checked));
    });
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); const b = f.querySelector('button[type=submit]');
      const p = {dia: h.dia, obras: [...f.querySelectorAll('[name=obra]:checked')].map(x => x.value), nenhuma: f.elements.nenhuma.checked, versao: c ? c.versao : 0, operacaoId: op()};
      b.disabled = true; b.textContent = 'Salvando…';
      try { const r = await ui.call('confirmarObrasDoDiaCPT', p); hojeDados.confirmado = r.confirmado; ui.toast(r.resultado); desenharHoje(); window.CPTMissoes && window.CPTMissoes.feita('obras-hoje'); }
      catch (e) { ui.toast(e.message); b.disabled = false; b.textContent = c ? 'Atualizar confirmação' : 'Confirmar obras'; }
    });
  }
  // ---------- Para vincular ("outra obra") ----------
  async function carregarVinculos() {
    const box = $('obrasVincular'); if (!box) return;
    box.innerHTML = '<div class="loading-label"><span class="spinner"></span>Procurando registros de "outra obra"…</div>';
    try { vinculos = await ui.call('listarVinculosObraCPT'); } catch (e) { box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    if (ui.state.route === 'obras' && aba === 'vincular') desenharVinculos();
  }
  function desenharVinculos() {
    const box = $('obrasVincular'); if (!box || !vinculos) return;
    const t = document.querySelector('[data-obra-aba=vincular]'); if (t) t.textContent = 'Para vincular' + (vinculos.pendentes.length ? ' (' + vinculos.pendentes.length + ')' : '');
    const opcoes = '<option value="">Escolha a obra…</option>' + vinculos.obras.map(o => `<option value="${ui.esc(o.id)}">${ui.esc(o.exibir)}${o.bairros && o.bairros.length ? ' — ' + ui.esc(o.bairros.join(' / ')) : ''}</option>`).join('');
    box.innerHTML = `<div class="results-head"><span>${vinculos.pendentes.length ? ui.num(vinculos.pendentes.length) + (vinculos.pendentes.length === 1 ? ' registro' : ' registros') + ' com "obra ainda não cadastrada"' : 'Nenhum registro esperando vínculo.'}</span>${dados.podeEditar ? `<button type="button" class="button secondary" data-obra-acao="nova">${ui.icon('plus')}Cadastrar obra nova</button>` : ''}</div>
      <p class="small muted">O registro original não muda. O vínculo vale nas telas, no painel e no relatório.</p>
      <div class="vinculo-lista">${vinculos.pendentes.map(r => `<article class="entry-card vinculo-card" data-vinc="${ui.esc(r.id)}"><div class="card-top"><span class="badge orange">${ui.esc(r.procedimento)}</span><span class="date">${ui.date(r.data)}</span></div>
        <h3>${ui.esc(r.atividade || 'Atividade sem título')}</h3><p class="small muted">${ui.esc([r.bairro, r.responsavel].filter(Boolean).join(' · '))}</p>
        ${r.observacao ? `<blockquote class="vinculo-obs">${ui.esc(r.observacao)}</blockquote>` : '<p class="small muted">Sem observação final.</p>'}
        <div class="vinculo-acao"><select aria-label="Obra deste registro" data-vinc-obra>${opcoes}</select><button type="button" class="button" data-vincular="${ui.esc(r.id)}">Vincular</button></div></article>`).join('')}</div>`;
  }
  async function vincular(id, botao) {
    const sel = botao.closest('.vinculo-card').querySelector('[data-vinc-obra]');
    if (!sel.value) { ui.toast('Escolha a obra deste registro.'); sel.focus(); return; }
    botao.disabled = true; botao.textContent = 'Vinculando…';
    try {
      const r = await ui.call('vincularObraCPT', {registroId: id, obraId: sel.value, operacaoId: op()}); ui.toast(r.resultado);
      vinculos.pendentes = vinculos.pendentes.filter(x => x.id !== id); desenharVinculos();
      if (!vinculos.pendentes.length && window.CPTMissoes) window.CPTMissoes.feita('vincular-obra');
    } catch (e) { ui.toast(e.message); botao.disabled = false; botao.textContent = 'Vincular'; }
  }
  function campo(rotulo, html, largo) { return `<label class="${largo ? 'wide' : ''}">${rotulo}${html}</label>`; }
  function editor(o) {
    const novo = !o, e = o || {id: '', nome: '', nomeUso: '', apelidos: [], bairros: [], noFormulario: true, situacao: 'Em andamento', inicioObra: hoje(), inicioComunicacao: '', termino: '', publico: '', impacto: '', observacao: '', tipo: '', endereco: '', atualizadoEm: ''};
    const so = !dados.podeEditar, dis = so ? 'disabled' : '';
    const mapa = e.latitude != null ? `<a href="https://www.google.com/maps?q=${e.latitude},${e.longitude}" target="_blank" rel="noopener noreferrer">Abrir no mapa ↗</a>` : '';
    $('detailType').textContent = novo ? 'NOVA OBRA' : 'OBRA ' + e.id; $('detailTitle').textContent = novo ? 'Cadastrar obra' : exibir(e);
    $('detailContent').innerHTML = `<form id="obraForm"><div id="obraErro" class="notice" hidden></div><div class="editor-grid">
      ${campo('Nome oficial da obra / frente', `<input name="nome" required maxlength="200" value="${ui.esc(e.nome)}" ${dis}>`, true)}
      ${campo('Nome de uso <small class="muted">(curto, aparece nas telas, no relatório e no formulário)</small>', `<input name="nomeUso" maxlength="80" placeholder="Opcional. Sem ele, vale o nome oficial" value="${ui.esc(e.nomeUso || '')}" ${dis}>`)}
      ${campo('Também chamada de <small class="muted">(separe por vírgula; ajuda a busca)</small>', `<input name="apelidos" maxlength="400" value="${ui.esc((e.apelidos || []).join(', '))}" ${dis}>`)}
      ${campo('Situação atual', `<select name="situacao" ${dis}>${dados.situacoes.map(s => `<option ${s === e.situacao ? 'selected' : ''}>${s}</option>`).join('')}</select>`)}
      <label class="check-inline"><input type="checkbox" name="noFormulario" ${e.noFormulario ? 'checked' : ''} ${dis}> Mostrar no formulário (quando em andamento ou paralisada)</label>
      ${campo('Tipo de obra', `<input name="tipo" maxlength="120" placeholder="Ex.: Coletor tronco, rede coletora, MND" value="${ui.esc(e.tipo)}" ${dis}>`)}
      ${campo('Endereço da frente', `<input name="endereco" maxlength="300" placeholder="${ui.esc(e.logradouroPAC16 || 'Rua, trecho ou intervalo de numeração')}" value="${ui.esc(e.endereco)}" ${dis}>`)}
      ${campo('Início da obra', `<input type="date" name="inicioObra" value="${ui.esc(e.inicioObra)}" ${dis}>`)}
      ${campo('Término da obra', `<input type="date" name="termino" value="${ui.esc(e.termino)}" ${dis}>`)}
      ${campo('Início da comunicação', `<input type="date" name="inicioComunicacao" value="${ui.esc(e.inicioComunicacao)}" ${dis}>`)}
      ${campo('Tipo de público (A, B, C…)', `<input name="publico" maxlength="20" placeholder="A, B" value="${ui.esc(e.publico)}" ${dis}>`)}
      ${campo('Impacto', `<select name="impacto" ${dis}><option value="">Não informado</option>${dados.impactos.map(s => `<option ${s === e.impacto ? 'selected' : ''}>${s}</option>`).join('')}</select>`)}
      <fieldset class="wide"><legend>Bairros</legend><div class="check-options obra-bairros">${dados.bairros.map(b => `<label><input type="checkbox" name="bairros" value="${ui.esc(b)}" ${e.bairros.includes(b) ? 'checked' : ''} ${dis}> ${ui.esc(b)}</label>`).join('')}</div></fieldset>
      ${campo('Observação', `<textarea name="observacao" rows="3" maxlength="1000" ${dis}>${ui.esc(e.observacao)}</textarea>`, true)}
      </div>
      ${novo ? '' : `<p class="small muted">PAC16: ${ui.esc(e.logradouroPAC16 || '—')} · ${ui.esc(e.metodoPAC16 || '—')} ${mapa}<br>${ui.esc(revisao(e))}${e.atualizadoPor ? ' por ' + ui.esc(e.atualizadoPor) : ''}.</p>`}
      ${so ? '' : `<div class="dialog-actions"><button class="button" type="submit">${novo ? 'Cadastrar obra' : 'Salvar alterações'}</button></div>`}</form>`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
    if (so) return;
    $('obraForm').onsubmit = async ev => {
      ev.preventDefault(); const f = new FormData(ev.target), b = ev.target.querySelector('button[type=submit]'), erro = $('obraErro');
      const p = {id: e.id, atualizadoEm: e.atualizadoEm, nome: f.get('nome'), nomeUso: f.get('nomeUso'), apelidos: separar(f.get('apelidos')), situacao: f.get('situacao'), noFormulario: f.has('noFormulario'), tipo: f.get('tipo'), endereco: f.get('endereco'),
        inicioObra: f.get('inicioObra'), termino: f.get('termino'), inicioComunicacao: f.get('inicioComunicacao'), publico: f.get('publico'), impacto: f.get('impacto'), bairros: f.getAll('bairros'), observacao: f.get('observacao')};
      b.disabled = true; b.textContent = 'Salvando…'; erro.hidden = true;
      try { const r = await ui.call('salvarObraCPT', p); ui.toast(r.resultado); $('detailDialog').close(); vinculos = null; render(); }
      catch (err) { erro.textContent = err.message + ' Seus dados continuam no formulário.'; erro.hidden = false; erro.scrollIntoView({block: 'nearest'}); b.disabled = false; b.textContent = novo ? 'Cadastrar obra' : 'Salvar alterações'; }
    };
  }
  async function confirmar(id, botao) {
    const o = dados.obras.find(x => x.id === id); if (!o) return;
    botao.disabled = true; botao.textContent = 'Confirmando…';
    try { const r = await ui.call('confirmarObraCPT', {id, atualizadoEm: o.atualizadoEm}); Object.assign(o, r.obra); ui.toast(r.resultado); draw(); }
    catch (e) { ui.toast(e.message); botao.disabled = false; botao.textContent = 'Continua igual'; }
  }
  function init(api) {
    ui = api;
    // Missões e atalhos levam direto a uma parte (antes da navegação desenhar a página).
    document.addEventListener('click', ev => { const ir = ev.target.closest('[data-obra-ir]'); if (ir) aba = ir.dataset.obraIr; }, true);
    document.addEventListener('click', ev => {
      const abrir = ev.target.closest('[data-obra]'); if (abrir) { editor(dados.obras.find(o => o.id === abrir.dataset.obra)); return; }
      const ok = ev.target.closest('[data-obra-confirmar]'); if (ok) { confirmar(ok.dataset.obraConfirmar, ok); return; }
      if (ev.target.closest('[data-obra-acao="nova"]')) { editor(null); return; }
      const t = ev.target.closest('[data-obra-aba]'); if (t) { aba = t.dataset.obraAba; draw(); return; }
      const vi = ev.target.closest('[data-vincular]'); if (vi) { vincular(vi.dataset.vincular, vi); return; }
      const bairro = ev.target.closest('[data-bairro]'); if (bairro) { editorBairro(cadastroBairros().find(b => b.nome === bairro.dataset.bairro)); return; }
      if (ev.target.closest('[data-bairro-novo]')) editorBairro(null);
    });
  }
  return {init, render, irPara: a => { aba = a; }};
})();
</script>
