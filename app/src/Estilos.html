.view-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--visao) 45%,var(--line));background:color-mix(in srgb,var(--visao) 10%,var(--surface));color:var(--ink);font-size:13px;line-height:1.45}

.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 18px}
.shortcut{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--visao);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:64px}

/* Painel da gestão */
.painel-tabs{display:inline-flex;margin:0 0 18px;max-width:100%;overflow-x:auto}

.attention{margin-bottom:16px;border-left:4px solid var(--visao)}
.alert-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alert-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

.alert-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mint)}
.alert-alto .alert-dot,.is-bad .alert-dot{background:#c2412d}.alert-medio .alert-dot,.is-warn .alert-dot{background:#d18a1f}.alert-baixo .alert-dot{background:var(--muted)}.is-ok .alert-dot{background:var(--mint)}
.ok-line{color:var(--mint);font-weight:600;margin:6px 0}
.stat-value small{font-size:.5em;color:var(--muted);font-weight:600}

.mini-chart{margin:0}.mini-chart figcaption{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}

.col-bar{fill:var(--blue)}.col-bar.b{fill:var(--visao)}.col-bar.c{fill:var(--mint)}

.key-swatch{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--blue);margin:0 4px 0 10px;vertical-align:-1px}.key-swatch.b{background:var(--visao)}.key-swatch.c{background:var(--mint)}

.front-cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}

.late-text{color:#b2412d}html[data-theme=dark] .late-text{color:#ff9f8a}
.front-numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.front-numbers div{background:var(--bg);border-radius:10px;padding:6px 8px}.front-numbers dt{font-size:10px;color:var(--muted)}.front-numbers dd{margin:0;font-weight:750;font-size:17px}

.relato-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}

/* Programa Parceiros */

.pp-main textarea{resize:vertical;line-height:1.5}
.pp-number{display:flex;gap:8px;align-items:center}.pp-number input{max-width:200px}
.small-button{font-size:12px;padding:6px 10px;min-height:36px}
.pp-check{display:flex;gap:8px;align-items:center;font-weight:600}.pp-check input{width:22px;min-height:22px;height:22px}

.pp-hint.warn{color:#985919}html[data-theme=dark] .pp-hint.warn{color:#ffcf91}

@media(max-width:800px){.sidebar nav{overflow-x:auto;scrollbar-width:none}.sidebar nav .nav-item{flex:0 0 auto;min-width:72px}.pp-row{grid-template-columns:36px minmax(0,1fr)}.pp-ok{grid-column:2}.front-numbers{grid-template-columns:repeat(2,1fr)}.hbars li{grid-template-columns:minmax(0,1fr) 70px auto}.view-banner{font-size:12px}.pp-bar{bottom:84px}}

/* 2.8 — Comunicação, Recados, Contatos e Lembretes: blocos curtos, um verbo por linha, botões grandes. */
.nav-item{position:relative}

.tool-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tool-head .painel-tabs{margin:0}.tool-head>.button{margin-left:auto}
.count-pill{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--bg);font-size:11px;font-weight:750;margin-left:4px}

.stack-form{display:grid;gap:12px}.stack-form .field{display:grid;gap:5px}
.stack-form input:not([type=checkbox]):not([type=radio]),.stack-form select,.stack-form textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;align-items:end}
.choice-group,.big-choice,.done-fields{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;display:flex;flex-wrap:wrap;gap:8px 16px}

.done-fields{display:block}.done-fields .form-row+.form-row{margin-top:10px}
.choice{display:inline-flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}.choice input{width:18px;height:18px}

.big-choice input{margin-top:3px;width:18px;height:18px}.big-choice small{display:block;color:var(--muted)}
.people-pick{border:1px solid var(--line);border-radius:12px;padding:8px 12px}.people-pick summary{cursor:pointer;font-weight:650}.people-pick .choice{margin-right:14px}
.simple-list{display:grid;gap:8px}
.simple-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.simple-row:hover,.simple-row:focus-visible{border-color:var(--visao)}
.row-dot{width:10px;height:10px;border-radius:50%;background:transparent;flex:none}.is-new .row-dot{background:var(--visao)}.is-new .row-main strong{font-weight:800}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.row-main small{color:var(--muted)}
.tag-important{color:#b2412d;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.link-chip{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--visao) 8%,var(--surface));border:1px solid var(--line);margin:0 0 10px}
.message{background:var(--bg);border-radius:12px;padding:12px 14px;margin:8px 0;white-space:pre-line;line-height:1.5}.message p{margin:4px 0 0}
.message.reply{background:var(--surface);border:1px solid var(--line)}.message small{color:var(--muted)}
.contact-cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}

.gallery-bar>span:last-child{display:flex;gap:6px;flex-wrap:wrap}

/* 2.9 — Meu espaço: mascote, checklist e caderno. */
.space-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start}
.space-main{display:grid;gap:16px;min-width:0}.space-main .today-hello{margin:0}
.mascot-stage{text-align:center;position:sticky;top:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--visao) 12%,var(--surface)),var(--surface) 60%)}
.mascot-art{display:flex;justify-content:center;padding-top:6px}
.mascot-art .mascot-svg{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
@media(prefers-reduced-motion:reduce){.mascot-art .mascot-svg{animation:none}}html[data-motion=reduce] .mascot-art .mascot-svg{animation:none}
.mascot-name{margin:4px 0 0;font-size:24px}.mascot-name .link-button{font-size:12px;font-weight:600}
.gift{display:block;width:100%;margin:12px 0;padding:12px;border-radius:12px;border:2px dashed #d18a1f;background:#fff4df;color:#6b4300;font:inherit;font-weight:750;cursor:pointer;animation:pulse 2.4s ease-in-out infinite}
html[data-theme=dark] .gift{background:#3a2c17;color:#ffd99a}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d18a1f33}50%{box-shadow:0 0 0 6px #d18a1f22}}@media(prefers-reduced-motion:reduce){.gift{animation:none}}
.mascot-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 8px;font-size:14px}
.dialog-actions.center{justify-content:center}
.day-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.day-nav>div{flex:1;min-width:160px}.day-nav h2{margin:0;font-size:18px}
.inline-add{display:flex;gap:8px;align-items:flex-end;margin:10px 0;flex-wrap:wrap}.inline-add input{flex:1 1 220px;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.inline-add .field{flex:1 1 220px;display:grid;gap:5px}
.check-list{list-style:none;margin:6px 0;padding:0;display:grid;gap:6px}
.check-list li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.check-list label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-height:32px}.check-list input{width:20px;height:20px;flex:none;accent-color:var(--visao)}
.check-list li.is-done span{text-decoration:line-through;color:var(--muted)}
.pts{font-size:13px}.small-x{width:30px;height:30px;font-size:18px;line-height:1}
.notebook{width:100%;min-height:180px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:15px;line-height:1.7;color:var(--ink);resize:vertical;
  background:repeating-linear-gradient(var(--surface),var(--surface) 25px,color-mix(in srgb,var(--visao) 14%,var(--surface)) 26px);background-attachment:local}
.notebook-past{margin-top:10px}.notebook-past summary{cursor:pointer;font-weight:650}
.welcome-pets{text-align:center}.welcome-pets h1{margin:6px 0}
.pet-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:16px 0}
.pet-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.pet-option:hover,.pet-option:focus-visible,.pet-option.is-picked{border-color:var(--visao);background:color-mix(in srgb,var(--visao) 8%,var(--surface))}
.welcome-pets .inline-add{justify-content:center;max-width:520px;margin:0 auto}
.wardrobe-tabs{display:flex;flex-wrap:wrap;margin-bottom:6px}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wardrobe-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;text-align:center}
.wardrobe-item small{color:var(--muted)}.wardrobe-item.is-on{border-color:var(--visao);background:color-mix(in srgb,var(--visao) 9%,var(--surface))}.wardrobe-item[aria-disabled=true]{opacity:.55}
@media(max-width:900px){.space-grid{grid-template-columns:1fr}.mascot-stage{position:static}}
/* ============================================================
   Tema 2.10 "Água clara" — camada final (vence as anteriores).
   Paleta calma: verde-água + areia, sem rosa/ameixa saturado. Mais respiro entre blocos.
   ============================================================ */
:root,[data-theme=light]{color-scheme:light;
  --bg:#f2f6f4;--surface:#ffffff;--ink:#1d2b29;--muted:#566763;--line:#e0e8e4;--blue:#0e7369;--pale:#e2f2ee;--navy:#123e39;--mint:#2b7a52;--soft:#edf6f2;--focus:#0e7369;--orange:#c96f1e;
  --accent:#f2b23b;--coral:#e8735a;--sky1:#d9f0f2;--sky2:#f3f9f4;--sun:#ffd36b;--hill1:#bfe3cf;--hill2:#d9eedf;--water1:#7fcfc3;--water2:#3ea596;--house:#ffffff;--roof:#e8735a;--tree:#7cc39a;--cloud:#ffffff;
  --art-main:#0e7369;--art-secondary:#58b8a8;--art-accent:#f2b23b;--art-ink:#123e39;--art-paper:#ffffff;--art-soft:#d7eee8;--wave1:#a7ddd2;--wave2:#4fb0a1;--wave3:#17756b;
  --tile1:#edf7f4;--tile2:#f2f7ea;--tile3:#fff5e2;
  --front-atendimento:#2f6fa3;--front-socioambiental:#2e8b57;--front-comunicacao:#c96f1e;--front-gestao:#6c5ba7;--front-administrativo:#4a6fa5;
  --chart-1:#0e7369;--chart-2:#58b8a8;--chart-3:#f2b23b;--chart-4:#e8735a;--action-ink:#fff;
  --radius:20px;--radius-control:12px;--shadow:0 1px 2px #12302b0a,0 8px 28px #12302b0d;--shadow-hover:0 2px 4px #12302b10,0 14px 36px #12302b17;
  --font-display:ui-rounded,'SF Pro Rounded','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;--font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--aside:248px}
html[data-theme=dark]{color-scheme:dark;
  --bg:#0f1716;--surface:#16211f;--ink:#e6f0ed;--muted:#a3b5b0;--line:#283633;--blue:#6fd1c2;--pale:#1b3430;--navy:#cdeee7;--mint:#83d4ab;--soft:#192b28;--focus:#f2b23b;--orange:#f0a35e;
  --accent:#f2c25b;--coral:#f08f78;--sky1:#14302f;--sky2:#16211f;--sun:#f2c25b;--hill1:#1f3d35;--hill2:#1a332d;--water1:#2a6d65;--water2:#1d5850;--house:#d9e6e2;--roof:#d97a63;--tree:#3d7d61;--cloud:#2b4743;
  --art-main:#6fd1c2;--art-secondary:#3f9a8d;--art-accent:#f2c25b;--art-ink:#0f1716;--art-paper:#e6f0ed;--art-soft:#1f3a36;--wave1:#2e6f67;--wave2:#21564f;--wave3:#173f3a;
  --tile1:#182b28;--tile2:#1b2c25;--tile3:#2a2618;--chart-1:#6fd1c2;--chart-2:#3f9a8d;--chart-3:#f2c25b;--chart-4:#f08f78;--action-ink:#0f1716;--shadow:0 1px 0 #ffffff08;--shadow-hover:0 0 0 1px #ffffff14}
body{background:var(--bg);font-family:var(--font-ui);color:var(--ink)}
h1,.welcome h2,.space-hero .hero-title{font-family:var(--font-display);font-weight:750;letter-spacing:-.6px}
.page-intro h1{font-size:clamp(26px,2.4vw,34px)}

/* ---------- Lateral ---------- */
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:26px 14px 18px;transition:width .22s ease,transform .25s ease;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.identity{padding:0 12px 22px;position:relative}
.identity-name{color:var(--navy);gap:8px}
.brand-drop{width:26px;height:30px;background:linear-gradient(160deg,var(--art-secondary),var(--blue));border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:path('M13 0 C13 0 0 14 0 20 A13 10 0 0 0 26 20 C26 14 13 0 13 0Z');flex:none}
.version{background:var(--pale);color:var(--blue)}
.nav-caption{padding:4px 14px 10px;letter-spacing:1.4px}
.nav-item{position:relative;gap:12px;padding:10px 12px;margin:3px 0;border-radius:14px;color:var(--muted);font-weight:600;font-size:14px;min-height:46px;box-shadow:none}
.nav-item .icon{width:34px;height:34px;padding:7px;border-radius:11px;background:var(--bg);color:var(--muted);transition:background .18s,color .18s}
.nav-item:hover{background:var(--soft);color:var(--ink)}.nav-item:hover .icon{background:var(--pale);color:var(--blue)}
.nav-item.active{background:var(--pale);color:var(--navy);box-shadow:none}.nav-item.active .icon{background:var(--blue);color:#fff}
html[data-theme=dark] .nav-item.active .icon{color:var(--bg)}
.nav-badge{position:static;margin-left:auto;background:var(--coral);color:#fff;min-width:20px;height:20px;font-size:11px}
.role-label{padding:0 12px}
.sidebar-water{opacity:.7}
.drawer-close{display:none}
.nav-item{min-height:42px;padding:6px 10px;margin:2px 0}.nav-item .icon{width:30px;height:30px;padding:6px;border-radius:10px}
@media(min-width:801px){.sidebar-water{height:120px}.sidebar-foot{margin-bottom:64px}}
/* Recolhido (botão ☰ no computador): só ícones */
@media(min-width:801px){
  body.nav-compact{--aside:84px}
  body.nav-compact .sidebar{padding:22px 12px}
  body.nav-compact .identity{padding:0 0 18px;align-items:center}
  body.nav-compact .identity>span:not(.identity-name),body.nav-compact .identity-name .version,body.nav-compact .role-label,body.nav-compact .nav-caption,body.nav-compact .sidebar-foot,body.nav-compact .sidebar-art{display:none}
  body.nav-compact .identity-name{font-size:0;justify-content:center}
  body.nav-compact .nav-item{justify-content:center;padding:6px}
  body.nav-compact .nav-item>span:not(.nav-badge){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  body.nav-compact .nav-item .nav-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;font-size:9px;padding:0 4px}
  .workspace{transition:margin-left .22s ease}
}

/* ---------- Topo ---------- */
.topbar{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);height:70px;padding:0 32px;gap:16px}
.topbar .breadcrumb{flex:1}
.menu-toggle{flex:none}
.icon-button{border-radius:12px;background:var(--surface);border-color:var(--line)}
.icon-button:hover{background:var(--pale);color:var(--blue)}
#month,#theme{border-radius:12px}

/* ---------- Conteúdo: mais respiro ---------- */
main{padding:36px 40px 48px;max-width:1440px}
.page-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;margin:0 0 32px;padding:26px 30px;border-radius:24px;background:linear-gradient(120deg,var(--surface) 0%,var(--surface) 55%,var(--tile1) 100%);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.page-intro p{max-width:62ch;font-size:14px;line-height:1.65;margin-top:8px;color:var(--muted)}
.page-intro .eyebrow{color:var(--blue);letter-spacing:1.6px;font-weight:750}
.page-intro .date-tag{display:inline-block;margin-top:14px;background:var(--pale);color:var(--navy);border:0;font-weight:650}
.intro-art{width:210px;height:140px;flex:none}
.page-art{width:100%;height:100%;overflow:visible}
.ia-s{fill:var(--art-soft)}.ia-s2{fill:var(--art-soft)}.ia-a{fill:var(--art-main)}.ia-b{fill:var(--art-secondary)}.ia-c{fill:var(--art-accent)}.ia-c2{fill:color-mix(in srgb,var(--art-accent) 70%,#000)}.ia-p{fill:var(--art-paper);stroke:var(--line);stroke-width:1.5}
.ia-l{stroke:var(--line);stroke-width:5;stroke-linecap:round;fill:var(--line)}.ia-l-w{stroke:#fff;stroke-width:5;stroke-linecap:round;fill:none;opacity:.85}.ia-l-c{stroke:var(--art-accent);stroke-width:6;stroke-linecap:round;fill:none}.ia-l-a{stroke:var(--art-main);stroke-width:6;stroke-linecap:round;fill:none}
.ia-c[stroke-width]{stroke:var(--art-accent);stroke-linecap:round}
.panel{padding:28px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.panel-head{margin-bottom:22px}
.panel-head h2{font-size:17px;font-weight:700}
.filter-panel{padding:22px 24px;background:var(--surface)}
.filters{gap:16px}
.results-head{margin:28px 4px 14px;font-size:12px}
.cards{gap:20px}
.entry-card{padding:24px;gap:14px;border-radius:18px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.entry-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.entry-card h3{font-size:16px}
.entry-card p{font-size:13px;line-height:1.6}
.badge{background:var(--pale);color:var(--navy);padding:5px 10px;font-size:11px}
.button{border-radius:var(--radius-control);min-height:44px;padding:10px 18px;font-size:13px;font-weight:650;background:var(--blue);color:var(--action-ink)}
.button:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 28%,transparent)}
.button.secondary{background:var(--surface);color:var(--blue);border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line))}
.button.secondary:hover{background:var(--pale)}
.button.ghost{background:transparent;color:var(--blue)}
.button.ghost:hover{box-shadow:none;text-decoration:underline}
input,select,textarea{border-radius:12px;border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.notice{border-radius:16px;border-color:color-mix(in srgb,var(--blue) 25%,var(--line));background:var(--pale);color:var(--ink);padding:14px 18px}
.view-banner{border-radius:16px;padding:10px 16px;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.skeleton{background:linear-gradient(100deg,var(--soft) 20%,var(--surface) 45%,var(--soft) 70%);background-size:220% 100%}
.footer{padding:0 40px 28px}
.kpis{border-radius:20px;box-shadow:var(--shadow)}
.toast{background:var(--navy);color:var(--surface);border-radius:14px}
dialog{border-radius:24px}
.empty{border-radius:20px;background:var(--surface)}

/* ---------- Página inicial (Meu espaço) ---------- */
.space-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:28px;align-items:end;min-height:330px;padding:34px 40px 30px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:28px;text-align:left;background:var(--sky2)}
.space-hero>*{position:relative;z-index:1}
.hero-scene{position:absolute!important;inset:0;width:100%;height:100%;z-index:0!important}
.sc-sky1{stop-color:var(--sky1)}.sc-sky2{stop-color:var(--sky2)}.sc-sun{fill:var(--sun)}.sc-cloud{fill:var(--cloud);opacity:.9}.sc-hill1{fill:var(--hill1)}.sc-hill2{fill:var(--hill2)}
.sc-house rect{fill:var(--house)}.sc-house path{fill:var(--roof)}.sc-tree{fill:var(--tree)}.sc-water1{fill:var(--water1);opacity:.8}.sc-water2{fill:var(--water2);opacity:.8}
.space-hero .hero-pet{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:end}
.space-hero .hero-pet .mascot-art{filter:drop-shadow(0 10px 18px #12302b22)}
.space-hero .pet-plate{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:8px 16px;text-align:center;box-shadow:var(--shadow)}
.space-hero .pet-plate .mascot-name{font-size:20px;font-family:var(--font-display);margin:0}
.space-hero .pet-plate p{color:var(--muted);margin:0}
.space-hero .hero-copy{display:flex;flex-direction:column;gap:12px;align-self:center;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:22px;padding:24px 26px;box-shadow:var(--shadow);max-width:640px}
.space-hero .hero-date{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue)}
.space-hero .hero-title{font-size:clamp(28px,3vw,40px);line-height:1.1;margin:0;color:var(--navy)}
.space-hero .hero-sub{color:var(--muted);font-size:15px;margin:0}
.space-hero .home-chips{display:flex;flex-wrap:wrap;gap:8px}
.space-hero .home-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--ink);min-height:34px;font-weight:550}
.space-hero .home-chip.is-alert{background:color-mix(in srgb,var(--coral) 16%,var(--surface));border-color:color-mix(in srgb,var(--coral) 40%,var(--line));color:var(--ink);cursor:pointer}
.space-hero .quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 0}
.space-hero .gift{margin:4px 0 0;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent);color:var(--ink)}
.space-hero .pet-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.pill-button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pill-button:hover{background:var(--pale);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.space-hero .pet-meter{display:flex;flex-direction:column;gap:4px;margin-left:auto;min-width:180px}
.space-hero .pet-meter small{color:var(--muted);font-size:11px}
.meter{background:var(--soft)}.meter span{background:linear-gradient(90deg,var(--art-secondary),var(--blue))}
.home-cards{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.home-notebook{grid-column:1/-1}
.card-kicker{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.home-cards .panel-head h2{font-size:20px;font-family:var(--font-display)}
.agenda-today{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.agenda-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--art-secondary)}
.agenda-item.is-mine{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.agenda-time{font-weight:750;font-size:13px;color:var(--navy);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.agenda-time b{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue)}
.agenda-what{display:flex;flex-direction:column;gap:3px;min-width:0}
.agenda-what strong{font-size:15px}
.agenda-what small{color:var(--muted);font-size:12px}
.agenda-fronts{display:flex;align-items:center;gap:5px;margin-top:4px}
.agenda-fronts em{font-style:normal;font-size:11px;font-weight:700;color:var(--orange);margin-left:4px}
.front-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.f-atendimento{background:var(--front-atendimento)}.f-socioambiental{background:var(--front-socioambiental)}.f-comunicacao{background:var(--front-comunicacao)}.f-gestao{background:var(--front-gestao)}.f-administrativo{background:var(--front-administrativo)}.f-comercializacao{background:#6b8e23}
.agenda-today.is-next .agenda-item{border-left-color:var(--line);background:var(--surface)}
.agenda-empty{display:flex;align-items:center;gap:16px;padding:12px 4px;color:var(--muted)}
.agenda-empty strong{color:var(--ink)}
.empty-art{width:96px;height:72px;flex:none}.ea-paper{fill:var(--surface);stroke:var(--line);stroke-width:2}.ea-top{fill:var(--art-secondary)}.ea-ring{fill:var(--art-main)}.ea-check{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.home-check .day-nav{margin-bottom:10px}
.check-list li{border-radius:12px;padding:8px 10px}
.check-list li:hover{background:var(--soft)}
.notebook{border-radius:16px;background:var(--bg);line-height:1.8;padding:16px 18px}
.color-picker .swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #0002}
.pet-option{border-radius:18px;transition:border-color .15s,transform .15s}.pet-option:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.pet-option.is-picked{border-color:var(--blue);background:var(--pale)}
.welcome-pets{background:linear-gradient(180deg,var(--tile1),var(--surface) 55%)}
/* Mascote vivo: balança e pisca (desligado com movimento reduzido) */
