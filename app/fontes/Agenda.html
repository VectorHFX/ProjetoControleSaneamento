<script>
window.CPTAgenda=(()=>{
  let ui,agenda=null,ticket=0,mode='mes',day='',filter={frente:'',natureza:'',responsavel:'',busca:'',cancelados:false},selected=new Set(),editing=null,saving=false,homeTicket=0;
  const names={administrador:'Administrador',gestao:'Gestão',atendimento:'Atendimento',socioambiental:'Socioambiental',comunicacao:'Comunicação',administrativo:'Administrativo'};
  const status={planejada:'Planejada',confirmada:'Confirmada',concluida:'Concluída',cancelada:'Cancelada'};
  const $=id=>document.getElementById(id),esc=v=>ui.esc(v),date=v=>ui.date(v),op=()=> 'OP-'+crypto.randomUUID();
  function pessoas(e){return e.responsavelNome||e.responsaveis.map(email=>agenda?.pessoas.find(p=>p.email===email)?.nome||email).join(', ');}
  function illustration(type){const common='viewBox="0 0 240 140" class="tile-art" aria-hidden="true"';if(type==='agenda')return `<svg ${common}><ellipse cx="122" cy="126" rx="78" ry="9" fill="var(--art-soft)"/><path d="M42 105Q18 60 47 30T114 43 188 35 208 111" fill="var(--art-soft)"/><rect x="62" y="26" width="125" height="99" rx="14" fill="var(--art-main)" transform="rotate(-7 125 76)"/><rect x="64" y="37" width="119" height="87" rx="9" fill="var(--art-paper)" transform="rotate(-7 125 76)"/><path d="M85 22v20m67-28v20" stroke="var(--art-ink)" stroke-width="7" stroke-linecap="round"/><g fill="var(--art-soft)"><rect x="80" y="59" width="19" height="17" rx="4"/><rect x="111" y="55" width="19" height="17" rx="4"/><rect x="141" y="51" width="19" height="17" rx="4"/><rect x="85" y="85" width="19" height="17" rx="4"/><rect x="115" y="81" width="19" height="17" rx="4"/></g><circle cx="164" cy="98" r="25" fill="var(--art-accent)"/><path d="m154 98 7 7 13-15" stroke="var(--art-ink)" stroke-width="5" fill="none" stroke-linecap="round"/><path d="m37 108 8-21 10 21Z" fill="var(--art-secondary)"/></svg>`;
    if(type==='registros')return `<svg ${common}><ellipse cx="117" cy="126" rx="82" ry="9" fill="var(--art-soft)"/><path d="M27 111Q18 50 65 31T185 30 208 117" fill="var(--art-soft)"/><rect x="66" y="21" width="111" height="104" rx="13" fill="var(--art-main)" transform="rotate(5 115 77)"/><rect x="78" y="27" width="82" height="91" rx="7" fill="var(--art-paper)"/><rect x="93" y="17" width="55" height="20" rx="8" fill="var(--art-secondary)"/><path d="M91 54h45m-45 15h30m-30 15h39" stroke="var(--art-main)" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="91" r="23" fill="var(--art-accent)" stroke="var(--art-ink)" stroke-width="7"/><path d="m177 109 21 19" stroke="var(--art-ink)" stroke-width="10" stroke-linecap="round"/><path d="M44 111q-22-24-9-39 18 9 9 39m0 0q-3-30 16-33 10 20-16 33" fill="var(--art-secondary)"/></svg>`;
    return `<svg ${common}><ellipse cx="120" cy="125" rx="81" ry="9" fill="var(--art-soft)"/><path d="M35 113Q12 62 46 35T172 25 215 111" fill="var(--art-soft)"/><rect x="59" y="32" width="123" height="69" rx="18" fill="var(--art-main)"/><path d="m84 97-7 24 33-23" fill="var(--art-main)"/><rect x="119" y="69" width="87" height="48" rx="13" fill="var(--art-accent)"/><path d="m178 111 16 18-1-22" fill="var(--art-accent)"/><g fill="var(--art-paper)"><circle cx="87" cy="65" r="6"/><circle cx="117" cy="65" r="6"/><circle cx="147" cy="65" r="6"/></g><circle cx="48" cy="97" r="15" fill="var(--art-secondary)"/><path d="M25 126q4-25 23-25t24 25" fill="var(--art-secondary)"/></svg>`;
  }
  function homeMarkup(d){const role=$('roleView')?.value||d.perfil?.papeis[0]||'administrador',first=(d.perfil?.nome||'Equipe').split(' ')[0],texts={atendimento:['Atendimentos e próximos passos','Encontre as fichas e acompanhe os retornos.'],socioambiental:['Socioambiental em acompanhamento','Planeje o campo e consulte as evidências do mês.'],comunicacao:['Comunicação em acompanhamento','Organize as ações e encontre os registros do território.'],gestao:['Equipe, território e entregas','Acompanhe o mês e organize os próximos compromissos.'],administrador:['Seu mês, em perspectiva','Consulte os resultados e organize o trabalho da equipe.']},t=texts[role]||texts.administrador;
    const canAtd=!['comunicacao','socioambiental'].includes(role)&&d.perfil?.papeis.some(x=>['administrador','gestao','atendimento'].includes(x));const tiles=[['agenda','Cronograma','Planeje com a equipe.','cronograma'],['registros','Registros e evidências','Encontre o trabalho realizado.','registros'],['atendimento',canAtd?'Atendimentos':'Relatos do mês',canAtd?'Acompanhe cada caso.':'Consulte as ações do território.',canAtd?'atendimentos':'registros']];
    return `<section class="welcome"><div><span class="eyebrow">OLÁ, ${esc(first.toUpperCase())}</span><h2>${t[0]}</h2><p>${t[1]}</p></div><div class="welcome-actions"><span class="focus-label">Visão de ${names[role]}</span>${ui.formLink().replace('button white','button secondary')}</div></section><div class="home-layout"><div class="home-main"><div id="overviewMetrics"></div><div id="overviewCharts"></div><section class="feature-tiles" aria-label="Ferramentas do dia">${tiles.map(([art,title,sub,route])=>`<button class="feature-tile" data-route="${route}">${illustration(art)}<span class="tile-title">${title}</span><span class="tile-sub">${sub}</span><span class="tile-link">Abrir ferramenta <span aria-hidden="true">↗</span></span></button>`).join('')}</section><section class="data-insight"><span class="eyebrow">LEITURA DO PERÍODO</span><h3>${ui.num(d.indicadores.registros)} registros neste mês</h3><p>${d.comparacao?.anterior>0?`${ui.num(d.comparacao.anterior)} no mês anterior. Compare considerando o período já decorrido e os registros disponíveis.`:'Os números refletem o que foi registrado. Ausência de registro não comprova ausência de atividade.'}</p>${d.indicadores.relatosSemPublico?`<button class="insight-action" data-pending="publico">${ui.num(d.indicadores.relatosSemPublico)} relatos sem público válido informado <span>Conferir →</span></button>`:'<p class="small">Público informado nos relatos consultáveis deste mês: '+ui.num(d.indicadores.participacoes)+' participações.</p>'}<button class="button secondary" data-route="registros">Consultar por obra →</button></section></div><aside class="agenda-peek"><div class="panel-head"><div><span class="eyebrow">EM EQUIPE</span><h3>Na agenda</h3></div><button class="icon-button" data-route="cronograma" aria-label="Abrir cronograma">↗</button></div><div id="peekEvents"><p class="muted">Carregando compromissos…</p></div><button class="button ghost" data-route="cronograma">Ver cronograma completo →</button></aside></div>`;
  }
  async function homeLoad(){const mine=++homeTicket,month=ui.state.mes;try{const d=await ui.call('carregarCronogramaCPT',{mes:month});if(mine!==homeTicket||!$('peekEvents'))return;agenda=d;const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),role=$('roleView').value,rows=d.itens.filter(e=>(['administrador','gestao'].includes(role)||e.frentes.includes(role))&&e.status!=='cancelada'&&(month===today.slice(0,7)?e.data>=today:true)).slice(0,4);$('peekEvents').innerHTML=rows.length?rows.map(e=>`<button class="peek-row" data-agenda-id="${esc(e.id)}"><span class="peek-date">${e.data.slice(8)}<small>${e.inicio||'DIA TODO'}</small></span><span><span class="tag ${e.natureza}">${names[e.frentes[0]]}</span><strong>${esc(e.titulo)}</strong><small>${esc(pessoas(e))}</small></span></button>`).join(''):'<div class="empty-agenda">Seu próximo compromisso começa aqui.<p>Abra o cronograma para planejar com a equipe.</p></div>';}catch(e){if(mine===homeTicket&&$('peekEvents'))$('peekEvents').innerHTML='<p class="muted">'+esc(e.message)+'</p>';}}
  async function render(){const current=++ticket;ui.view.innerHTML=ui.intro('Cronograma compartilhado','Uma atividade, todos os responsáveis. Planeje, acompanhe e selecione o que vai exportar.')+'<div class="loading-label">Carregando o cronograma…</div>';try{agenda=await ui.call('carregarCronogramaCPT',{mes:ui.state.mes});if(current!==ticket||ui.state.route!=='cronograma')return;day=day.startsWith(ui.state.mes)?day:ui.state.mes+'-01';selected=new Set();draw();}catch(e){if(current===ticket&&ui.state.route==='cronograma')ui.view.innerHTML=ui.intro('Cronograma compartilhado','Planejamento em equipe.')+'<div class="notice">'+esc(e.message)+'</div><button class="button" data-agenda-action="reload">Tentar novamente</button>';}}
  function visible(){return agenda.itens.filter(e=>(filter.cancelados||e.status!=='cancelada')&&(!filter.frente||e.frentes.includes(filter.frente))&&(!filter.natureza||e.natureza===filter.natureza)&&(!filter.responsavel||(filter.responsavel==='me'?e.responsaveis.includes(agenda.perfil.email):e.responsaveis.includes(filter.responsavel)))&&(!filter.busca||[e.titulo,e.obra,e.bairro,pessoas(e)].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(filter.busca.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase())));}
  function options(arr,current,all){return `<option value="">${all}</option>`+arr.map(([v,t])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(t)}</option>`).join('');}
  function draw(){ui.view.innerHTML=ui.intro('Cronograma compartilhado','Planeje com a equipe. Escolha as atividades antes de exportar.')+`<section class="panel agenda-controls"><div class="agenda-toolbar"><div class="segmented" aria-label="Visualização">${[['mes','Mês'],['semana','Semana'],['lista','Lista']].map(([v,t])=>`<button data-agenda-mode="${v}" class="${mode===v?'chosen':''}" aria-pressed="${mode===v}">${t}</button>`).join('')}</div><div class="agenda-actions"><button class="button secondary" data-agenda-action="export">Exportar seleção <span id="selectionCount">(${selected.size})</span></button><button class="button" data-agenda-action="new">+ Nova atividade</button></div></div><form id="agendaFilters" class="agenda-filters"><label>Frente<select name="frente">${options(['atendimento','socioambiental','comunicacao','gestao','administrativo'].map(x=>[x,names[x]]),filter.frente,'Todas as frentes')}</select></label><label>O que mostrar<select name="natureza">${options([['interno','Interno'],['externo','Externo']],filter.natureza,'Interno e externo')}</select></label><label>Responsável<select name="responsavel">${options([['me','Meus compromissos'],...agenda.pessoas.map(p=>[p.email,p.nome])],filter.responsavel,'Toda a equipe')}</select></label><label>Localizar<input name="busca" value="${esc(filter.busca)}" placeholder="Atividade, obra ou bairro"></label></form><div class="selection-bar"><label><input type="checkbox" id="includeCanceled" ${filter.cancelados?'checked':''}> Incluir canceladas</label><span><button class="text-button" data-agenda-action="select">Selecionar filtradas</button> · <button class="text-button" data-agenda-action="clear">Limpar seleção</button></span></div></section><div id="agendaSurface"></div><p class="small muted">Datas e horários de Brasília. A seleção de exportação segue os filtros.</p>`;
    const form=$('agendaFilters');form.addEventListener('submit',e=>e.preventDefault());form.addEventListener('change',()=>{Object.assign(filter,Object.fromEntries(new FormData(form)));selected.clear();drawSurface();});let debounce;form.elements.busca.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{if(ui.state.route!=='cronograma')return;filter.busca=form.elements.busca.value;selected.clear();drawSurface();},250);});$('includeCanceled').onchange=e=>{filter.cancelados=e.target.checked;selected.clear();drawSurface();};drawSurface();}
  function chip(e){return `<div class="calendar-event ${e.status==='cancelada'?'canceled':''}" style="--event-color:var(--front-${e.frentes[0]})"><label class="event-check"><input type="checkbox" data-agenda-select="${esc(e.id)}" ${selected.has(e.id)?'checked':''} aria-label="Selecionar ${esc(e.titulo)} para exportação"></label><button data-agenda-id="${esc(e.id)}"><small>${e.inicio||'Dia todo'} · ${status[e.status]}</small><strong>${esc(e.titulo)}</strong><span>${esc(pessoas(e))}</span></button></div>`;}
  function drawSurface(){const rows=visible();const valid=new Set(rows.map(x=>x.id));selected=new Set([...selected].filter(id=>valid.has(id)));$('selectionCount').textContent='('+selected.size+')';let html='';if(mode==='lista'){html=`<div class="agenda-list">${rows.length?rows.map(e=>`<section class="agenda-list-row"><div class="list-day">${date(e.data)}</div>${chip(e)}<span class="tag ${e.natureza}">${e.natureza==='interno'?'Interno':'Externo'}</span><span class="small">${esc(e.obra||e.bairro||'Local não informado')}</span></section>`).join(''):'<div class="panel empty">Nenhuma atividade com estes filtros. Use “Nova atividade” para começar.</div>'}</div>`;}else{const first=ui.state.mes+'-01',last=new Date(Number(first.slice(0,4)),Number(first.slice(5,7)),0).getDate(),shift=(new Date(first+'T12:00:00Z').getUTCDay()+6)%7;let days=[];if(mode==='mes'){days=Array(shift).fill(null).concat(Array.from({length:last},(_,i)=>ui.state.mes+'-'+String(i+1).padStart(2,'0')));while(days.length%7)days.push(null);}else{const sel=new Date(day+'T12:00:00Z'),offset=(sel.getUTCDay()+6)%7;days=Array.from({length:7},(_,i)=>{const d=new Date(sel);d.setUTCDate(d.getUTCDate()-offset+i);return d.toISOString().slice(0,10);});html+=`<div class="week-picker"><label>Semana de <input id="weekDay" type="date" value="${day}" min="${first}" max="${ui.state.mes}-${last}"></label><p class="small muted">Os dias fora da competência escolhida ficam indisponíveis.</p></div>`;}
    html+=`<div class="calendar-scroll"><div class="calendar-grid ${mode==='semana'?'week':''}">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="weekday">${x}</div>`).join('')}${days.map(d=>!d||!d.startsWith(ui.state.mes)?'<div class="calendar-cell outside"></div>':`<section class="calendar-cell"><button class="day-number" data-agenda-newdate="${d}" aria-label="Adicionar atividade em ${date(d)}">${Number(d.slice(8))}<span>+</span></button>${rows.filter(e=>e.data===d).map(chip).join('')}</section>`).join('')}</div></div><p class="small mobile-calendar-tip">Deslize o calendário para os lados ou use Lista para uma leitura mais compacta.</p>`;}
    $('agendaSurface').innerHTML=html;if($('weekDay'))$('weekDay').onchange=e=>{if(e.target.value.startsWith(ui.state.mes)){day=e.target.value;drawSurface();}};}
  function modal(title,content){$('detailType').textContent='PLANEJAMENTO';$('detailTitle').textContent=title;$('detailContent').innerHTML=content;if(!$('detailDialog').open)$('detailDialog').showModal();}
  function errorInModal(e){const target=$('agendaError');if(target){target.textContent=e.message;target.hidden=false;}else ui.toast(e.message);}
  function open(id){const e=agenda?.itens.find(x=>x.id===id);if(!e)return;editing=e;modal(e.titulo,`<div class="event-overview"><span class="tag ${e.natureza}">${e.natureza==='interno'?'Interno':'Externo'}</span><span class="badge">${status[e.status]}</span></div><dl class="detail-summary"><div><dt>Quando</dt><dd>${date(e.data)} · ${e.inicio?e.inicio+' às '+e.fim:'Dia todo'}</dd></div><div><dt>Responsáveis</dt><dd>${esc(pessoas(e))}</dd></div><div><dt>Frentes</dt><dd>${e.frentes.map(x=>names[x]).join(', ')}</dd></div><div><dt>Obra e bairro</dt><dd>${esc([e.obra,e.bairro].filter(Boolean).join(' · ')||'Não informado')}</dd></div></dl><section class="answer"><h3>Sobre a atividade</h3><p>${esc(e.descricao||'Sem descrição adicional.')}</p></section><p class="small muted">Versão ${e.versao} · alterada por ${esc(e.alteradoPor)}</p><div class="dialog-actions">${e.podeEditar?'<button class="button" data-agenda-action="edit">Editar atividade</button><button class="button secondary" data-agenda-action="reschedule">Reagendar</button><button class="button secondary" data-agenda-action="cancel">Cancelar atividade</button>':''}<button class="button secondary" data-agenda-action="history">Ver histórico</button></div><div id="eventHistory"></div>`);}
  function editor(event=null,newdate=''){if(!agenda){ui.toast('Abra o cronograma primeiro.');return;}const me=agenda.perfil,role=$('roleView').value,e=event||{id:'',versao:0,data:newdate||day||ui.state.mes+'-01',titulo:'',inicio:'',fim:'',descricao:'',obra:'',bairro:'',frentes:[['administrador','gestao'].includes(role)?'administrativo':role],responsaveis:[me.email],natureza:'externo',status:'planejada'};editing=e;const request=op();modal(e.id?'Editar atividade':'Nova atividade',`<form id="eventForm"><div id="agendaError" class="notice" role="alert" hidden></div><div class="editor-grid"><label class="wide">O que será feito?<input name="titulo" required maxlength="140" value="${esc(e.titulo)}" placeholder="Ex.: sensibilização com moradores"></label><label>Data<input type="date" name="data" required value="${e.data}"></label><label>Classificação<select name="natureza"><option value="externo" ${e.natureza==='externo'?'selected':''}>Externo</option><option value="interno" ${e.natureza==='interno'?'selected':''}>Interno</option></select></label><label>Início<input type="time" name="inicio" value="${e.inicio}"></label><label>Fim<input type="time" name="fim" value="${e.fim}"></label><p class="small muted wide">Para dia todo, deixe início e fim vazios.</p><label>Obra de referência<input name="obra" maxlength="200" list="eventWorks" value="${esc(e.obra)}"><datalist id="eventWorks">${(ui.state.home?.filtros?.obras||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label>Bairro<input name="bairro" maxlength="150" value="${esc(e.bairro)}"></label><fieldset class="wide"><legend>Frentes envolvidas</legend><div class="check-options">${['atendimento','socioambiental','comunicacao','gestao','administrativo'].map(x=>`<label><input type="checkbox" name="frentes" value="${x}" ${e.frentes.includes(x)?'checked':''}> ${names[x]}</label>`).join('')}</div></fieldset><fieldset class="wide"><legend>Quem participa?</legend><div class="check-options">${agenda.pessoas.map(p=>`<label><input type="checkbox" name="responsaveis" value="${esc(p.email)}" ${e.responsaveis.includes(p.email)?'checked':''}> ${esc(p.nome)}</label>`).join('')}</div></fieldset><label>Situação<select name="status">${Object.entries(status).map(([v,t])=>`<option value="${v}" ${e.status===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="wide">Motivo da alteração<textarea name="motivo" rows="2" maxlength="600" placeholder="Explique reagendamentos e cancelamentos; fica no histórico."></textarea></label><label class="wide">Descrição<textarea name="descricao" rows="3" maxlength="2500" placeholder="Local de encontro, materiais e orientações">${esc(e.descricao)}</textarea></label></div><div class="dialog-actions"><button class="button" id="saveEvent" type="submit">Salvar no cronograma</button><button class="button secondary" type="button" data-agenda-action="close">Voltar</button></div><p class="small muted">Ao salvar, a atividade fica visível para a equipe autorizada. Para retirar do planejamento, altere a situação para Cancelada.</p></form>`);
    $('eventForm').onsubmit=async ev=>{ev.preventDefault();if(saving)return;const data=new FormData(ev.target),payload={...Object.fromEntries(data),frentes:data.getAll('frentes'),responsaveis:data.getAll('responsaveis'),id:e.id,versao:e.versao,operacaoId:request};saving=true;$('saveEvent').disabled=true;$('saveEvent').textContent='Salvando…';try{const r=await ui.call('salvarAtividadeCPT',payload);ui.toast(r.resultado);$('detailDialog').close();ui.navigate('cronograma');}catch(err){errorInModal(err);if($('saveEvent')){$('saveEvent').disabled=false;$('saveEvent').textContent='Tentar salvar novamente';}}finally{saving=false;}};}
  function exportDialog(){const rows=visible().filter(e=>selected.has(e.id));if(!rows.length){ui.toast('Selecione as atividades que deseja exportar.');return;}const internal=rows.filter(x=>x.natureza==='interno').length;modal('Exportar cronograma',`<p>${rows.length} atividades selecionadas: ${internal} internas e ${rows.length-internal} externas.</p><p class="muted">A exportação contém apenas os itens marcados. Para mudar a seleção, volte ao cronograma.</p><div class="dialog-actions"><button class="button" data-agenda-action="csv">Baixar CSV</button><button class="button secondary" data-agenda-action="print">Imprimir / salvar PDF</button></div>`);}
  function exportRows(){return visible().filter(e=>selected.has(e.id));}
  function downloadCSV(){const cells=v=>'"'+String(v??'').replace(/^(?:[\s]*[=+@-]|[\t\r\n])/,"'$&").replace(/"/g,'""')+'"',head=['Data','Início','Fim','Atividade','Frentes','Responsáveis','Natureza','Situação','Obra','Bairro','Descrição'],rows=exportRows().map(e=>[date(e.data),e.inicio,e.fim,e.titulo,e.frentes.map(x=>names[x]).join(', '),pessoas(e),e.natureza,status[e.status],e.obra,e.bairro,e.descricao]);const blob=new Blob(['\uFEFF'+[head,...rows].map(r=>r.map(cells).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Cronograma_CPT_'+ui.state.mes+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);ui.toast('CSV preparado com as atividades selecionadas.');}
  function print(){const old=$('printAgenda');if(old)old.remove();const wrap=document.createElement('section');wrap.id='printAgenda';wrap.innerHTML=`<h1>Cronograma CPT</h1><p>${esc(ui.state.mes)} · ${exportRows().length} atividades selecionadas · horários de Brasília</p><table><thead><tr><th>Data / horário</th><th>Atividade e local</th><th>Responsáveis</th><th>Frente / situação</th></tr></thead><tbody>${exportRows().map(e=>`<tr><td>${date(e.data)}<br>${e.inicio?e.inicio+'–'+e.fim:'Dia todo'}</td><td><b>${esc(e.titulo)}</b><br>${esc([e.obra,e.bairro].filter(Boolean).join(' · '))}<p>${esc(e.descricao||'')}</p></td><td>${esc(pessoas(e))}</td><td>${e.frentes.map(x=>names[x]).join(', ')}<br>${e.natureza==='interno'?'Interno':'Externo'} · ${status[e.status]}</td></tr>`).join('')}</tbody></table>`;document.body.append(wrap);$('detailDialog').close();window.print();}
  async function team(){const current=++ticket;ui.view.innerHTML=ui.intro('Equipe e acessos','Cada pessoa entra com sua conta Google e encontra a visão do seu trabalho.')+'<p>Carregando equipe…</p>';try{const d=await ui.call('listarEquipeCPT');if(current!==ticket||ui.state.route!=='equipe')return;ui.view.innerHTML=ui.intro('Equipe e acessos','Cadastre a conta Google e escolha as funções de cada pessoa.')+`<section class="panel"><div class="panel-head"><h2>Pessoas cadastradas</h2><button class="button" id="newPerson">+ Cadastrar pessoa</button></div><div class="team-list">${d.pessoas.map((p,i)=>`<button class="team-row" data-person-index="${i}"><span class="avatar">${esc(p.nome.slice(0,1))}</span><span><strong>${esc(p.nome)}</strong><small>${esc(p.email)}</small><small>${p.papeis.map(x=>names[x]).join(' · ')}</small></span><span class="badge ${p.ativo?'green':'orange'}">${p.ativo?'Ativo':'Inativo'}</span></button>`).join('')}</div><p class="small muted">O cadastro define acesso na aplicação. O compartilhamento das planilhas e arquivos continua sendo feito no Google Drive.</p><a class="button secondary" href="${esc(d.agendaUrl)}" target="_blank" rel="noopener">Abrir planilha da agenda para compartilhar ↗</a></section>`;$('newPerson').onclick=()=>personEditor(null);document.querySelectorAll('[data-person-index]').forEach(b=>b.onclick=()=>personEditor(d.pessoas[Number(b.dataset.personIndex)]));}catch(e){if(current===ticket)ui.view.innerHTML='<div class="notice">'+esc(e.message)+'</div>';}}
  function personEditor(p){p=p||{email:'',nome:'',papeis:[],ativo:true,versao:0};modal('Cadastro da equipe',`<form id="personForm"><div id="agendaError" class="notice" hidden></div><div class="editor-grid"><label class="wide">Nome<input name="nome" value="${esc(p.nome)}" required maxlength="100"></label><label class="wide">Conta Google<input type="email" name="email" value="${esc(p.email)}" ${p.email?'readonly':''} required maxlength="180"></label><fieldset class="wide"><legend>Funções na aplicação</legend><div class="check-options">${Object.keys(names).filter(x=>x!=='administrativo').map(x=>`<label><input name="papeis" type="checkbox" value="${x}" ${p.papeis.includes(x)?'checked':''}> ${names[x]}</label>`).join('')}</div></fieldset><label class="check-inline"><input name="ativo" type="checkbox" ${p.ativo?'checked':''}> Acesso ativo</label></div><button class="button" type="submit">Salvar acesso</button></form>`);$('personForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;const f=new FormData(e.target);try{const r=await ui.call('salvarPessoaCPT',{nome:f.get('nome'),email:f.get('email'),papeis:f.getAll('papeis'),ativo:f.has('ativo'),versao:p.versao||0});ui.toast(r.resultado);$('detailDialog').close();team();}catch(err){errorInModal(err);b.disabled=false;}};}
  function init(api){ui=api;document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-agenda-action],[data-agenda-mode],[data-agenda-id],[data-agenda-newdate],[data-pending]');if(!el)return;if(el.dataset.pending){ui.state.filters={busca:'',procedimento:'Relato de atividade',bairro:'',obra:'',pendencia:'publico'};ui.navigate('registros');return;}if(el.dataset.agendaMode){mode=el.dataset.agendaMode;draw();return;}if(el.dataset.agendaId){open(el.dataset.agendaId);return;}if(el.dataset.agendaNewdate){editor(null,el.dataset.agendaNewdate);return;}switch(el.dataset.agendaAction){case 'reload':render();break;case 'new':editor();break;case 'edit':editor(editing);break;case 'reschedule':editor(editing);$('eventForm').elements.data.focus();$('eventForm').elements.motivo.required=true;break;case 'cancel':editor(editing);$('eventForm').elements.status.value='cancelada';$('eventForm').elements.motivo.required=true;$('eventForm').elements.motivo.focus();$('saveEvent').textContent='Confirmar cancelamento';break;case 'close':$('detailDialog').close();break;case 'select':visible().forEach(e=>selected.add(e.id));drawSurface();break;case 'clear':selected.clear();drawSurface();break;case 'export':exportDialog();break;case 'csv':downloadCSV();break;case 'print':print();break;case 'history':{const id=editing.id;try{const r=await ui.call('historicoAtividadeCPT',id);if(editing?.id===id&&$('eventHistory'))$('eventHistory').innerHTML=r.versoes.map(v=>`<section class="answer"><h3>Versão ${v.versao} · ${esc(v.alteradoPor)}</h3><p>${esc(v.acao||'Atualização')} · ${esc(v.alteradoEm||'')}\n${esc(v.titulo)}\n${date(v.data)} · ${esc(v.inicio||'Dia todo')} · ${status[v.status]}\n${esc(v.motivo||'Sem motivo registrado nesta versão.')}\nCampos alterados: ${esc((v.camposAlterados||[]).join(', ')||'Registro anterior')}\n${esc(v.descricao||'')}</p></section>`).join('');}catch(e){ui.toast(e.message);}break;}}});document.addEventListener('change',e=>{const id=e.target.dataset.agendaSelect;if(!id)return;if(e.target.checked)selected.add(id);else selected.delete(id);$('selectionCount').textContent='('+selected.size+')';});}
  return {init,render,team,homeMarkup,homeLoad,names};
})();
</script>
