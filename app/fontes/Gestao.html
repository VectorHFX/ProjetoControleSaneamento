<script>
/*
 * Gestão 2.7.0 — Painel da gestão (contrato, frentes de serviço, relatos em resumo), Programa Parceiros e Conectores.
 * Painel: só leitura, com o que pede atenção primeiro. Frentes e relatos abrem o registro ou a ficha de sempre.
 * Programa Parceiros: uma pergunta por linha da máscara; sugestões só entram com um clique; salvar cria versão;
 * publicar grava só o que foi marcado como conferido. O texto digitado fica na tela (e neste navegador) se algo falhar.
 */
window.CPTGestao = (() => {
  'use strict';
  let ui = null, ticket = 0, painel = null, aba = 'contrato', relatos = null, filtroFrente = {busca: '', andamento: true}, filtroRelato = {busca: '', item: ''};
  let pp = null, ppOp = null, ppSujo = false;
  const $ = id => document.getElementById(id);
  const store = {get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} }, del: k => { try { localStorage.removeItem(k); } catch (_) {} }};
  const mesCurto = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'short'}).replace('.', '');
  const mesLongo = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;
  const medidor = (v, meta) => `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${v}" aria-label="${v} de ${meta}"><span style="width:${pct(v, meta)}%"></span></div>`;
  const tile = (rotulo, valor, nota, extra = '') => `<div class="stat-tile"><span class="stat-label">${rotulo}</span><span class="stat-value">${valor}</span>${extra}<span class="stat-note">${nota}</span></div>`;

  /** Barras verticais simples (SVG próprio): uma ou duas séries, valor escrito em cima de cada barra. */
  function colunas(serie, campos, titulo) {
    const W = 300, H = 150, base = 118, alto = 92, n = serie.length, passo = W / n, max = Math.max(1, ...serie.flatMap(s => campos.map(c => s[c.k] || 0)));
    const larg = Math.min(26, (passo - 10) / campos.length);
    const barras = serie.map((s, i) => campos.map((c, j) => { const v = s[c.k] || 0, h = Math.round(v / max * alto), x = i * passo + (passo - larg * campos.length) / 2 + j * larg;
      return `<rect class="col-bar ${c.cls || ''}" x="${x}" y="${base - h}" width="${larg - 2}" height="${h}" rx="3"><title>${ui.esc(c.nome + ' em ' + mesLongo(s.mes) + ': ' + v)}</title></rect><text class="col-val" x="${x + (larg - 2) / 2}" y="${base - h - 4}" text-anchor="middle">${v}</text>`; }).join('') +
      `<text class="axis" x="${i * passo + passo / 2}" y="${H - 12}" text-anchor="middle">${mesCurto(s.mes)}</text>`).join('');
    const resumo = serie.map(s => mesLongo(s.mes) + ': ' + campos.map(c => c.nome + ' ' + (s[c.k] || 0)).join(', ')).join('; ');
    return `<figure class="mini-chart"><figcaption>${titulo}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ui.esc(titulo + '. ' + resumo)}"><line class="baseline" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${barras}</svg>${campos.length > 1 ? `<p class="chart-key">${campos.map(c => `<span class="key-swatch ${c.cls || ''}"></span>${c.nome}`).join(' ')}</p>` : ''}</figure>`;
  }
  /** Barras horizontais com rótulo e número (lista acessível, sem gráfico). */
  function barrasH(lista, vazio) {
    if (!lista || !lista.length || !lista.some(x => x.quantidade)) return `<p class="muted">${vazio}</p>`;
    const max = Math.max(...lista.map(x => x.quantidade));
    return `<ul class="hbars">${lista.map(x => `<li><span class="hbar-label">${ui.esc(x.rotulo || x.nome)}</span><span class="hbar-track" aria-hidden="true"><span style="width:${pct(x.quantidade, max)}%"></span></span><strong>${ui.num(x.quantidade)}</strong></li>`).join('')}</ul>`;
  }

  // ---------------- Painel da gestão ----------------
  // 2.11: o painel vive dentro da Visão do mês, em abas (Resumo do mês · Contrato · Frentes · Relatos).
  const INTRO = ['Visão do mês', 'Resumo, contrato, frentes de serviço e relatos do mês, começando pelo que pede atenção.'];
  async function renderPainel(atualizar = false) {
    const mine = ++ticket, mes = ui.state.mes;
    if (!painel || painel.mes !== mes) { relatos = null; ui.view.innerHTML = abas() + '<div class="loading-label"><span class="spinner"></span>Reunindo os números do mês…</div><div class="stat-row">' + '<div class="skeleton"></div>'.repeat(4) + '</div>'; }
    try {
      const d = await ui.call('carregarPainelGestaoCPT', {mes, atualizar}); if (mine !== ticket || ui.state.route !== 'painel') return;
      painel = d; desenharPainel();
    } catch (e) { if (mine === ticket) ui.view.innerHTML = abas() + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  /** Abas da Visão do mês para a gestão. sel: aba marcada ('resumo' na própria Visão do mês). */
  function abas(sel) {
    const atual = sel || aba;
    return `<div class="segmented painel-tabs mes-tabs" role="tablist" aria-label="Partes da Visão do mês">${[['resumo', 'Resumo do mês'], ['contrato', 'Contrato'], ['frentes', 'Frentes de serviço'], ['relatos', 'Relatos em resumo']].map(([k, n]) => `<button role="tab" aria-selected="${atual === k}" class="${atual === k ? 'chosen' : ''}" data-painel-aba="${k}">${n}</button>`).join('')}</div>`;
  }
  function desenharPainel() {
    const corpo = aba === 'frentes' ? frentes() : aba === 'relatos' ? '<div id="relatosResumo"></div>' : contrato();
    ui.view.innerHTML = abas() + `<div class="painel-body">${corpo}</div><p class="small muted painel-foot">Atualizado às ${new Date(painel.atualizadoEm).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'})}. Use o botão Atualizar no topo para recalcular.</p>`;
    if (aba === 'relatos') carregarRelatos();
  }
  function contrato() {
    const c = painel.contrato, s = c.pesquisas, k = c.casos;
    const alertas = painel.alertas.length ? `<ul class="alert-list">${painel.alertas.map(a => `<li class="alert-${a.nivel}"><span class="alert-dot" aria-hidden="true"></span><span>${ui.esc(a.texto)}</span>${a.rota ? `<button class="button ghost" data-route="${a.rota}">Abrir</button>` : a.aba ? `<button class="button ghost" data-painel-aba="${a.aba}">Ver</button>` : ''}</li>`).join('')}</ul>` : '<p class="ok-line">Nada pedindo atenção agora. Bom trabalho da equipe.</p>';
    const pp = painel.parceiros, ppTexto = !pp ? 'Indisponível' : pp.situacao === 'publicado' ? 'Publicado na máscara' : pp.versao ? (pp.situacao === 'conferido' ? 'Conferido' : 'Rascunho') + ' · ' + pp.conferidos + ' campos conferidos' : 'Ainda não iniciado';
    return `<section class="panel attention"><div class="panel-head"><div><span class="eyebrow">PEDE ATENÇÃO</span><h2>${painel.alertas.length ? painel.alertas.length + (painel.alertas.length === 1 ? ' ponto' : ' pontos') : 'Tudo em dia'}</h2></div></div>${alertas}</section>
      <section class="stat-row" aria-label="Números do contrato no mês">
        ${tile('Ações socioambientais', ui.num(c.acoes), ui.num(c.pessoas) + ' pessoas alcançadas · ' + ui.num(c.frentes) + ' frentes · ' + ui.num(c.bairros) + ' bairros.')}
        ${tile('Pesquisas de satisfação', ui.num(s.mes) + '<small> / ' + s.meta + '</small>', s.semana ? 'Nesta semana: ' + s.semana.total + ' de ' + s.semana.meta + '.' : 'Meta: 15 por semana, 60 no mês.', medidor(s.mes, s.meta))}
        ${tile('Atendimentos em aberto', ui.num(k.abertos), ui.num(k.recebidosMes) + ' recebidos e ' + ui.num(k.concluidosMes) + ' concluídos no mês' + (k.prazoMedio != null ? ' · prazo médio ' + k.prazoMedio + ' dias' : '') + '.')}
        ${tile('Relatos prontos', ui.num(c.relatos.prontos) + '<small> / ' + ui.num(c.relatos.total) + '</small>', ui.num(c.diagnosticos) + ' diagnósticos no mês.', medidor(c.relatos.prontos, Math.max(1, c.relatos.total)))}
      </section>
      <div class="painel-grid">
        <section class="panel wide"><div class="panel-head"><div><h2>Últimos seis meses</h2><p>Pela data de realização de cada atividade.</p></div></div><div class="mini-charts">
          ${colunas(painel.serie, [{k: 'acoes', nome: 'Ações'}], 'Ações socioambientais')}${colunas(painel.serie, [{k: 'pessoas', nome: 'Pessoas'}], 'Pessoas alcançadas')}
          ${colunas(painel.serie, [{k: 'pesquisas', nome: 'Pesquisas'}], 'Pesquisas de satisfação')}${colunas(painel.serie, [{k: 'recebidos', nome: 'Recebidos', cls: 'b'}, {k: 'concluidos', nome: 'Concluídos', cls: 'c'}], 'Atendimentos')}</div></section>
        <section class="panel"><div class="panel-head"><div><h2>Para o relatório</h2><p>Ações por item do relatório mensal.</p></div><button class="button ghost" data-route="socioambiental">Mesa ${ui.icon('arrow')}</button></div>${barrasH(painel.porItem.map(x => ({rotulo: x.item + ' · ' + x.titulo, quantidade: x.quantidade})), 'Sem ações no mês.')}</section>
        <section class="panel"><div class="panel-head"><div><h2>Tipos de atividade</h2><p>As mais frequentes no mês.</p></div></div>${barrasH(painel.porTipo, 'Sem ações no mês.')}</section>
        <section class="panel"><div class="panel-head"><div><h2>Quem registrou</h2><p>Registros de campo por pessoa no mês.</p></div></div>${barrasH(painel.porPessoa, 'Sem registros no mês.')}</section>
        <section class="panel"><div class="panel-head"><div><h2>Programa Parceiros</h2><p>${ui.esc(mesLongo(painel.mes))}</p></div></div><p><span class="badge ${pp && pp.situacao === 'publicado' ? 'status-concluida' : 'status-andamento'}">${ui.esc(ppTexto)}</span></p><button class="button secondary" data-route="parceiros">Responder ${ui.icon('arrow')}</button></section>
      </div>`;
  }
  function frentes() {
    const b = ui.norm(filtroFrente.busca), lista = painel.frentes.filter(f => (!filtroFrente.andamento || f.situacao === 'Em andamento' || f.acoes || f.casosAbertos) && (!b || ui.norm(f.nome + ' ' + f.bairros.join(' ')).includes(b)));
    const card = (f, i) => {
      const parada = f.situacao === 'Em andamento' && (f.diasSemRegistro === null || f.diasSemRegistro > 14);
      return `<article class="front-card ${parada ? 'is-late' : ''}"><div class="card-top"><span class="badge ${f.situacao === 'Em andamento' ? 'status-concluida' : f.situacao === 'Paralisada' ? 'status-andamento' : ''}">${ui.esc(f.situacao)}</span>${f.impacto ? `<span class="small muted">Impacto ${ui.esc(f.impacto)}</span>` : ''}</div>
        <h3>${ui.esc(f.nome)}</h3><p class="small muted">${ui.esc(f.bairros.join(', ') || f.endereco || 'Bairros não informados')}</p>
        <dl class="front-numbers"><div><dt>Ações</dt><dd>${f.acoes}</dd></div><div><dt>Pessoas</dt><dd>${ui.num(f.pessoas)}</dd></div><div><dt>Diagnósticos</dt><dd>${f.diagnosticos}</dd></div><div><dt>Casos abertos</dt><dd>${f.casosAbertos}</dd></div></dl>
        <p class="small ${parada ? 'late-text' : 'muted'}">${f.ultimo ? 'Último registro em ' + ui.date(f.ultimo) + ' (há ' + f.diasSemRegistro + (f.diasSemRegistro === 1 ? ' dia' : ' dias') + ')' : 'Nenhum registro de atividade ainda'}</p>
        <button class="button ghost" data-frente="${i}">Ver a frente ${ui.icon('arrow')}</button></article>`;
    };
    return `<section class="panel filter-panel"><form id="frenteFiltro" class="filters"><label class="field">Localizar frente<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroFrente.busca)}" placeholder="Nome da obra ou bairro" maxlength="100"></span></label><label class="reduced"><input type="checkbox" name="andamento" ${filtroFrente.andamento ? 'checked' : ''}> Só frentes ativas no mês</label></form></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'frente' : 'frentes'}</span><span>Em vermelho: em andamento e sem registro há mais de 14 dias</span></div>
      <div class="cards front-cards">${lista.map(f => card(f, painel.frentes.indexOf(f))).join('') || '<p class="muted">Nenhuma frente com esse filtro.</p>'}</div>`;
  }
  function abrirFrente(i) {
    const f = painel.frentes[i]; if (!f) return;
    $('detailType').textContent = 'FRENTE DE SERVIÇO'; $('detailTitle').textContent = f.nome;
    $('detailContent').innerHTML = `<dl class="detail-summary"><div><dt>Situação</dt><dd>${ui.esc(f.situacao)}</dd></div><div><dt>Bairros</dt><dd>${ui.esc(f.bairros.join(', ') || 'Não informado')}</dd></div><div><dt>Endereço</dt><dd>${ui.esc(f.endereco || 'Não informado')}</dd></div><div><dt>No mês</dt><dd>${f.acoes} ações · ${ui.num(f.pessoas)} pessoas · ${f.diagnosticos} diagnósticos · ${f.casosMes} casos recebidos</dd></div></dl>
      <h3 class="answers-head">Atividades do mês</h3>${f.atividades.length ? `<div class="mini-list">${f.atividades.map(a => `<button class="mini-row" data-record="${ui.esc(a.id)}"><strong>${ui.esc(a.atividade)}${a.diagnostico ? ' (diagnóstico)' : ''}</strong><small>${ui.date(a.data)} · ${ui.esc([a.bairro, a.publico != null ? a.publico + ' pessoas' : 'público não informado', a.responsavel].filter(Boolean).join(' · '))}</small></button>`).join('')}</div>` : '<p class="muted">Nenhuma atividade registrada nesta frente no mês.</p>'}
      <h3 class="answers-head">Atendimentos em aberto</h3>${f.casos.length ? `<div class="mini-list">${f.casos.map(c => `<button class="mini-row" data-case="${ui.esc(c.protocolo)}"><strong>${ui.esc(c.protocolo)} · ${ui.esc(c.assunto || 'Assunto não informado')}</strong><small>${ui.esc(c.status || 'Em aberto')}${c.dias != null ? ' · ' + c.dias + ' dias' : ''}</small></button>`).join('')}</div>` : '<p class="muted">Nenhum atendimento em aberto ligado a esta frente.</p>'}`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
  }
  async function carregarRelatos() {
    const box = $('relatosResumo'); if (!box) return;
    if (!relatos || relatos.mes !== ui.state.mes) {
      box.innerHTML = '<div class="loading-label"><span class="spinner"></span>Lendo os relatos do mês…</div>';
      try { const d = await ui.call('carregarRelatosResumoCPT', ui.state.mes); if (ui.state.route !== 'painel' || aba !== 'relatos') return; relatos = d; }
      catch (e) { box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    }
    desenharRelatos();
  }
  function desenharRelatos() {
    const box = $('relatosResumo'); if (!box || !relatos) return;
    const itens = [...new Set(relatos.itens.map(r => r.item))].sort(), b = ui.norm(filtroRelato.busca);
    const lista = relatos.itens.filter(r => (!filtroRelato.item || r.item === filtroRelato.item) && (!b || ui.norm([r.atividade, r.bairro, r.frente, r.responsavel, r.resumo].join(' ')).includes(b)));
    const dias = new Map(); lista.forEach(r => dias.set(r.data, (dias.get(r.data) || []).concat([r])));
    const rot = {pronto: 'Pronto', rascunho: 'Rascunho', revisao: 'Em revisão'};
    box.innerHTML = `<section class="panel filter-panel"><form id="relatoFiltro" class="filters"><label class="field">Procurar nos relatos<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroRelato.busca)}" placeholder="Atividade, bairro, pessoa ou palavra do relato" maxlength="100"></span></label>
      <label class="field">Item do relatório<select name="item"><option value="">Todos</option>${itens.map(i => `<option ${filtroRelato.item === i ? 'selected' : ''}>${ui.esc(i)}</option>`).join('')}</select></label></form></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'relato' : 'relatos'} em ${dias.size} ${dias.size === 1 ? 'dia' : 'dias'}</span><span>Leitura rápida; o texto completo fica no registro</span></div>
      ${[...dias].map(([dia, rs]) => `<section class="relato-day"><h3 class="peek-title">${ui.date(dia)}</h3>${rs.map(r => `<article class="relato-card"><div class="card-top"><span class="badge">Item ${ui.esc(r.item)}</span>${r.situacao ? `<span class="badge ${r.situacao === 'pronto' ? 'status-concluida' : 'status-andamento'}">${rot[r.situacao] || ui.esc(r.situacao)}</span>` : ''}${r.fotos ? `<span class="small muted">${r.fotos} ${r.fotos === 1 ? 'foto' : 'fotos'}</span>` : '<span class="small late-text">sem foto</span>'}</div>
        <h4>${ui.esc(r.atividade)}</h4><p class="small muted">${ui.esc([r.frente || r.bairro, r.publico != null ? r.publico + ' pessoas' : 'público não informado', r.responsavel].filter(Boolean).join(' · '))}</p>
        ${r.resumo ? `<p class="relato-text">${ui.esc(r.resumo)}</p>` : '<p class="small late-text">Relato sem texto no registro.</p>'}${r.objetivo ? `<p class="small"><strong>Objetivo:</strong> ${ui.esc(r.objetivo)}</p>` : ''}
        <div class="card-bottom"><span></span><span><button class="button ghost" data-record="${ui.esc(r.id)}">Registro completo</button> <button class="button secondary" data-prepare-relato="${ui.esc(r.id)}">Preparar</button></span></div></article>`).join('')}</section>`).join('') || '<p class="muted">Nenhum relato com esse filtro.</p>'}`;
  }

  // ---------------- Programa Parceiros ----------------
  const INTRO_PP = ['Programa Parceiros', 'Respostas do mês no formato da máscara de lançamento. Responda, confira e publique.'];
  const chaveLocal = () => 'cpt.parceiros.' + ui.state.mes;
  async function renderParceiros() {
    const mine = ++ticket, mes = ui.state.mes; ppSujo = false; ppOp = null;
    ui.view.innerHTML = ui.intro(...INTRO_PP) + '<div class="loading-label"><span class="spinner"></span>Abrindo as perguntas e calculando as sugestões do mês…</div><div class="skel-list" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';
    try {
      const d = await ui.call('carregarParceirosCPT', mes); if (mine !== ticket || ui.state.route !== 'parceiros') return;
      pp = d; pp.campos = JSON.parse(JSON.stringify(d.atual.campos || {}));
      const local = store.get(chaveLocal()); let recuperado = false;
      if (local) { try { const l = JSON.parse(local); if (l.versao === d.atual.versao && JSON.stringify(l.campos) !== JSON.stringify(pp.campos)) { pp.campos = l.campos; recuperado = true; ppSujo = true; } else store.del(chaveLocal()); } catch (_) { store.del(chaveLocal()); } }
      desenharParceiros(recuperado);
    } catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro(...INTRO_PP) + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  const exibir = v => v === true ? 'Sim (marcado)' : v === false ? 'Não marcado' : v === '' || v == null ? '—' : String(v);
  function entrada(q, c) {
    const v = c ? c.valor : '', nome = `name="v${q.linha}" data-linha="${q.linha}" aria-labelledby="pq${q.linha}"`;
    if (q.tipo === 'texto') return `<textarea ${nome} rows="${String(v).length > 180 ? 5 : 3}" maxlength="5000">${ui.esc(v)}</textarea>`;
    if (q.tipo === 'marcar') return `<label class="pp-check"><input type="checkbox" ${nome} ${v === true ? 'checked' : ''}> Sim, foi executado no mês</label>`;
    if (q.tipo === 'simnao') return `<select ${nome}><option value="">Escolha</option>${['Sim', 'Não'].map(o => `<option ${v === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    return `<span class="pp-number"><input ${nome} inputmode="decimal" value="${ui.esc(v)}" placeholder="${q.tipo === 'nota' ? '0 a 10' : 'Número'}" maxlength="20"><button type="button" class="button ghost small-button" data-pp-na="${q.linha}">Não se aplica</button></span>`;
  }
  function pergunta(q) {
    if (q.tipo === 'titulo') return `<h4 class="pp-subtitle">${ui.esc(q.rotulo)}</h4>`;
    if (q.tipo === 'escala') return `<div class="pp-row is-info"><span class="pp-line">L${q.linha}</span><div class="pp-main"><p class="pp-question">${ui.esc(q.rotulo)}</p><p class="small muted">Este campo tem marcações próprias (0 a 5) na máscara. Marque direto na planilha oficial.</p></div></div>`;
    const c = pp.campos[q.linha], s = pp.sugestoes[q.linha], ant = pp.anterior[q.linha], m = pp.mascara.valores[q.linha];
    const naMascara = m && c && String(m.valor) !== String(c.valor) ? `<span class="pp-hint warn">Na máscara agora: ${ui.esc(exibir(m.valor))}${m.formula ? ' (fórmula, não será alterada)' : ''}</span>` : m && m.formula ? '<span class="pp-hint">Esta linha tem fórmula na máscara e não será alterada.</span>' : '';
    return `<div class="pp-row ${c && c.conferido ? 'is-checked' : ''}" id="pp${q.linha}"><span class="pp-line" title="Linha ${q.linha} da máscara">L${q.linha}</span>
      <div class="pp-main"><p class="pp-question" id="pq${q.linha}">${ui.esc(q.rotulo)}</p>${entrada(q, c)}
        <div class="pp-hints">${ant ? `<span class="pp-hint">Mês anterior: ${ui.esc(exibir(ant.valor).slice(0, 140))}</span>` : ''}${s ? `<span class="pp-hint suggest">Sugestão: <strong>${ui.esc(String(s.valor).slice(0, 160))}${String(s.valor).length > 160 ? '…' : ''}</strong> <button type="button" class="link-button" data-pp-usar="${q.linha}">Usar</button><small>${ui.esc(s.regra)}</small></span>` : ''}${naMascara}</div></div>
      <label class="pp-ok"><input type="checkbox" data-pp-ok="${q.linha}" ${c && c.conferido ? 'checked' : ''}><span>Conferido</span></label></div>`;
  }
  function contagem() {
    const resp = pp.definicoes.flatMap(g => g.perguntas).filter(q => !['titulo', 'escala'].includes(q.tipo));
    const r = resp.filter(q => { const c = pp.campos[q.linha]; return c && c.valor !== '' && c.valor != null; }).length, ok = resp.filter(q => (pp.campos[q.linha] || {}).conferido).length;
    return {total: resp.length, respondidas: r, conferidas: ok};
  }
  function situacaoTexto() {
    const a = pp.atual; if (!a.versao) return 'Ainda não salvo';
    if (a.situacao === 'publicado' && a.publicacao) return 'Publicado em ' + new Date(a.publicacao.em).toLocaleString('pt-BR', {dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo'});
    return (a.situacao === 'conferido' ? 'Conferido' : 'Rascunho') + ' · versão ' + a.versao + (a.por ? ' · ' + a.por.split('@')[0] : '');
  }
  function desenharParceiros(recuperado) {
    const n = contagem(), equipe = pp.definicoes.filter(g => g.quem === 'equipe'), eng = pp.definicoes.filter(g => g.quem === 'engenharia');
    const grupo = g => `<section class="panel pp-group" id="grupo-${g.id}"><div class="panel-head"><div><span class="eyebrow">${g.quem === 'equipe' ? 'NOSSA EQUIPE' : 'ENGENHARIA (CONCREJATO)'}</span><h2>${ui.esc(g.nome)}</h2></div></div>${g.perguntas.map(pergunta).join('')}</section>`;
    ui.view.innerHTML = ui.intro(...INTRO_PP) + `${recuperado ? '<div class="notice">Recuperamos respostas que ficaram neste navegador sem salvar. Confira e clique em Salvar respostas.</div>' : ''}${pp.avisos.map(a => `<div class="notice">${ui.esc(a)}</div>`).join('')}
      <section class="panel pp-status"><div class="pp-status-main"><div><span class="eyebrow">COMPETÊNCIA</span><h2>${ui.esc(mesLongo(pp.mes).replace(/^./, c => c.toUpperCase()))}</h2><p><span class="badge ${pp.atual.situacao === 'publicado' ? 'status-concluida' : pp.atual.versao ? 'status-andamento' : ''}" id="ppSituacao">${ui.esc(situacaoTexto())}</span></p></div>
        <div class="pp-progress"><p><strong id="ppResp">${n.respondidas}</strong> de ${n.total} respondidas · <strong id="ppOk">${n.conferidas}</strong> conferidas</p>${medidor(n.conferidas, n.total)}</div></div>
        <div class="dialog-actions pp-tools"><button class="button secondary" id="ppSugestoes" type="button">Trazer sugestões para campos vazios</button><button class="button secondary" id="ppExportar" type="button">Planilha para conferência</button><button class="button secondary" data-pp-print type="button">Imprimir</button>
          ${pp.podePublicar ? `<button class="button" id="ppPublicar" type="button" ${pp.mascara.ok ? '' : 'disabled title="Conector da máscara indisponível"'}>Publicar na máscara oficial</button>` : '<span class="small muted">Publicar na máscara oficial: reservado à administração técnica durante os testes.</span>'}
          ${pp.mascara.ok ? `<a class="button ghost" href="${ui.esc(ui.safeURL(pp.mascara.url))}" target="_blank" rel="noopener noreferrer">Abrir máscara</a>` : ''}</div><div id="ppResultado" class="small" aria-live="polite"></div></section>
      <nav class="pp-jump" aria-label="Ir para o grupo">${pp.definicoes.map(g => `<a href="#grupo-${g.id}">${ui.esc(g.nome)}</a>`).join('')}</nav>
      <form id="ppForm" novalidate>${equipe.map(grupo).join('')}<details class="pp-eng"><summary>Dados da engenharia (Sistema viário, Qualidade e Ambiental) — preencha quando a Concrejato enviar</summary>${eng.map(grupo).join('')}</details></form>
      <div class="pp-bar"><span id="ppEstado" class="small">${ppSujo ? 'Alterações não salvas' : 'Tudo salvo'}</span><button class="button" id="ppSalvar" type="button">Salvar respostas</button></div>`;
    const f = $('ppForm');
    f.addEventListener('input', e => lerCampo(e.target));
    f.addEventListener('change', e => { if (e.target.dataset.ppOk) { const l = e.target.dataset.ppOk; pp.campos[l] = {...(pp.campos[l] || {valor: ''}), conferido: e.target.checked}; e.target.closest('.pp-row').classList.toggle('is-checked', e.target.checked); sujar(); } else lerCampo(e.target); });
    $('ppSalvar').addEventListener('click', salvarPP); $('ppSugestoes').addEventListener('click', usarSugestoes); $('ppExportar').addEventListener('click', exportarPP);
    if ($('ppPublicar')) $('ppPublicar').addEventListener('click', publicarPP);
  }
  function lerCampo(el) {
    const l = el && el.dataset.linha; if (!l) return;
    const v = el.type === 'checkbox' ? el.checked : el.value; pp.campos[l] = {...(pp.campos[l] || {conferido: false}), valor: v}; sujar();
  }
  function sujar() {
    ppSujo = true; ppOp = null; if ($('ppEstado')) $('ppEstado').textContent = 'Alterações não salvas';
    const n = contagem(); if ($('ppResp')) { $('ppResp').textContent = n.respondidas; $('ppOk').textContent = n.conferidas; const m = document.querySelector('.pp-progress .meter span'); if (m) m.style.width = pct(n.conferidas, n.total) + '%'; }
    store.set(chaveLocal(), JSON.stringify({versao: pp.atual.versao, campos: pp.campos}));
  }
  function preencher(l, valor) {
    const el = document.querySelector(`[data-linha="${l}"]`); if (!el) return;
    if (el.type === 'checkbox') el.checked = valor === true; else el.value = valor; lerCampo(el);
  }
  function usarSugestoes() {
    let n = 0; Object.keys(pp.sugestoes).forEach(l => { const c = pp.campos[l]; if (!c || c.valor === '' || c.valor == null) { preencher(l, pp.sugestoes[l].valor); n++; } });
    ui.toast(n ? n + ' sugestões trazidas. Confira cada uma antes de marcar como conferida.' : 'Não há campos vazios com sugestão.');
  }
  async function salvarPP() {
    const b = $('ppSalvar'); b.disabled = true; $('ppEstado').textContent = 'Salvando…';
    if (!ppOp) ppOp = 'OP-' + crypto.randomUUID();
    try {
      const r = await ui.call('salvarParceirosCPT', {mes: pp.mes, versao: pp.atual.versao, operacaoId: ppOp, campos: pp.campos});
      pp.atual = r.atual; pp.campos = JSON.parse(JSON.stringify(r.atual.campos)); ppSujo = false; ppOp = null; store.del(chaveLocal());
      $('ppEstado').textContent = 'Tudo salvo'; $('ppSituacao').textContent = situacaoTexto(); $('ppSituacao').className = 'badge status-andamento'; ui.toast(r.resultado);
    } catch (e) { $('ppEstado').textContent = 'Não salvou: ' + e.message; ui.toast('Suas respostas continuam na tela. ' + e.message); }
    finally { b.disabled = false; }
  }
  async function exportarPP() {
    if (ppSujo) { ui.toast('Salve as respostas antes de exportar.'); return; }
    const b = $('ppExportar'); b.disabled = true; $('ppResultado').textContent = 'Criando a planilha de conferência…';
    try { const r = await ui.call('exportarParceirosCPT', {mes: pp.mes}); $('ppResultado').innerHTML = `${ui.esc(r.resultado)} <a href="${ui.esc(ui.safeURL(r.planilha))}" target="_blank" rel="noopener noreferrer">Abrir</a> · <a href="${ui.esc(ui.safeURL(r.xlsx))}" target="_blank" rel="noopener noreferrer">Baixar Excel</a> · <a href="${ui.esc(ui.safeURL(r.pdf))}" target="_blank" rel="noopener noreferrer">Baixar PDF</a>`; }
    catch (e) { $('ppResultado').textContent = e.message; } finally { b.disabled = false; }
  }
  async function publicarPP() {
    if (ppSujo) { ui.toast('Salve as respostas antes de publicar.'); return; }
    const n = contagem(); if (!n.conferidas) { ui.toast('Marque como conferido o que deve ir para a máscara.'); return; }
    if (!confirm('Gravar ' + n.conferidas + ' resposta(s) conferida(s) na coluna de ' + mesLongo(pp.mes) + ' da máscara oficial? Campos não conferidos e fórmulas não são alterados.')) return;
    const b = $('ppPublicar'); b.disabled = true; $('ppResultado').textContent = 'Publicando na máscara oficial…';
    try { const r = await ui.call('publicarParceirosCPT', {mes: pp.mes, versao: pp.atual.versao}); pp.atual = r.atual; $('ppSituacao').textContent = situacaoTexto(); $('ppSituacao').className = 'badge status-concluida'; $('ppResultado').textContent = r.resultado; ui.toast(r.resultado); }
    catch (e) { $('ppResultado').textContent = e.message; } finally { b.disabled = false; }
  }
  function imprimirPP() {
    const old = $('printDetail'); if (old) old.remove();
    const paper = document.createElement('article'); paper.id = 'printDetail';
    paper.innerHTML = `<h1>Programa Parceiros · ${ui.esc(mesLongo(pp.mes))}</h1>` + pp.definicoes.map(g => `<h2>${ui.esc(g.nome)}</h2><table class="pp-print"><tbody>${g.perguntas.filter(q => q.tipo !== 'titulo').map(q => `<tr><td>${ui.esc(q.rotulo)}</td><td>${ui.esc(exibir((pp.campos[q.linha] || {}).valor))}</td></tr>`).join('')}</tbody></table>`).join('');
    document.body.append(paper); document.body.classList.add('printing-detail');
    try { window.print(); } finally { document.body.classList.remove('printing-detail'); paper.remove(); }
  }

  // ---------------- Conectores (administração técnica) ----------------
  async function renderConectores() {
    const mine = ++ticket; ui.view.innerHTML = ui.intro('Conectores e pastas', 'De onde a aplicação lê e para onde publica, e quais pastas a equipe precisa enxergar.') + '<div class="loading-label"><span class="spinner"></span>Conferindo cada conector com a conta proprietária…</div>';
    try {
      const d = await ui.call('conferirConectoresCPT'); if (mine !== ticket || ui.state.route !== 'conectores') return;
      ui.view.innerHTML = ui.intro('Conectores e pastas', 'De onde a aplicação lê e para onde publica, e quais pastas a equipe precisa enxergar.') +
        `<section class="panel ${d.travada ? 'lock-on' : ''}"><h2>${d.travada ? 'Período de testes: configuração travada' : 'Configuração liberada'}</h2><p>${d.travada ? 'Só você altera cadastros e papéis, o catálogo de obras, os conectores e publica nas planilhas oficiais. Para liberar obras e publicações à Gestão e ao Administrativo, execute <code>liberarConfiguracaoCPT</code> no editor do Apps Script.' : 'Gestão e Administrativo editam obras e publicam entregas oficiais. Cadastros e papéis continuam só com você. Para travar de novo, execute <code>travarConfiguracaoCPT</code> no editor.'}</p></section>
        <section class="panel"><div class="panel-head"><div><span class="eyebrow">COMPARTILHAR COM A EQUIPE</span><h2>Pastas que a equipe precisa enxergar</h2><p>Fotos e documentos abrem com a conta de cada pessoa. Compartilhe estas pastas com o domínio, como <strong>Leitor</strong>.</p></div></div>
          ${d.pastas.length ? `<ul class="connector-list">${d.pastas.map(p => `<li class="${p.equipeVe ? 'is-ok' : 'is-warn'}"><span class="alert-dot" aria-hidden="true"></span><div><strong>${ui.esc(p.nome)}</strong><small>${ui.esc(p.motivo)} · ${ui.esc(p.texto)}</small></div><a class="button ${p.equipeVe ? 'ghost' : 'secondary'}" href="${ui.esc(ui.safeURL(p.url))}" target="_blank" rel="noopener noreferrer">${p.equipeVe ? 'Abrir' : 'Abrir e compartilhar'}</a></li>`).join('')}</ul>` : '<p class="muted">Nenhuma pasta encontrada nos registros recentes.</p>'}</section>
        <section class="panel"><div class="panel-head"><div><span class="eyebrow">FONTES OFICIAIS</span><h2>Conectores</h2><p>Para trocar, cole o link do arquivo ou da pasta e salve.</p></div></div>
          <ul class="connector-list">${d.conectores.map(c => `<li class="${c.ok ? 'is-ok' : 'is-warn'}"><span class="alert-dot" aria-hidden="true"></span><div><strong>${ui.esc(c.nome)}</strong><small>${ui.esc(c.ok ? (c.titulo + ' · ' + c.compartilhamento) : c.erro)}</small><small class="muted">${ui.esc(c.uso)}${c.configurado ? '' : ' (valor padrão)'}</small>
            <form class="connector-form" data-conector="${ui.esc(c.chave)}"><input name="id" placeholder="Cole o link do ${c.tipo === 'pasta' ? 'Drive (pasta)' : 'arquivo'}" maxlength="300" aria-label="Novo link para ${ui.esc(c.nome)}"><button class="button ghost" type="submit">Salvar</button></form></div>
            <a class="button ghost" href="${ui.esc(ui.safeURL(c.url))}" target="_blank" rel="noopener noreferrer">Abrir</a></li>`).join('')}</ul></section>`;
    } catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro('Conectores e pastas', '') + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }

  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-painel-aba]'); if (t) { if (t.dataset.painelAba === 'resumo') { ui.navigate('inicio'); return; } aba = t.dataset.painelAba; if (ui.state.route !== 'painel') ui.navigate('painel'); else if (painel) desenharPainel(); return; }
      const f = e.target.closest('[data-frente]'); if (f) { abrirFrente(Number(f.dataset.frente)); return; }
      const na = e.target.closest('[data-pp-na]'); if (na) { preencher(na.dataset.ppNa, 'Não aplicada'); return; }
      const usar = e.target.closest('[data-pp-usar]'); if (usar && pp && pp.sugestoes[usar.dataset.ppUsar]) { preencher(usar.dataset.ppUsar, pp.sugestoes[usar.dataset.ppUsar].valor); return; }
      if (e.target.closest('[data-pp-print]') && pp) imprimirPP();
    });
    // Filtros com espera curta (debounce): o painel é redesenhado quando a pessoa para de digitar.
    let buscaTimer = null;
    const redesenhar = (form, desenhar) => {
      const f = $(form); if (!f) return;
      const i = f.elements.busca, foco = document.activeElement === i, pos = foco ? i.selectionStart : null;
      desenhar(f);
      const n = $(form) && $(form).elements.busca; if (n && foco) { n.focus(); n.setSelectionRange(pos, pos); }
    };
    document.addEventListener('input', e => {
      const f = e.target.closest('#frenteFiltro');
      if (f) { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => redesenhar('frenteFiltro', x => { filtroFrente = {busca: x.elements.busca.value, andamento: x.elements.andamento.checked}; desenharPainel(); }), e.target.name === 'busca' ? 220 : 0); return; }
      const r = e.target.closest('#relatoFiltro');
      if (r && e.target.name === 'busca') { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => redesenhar('relatoFiltro', x => { filtroRelato.busca = x.elements.busca.value; desenharRelatos(); }), 220); }
    });
    document.addEventListener('change', e => {
      const f = e.target.closest('#frenteFiltro'); if (f && e.target.name === 'andamento') { filtroFrente.andamento = e.target.checked; desenharPainel(); return; }
      const r = e.target.closest('#relatoFiltro'); if (r && e.target.name === 'item') { filtroRelato.item = e.target.value; desenharRelatos(); }
    });
    document.addEventListener('submit', async e => {
      const f = e.target.closest('.connector-form'); if (!f) return; e.preventDefault();
      const b = f.querySelector('button'); b.disabled = true;
      try { const r = await ui.call('configurarConectorCPT', {chave: f.dataset.conector, id: f.elements.id.value}); ui.toast(r.resultado); renderConectores(); }
      catch (err) { ui.toast(err.message); } finally { b.disabled = false; }
    });
    window.addEventListener('beforeunload', e => { if (ppSujo && ui.state.route === 'parceiros') { e.preventDefault(); e.returnValue = ''; } });
  }
  const sair = () => !ppSujo || ui.state.route !== 'parceiros' || confirm('Há respostas do Programa Parceiros sem salvar (elas ficam guardadas neste navegador). Sair mesmo assim?');
  return {init, renderPainel, renderParceiros, renderConectores, sair, colunas, barrasH, abas, irPara: k => { aba = k; }};
})();
</script>
