<script>
/*
 * Atendimentos 2.4.0 — carteira e ficha do caso, com o ciclo completo na aplicação:
 * consulta e observações (todos) · atualização e finalização (Atendimento/Gestão) · execução (Execução/Atendimento).
 * 2.4: filtro "com quem está", dias em aberto, correção dos dados, incorporação de protocolo e ficha oficial em PDF.
 * 2.7: aba "Auditoria e números" (Atendimento, Administrativo e Gestão): o que precisa de cuidado na carteira,
 *      com a ficha a um clique, e os números do serviço (idade dos casos, áreas, tipos, recebidos x concluídos).
 * Textos digitados ficam na tela em caso de erro ou conflito.
 */
window.CPTAtendimentos = (() => {
  'use strict';
  let ui = null, filtro = {busca: '', estado: 'abertos', com: ''}, pagina = null, casos = [], ticket = 0, debounce = null;
  let aberto = null, abrirTicket = 0, historico = {cursor: null, ocupado: false}, modo = 'casos', auditoria = null;
  const ops = new Map(); // operação idempotente por formulário enquanto o conteúdo não muda
  const $ = id => document.getElementById(id);
  const hoje = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
  // Situação: Recebida = vermelho (ninguém atuou ainda) · Em andamento = amarelo · Concluída = verde.
  const corStatus = c => c.concluido ? 'status-concluida' : /receb/i.test(c.status) ? 'status-recebida' : 'status-andamento';
  const opId = (chave, conteudo) => { const sig = JSON.stringify(conteudo), atual = ops.get(chave); if (atual && atual.sig === sig) return atual.id; const id = 'OP-' + crypto.randomUUID(); ops.set(chave, {sig, id}); return id; };

  /** A aba de auditoria aparece para quem conduz casos, na visão de Atendimento, Administrativo ou Gestão. */
  const conduz = () => ['atendimento', 'administrativo', 'gestao'].includes(ui.visao()) && (ui.state.perfil?.papeis || []).some(p => ['administrador', 'administrativo', 'gestao', 'atendimento'].includes(p));
  const abas = () => conduz() ? `<div class="segmented painel-tabs" role="tablist" aria-label="Partes de atendimentos">${[['casos', 'Casos'], ['auditoria', 'Auditoria e números']].map(([k, n]) => `<button role="tab" aria-selected="${modo === k}" class="${modo === k ? 'chosen' : ''}" data-atd-modo="${k}">${n}</button>`).join('')}</div>` : '';
  function render() {
    if (!conduz()) modo = 'casos';
    if (modo === 'auditoria') { renderAuditoria(); return; }
    ui.view.innerHTML = ui.intro('Atendimentos', 'Cada ficha nasce do formulário com um protocolo. Acompanhe, registre a execução e finalize por aqui.') + abas() +
      `<section class="panel filter-panel"><form id="caseFilters" class="filters cases"><label class="field">Localizar atendimento<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtro.busca)}" placeholder="Nº do caso (ex.: 17), protocolo, pessoa, assunto ou endereço" maxlength="200"></span></label>
      <label class="field">Situação<select name="estado"><option value="" ${!filtro.estado ? 'selected' : ''}>Todos os casos</option><option value="abertos" ${filtro.estado === 'abertos' ? 'selected' : ''}>Em aberto</option><option value="concluidos" ${filtro.estado === 'concluidos' ? 'selected' : ''}>Concluídos</option></select></label>
      <label class="field">Com quem está<select name="com"><option value="">Todos</option>${['Execução', 'Atendimento'].map(x => `<option ${filtro.com === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <button type="submit" class="button">${ui.icon('search')}Buscar</button></form></section><div class="results-head"><span id="caseCount">Consultando atendimentos…</span><span>Protocolos ATD + ano + número</span></div><div id="caseResults" class="list-table cases-table"></div><div id="moreCases" class="load-more"></div>`;
    const f = $('caseFilters'), ler = () => { filtro = Object.fromEntries(new FormData(f)); };
    f.addEventListener('submit', e => { e.preventDefault(); ler(); carregar(); });
    f.addEventListener('change', () => { ler(); carregar(); });
    f.elements.busca.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(() => { if (ui.state.route === 'atendimentos') { ler(); carregar(); } }, 400); });
    carregar();
  }
  // 2.13: uma linha por caso (mais casos por tela). Clicar abre o detalhe (painel ao lado no computador).
  const COLUNAS = ['Caso', 'Nome', 'Assunto', 'Situação', 'Com quem está', 'Dias', 'Próxima ação'];
  const cabecalho = () => `<div class="list-head" aria-hidden="true">${COLUNAS.map(c => `<span data-col>${c}</span>`).join('')}</div>`;
  /** Dias em aberto: até 29 verde, 30 a 59 amarelo, 60 ou mais vermelho (as mesmas faixas do Painel da Execução). */
  const tomDias = d => d == null ? '' : d >= 60 ? 'vermelho' : d >= 30 ? 'amarelo' : 'verde';
  function linha(r) {
    const situacao = r.concluido ? 'Concluído' : r.status || 'Em aberto';
    return `<div class="list-row" role="button" tabindex="0" data-case="${ui.esc(r.protocolo)}" aria-label="${ui.esc((r.caso ? r.caso + ', protocolo ' : '') + r.protocolo + ', ' + (r.nome || 'nome não informado') + ', ' + situacao)}">
      <span class="c-prot">${r.caso ? `<b class="c-caso">${ui.esc(r.caso)}</b><small>${ui.esc(r.protocolo)}</small>` : ui.esc(r.protocolo)}</span><span class="c-nome">${ui.esc(r.nome || 'Nome não informado')}</span><span class="c-assunto">${ui.esc(r.assunto || '—')}</span>
      <span class="c-sit"><i class="status-dot ${corStatus(r)}" aria-hidden="true"></i>${ui.esc(situacao)}</span><span class="c-com">${ui.esc(r.concluido ? '—' : r.area || '—')}</span>
      <span class="c-dias"><b class="dias ${r.concluido ? '' : tomDias(r.dias)}">${r.dias == null ? '—' : ui.esc(String(r.dias))}</b></span><span class="c-prox">${ui.esc(!r.concluido && r.proximaAcao ? r.proximaAcao : '—')}</span></div>`;
  }
  async function carregar(mais = false) {
    const mine = ++ticket; if (!mais) casos = [];
    $('moreCases').innerHTML = '<span class="loading-label"><span class="spinner"></span>Buscando fichas…</span>'; if (!mais) $('caseResults').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    try {
      const d = await ui.call('buscarAtendimentosCPT', {...filtro, pagina: mais ? pagina : 0}); if (mine !== ticket || ui.state.route !== 'atendimentos') return;
      casos.push(...d.itens); pagina = d.proximaPagina; $('caseCount').textContent = ui.num(d.total) + ' casos encontrados';
      $('caseResults').innerHTML = casos.length ? cabecalho() + casos.map(linha).join('') : '<p class="muted">Nenhum atendimento encontrado. Altere a situação ou o termo da busca.</p>';
      $('moreCases').innerHTML = d.proximaPagina !== null ? '<button class="button secondary" data-case-mais>Carregar mais</button>' : '';
    } catch (e) { if (mine !== ticket) return; $('caseResults').innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; $('moreCases').innerHTML = ''; $('caseCount').textContent = 'Consulta não concluída'; }
  }

  // ---------- Auditoria e números ----------
  async function renderAuditoria(atualizar = false) {
    const mine = ++ticket, intro = ui.intro('Atendimentos', 'Auditoria da carteira: o que precisa de cuidado, com a ficha a um clique. Nada é alterado aqui.') + abas();
    if (!auditoria || atualizar) ui.view.innerHTML = intro + '<div class="loading-label"><span class="spinner"></span>Conferindo todas as fichas…</div>';
    try {
      const d = await ui.call('auditarAtendimentosCPT', {atualizar}); if (mine !== ticket || ui.state.route !== 'atendimentos' || modo !== 'auditoria') return;
      auditoria = d; const n = d.numeros, G = window.CPTGestao;
      const ponto = v => !v.quantidade ? 'is-ok' : v.grave ? 'is-bad' : 'is-warn';
      const lista = v => v.itens.length ? `<ul class="audit-cases">${v.itens.map(x => `<li><button class="mini-row" data-case="${ui.esc(x.protocolo)}"><strong>${ui.esc(x.caso ? x.caso + ' (' + x.protocolo + ')' : x.protocolo)} · ${ui.esc(x.nome || 'Nome não informado')}</strong><small>${ui.esc([x.assunto, x.detalhe, x.area ? 'Com ' + x.area : ''].filter(Boolean).join(' · '))}</small></button></li>`).join('')}</ul>${v.quantidade > v.itens.length ? `<p class="small muted">Mostrando ${v.itens.length} de ${v.quantidade}, dos mais antigos para os mais novos.</p>` : ''}` : '<p class="ok-line">Nenhum caso nesta situação.</p>';
      ui.view.innerHTML = intro + `<section class="stat-row" aria-label="Números da carteira">
          <div class="stat-tile"><span class="stat-label">Em aberto</span><span class="stat-value">${ui.num(n.abertos)}</span><span class="stat-note">${ui.num(n.total)} casos principais no total.</span></div>
          <div class="stat-tile"><span class="stat-label">Pedem ação já</span><span class="stat-value">${ui.num(d.pendencias)}</span><span class="stat-note">Recebidos parados e casos acima de 30 dias.</span></div>
          <div class="stat-tile"><span class="stat-label">Prazo médio</span><span class="stat-value">${n.prazoMedio == null ? '—' : n.prazoMedio}<small> dias</small></span><span class="stat-note">Da abertura à conclusão, últimos 6 meses.</span></div>
          <div class="stat-tile"><span class="stat-label">Concluídos</span><span class="stat-value">${ui.num(n.concluidos)}</span><span class="stat-note">Acumulado da carteira.</span></div></section>
        <section class="panel"><div class="panel-head"><div><span class="eyebrow">AUDITORIA</span><h2>O que conferir</h2><p>Cada item explica o problema e o que fazer. Abra a ficha para corrigir; a correção fica no histórico.</p></div></div>
          <div class="audit-list">${d.verificacoes.map(v => `<details class="audit-item ${ponto(v)}" ${v.grave && v.quantidade ? 'open' : ''}><summary><span class="alert-dot" aria-hidden="true"></span><span class="audit-title">${ui.esc(v.titulo)}</span><span class="audit-count">${ui.num(v.quantidade)}</span></summary><p class="small">${ui.esc(v.ajuda)}</p>${lista(v)}</details>`).join('')}</div></section>
        <div class="painel-grid">
          <section class="panel"><div class="panel-head"><div><h2>Recebidos e concluídos</h2><p>Últimos seis meses.</p></div></div>${G.colunas(n.porMes, [{k: 'recebidos', nome: 'Recebidos', cls: 'b'}, {k: 'concluidos', nome: 'Concluídos', cls: 'c'}], 'Atendimentos por mês')}</section>
          <section class="panel"><div class="panel-head"><div><h2>Há quanto tempo estão abertos</h2></div></div>${G.barrasH(n.porIdade, 'Nenhum caso em aberto.')}</section>
          <section class="panel"><div class="panel-head"><div><h2>Com quem estão</h2><p>Casos em aberto por área.</p></div></div>${G.barrasH(n.porArea, 'Nenhum caso em aberto.')}</section>
          <section class="panel"><div class="panel-head"><div><h2>Tipos de manifestação</h2><p>Casos em aberto.</p></div></div>${G.barrasH(n.porTipo, 'Nenhum caso em aberto.')}</section>
          <section class="panel"><div class="panel-head"><div><h2>Por onde chegaram</h2><p>Canal, últimos seis meses.</p></div></div>${G.barrasH(n.porCanal, 'Sem casos no período.')}</section>
          <section class="panel"><div class="panel-head"><div><h2>Mais antigos em aberto</h2></div></div>${n.maisAntigos.length ? `<div class="mini-list">${n.maisAntigos.map(x => `<button class="mini-row" data-case="${ui.esc(x.protocolo)}"><strong>${ui.esc(x.caso ? x.caso + ' (' + x.protocolo + ')' : x.protocolo)} · ${ui.esc(x.assunto || 'Assunto não informado')}</strong><small>${ui.esc(x.detalhe)}${x.area ? ' · com ' + ui.esc(x.area) : ''}</small></button>`).join('')}</div>` : '<p class="ok-line">Nenhum caso em aberto.</p>'}</section>
        </div><p class="small muted painel-foot">Conferido em ${new Date(d.atualizadoEm).toLocaleString('pt-BR', {dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo'})}. Use Atualizar no topo para conferir de novo.</p>`;
    } catch (e) { if (mine === ticket) ui.view.innerHTML = intro + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }

  // ---------- Ficha ----------
  function linhaResumo(pares) { return '<dl class="detail-summary">' + pares.filter(([, v]) => v !== null).map(([k, v]) => `<div><dt>${ui.esc(k)}</dt><dd>${ui.esc(v || 'Não informado')}</dd></div>`).join('') + '</dl>'; }
  async function abrir(protocolo) {
    const mine = ++abrirTicket; aberto = null; historico = {cursor: null, ocupado: false};
    $('detailType').textContent = 'ATENDIMENTO'; $('detailTitle').textContent = 'Abrindo ficha ' + protocolo; $('detailContent').innerHTML = '<div class="loading-label"><span class="spinner"></span>Abrindo a ficha…</div>';
    window.CPTDetalhe.abrir(document.querySelector('#caseResults .list-row[data-case="' + String(protocolo).replace(/"/g, '') + '"]'));
    try { const d = await ui.call('abrirAtendimentoCPT', protocolo); if (mine !== abrirTicket || !$('detailDialog').open) return; aberto = d; desenhar(); }
    catch (e) { if (mine === abrirTicket) $('detailContent').innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  function desenhar(rascunhos = {}) {
    const d = aberto, f = d.ficha, a = d.abertura, conc = f.concluido, docs = [['Abrir ficha', f.documento], ['Abrir PDF', f.pdf]].filter(([, u]) => ui.safeURL(u));
    $('detailTitle').textContent = (f.caso || f.protocolo) + ' · ' + (f.nome || 'Atendimento');
    $('detailContent').innerHTML = `<div class="case-status">${f.caso ? `<span class="small">Protocolo <strong>${ui.esc(f.protocolo)}</strong></span>` : ''}<span class="badge ${corStatus(f)}">${ui.esc(conc ? 'Concluído' : f.status)}</span><span class="badge">${ui.esc(d.procedencia)}</span>${!conc && f.proximaAcao ? `<span class="small">Próxima ação: <strong>${ui.esc(f.proximaAcao)}</strong> · ${ui.esc(f.area || '')}</span>` : ''}</div>
      ${docs.length ? `<div class="dialog-actions">${docs.map(([l, u]) => `<a class="button secondary" href="${ui.esc(ui.safeURL(u))}" target="_blank" rel="noopener noreferrer">${ui.icon('file')}${l}</a>`).join('')}</div>` : ''}
      ${d.protocoloConsultado !== f.protocolo ? `<div class="notice">O protocolo ${ui.esc(d.protocoloConsultado)} está incorporado à ficha principal ${ui.esc(f.protocolo)}.</div>` : ''}
      <div class="case-actions" role="group" aria-label="Ações do caso">
        ${d.pode.atualizar && !conc ? '<button class="button secondary" data-caso-form="atualizar">Atualizar caso</button>' : ''}
        ${d.pode.executar && !conc ? '<button class="button secondary" data-caso-form="execucao">Registrar execução</button>' : ''}
        ${d.pode.finalizar && !conc ? '<button class="button" data-caso-form="finalizar">Finalizar ficha</button>' : ''}
        ${d.pode.reabrir && conc ? '<button class="button secondary" data-caso-form="reabrir">Reabrir caso</button>' : ''}
        ${d.pode.corrigir ? '<button class="button ghost" data-caso-form="corrigir">Corrigir dados da ficha</button>' : ''}
        ${d.pode.incorporar ? '<button class="button ghost" data-caso-form="incorporar">Incorporar protocolo duplicado</button>' : ''}
        ${d.pode.fichaOficial ? `<button class="button ghost" data-ficha-oficial>${ui.icon('file')}${d.fichaAtualizada ? 'Ficha oficial em dia' : 'Gerar ficha oficial (PDF)'}</button>` : ''}
      </div><div id="fichaResultado" aria-live="polite"></div><div id="casoForm"></div>
      <h3 class="answers-head">Solicitação</h3><p class="case-text">${ui.esc(a.solicitacao || f.assunto || 'Não informada')}</p>${a.descricao ? `<p class="case-text">${ui.esc(a.descricao)}</p>` : ''}
      ${a.execucoesAntigas ? `<h3 class="answers-head">Providências registradas no Controle antigo</h3><p class="case-text">${ui.esc(a.execucoesAntigas)}</p>` : ''}${a.conclusaoAntiga ? `<h3 class="answers-head">Conclusão registrada no Controle antigo</h3><p class="case-text">${ui.esc(a.conclusaoAntiga)}</p>` : ''}
      ${linhaResumo([['Assunto', f.assunto], ['Tipo de manifestação', a.tipo], ['Canal', a.canal], ['Urgência', a.urgencia], ['Endereço', f.endereco], ['Frente de obra', f.obra],
        ['Telefone', a.telefone || (a.contatoOculto ? 'Visível para Atendimento e Execução' : '')], ['E-mail', a.email || null], ['Abertura', ui.date(f.abertura)], ['Conclusão', f.conclusao ? ui.date(f.conclusao) : null], ['Responsável', f.responsavel], ['Tratativa inicial', a.tratativa || null]])}
      ${a.registroId ? `<p class="small muted">Aberto pelo formulário · registro <button class="link-button" data-record="${ui.esc(a.registroId)}">${ui.esc(a.registroId)}</button></p>` : ''}
      <section class="case-notes"><h3 class="answers-head">Observações da equipe</h3><p class="small muted">Registre o que você soube sobre o caso. Fica com seu nome e não altera a ficha oficial.</p>
        <form id="noteForm"><div id="noteError" class="notice" hidden></div><label class="field">Por onde a informação chegou<select name="canal" required><option value="">Escolha</option>${['Escritório', 'Campo / itinerante', 'Telefone ou WhatsApp', 'E-mail', 'Reunião', 'Outro'].map(x => `<option ${rascunhos.canal === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <label class="field">Observação<textarea name="texto" rows="3" maxlength="2000" required placeholder="Ex.: Moradora procurou a equipe na rua e informou que o vazamento voltou.">${ui.esc(rascunhos.nota || '')}</textarea></label><button class="button secondary" type="submit">Registrar observação</button></form>
        <div id="caseNotes"><p class="muted">Carregando observações…</p></div></section>
      <h3 class="answers-head">Linha do tempo</h3><div id="caseHistory" class="timeline"><p class="muted">Carregando histórico…</p></div><button class="button ghost" id="historyMore" hidden>Carregar mais</button>`;
    carregarNotas(); carregarHistorico(true);
  }
  function formulario(tipo) {
    const d = aberto, f = d.ficha, sel = (nome, lista, atual) => `<select name="${nome}" required>${lista.map(x => `<option ${x === atual ? 'selected' : ''}>${ui.esc(x)}</option>`).join('')}</select>`;
    const eu = (ui.state.perfil && ui.state.perfil.nome) || '';
    const html = {
      atualizar: `<label class="field">Situação${sel('status', d.opcoes.status.filter(x => x !== 'Concluída'), f.status)}</label><label class="field">Procedência${sel('procedencia', d.opcoes.procedencias, d.procedencia)}</label>
        <label class="field">Área responsável pela próxima ação${sel('area', d.opcoes.areas, f.area || 'Atendimento')}</label><label class="field">Responsável<input name="responsavel" maxlength="120" value="${ui.esc(f.responsavel)}"></label>
        <label class="field wide">Próxima ação<input name="proximaAcao" required maxlength="500" value="${ui.esc(f.proximaAcao)}"></label><label class="field wide">Observação da atualização (opcional)<textarea name="observacao" rows="2" maxlength="2000"></textarea></label>`,
      execucao: `<label class="field wide">O que foi feito<textarea name="feito" rows="4" required maxlength="3000" placeholder="Ex.: Reparo da calçada com troca de 3 m² de piso; local limpo e liberado."></textarea></label>
        <label class="field">Data da execução<input type="date" name="data" required max="${hoje()}" value="${hoje()}"></label><label class="field">Executado por<input name="executadoPor" required maxlength="120" value="${ui.esc(eu)}"></label>
        <label class="field wide">Evidências (links de fotos no Drive, opcional)<textarea name="evidencias" rows="2" maxlength="1500" placeholder="https://drive.google.com/…"></textarea></label>`,
      finalizar: `<label class="field wide">Conclusão (como o caso foi resolvido)<textarea name="conclusao" rows="4" required maxlength="3000"></textarea></label>
        <label class="field">Data de conclusão<input type="date" name="data" required max="${hoje()}" value="${hoje()}"></label><label class="field">Procedência final${sel('procedencia', ['Procedente', 'Não procedente'], d.procedencia === 'Não procedente' ? 'Não procedente' : 'Procedente')}</label>
        <label class="check-inline wide"><input type="checkbox" name="semExecucao"> Resolvido sem execução de obra (ex.: orientação ou esclarecimento)</label>`,
      corrigir: (() => { const c = d.correcao || {}, campo = (k, rot, max, tipo) => `<label class="field${k === 'solicitacao' || k === 'endereco' ? ' wide' : ''}">${rot}${k === 'solicitacao' ? `<textarea name="${k}" rows="4" maxlength="${max}">${ui.esc(c[k] || '')}</textarea>` : `<input name="${k}" type="${tipo || 'text'}" maxlength="${max}" value="${ui.esc(c[k] || '')}">`}</label>`;
        return campo('nome', 'Nome', 120) + campo('telefone', 'Telefone', 120) + campo('email', 'E-mail', 160, 'email') + campo('endereco', 'Endereço', 300) + campo('assunto', 'Assunto', 200) + campo('tipo', 'Tipo de manifestação', 60) +
          campo('canal', 'Canal de recebimento', 80) + campo('local', 'Local do atendimento', 200) + campo('solicitacao', 'Solicitação', 3000) +
          '<label class="field wide">Motivo da correção<input name="motivo" required maxlength="500" placeholder="Ex.: nome digitado errado na abertura; morador informou novo telefone."></label>'; })(),
      incorporar: `<p class="small muted wide">Use quando a mesma demanda foi registrada em dois protocolos. O outro protocolo passa a apontar para este caso e sai da lista da engenharia; o histórico dele continua visível aqui.</p>
        <label class="field">Protocolo a incorporar<input name="outro" required maxlength="30" pattern="[A-Za-z0-9-]{3,30}" placeholder="ATD2026…"></label><label class="field wide">Motivo<input name="motivo" required maxlength="500" placeholder="Ex.: mesma moradora e mesmo vazamento, registrado duas vezes."></label>`,
      reabrir: `<label class="field wide">Motivo da reabertura<textarea name="motivo" rows="3" required maxlength="1000"></textarea></label><label class="field wide">Próxima ação<input name="proximaAcao" required maxlength="500"></label>`
    }[tipo];
    const titulos = {atualizar: 'Atualizar caso', execucao: 'Registrar execução', finalizar: 'Finalizar ficha', reabrir: 'Reabrir caso', corrigir: 'Corrigir dados da ficha', incorporar: 'Incorporar protocolo'};
    $('casoForm').innerHTML = `<form class="case-form" data-tipo="${tipo}"><h3>${titulos[tipo]}</h3><div id="casoErro" class="notice" hidden></div><div class="editor-grid">${html}</div>
      <div class="dialog-actions"><button class="button" type="submit">${titulos[tipo]}</button><button class="button ghost" type="button" data-caso-cancelar>Cancelar</button></div></form>`;
    $('casoForm').querySelector('textarea, input:not([type=hidden]), select').focus();
  }
  async function enviar(form) {
    const tipo = form.dataset.tipo, dados = Object.fromEntries(new FormData(form)), b = form.querySelector('button[type=submit]'), erro = $('casoErro');
    if (tipo === 'finalizar') dados.semExecucao = form.elements.semExecucao.checked;
    let p = {...dados, protocolo: aberto.ficha.protocolo, versao: aberto.versao};
    if (tipo === 'corrigir') { const {motivo, ...campos} = dados; p = {motivo, dados: campos, protocolo: aberto.ficha.protocolo, versao: aberto.versao}; }
    p.operacaoId = opId(tipo + aberto.ficha.protocolo, p);
    const fn = {atualizar: 'atualizarAtendimentoCPT', execucao: 'registrarExecucaoCPT', finalizar: 'finalizarAtendimentoCPT', reabrir: 'reabrirAtendimentoCPT', corrigir: 'corrigirAtendimentoCPT', incorporar: 'incorporarAtendimentoCPT'}[tipo];
    b.disabled = true; const rotulo = b.textContent; b.textContent = 'Salvando…'; erro.hidden = true;
    try {
      const r = await ui.call(fn, p); ui.toast(r.resultado); ops.delete(tipo + aberto.ficha.protocolo);
      const protocolo = aberto.ficha.protocolo; await abrir(protocolo);
      const i = casos.findIndex(c => c.protocolo === protocolo); if (i >= 0 && aberto) { casos[i] = aberto.ficha; if ($('caseResults')) $('caseResults').innerHTML = casos.map(cartao).join(''); }
    } catch (e) { erro.textContent = e.message + ' Seu texto continua no formulário.'; erro.hidden = false; erro.scrollIntoView({block: 'nearest'}); b.disabled = false; b.textContent = rotulo; }
  }
  async function fichaOficial(b) {
    const protocolo = aberto.ficha.protocolo, box = $('fichaResultado'), rotulo = b.innerHTML;
    b.disabled = true; b.textContent = 'Gerando a ficha… (até 1 minuto)'; box.innerHTML = '';
    try {
      const r = await ui.call('gerarFichaOficialCPT', {protocolo}); ui.toast(r.resultado);
      if (aberto && aberto.ficha.protocolo === protocolo) { aberto.ficha.documento = r.documento; aberto.ficha.pdf = r.pdf; aberto.fichaAtualizada = true; desenhar(); }
    } catch (e) { box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; b.disabled = false; b.innerHTML = rotulo; }
  }
  // ---------- Observações e histórico ----------
  function nota(x) { const q = x.em ? new Date(x.em).toLocaleString('pt-BR', {dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo'}) : ''; return `<section class="history-item"><h3>${ui.esc(x.nome || x.autor)}</h3><p class="small muted">${ui.esc(q + ' · ' + x.canal + (x.consultado && x.consultado !== x.protocolo ? ' · protocolo ' + x.consultado : ''))}</p><p class="case-text">${ui.esc(x.texto)}</p></section>`; }
  async function carregarNotas() {
    const protocolo = aberto.ficha.protocolo;
    try { const r = await ui.call('listarObservacoesCPT', {protocolo}); if (!aberto || aberto.ficha.protocolo !== protocolo || !$('caseNotes')) return; $('caseNotes').innerHTML = r.itens.length ? r.itens.map(nota).join('') : '<p class="muted">Nenhuma observação registrada ainda.</p>'; }
    catch (e) { if ($('caseNotes')) $('caseNotes').innerHTML = `<p class="muted">${ui.esc(e.message)}</p>`; }
  }
  async function enviarNota(form) {
    const f = new FormData(form), p = {protocolo: aberto.ficha.protocolo, canal: f.get('canal'), texto: String(f.get('texto') || '').trim()}, err = $('noteError'), b = form.querySelector('button');
    if (!p.canal || !p.texto) { err.textContent = 'Escolha o canal e escreva a observação.'; err.hidden = false; return; }
    p.operacaoId = opId('nota' + p.protocolo, p); b.disabled = true; b.textContent = 'Registrando…'; err.hidden = true;
    try { const r = await ui.call('adicionarObservacaoCPT', p); ops.delete('nota' + p.protocolo); ui.toast(r.resultado); form.reset(); const box = $('caseNotes'); if (box) { if (box.querySelector('.muted:only-child')) box.innerHTML = ''; box.insertAdjacentHTML('afterbegin', nota(r.observacao)); } }
    catch (e) { err.textContent = e.message + ' Seu texto continua no campo.'; err.hidden = false; } finally { b.disabled = false; b.textContent = 'Registrar observação'; }
  }
  async function carregarHistorico(inicio) {
    if (historico.ocupado) return; historico.ocupado = true; const protocolo = aberto.ficha.protocolo;
    try {
      const r = await ui.call('consultarHistoricoFichaCPT', {protocolo, cursor: inicio ? null : historico.cursor}); if (!aberto || aberto.ficha.protocolo !== protocolo || !$('caseHistory')) return;
      const html = r.itens.map(x => `<section class="history-item tipo-${ui.esc(ui.norm(x.tipo).replace(/[^a-z]/g, ''))}"><h3>${ui.esc(x.tipo || 'Movimentação')}</h3><p class="small muted">${ui.esc([x.data, x.status, x.autor].filter(Boolean).join(' · '))}</p><p class="case-text">${ui.esc(x.resumo || '')}</p></section>`).join('');
      if (inicio) $('caseHistory').innerHTML = html || '<p class="muted">Sem movimentações registradas.</p>'; else $('caseHistory').insertAdjacentHTML('beforeend', html);
      historico.cursor = r.proximoCursor; $('historyMore').hidden = r.proximoCursor == null;
    } catch (e) { if ($('caseHistory')) $('caseHistory').innerHTML = `<p class="muted">${ui.esc(e.message)}</p>`; } finally { historico.ocupado = false; }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', ev => {
      const c = ev.target.closest('[data-case]'); if (c) { abrir(c.dataset.case); return; }
      const m = ev.target.closest('[data-atd-modo]'); if (m) { modo = m.dataset.atdModo; render(); return; }
      if (ev.target.closest('[data-case-mais]')) { carregar(true); return; }
      const f = ev.target.closest('[data-caso-form]'); if (f && aberto) { formulario(f.dataset.casoForm); return; }
      if (ev.target.closest('[data-caso-cancelar]')) { $('casoForm').innerHTML = ''; return; }
      const fo = ev.target.closest('[data-ficha-oficial]'); if (fo && aberto) { fichaOficial(fo); return; }
      if (ev.target.closest('#historyMore')) carregarHistorico(false);
    });
    document.addEventListener('submit', ev => {
      const cf = ev.target.closest('.case-form'); if (cf) { ev.preventDefault(); enviar(cf); return; }
      const nf = ev.target.closest('#noteForm'); if (nf && aberto) { ev.preventDefault(); enviarNota(nf); }
    });
  }
  return {init, render, abrir, atualizar: () => { if (modo === 'auditoria' && conduz()) renderAuditoria(true); else render(); }, filtrar: estado => { if (estado === 'auditoria') { modo = 'auditoria'; return; } filtro.estado = estado; modo = 'casos'; }};
})();
</script>
