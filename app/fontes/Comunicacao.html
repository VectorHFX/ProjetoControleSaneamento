<script>
/*
 * Comunicação 2.8.0 — um lugar calmo, uma coisa de cada vez.
 * Hoje: só o que pede ação agora (recados novos, lembretes, ações da equipe na semana, materiais com prazo,
 *   e o que já está guardado para o fechamento do mês). Cada bloco tem no máximo poucas linhas e um verbo.
 * Lembretes: ações socioambientais e materiais, compartilhados com o Social (também na rota "lembretes").
 * Materiais e links: a pasta de links com prazo e situação; o que é concluído entra no mês (Programa Parceiros).
 * Galeria: fotos do mês (registros + extras), envio do computador ou por link, pacote .zip para baixar.
 */
window.CPTComunicacao = (() => {
  'use strict';
  let ui = null, ticket = 0, aba = 'hoje', hoje = null, lem = null, mat = null, gal = null;
  let filtroLem = 'fazer', filtroMat = {situacao: 'abertos', busca: ''}, filtroGal = {origem: '', busca: '', limite: 24}, selecionadas = new Set();
  const $ = id => document.getElementById(id);
  const ops = new Map(), opId = (k, c) => { const s = JSON.stringify(c), a = ops.get(k); if (a && a.s === s) return a.id; const id = 'OP-' + crypto.randomUUID(); ops.set(k, {s, id}); return id; };
  const hojeISO = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
  const dias = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);
  const relativo = d => { if (!d) return 'Sem data'; const n = dias(hojeISO(), d); return n === 0 ? 'Hoje' : n === 1 ? 'Amanhã' : n === -1 ? 'Ontem (atrasado)' : n < 0 ? 'Atrasado ' + (-n) + ' dias' : n < 7 ? new Date(d + 'T12:00:00Z').toLocaleDateString('pt-BR', {weekday: 'long', timeZone: 'UTC'}) : ui.date(d); };
  const dialogo = (tipo, titulo, html) => { $('detailType').textContent = tipo; $('detailTitle').textContent = titulo; $('detailContent').innerHTML = html; if (!$('detailDialog').open) $('detailDialog').showModal(); };
  const fechar = () => { if ($('detailDialog').open) $('closeDialog').click(); };
  const erro = (id, e) => { const b = $(id); if (b) { b.hidden = false; b.textContent = e.message; } };
  const nomePessoa = (lista, email) => (lista.find(p => p.email === email) || {nome: email ? email.split('@')[0] : ''}).nome;
  const thumb = id => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w360';

  const ABAS = [['hoje', 'Hoje'], ['lembretes', 'Lembretes'], ['materiais', 'Materiais e links'], ['galeria', 'Galeria']];
  const INTRO = ['Comunicação', 'Uma coisa de cada vez: comece por "Hoje".'];
  function cabecalho() {
    if (ui.state.route === 'lembretes') return ui.intro('Lembretes', 'Ações socioambientais e materiais, combinados entre Social e Comunicação.');
    return ui.intro(...INTRO) + `<div class="segmented painel-tabs com-tabs" role="tablist" aria-label="Partes da Comunicação">${ABAS.map(([k, n]) => `<button role="tab" aria-selected="${aba === k}" class="${aba === k ? 'chosen' : ''}" data-com-aba="${k}">${n}</button>`).join('')}</div>`;
  }
  function render() {
    if (ui.state.route === 'lembretes') { renderLembretes(); return; }
    ({hoje: renderHoje, lembretes: renderLembretes, materiais: renderMateriais, galeria: renderGaleria}[aba] || renderHoje)();
  }
  const carregando = t => { ui.view.innerHTML = cabecalho() + `<div class="loading-label"><span class="spinner"></span>${t}</div>`; };
  const falhou = (mine, e) => { if (mine === ticket) ui.view.innerHTML = cabecalho() + `<div class="notice">${ui.esc(e.message)}</div>`; };
  const ativo = mine => mine === ticket && ['comunicacao', 'lembretes'].includes(ui.state.route);

  // ---------------- Hoje ----------------
  async function renderHoje() {
    const mine = ++ticket; carregando('Separando o que é para hoje…');
    try { hoje = await ui.call('carregarComunicacaoHojeCPT'); if (!ativo(mine)) return; desenharHoje(); } catch (e) { falhou(mine, e); }
  }
  function bloco(n, titulo, conteudo, acao) { return `<section class="panel today-block"><div class="today-head"><span class="today-step" aria-hidden="true">${n}</span><h2>${titulo}</h2>${acao || ''}</div>${conteudo}</section>`; }
  function linhaLembrete(l) {
    const atrasado = l.data < hojeISO();
    return `<li class="today-row ${atrasado ? 'is-late' : ''}"><span class="kind kind-${l.tipo}">${l.tipo === 'material' ? 'Material' : 'Ação'}</span><span class="row-main"><strong>${ui.esc(l.titulo)}</strong><small>${ui.esc(relativo(l.data))}${l.material ? ' · ' + ui.esc(l.material) : ''}</small></span><button class="button secondary" data-lem-feito="${ui.esc(l.id)}">Feito ✓</button></li>`;
  }
  function desenharHoje() {
    const h = hoje, nome = ((ui.state.perfil || {}).nome || '').split(' ')[0], L = h.lembretes || {atrasados: [], hoje: [], semana: []};
    const lemHoje = L.atrasados.concat(L.hoje), dataLonga = new Date(h.hoje + 'T12:00:00Z').toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'});
    const total = (h.recadosTotal || 0) + lemHoje.length + (h.materiais || []).length;
    const r = h.resumo;
    ui.view.innerHTML = cabecalho() + h.avisos.map(a => `<div class="notice">${ui.esc(a)}</div>`).join('') +
      `<section class="today-hello"><h2>Olá${nome ? ', ' + ui.esc(nome) : ''}! Hoje é ${ui.esc(dataLonga)}.</h2><p>${total ? 'Você tem <strong>' + total + '</strong> ' + (total === 1 ? 'coisa' : 'coisas') + ' para olhar. Vá de cima para baixo.' : 'Tudo em dia por aqui. 🌿'}</p>
        <div class="quick-actions"><button class="button" data-lem-novo>${ui.icon('plus')}Novo lembrete</button><button class="button secondary" data-mat-novo>${ui.icon('plus')}Novo material</button><button class="button secondary" data-gal-enviar>Enviar fotos</button><button class="button secondary" data-rec-novo>Mandar recado</button></div></section>` +
      bloco(1, 'Recados para você', (h.recados || []).length ? `<ul class="today-list">${h.recados.map(x => `<li class="today-row is-new"><span class="row-main"><strong>${ui.esc(x.assunto)}</strong><small>De ${ui.esc(x.nomeAutor || x.criadoPor)}${x.importante ? ' · importante' : ''}</small></span><button class="button secondary" data-route="recados">Ler</button></li>`).join('')}</ul>` : '<p class="empty-line">Nenhum recado novo.</p>') +
      bloco(2, 'Lembretes de hoje', lemHoje.length ? `<ul class="today-list">${lemHoje.map(linhaLembrete).join('')}</ul>` : '<p class="empty-line">Nada para hoje.</p>' + (L.semana.length ? `<p class="small muted">Nesta semana: ${L.semana.length} ${L.semana.length === 1 ? 'lembrete' : 'lembretes'}.</p>` : ''), '<button class="button ghost" data-com-aba="lembretes">Ver todos</button>') +
      bloco(3, 'Ações da equipe nos próximos 7 dias', (h.agenda || []).length ? `<ul class="today-list">${h.agenda.map(e => `<li class="today-row"><span class="kind kind-acao">${ui.esc(relativo(e.data))}${e.inicio ? ' ' + ui.esc(e.inicio) : ''}</span><span class="row-main"><strong>${ui.esc(e.titulo)}</strong><small>${ui.esc([e.obra, e.bairro].filter(Boolean).join(' · ') || 'Local no cronograma')}</small></span><button class="button ghost" data-lem-evento="${ui.esc(e.id)}">Precisa de material?</button></li>`).join('')}</ul>` : '<p class="empty-line">Nenhuma ação marcada no cronograma para esta semana.</p>', '<button class="button ghost" data-route="cronograma">Cronograma</button>') +
      (h.materiais ? bloco(4, 'Materiais com prazo', h.materiais.length ? `<ul class="today-list">${h.materiais.map(m => `<li class="today-row ${m.prazo && m.prazo < h.hoje ? 'is-late' : ''}"><span class="kind kind-material">${ui.esc(m.situacao === 'producao' ? 'Em produção' : 'A fazer')}</span><span class="row-main"><strong>${ui.esc(m.titulo)}</strong><small>${ui.esc(m.tipo)}${m.prazo ? ' · prazo: ' + ui.esc(relativo(m.prazo)) : ''}</small></span><button class="button secondary" data-mat-concluir="${ui.esc(m.id)}">Concluir</button></li>`).join('')}</ul>` : '<p class="empty-line">Nenhum material com prazo nesta semana.</p>', '<button class="button ghost" data-com-aba="materiais">Ver todos</button>') : '') +
      (r ? bloco(5, 'Guardado para o fechamento do mês', `<dl class="month-strip"><div><dt>Publicações</dt><dd>${r.publicacoes}</dd></div><div><dt>Pessoas alcançadas</dt><dd>${ui.num(r.alcance)}</dd></div><div><dt>Impressos entregues</dt><dd>${ui.num(r.impressos)}</dd></div><div><dt>Vídeos</dt><dd>${r.videos}</dd></div></dl><p class="small muted">Conta o que você marca como <strong>Concluído</strong> em Materiais e links. Esses números já aparecem como sugestão no Programa Parceiros.</p>`, '<button class="button ghost" data-route="fechamento">Fechamento</button>') : '');
  }

  // ---------------- Lembretes ----------------
  async function renderLembretes() {
    const mine = ++ticket; carregando('Abrindo os lembretes…');
    try { lem = await ui.call('listarLembretesCPT'); if (!ativo(mine)) return; desenharLembretes(); } catch (e) { falhou(mine, e); }
  }
  function cartaoLembrete(l) {
    const feito = l.situacao === 'feito', late = !feito && l.data < hojeISO();
    return `<article class="reminder ${feito ? 'is-done' : ''} ${late ? 'is-late' : ''}"><div class="card-top"><span class="kind kind-${l.tipo}">${l.tipo === 'material' ? 'Material de comunicação' : 'Ação socioambiental'}</span><span class="small ${late ? 'late-text' : 'muted'}">${feito ? 'Feito em ' + ui.date(String(l.feitoEm).slice(0, 10)) : ui.esc(relativo(l.data))}</span></div>
      <h3>${ui.esc(l.titulo)}</h3>${l.detalhe ? `<p>${ui.esc(l.detalhe)}</p>` : ''}${l.material ? `<p class="small"><strong>Materiais:</strong> ${ui.esc(l.material)}</p>` : ''}
      <p class="small muted">${ui.esc([l.responsavel ? 'Com ' + nomePessoa(lem.pessoas, l.responsavel) : '', l.evento ? 'Atividade: ' + l.evento.titulo : '', l.frentes.map(f => f === 'comunicacao' ? 'Comunicação' : 'Social').join(' + ')].filter(Boolean).join(' · '))}</p>
      <div class="card-actions">${feito ? `<button class="button ghost" data-lem-desfazer="${ui.esc(l.id)}">Voltar para pendente</button>` : `<button class="button" data-lem-feito="${ui.esc(l.id)}">Feito ✓</button>`}<button class="button ghost" data-lem-editar="${ui.esc(l.id)}">Editar</button><button class="button ghost" data-lem-recado="${ui.esc(l.id)}">Avisar por recado</button></div></article>`;
  }
  function desenharLembretes() {
    const h = hojeISO(), pend = lem.itens.filter(l => l.situacao !== 'feito'), d7 = new Date(h + 'T12:00:00Z'); d7.setUTCDate(d7.getUTCDate() + 7); const s7 = d7.toISOString().slice(0, 10);
    const grupos = filtroLem === 'feitos' ? [['Feitos (mais recentes primeiro)', lem.itens.filter(l => l.situacao === 'feito').sort((a, b) => String(b.feitoEm).localeCompare(String(a.feitoEm))).slice(0, 40)]]
      : [['Atrasados', pend.filter(l => l.data < h)], ['Hoje', pend.filter(l => l.data === h)], ['Próximos 7 dias', pend.filter(l => l.data > h && l.data <= s7)], ['Mais adiante', pend.filter(l => l.data > s7)]];
    ui.view.innerHTML = cabecalho() + `<div class="tool-head"><div class="segmented painel-tabs">${[['fazer', 'Para fazer'], ['feitos', 'Feitos']].map(([k, n]) => `<button class="${filtroLem === k ? 'chosen' : ''}" aria-pressed="${filtroLem === k}" data-lem-filtro="${k}">${n}</button>`).join('')}</div><button class="button" data-lem-novo>${ui.icon('plus')}Novo lembrete</button></div>` +
      grupos.filter(([, l]) => l.length || filtroLem === 'feitos').map(([t, l]) => `<section class="reminder-group"><h3 class="peek-title">${t} <span class="count-pill">${l.length}</span></h3><div class="cards reminder-cards">${l.map(cartaoLembrete).join('') || '<p class="empty-line">Nada aqui.</p>'}</div></section>`).join('') ||
      '<p class="empty-line">Nenhum lembrete pendente. Crie um para não esquecer de uma ação ou de um material.</p>';
  }
  async function formLembrete(l, evento) {
    if (!lem) { try { lem = await ui.call('listarLembretesCPT'); } catch (e) { ui.toast(e.message); return; } }
    l = l || {tipo: evento ? 'material' : 'acao', titulo: evento ? 'Material para: ' + evento.titulo : '', data: evento ? evento.data : hojeISO(), frentes: ['socioambiental', 'comunicacao'], evento: evento || null};
    dialogo('LEMBRETE', l.id ? 'Editar lembrete' : 'Novo lembrete', `<form id="lemForm" class="stack-form" data-id="${ui.esc(l.id || '')}" data-versao="${l.versao || 0}"><div id="lemErro" class="notice" hidden></div>
      <fieldset class="big-choice"><legend>É sobre o quê?</legend><label><input type="radio" name="tipo" value="acao" ${l.tipo === 'acao' ? 'checked' : ''}><span><strong>Ação socioambiental</strong><small>Algo para fazer, acompanhar ou divulgar</small></span></label><label><input type="radio" name="tipo" value="material" ${l.tipo === 'material' ? 'checked' : ''}><span><strong>Material</strong><small>Panfleto, banner, brinde, foto, vídeo…</small></span></label></fieldset>
      ${l.evento ? `<p class="link-chip"><span>Atividade: <strong>${ui.esc(l.evento.titulo)}</strong> (${ui.date(l.evento.data)})</span></p>` : ''}
      <label class="field">O que lembrar<input name="titulo" maxlength="140" required value="${ui.esc(l.titulo || '')}" placeholder="Ex.: Levar 200 panfletos da obra"></label>
      <div class="form-row"><label class="field">Quando<input type="date" name="data" required value="${ui.esc(l.data || '')}"></label><label class="field">Responsável<select name="responsavel"><option value="">Ninguém em especial</option>${lem.pessoas.map(p => `<option value="${ui.esc(p.email)}" ${l.responsavel === p.email ? 'selected' : ''}>${ui.esc(p.nome)}</option>`).join('')}</select></label></div>
      <label class="field">Materiais necessários (se tiver)<input name="material" maxlength="600" value="${ui.esc(l.material || '')}" placeholder="Ex.: 200 panfletos, 1 banner, tenda"></label>
      <label class="field">Detalhes<textarea name="detalhe" rows="3" maxlength="1500" placeholder="Onde, com quem, o que não pode faltar.">${ui.esc(l.detalhe || '')}</textarea></label>
      <fieldset class="choice-group"><legend>Quem acompanha</legend><label class="choice"><input type="checkbox" name="frentes" value="socioambiental" ${l.frentes.includes('socioambiental') ? 'checked' : ''}>Social</label><label class="choice"><input type="checkbox" name="frentes" value="comunicacao" ${l.frentes.includes('comunicacao') ? 'checked' : ''}>Comunicação</label></fieldset>
      <div class="dialog-actions"><button class="button" type="submit">Salvar lembrete</button></div></form>`);
    $('lemForm').__evento = l.evento || null;
  }
  async function salvarLembrete(f) {
    const b = f.querySelector('[type=submit]'), dados = {id: f.dataset.id, versao: Number(f.dataset.versao), tipo: (f.querySelector('[name=tipo]:checked') || {}).value, titulo: f.elements.titulo.value, data: f.elements.data.value, responsavel: f.elements.responsavel.value,
      material: f.elements.material.value, detalhe: f.elements.detalhe.value, frentes: [...f.querySelectorAll('[name=frentes]:checked')].map(x => x.value), evento: f.__evento};
    b.disabled = true;
    try { const r = await ui.call('salvarLembreteCPT', {...dados, operacaoId: opId('lem' + dados.id, dados)}); ui.toast(r.resultado); fechar(); depoisDeSalvar(); }
    catch (e) { erro('lemErro', e); } finally { b.disabled = false; }
  }
  async function concluirLembrete(id, feito, botao) {
    if (botao) botao.disabled = true;
    try { const r = await ui.call('concluirLembreteCPT', {id, feito, operacaoId: opId('lemc' + id, {id, feito})}); ui.toast(r.resultado); depoisDeSalvar(); }
    catch (e) { ui.toast(e.message); if (botao) botao.disabled = false; }
  }
  function depoisDeSalvar() { if (window.CPTRecados) window.CPTRecados.contar(true); if (['comunicacao', 'lembretes'].includes(ui.state.route)) render(); }

  // ---------------- Materiais e links ----------------
  async function renderMateriais() {
    const mine = ++ticket; carregando('Abrindo a pasta de materiais…');
    try { mat = await ui.call('listarMateriaisCPT', ui.state.mes); if (!ativo(mine)) return; desenharMateriais(); } catch (e) { falhou(mine, e); }
  }
  function desenharMateriais(manterFoco) {
    const b = ui.norm(filtroMat.busca), r = mat.resumo, mes = ui.state.mes;
    const passa = m => filtroMat.situacao === 'abertos' ? m.situacao !== 'concluido' : String(m.publicadoEm || m.prazo || '').slice(0, 7) === mes && m.situacao === 'concluido';
    const lista = mat.itens.filter(m => passa(m) && (!b || ui.norm([m.titulo, m.observacao, m.tipo, m.canal].join(' ')).includes(b)));
    const pos = manterFoco ? document.activeElement.selectionStart : null;
    ui.view.innerHTML = cabecalho() + `<section class="panel month-panel"><div><span class="eyebrow">O QUE FOI FEITO EM ${ui.esc(new Date(mes + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long'}).toUpperCase())}</span>
        <dl class="month-strip"><div><dt>Publicações</dt><dd>${r.publicacoes}</dd></div><div><dt>Pessoas alcançadas</dt><dd>${ui.num(r.alcance)}</dd></div><div><dt>Impressos entregues</dt><dd>${ui.num(r.impressos)}</dd></div><div><dt>Vídeos</dt><dd>${r.videos}</dd></div><div><dt>Peças criadas</dt><dd>${r.ferramentas}</dd></div></dl>
        <p class="small muted">Só conta o que está <strong>Concluído</strong>, pela data de publicação ou entrega. Vai como sugestão para o Programa Parceiros (linhas 32 a 34).${r.semAlcance ? ' ' + r.semAlcance + ' publicação(ões) sem pessoas alcançadas: complete.' : ''}</p></div></section>
      <div class="tool-head"><div class="segmented painel-tabs">${[['abertos', 'A fazer e em produção'], ['mes', 'Concluídos no mês']].map(([k, n]) => `<button class="${filtroMat.situacao === k ? 'chosen' : ''}" aria-pressed="${filtroMat.situacao === k}" data-mat-filtro="${k}">${n}</button>`).join('')}</div>
        <span class="search-input small-search">${ui.icon('search')}<input id="matBusca" value="${ui.esc(filtroMat.busca)}" placeholder="Procurar material" aria-label="Procurar material" maxlength="100"></span><button class="button" data-mat-novo>${ui.icon('plus')}Novo material</button></div>
      <div class="cards material-cards">${lista.map(m => `<article class="material ${m.prazo && m.situacao !== 'concluido' && m.prazo < hojeISO() ? 'is-late' : ''}"><div class="card-top"><span class="badge">${ui.esc(m.tipo)}</span><span class="badge ${m.situacao === 'concluido' ? 'status-concluida' : m.situacao === 'producao' ? 'status-andamento' : ''}">${ui.esc(mat.situacoes[m.situacao])}</span></div>
        <h3>${ui.esc(m.titulo)}</h3>${m.observacao ? `<p class="small">${ui.esc(m.observacao)}</p>` : ''}
        <p class="small muted">${ui.esc([m.prazo && m.situacao !== 'concluido' ? 'Prazo: ' + relativo(m.prazo) : '', m.publicadoEm ? 'Publicado/entregue em ' + ui.date(m.publicadoEm) : '', m.canal, m.alcance != null ? ui.num(m.alcance) + ' pessoas alcançadas' : '', m.quantidade != null ? ui.num(m.quantidade) + ' entregues' : '', m.responsavel ? 'Com ' + nomePessoa(mat.pessoas, m.responsavel) : ''].filter(Boolean).join(' · '))}</p>
        <div class="card-actions">${m.url ? `<a class="button ghost" href="${ui.esc(ui.safeURL(m.url))}" target="_blank" rel="noopener noreferrer">Abrir link</a>` : ''}${m.situacao !== 'concluido' ? `<button class="button" data-mat-concluir="${ui.esc(m.id)}">Concluir</button>` : ''}<button class="button ghost" data-mat-editar="${ui.esc(m.id)}">Editar</button><button class="button ghost" data-mat-recado="${ui.esc(m.id)}">Enviar por recado</button></div></article>`).join('') || `<p class="empty-line">${filtroMat.situacao === 'abertos' ? 'Nenhum material em aberto. Use "Novo material" para guardar um link ou combinar uma peça.' : 'Nada concluído neste mês ainda.'}</p>`}</div>`;
    if (manterFoco) { const i = $('matBusca'); i.focus(); i.setSelectionRange(pos, pos); }
  }
  async function formMaterial(m, concluir) {
    if (!mat) { try { mat = await ui.call('listarMateriaisCPT', ui.state.mes); } catch (e) { ui.toast(e.message); return; } }
    m = m || {tipo: '', situacao: 'afazer'}; const sit = concluir ? 'concluido' : m.situacao;
    dialogo('MATERIAL', concluir ? 'Concluir material' : m.id ? 'Editar material' : 'Novo material', `<form id="matForm" class="stack-form" data-id="${ui.esc(m.id || '')}" data-versao="${m.versao || 0}"><div id="matErro" class="notice" hidden></div>
      ${concluir ? '<p class="help-note small">Confira a data e, se for publicação, quantas pessoas alcançou. Isso vai para o fechamento do mês.</p>' : ''}
      <label class="field">Título<input name="titulo" maxlength="160" required value="${ui.esc(m.titulo || '')}" placeholder="Ex.: Post sobre a obra da Viela Carijós"></label>
      <div class="form-row"><label class="field">Tipo<select name="tipo" required><option value="">Escolha</option>${mat.tipos.map(t => `<option ${m.tipo === t ? 'selected' : ''}>${ui.esc(t)}</option>`).join('')}</select></label><label class="field">Situação<select name="situacao">${Object.entries(mat.situacoes).map(([k, n]) => `<option value="${k}" ${sit === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <label class="field">Link (Drive, Canva, Instagram…)<input name="url" type="url" maxlength="2000" value="${ui.esc(m.url || '')}" placeholder="https://"></label>
      <div class="form-row"><label class="field">Prazo<input type="date" name="prazo" value="${ui.esc(m.prazo || '')}"></label><label class="field">Responsável<select name="responsavel"><option value="">—</option>${mat.pessoas.map(p => `<option value="${ui.esc(p.email)}" ${m.responsavel === p.email ? 'selected' : ''}>${ui.esc(p.nome)}</option>`).join('')}</select></label></div>
      <fieldset class="done-fields"><legend>Quando ficar pronto</legend><div class="form-row"><label class="field">Data de publicação ou entrega<input type="date" name="publicadoEm" value="${ui.esc(m.publicadoEm || (concluir ? hojeISO() : ''))}"></label><label class="field">Onde foi publicado<input name="canal" maxlength="120" value="${ui.esc(m.canal || '')}" placeholder="Instagram, LinkedIn, jornal…"></label></div>
        <div class="form-row"><label class="field">Pessoas alcançadas<input name="alcance" inputmode="numeric" maxlength="12" value="${m.alcance == null ? '' : m.alcance}" placeholder="Só publicações"></label><label class="field">Quantidade entregue<input name="quantidade" inputmode="numeric" maxlength="12" value="${m.quantidade == null ? '' : m.quantidade}" placeholder="Só impressos"></label></div></fieldset>
      <label class="field">Observação<textarea name="observacao" rows="3" maxlength="2000" placeholder="Para se guiar: versão final, quem aprovou, o que falta.">${ui.esc(m.observacao || '')}</textarea></label>
      <div class="dialog-actions"><button class="button" type="submit">${concluir ? 'Concluir' : 'Salvar material'}</button>${m.id ? '<button class="button ghost" type="button" data-mat-arquivar>Arquivar</button>' : ''}</div></form>`);
  }
  async function salvarMaterial(f, arquivar) {
    const b = f.querySelector('[type=submit]'), dados = {...Object.fromEntries(new FormData(f)), id: f.dataset.id, arquivado: !!arquivar}; dados.versao = Number(f.dataset.versao); b.disabled = true;
    try { const r = await ui.call('salvarMaterialCPT', {...dados, operacaoId: opId('mat' + dados.id, dados)}); ui.toast(r.resultado); fechar(); depoisDeSalvar(); }
    catch (e) { erro('matErro', e); } finally { b.disabled = false; }
  }

  // ---------------- Galeria ----------------
  async function renderGaleria(atualizar) {
    const mine = ++ticket; carregando('Reunindo as fotos do mês…');
    try { gal = await ui.call('listarGaleriaCPT', {mes: ui.state.mes, atualizar: !!atualizar}); if (!ativo(mine)) return; selecionadas = new Set(); filtroGal.limite = 24; desenharGaleria(); } catch (e) { falhou(mine, e); }
  }
  function listaGaleria() { const b = ui.norm(filtroGal.busca); return gal.itens.filter(x => (!filtroGal.origem || x.origem === filtroGal.origem) && (!b || ui.norm([x.legenda, x.responsavel].join(' ')).includes(b))); }
  function desenharGaleria(manterFoco) {
    const lista = listaGaleria(), vis = lista.slice(0, filtroGal.limite), pos = manterFoco ? document.activeElement.selectionStart : null;
    ui.view.innerHTML = cabecalho() + `<div class="tool-head"><div class="segmented painel-tabs">${[['', 'Todas'], ['Registro', 'Dos registros'], ['Extra', 'Extras']].map(([k, n]) => `<button class="${filtroGal.origem === k ? 'chosen' : ''}" aria-pressed="${filtroGal.origem === k}" data-gal-origem="${k}">${n}</button>`).join('')}</div>
        <span class="search-input small-search">${ui.icon('search')}<input id="galBusca" value="${ui.esc(filtroGal.busca)}" placeholder="Atividade, bairro ou pessoa" aria-label="Procurar foto" maxlength="100"></span><button class="button" data-gal-enviar>Enviar fotos</button></div>
      <div class="gallery-bar" id="galBar"><span><strong id="galSel">${selecionadas.size}</strong> de 15 escolhidas para baixar</span><span><button class="button secondary" data-gal-baixar ${selecionadas.size ? '' : 'disabled'}>Baixar (.zip)</button> <button class="button ghost" data-gal-legendas ${selecionadas.size ? '' : 'disabled'}>Copiar legendas</button> <button class="button ghost" data-gal-limpar ${selecionadas.size ? '' : 'disabled'}>Limpar</button></span></div>
      <p class="small muted">${lista.length} ${lista.length === 1 ? 'arquivo' : 'arquivos'} em ${ui.esc(new Date(ui.state.mes + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}))}. Se uma miniatura não aparecer, a pasta dela ainda não foi compartilhada com você.</p>
      <div class="gallery-grid">${vis.map(x => `<figure class="photo ${selecionadas.has(x.fileId) ? 'is-picked' : ''}"><button class="photo-open" data-gal-abrir="${ui.esc(x.fileId)}" aria-label="Ampliar: ${ui.esc(x.legenda)}">${x.video ? '<span class="video-tag">Vídeo</span>' : ''}<img loading="lazy" alt="" src="${ui.esc(thumb(x.fileId))}"></button>
        <figcaption><label class="photo-pick"><input type="checkbox" data-gal-marcar="${ui.esc(x.fileId)}" ${selecionadas.has(x.fileId) ? 'checked' : ''} ${x.video ? 'disabled title="Vídeos: baixe pelo Drive"' : ''}><span>${ui.esc(x.legenda)}</span></label><small>${ui.esc(x.origem === 'Extra' ? 'Extra · ' + (x.responsavel || '') : x.responsavel)}</small></figcaption></figure>`).join('') || '<p class="empty-line">Nenhuma foto neste mês com esse filtro.</p>'}</div>
      ${lista.length > vis.length ? `<div class="load-more"><button class="button secondary" data-gal-mais>Mostrar mais ${Math.min(24, lista.length - vis.length)}</button></div>` : ''}`;
    if (manterFoco) { const i = $('galBusca'); i.focus(); i.setSelectionRange(pos, pos); }
  }
  function abrirFoto(id) {
    const x = gal.itens.find(y => y.fileId === id); if (!x) return;
    dialogo('GALERIA', x.legenda, `<iframe class="media-frame" src="https://drive.google.com/file/d/${encodeURIComponent(id)}/preview" title="Visualização" allow="fullscreen"></iframe>
      <p class="small">${ui.esc(x.legenda)}</p><div class="dialog-actions"><button class="button secondary" data-gal-copiar="${ui.esc(id)}">Copiar legenda</button><a class="button ghost" href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view" target="_blank" rel="noopener noreferrer">Abrir no Drive</a>${x.registro ? `<button class="button ghost" data-record="${ui.esc(x.registro)}">Ver o registro</button>` : ''}</div>`);
  }
  function formEnvio() {
    dialogo('GALERIA', 'Enviar fotos', `<form id="galForm" class="stack-form"><div id="galErro" class="notice" hidden></div>
      <p class="help-note small">As fotos ficam numa pasta própria da Comunicação (não mexem no RDAS). Use a <strong>data em que a atividade aconteceu</strong>. A legenda segue o padrão do relatório: data - atividade - local.</p>
      <label class="field">Fotos do computador ou celular<input type="file" name="arquivos" accept="image/jpeg,image/png,image/webp" multiple></label>
      <label class="field">Ou link de foto/vídeo do Google Drive<input name="link" type="url" maxlength="2000" placeholder="https://drive.google.com/file/d/…"></label>
      <div class="form-row"><label class="field">Data da atividade<input type="date" name="data" required value="${hojeISO()}"></label><label class="field">Local<input name="local" maxlength="200" placeholder="Ex.: EMEIEF Vila Linda"></label></div>
      <label class="field">Atividade<input name="atividade" maxlength="200" required placeholder="Ex.: Oficina de horta"></label>
      <div id="galProgresso" class="small" aria-live="polite"></div><div class="dialog-actions"><button class="button" type="submit">Enviar</button></div></form>`);
  }
  /** Reduz a foto no navegador (até 2000 px, JPEG) antes de enviar: envio mais rápido e arquivo menor. */
  function reduzir(file) {
    return new Promise((ok, bad) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const e = Math.min(1, 2000 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok({mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.85).split(',')[1]}); };
      img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('Não foi possível ler ' + file.name + '.')); }; img.src = url;
    });
  }
  async function enviarFotos(f) {
    const b = f.querySelector('[type=submit]'), base = {data: f.elements.data.value, atividade: f.elements.atividade.value, local: f.elements.local.value}, arquivos = [...f.elements.arquivos.files], link = f.elements.link.value.trim();
    if (!arquivos.length && !link) { erro('galErro', new Error('Escolha fotos ou cole um link do Drive.')); return; }
    if (arquivos.length > 20) { erro('galErro', new Error('Envie até 20 fotos por vez.')); return; }
    b.disabled = true; let feitos = 0; const falhas = [];
    const passo = async (chave, conteudo) => { const r = await ui.call('enviarFotoGaleriaCPT', {...base, ...conteudo, operacaoId: opId(chave, {...base, chave})}); ops.delete(chave); feitos++; $('galProgresso').textContent = 'Enviadas ' + feitos + ' de ' + (arquivos.length + (link ? 1 : 0)) + '…'; return r; };
    for (const [i, file] of arquivos.entries()) { try { await passo('gal' + file.name + file.size + i, await reduzir(file)); } catch (e) { falhas.push(file.name + ': ' + e.message); } }
    if (link) try { await passo('gal-link' + link, {link}); } catch (e) { falhas.push('Link: ' + e.message); }
    b.disabled = false;
    if (falhas.length) { erro('galErro', new Error(feitos + ' enviada(s). Não foram: ' + falhas.join(' | ') + ' Clique em Enviar de novo para repetir só as que faltaram.')); return; }
    ui.toast(feitos === 1 ? 'Foto guardada na galeria.' : feitos + ' fotos guardadas na galeria.'); fechar(); if (aba === 'galeria') renderGaleria();
  }
  async function baixar(botao) {
    botao.disabled = true; ui.toast('Montando o pacote…');
    try {
      const r = await ui.call('baixarPacoteGaleriaCPT', {mes: ui.state.mes, ids: [...selecionadas]}), bytes = Uint8Array.from(atob(r.base64), c => c.charCodeAt(0));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], {type: 'application/zip'})); a.download = r.nome; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      ui.toast('Pacote baixado: ' + r.nome);
    } catch (e) { ui.toast(e.message); } finally { botao.disabled = false; }
  }
  async function copiar(texto) { try { await navigator.clipboard.writeText(texto); ui.toast('Copiado.'); } catch (_) { ui.toast('O navegador bloqueou a cópia.'); } }

  function irPara(destino) { if (ABAS.some(a => a[0] === destino)) aba = destino; }
  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-com-aba]'); if (t) { aba = t.dataset.comAba; if (ui.state.route !== 'comunicacao') ui.navigate('comunicacao'); else render(); return; }
      if (e.target.closest('[data-lem-novo]')) { formLembrete(); return; }
      const lf = e.target.closest('[data-lem-feito]'); if (lf) { concluirLembrete(lf.dataset.lemFeito, true, lf); return; }
      const ld = e.target.closest('[data-lem-desfazer]'); if (ld) { concluirLembrete(ld.dataset.lemDesfazer, false, ld); return; }
      const le = e.target.closest('[data-lem-editar]'); if (le) { formLembrete(lem.itens.find(x => x.id === le.dataset.lemEditar)); return; }
      const lr = e.target.closest('[data-lem-recado]'); if (lr) { const l = lem.itens.find(x => x.id === lr.dataset.lemRecado); window.CPTRecados.novo({tipo: 'lembrete', id: l.id, titulo: l.titulo, url: ''}, {assunto: 'Lembrete: ' + l.titulo, texto: [relativo(l.data), l.material ? 'Materiais: ' + l.material : '', l.detalhe].filter(Boolean).join('\n'), frentes: l.frentes}); return; }
      const lv = e.target.closest('[data-lem-evento]'); if (lv) { const ev = (hoje.agenda || []).find(x => x.id === lv.dataset.lemEvento); formLembrete(null, {id: ev.id, titulo: ev.titulo, data: ev.data}); return; }
      const lft = e.target.closest('[data-lem-filtro]'); if (lft) { filtroLem = lft.dataset.lemFiltro; desenharLembretes(); return; }
      if (e.target.closest('[data-mat-novo]')) { formMaterial(); return; }
      const mc = e.target.closest('[data-mat-concluir]'); if (mc) { const go = async () => { if (!mat) mat = await ui.call('listarMateriaisCPT', ui.state.mes); formMaterial(mat.itens.find(x => x.id === mc.dataset.matConcluir), true); }; go().catch(err => ui.toast(err.message)); return; }
      const me = e.target.closest('[data-mat-editar]'); if (me) { formMaterial(mat.itens.find(x => x.id === me.dataset.matEditar)); return; }
      const mr = e.target.closest('[data-mat-recado]'); if (mr) { const m = mat.itens.find(x => x.id === mr.dataset.matRecado); window.CPTRecados.novo({tipo: 'link', id: m.id, titulo: m.titulo, url: m.url}, {assunto: m.titulo, texto: m.observacao || 'Segue o material.'}); return; }
      const mf = e.target.closest('[data-mat-filtro]'); if (mf) { filtroMat.situacao = mf.dataset.matFiltro; desenharMateriais(); return; }
      if (e.target.closest('[data-mat-arquivar]') && confirm('Arquivar este material? Ele sai da lista, mas continua no histórico.')) { salvarMaterial($('matForm'), true); return; }
      if (e.target.closest('[data-gal-enviar]')) { formEnvio(); return; }
      const go = e.target.closest('[data-gal-origem]'); if (go) { filtroGal.origem = go.dataset.galOrigem; filtroGal.limite = 24; desenharGaleria(); return; }
      if (e.target.closest('[data-gal-mais]')) { filtroGal.limite += 24; desenharGaleria(); return; }
      const ga = e.target.closest('[data-gal-abrir]'); if (ga) { abrirFoto(ga.dataset.galAbrir); return; }
      const gc = e.target.closest('[data-gal-copiar]'); if (gc) { copiar((gal.itens.find(x => x.fileId === gc.dataset.galCopiar) || {}).legenda || ''); return; }
      const gb = e.target.closest('[data-gal-baixar]'); if (gb) { baixar(gb); return; }
      if (e.target.closest('[data-gal-legendas]')) { copiar(gal.itens.filter(x => selecionadas.has(x.fileId)).map(x => x.legenda).join('\n')); return; }
      if (e.target.closest('[data-gal-limpar]')) { selecionadas.clear(); desenharGaleria(); }
    });
    // Miniatura sem acesso (pasta não compartilhada com quem vê): troca por um aviso curto.
    document.addEventListener('error', e => { const t = e.target; if (t && t.matches && t.matches('.photo img')) { const x = document.createElement('span'); x.className = 'photo-missing'; x.textContent = 'Sem acesso à miniatura'; t.replaceWith(x); } }, true);
    document.addEventListener('change', e => {
      const m = e.target.closest('[data-gal-marcar]'); if (!m) return;
      if (m.checked && selecionadas.size >= 15) { m.checked = false; ui.toast('Escolha até 15 fotos por pacote.'); return; }
      if (m.checked) selecionadas.add(m.dataset.galMarcar); else selecionadas.delete(m.dataset.galMarcar);
      m.closest('.photo').classList.toggle('is-picked', m.checked); $('galSel').textContent = selecionadas.size;
      document.querySelectorAll('#galBar button').forEach(b => b.disabled = !selecionadas.size);
    });
    document.addEventListener('input', e => {
      if (e.target.id === 'matBusca') { filtroMat.busca = e.target.value; desenharMateriais(true); }
      if (e.target.id === 'galBusca') { filtroGal.busca = e.target.value; filtroGal.limite = 24; desenharGaleria(true); }
    });
    document.addEventListener('submit', e => {
      const f = e.target; if (!['lemForm', 'matForm', 'galForm'].includes(f.id)) return; e.preventDefault();
      if (f.id === 'lemForm') salvarLembrete(f); else if (f.id === 'matForm') salvarMaterial(f); else enviarFotos(f);
    });
  }
  return {init, render, irPara, atualizar: () => { if (aba === 'galeria' && ui.state.route === 'comunicacao') renderGaleria(true); else render(); }};
})();
</script>
