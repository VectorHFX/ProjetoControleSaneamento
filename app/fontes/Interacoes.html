<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const num=n=>new Intl.NumberFormat('pt-BR').format(n||0);
  // Sempre devolve texto seguro para HTML: o valor fora do padrão vem da planilha e é escapado.
  const date=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):esc(d||'Não informado');
  const monthLabel=m=>/^\d{4}-\d{2}$/.test(m)?new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}):'';
  const nowParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const state={route:'inicio',mes:window.CPT_PREVIA?'2026-09':nowParts.year+'-'+nowParts.month,home:null,homeRequest:0,listRequest:0,detailRequest:0,cursor:null,
    filters:{busca:'',procedimento:'',bairro:'',obra:'',pendencia:''},records:[],busy:false};
  let debounce,toastTimer;let activeDocument=null;
  const store={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  // Aparência: Claro, Escuro ou Mês (2.22: o Claro com as cores da campanha de saúde do mês; no período de testes, só o proprietário).
  const mesSP=()=>new Intl.DateTimeFormat('en-US',{month:'numeric',timeZone:'America/Sao_Paulo'}).format(new Date());
  function aplicarTema(v){const h=document.documentElement;h.dataset.theme=v==='dark'?'dark':'light';if(v==='mes')h.dataset.campanha=mesSP();else delete h.dataset.campanha;}
  const savedTheme=store.get('cpt.theme');aplicarTema(savedTheme);
  if(store.get('cpt.motion')==='reduce')document.documentElement.dataset.motion='reduce';
  /*
   * ROTAS — registro único das páginas (2.11). Para criar, mudar ou tirar uma página, mexa só aqui:
   * o menu lateral, os títulos, as permissões, as telas por cargo, o botão Atualizar e a troca de mês saem deste registro.
   * - grupo: 'dia' (sempre aberto) ou 'consulta' (Consultas e cadastros); sem grupo = fora do menu. 2.27: o grupo "Fechamento do mês" saiu.
   * - acesso: papéis da conta que podem abrir (o servidor confere de novo). Sem acesso = todos.
   * - visoes: telas por cargo em que a página aparece. Sem visoes = todas.
   * - abrir / atualizar / mes: o que fazer ao entrar, no botão Atualizar e ao trocar a competência
   *   (sem atualizar: recarrega os números do mês; sem mes: só recarrega os números do mês).
   * - podeSair: devolve false para segurar a pessoa na página (alterações não salvas). aoSair: avisa o módulo.
   */
  const GESTAO=['gestao','administrativo'],MESA=['socioambiental','comunicacao','gestao','administrativo'];
  const ROTAS={
    // 2.29: menu novo — Meu espaço, Visão do mês (com o Cronograma dentro), Atendimentos; Ferramentas; Ferramentas extras; Administração; Como usar.
    meuespaco:{titulo:'Meu espaço',icone:'i-star',grupo:'dia',abrir:()=>window.CPTEspaco.render(),atualizar:()=>window.CPTEspaco.render(true),aoSair:()=>window.CPTEspaco.sair()},
    // 2.30: Recados e Lembretes moram no Meu espaço; os endereços antigos (atalhos, missões, Ctrl K) levam para lá.
    recados:{titulo:'Recados',menu:'meuespaco',abrir:()=>{window.CPTEspaco.irParte('recados');navigate('meuespaco');}},
    lembretes:{titulo:'Lembretes',menu:'meuespaco',abrir:()=>{window.CPTEspaco.irParte('dia');navigate('meuespaco');}},
    inicio:{titulo:'Visão do mês',icone:'i-home',grupo:'dia',abrir:()=>renderHome(),atualizar:()=>{window.CPTInicio.prefetchAgenda(state.mes);loadHome(true);}},
    painel:{titulo:'Visão do mês',icone:'i-chart',menu:'inicio',acesso:['administrador','administrativo','gestao'],visoes:GESTAO,abrir:()=>window.CPTGestao.renderPainel(),atualizar:()=>window.CPTGestao.renderPainel(true),mes:()=>window.CPTGestao.renderPainel()},
    cronograma:{titulo:'Cronograma',icone:'i-calendar',menu:'inicio',abrir:()=>window.CPTAgenda.render(),atualizar:()=>window.CPTAgenda.render(),mes:()=>window.CPTAgenda.render()},
    atendimentos:{titulo:'Atendimentos',icone:'i-case',grupo:'dia',abrir:()=>window.CPTAtendimentos.render(),atualizar:()=>window.CPTAtendimentos.atualizar()},
    registros:{titulo:'Relatos',busca:'registros relatos procedimentos formulario de campo',icone:'i-records',grupo:'ferramentas',abrir:()=>window.CPTRelatos.render(),mes:()=>{$('view').innerHTML=skeleton();}},
    // 2.33: Levantamento de traçado (casa por casa, guardado no celular e enviado em lotes).
    levantamento:{titulo:'Levantamento de traçado',busca:'levantamento tracado casa por casa rua numero comunicado morador campo',icone:'i-route',grupo:'ferramentas',abrir:()=>window.CPTLevantamento.render(),atualizar:()=>window.CPTLevantamento.render(true)},
    mapa:{titulo:'Mapa',busca:'mapa santo andre bairros localizacao',icone:'i-pin',grupo:'extras',emTeste:true,abrir:()=>window.CPTMapa.render(),atualizar:()=>window.CPTMapa.render(true),mes:()=>window.CPTMapa.render(),aoSair:()=>window.CPTMapa.sair()},
    galeria:{titulo:'Galeria',busca:'galeria fotos do mes baixar pacote legendas',icone:'i-photo',grupo:'extras',abrir:()=>window.CPTComunicacao.render(),atualizar:()=>window.CPTComunicacao.atualizar(),mes:()=>window.CPTComunicacao.render()},
    obras:{titulo:'Obras',icone:'i-pin',grupo:'extras',abrir:()=>window.CPTObras.render(),atualizar:()=>window.CPTObras.render()},
    organograma:{titulo:'Organograma',busca:'organograma equipe quem e quem cargos areas baixar imagem pdf',icone:'i-people',grupo:'extras',emTeste:true,abrir:()=>window.CPTOrganograma.render(),atualizar:()=>window.CPTOrganograma.render()},
    contatos:{titulo:'Contatos',icone:'i-contact',grupo:'extras',abrir:()=>window.CPTRecados.renderContatos(),atualizar:()=>window.CPTRecados.renderContatos()},
    materiais:{titulo:'Materiais',busca:'materiais links publicacoes prazos comunicacao',icone:'i-megaphone',grupo:'extras',abrir:()=>window.CPTComunicacao.render(),atualizar:()=>window.CPTComunicacao.atualizar(),mes:()=>window.CPTComunicacao.render()},
    equipe:{titulo:'Equipe e acessos',icone:'i-people',grupo:'admin',acesso:['administrador'],visoes:GESTAO,abrir:()=>window.CPTAgenda.team(),atualizar:()=>window.CPTAgenda.team()},
    revisao:{titulo:'Revisão do conteúdo',busca:'revisao conteudo quiz curiosidades perguntas aprovar suspender',icone:'i-book',grupo:'admin',acesso:['administrador'],visoes:GESTAO,abrir:()=>window.CPTSaber.revisao(),atualizar:()=>window.CPTSaber.revisao()},
    conectores:{titulo:'Conectores e pastas',icone:'i-records',grupo:'admin',acesso:['administrador'],visoes:GESTAO,abrir:()=>window.CPTGestao.renderConectores(),atualizar:()=>window.CPTGestao.renderConectores()},
    ajuda:{titulo:'Como usar',icone:'i-help',grupo:'ajuda',abrir:()=>renderHelp()}
  };
  /** Monta o menu lateral a partir de ROTAS (na ordem do registro, separado por grupo). */
  (function montarMenu(){const grupos=[['dia','',false],['ferramentas','Ferramentas',false],['extras','Ferramentas extras',true],['admin','Administração',true],['ajuda','',false]];
    const item=(id,r)=>`<button class="nav-item" data-route="${id}" hidden><svg class="icon"><use href="#${r.icone}"/></svg><span>${esc(r.titulo)}</span></button>`;
    $('navigation').innerHTML=grupos.map(([g,nome,recolhe])=>{const itens=Object.entries(ROTAS).filter(([,r])=>r.grupo===g).map(([id,r])=>item(id,r)).join('');const gid='grupo'+g[0].toUpperCase()+g.slice(1);
      return `<div class="nav-group" data-grupo="${g}">${recolhe?`<button type="button" class="nav-group-head" aria-expanded="true" aria-controls="${gid}"><span>${esc(nome)}</span><svg class="icon chevron" aria-hidden="true"><use href="#i-arrow"/></svg></button><div class="nav-group-items" id="${gid}">${itens}</div>`:`${nome?`<div class="nav-caption">${esc(nome.toUpperCase())}</div>`:''}${itens}`}</div>`;}).join('');})();
  // ---------- Menu (hambúrguer): no computador recolhe a lateral (só ícones); no celular abre a gaveta com todas as páginas ----------
  const celular=()=>window.matchMedia('(max-width:800px)').matches;
  function abrirMenu(abrir){document.body.classList.toggle('nav-open',abrir);$('navScrim').hidden=!abrir;$('menuToggle').setAttribute('aria-expanded',String(abrir));const tm=$('tabMenu');if(tm)tm.setAttribute('aria-expanded',String(abrir));
    if(abrir){const alvo=document.querySelector('#navigation .nav-item.active')||document.querySelector('#navigation .nav-item:not([hidden])');if(alvo)alvo.focus();}}
  function alternarMenu(){if(celular()){abrirMenu(!document.body.classList.contains('nav-open'));return;}const compacto=!document.body.classList.contains('nav-compact');document.body.classList.toggle('nav-compact',compacto);store.set('cpt.nav',compacto?'compacto':'');$('menuToggle').setAttribute('aria-expanded',String(!compacto));}
  if(store.get('cpt.nav')==='compacto'&&!celular()){document.body.classList.add('nav-compact');$('menuToggle').setAttribute('aria-expanded','false');}
  if(celular())$('menuToggle').setAttribute('aria-expanded','false');
  $('menuToggle').addEventListener('click',alternarMenu);$('menuClose').addEventListener('click',()=>abrirMenu(false));$('navScrim').addEventListener('click',()=>abrirMenu(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav-open'))abrirMenu(false);});
  document.addEventListener('click',e=>{if(e.target.closest('#tabMenu'))abrirMenu(true);});
  // ---------- Detalhe ao lado (2.13): nas listas, no computador, a ficha abre num painel à direita e a lista continua clicável ----------
  // É o mesmo #detailDialog de sempre (mesmo conteúdo, ações e permissões); só muda onde ele aparece. Telas médias e celular: janela por cima.
  const LISTAS={atendimentos:'#caseResults .list-row',registros:'#recordResults .list-row',contatos:'.contacts-table .list-row'};
  window.CPTDetalhe={
    /** Abre o detalhe. linha: elemento da lista que ficou aberto (destacado). */
    abrir(linha){const d=$('detailDialog'),lado=window.matchMedia('(min-width:1101px)').matches&&!!LISTAS[state.route];
      document.querySelectorAll('.list-row.is-open').forEach(x=>x.classList.remove('is-open'));if(linha)linha.classList.add('is-open');
      if(d.open&&d.classList.contains('is-side')===lado)return;if(d.open)d.close();
      d.classList.toggle('is-side',lado);document.body.classList.toggle('detail-side',lado);if(lado)d.show();else d.showModal();}
  };
  // Linhas das listas: Enter ou espaço abre, como um botão.
  document.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('.list-row');if(r&&e.target===r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.click();}});
  // Teclado com o painel ao lado aberto: ↓/J próximo, ↑/K anterior, Esc fecha. Não interfere quando se está digitando.
  document.addEventListener('keydown',e=>{const d=$('detailDialog');if(!d.open||!d.classList.contains('is-side')||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.closest('input,textarea,select,[contenteditable="true"]')&&e.key!=='Escape')return;
    if(e.key==='Escape'){e.preventDefault();closeDetail();return;}
    const passo={ArrowDown:1,j:1,J:1,ArrowUp:-1,k:-1,K:-1}[e.key];if(!passo||!LISTAS[state.route])return;
    const linhas=[...document.querySelectorAll(LISTAS[state.route])],i=linhas.findIndex(x=>x.classList.contains('is-open')),alvo=linhas[i+passo];
    if(!alvo)return;e.preventDefault();alvo.focus({preventScroll:true});alvo.scrollIntoView({block:'nearest'});alvo.click();});
  /** Tira o painel ao lado e o destaque da linha (na hora, ao fechar; e pelo evento close, para outros caminhos). */
  function limparDetalhe(){$('detailDialog').classList.remove('is-side');document.body.classList.remove('detail-side');document.querySelectorAll('.list-row.is-open').forEach(x=>x.classList.remove('is-open'));}
  $('detailDialog').addEventListener('close',limparDetalhe);
  // ---------- Busca geral (Ctrl+K): páginas, ações, protocolos, obras e contatos ----------
  const BUSCA={obras:null,contatos:null,matriz:null,casos:[],casosDe:'',timer:null,seq:0,sel:0,itens:[]};
  const ACOES=[{titulo:'Novo recado',rota:'recados',chave:'recado mensagem avisar escrever',alvo:'[data-rec-novo]'},{titulo:'Nova atividade no cronograma',rota:'cronograma',chave:'agenda evento atividade marcar',alvo:'[data-agenda-action="new"]'},
    {titulo:'Novo contato',rota:'contatos',chave:'contato telefone cadastrar pessoa',alvo:'[data-con-novo]'},
    {titulo:'Visão do mês · Contrato',rota:'painel',chave:'painel contrato gestao numeros',aba:'contrato'},{titulo:'Visão do mês · Frentes de serviço',rota:'painel',chave:'painel frentes obras servico',aba:'frentes'},
    {titulo:'Visão do mês · Relatos em resumo',rota:'painel',chave:'painel relatos resumo',aba:'relatos'}];
  const normBusca=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  function abrirBusca(){const d=$('searchDialog');if(d.open)return;if(document.body.classList.contains('nav-open'))abrirMenu(false);d.showModal();$('searchInput').value='';BUSCA.sel=0;desenharBusca();$('searchInput').focus();
    if(!BUSCA.obras)call('listarObrasCPT').then(r=>{BUSCA.obras=(r&&r.obras)||[];desenharBusca();}).catch(()=>{BUSCA.obras=[];});
    if(!BUSCA.contatos)call('listarContatosCPT').then(r=>{BUSCA.contatos=(r&&r.itens)||[];BUSCA.matriz=(r&&r.matriz)||[];desenharBusca();}).catch(()=>{BUSCA.contatos=[];BUSCA.matriz=[];});}
  function fecharBusca(){const d=$('searchDialog');if(d.open)d.close();}
  /** Monta a lista de resultados para o texto digitado (sem texto: atalhos). Atendimentos vêm do servidor, com espera curta. */
  function resultadosBusca(q){const n=normBusca(q).trim(),out=[],tem=t=>!n||normBusca(t).includes(n);
    [...document.querySelectorAll('#navigation .nav-item')].filter(b=>!b.hidden).forEach(b=>{const nome=b.querySelector('span').textContent;if(tem(nome+' '+((ROTAS[b.dataset.route]||{}).busca||'')))out.push({tipo:'Página',titulo:nome,icone:(b.querySelector('use')||{getAttribute:()=>'#i-arrow'}).getAttribute('href'),ir:()=>navigate(b.dataset.route)});});
    ACOES.filter(a=>podeVer(a.rota)&&(tem(a.titulo)||(n&&normBusca(a.chave).includes(n)))).forEach(a=>out.push({tipo:'Ação',titulo:a.titulo,icone:a.aba?'#i-chart':'#i-plus',ir:()=>{if(a.aba)window.CPTGestao.irPara(a.aba);navigate(a.rota);if(a.alvo)clicarQuandoAparecer(a.alvo);}}));
    if(n.length>=2){
      BUSCA.casos.forEach(c=>out.push({tipo:'Atendimento',titulo:(c.caso?c.caso+' · ':'')+c.protocolo+' · '+(c.nome||'Sem nome'),detalhe:[c.assunto,c.status].filter(Boolean).join(' · '),icone:'#i-case',ir:()=>{navigate('atendimentos');window.CPTAtendimentos.abrir(c.protocolo);}}));
      (BUSCA.obras||[]).filter(o=>normBusca([o.nome,o.nomeUso,(o.apelidos||[]).join(' '),(o.bairros||[]).join(' '),o.id].join(' ')).includes(n)).slice(0,5).forEach(o=>out.push({tipo:'Obra',titulo:o.exibir||o.nome,detalhe:[(o.bairros||[]).join(', '),o.situacao].filter(Boolean).join(' · '),icone:'#i-pin',ir:()=>{window.CPTObras.irPara('catalogo');navigate('obras');preencherQuandoAparecer('#obraFiltros [name=busca]',o.exibir||o.nome);}}));
      (BUSCA.contatos||[]).filter(c=>normBusca([c.nome,c.instituicao,c.bairro,c.etiquetas,c.telefone].join(' ')).includes(n)).slice(0,5).forEach(c=>out.push({tipo:'Contato',titulo:c.nome||c.instituicao,detalhe:[c.instituicao,c.bairro].filter(Boolean).join(' · '),icone:'#i-contact',ir:()=>{navigate('contatos');clicarQuandoAparecer('[data-con-abrir="'+String(c.id).replace(/"/g,'')+'"]');}}));
      // 2.40: contatos da Matriz Sabesp (aprovados e ativos) também aparecem.
      (BUSCA.matriz||[]).filter(c=>normBusca([c.nome,c.pessoa,c.secao,c.telefone,c.email].join(' ')).includes(n)).slice(0,5).forEach(c=>out.push({tipo:'Matriz Sabesp',titulo:c.nome,detalhe:[c.pessoa,c.telefone,c.secao].filter(Boolean).join(' · '),icone:'#i-contact',ir:()=>{window.CPTRecados.irMatriz(c.id);navigate('contatos');}}));}
    return out.slice(0,14);}
  function desenharBusca(){const q=$('searchInput').value,lista=resultadosBusca(q);BUSCA.itens=lista;BUSCA.sel=Math.min(BUSCA.sel,Math.max(0,lista.length-1));
    $('searchResults').innerHTML=lista.length?lista.map((r,i)=>`<button type="button" class="search-item${i===BUSCA.sel?' is-sel':''}" role="option" aria-selected="${i===BUSCA.sel}" data-busca="${i}"><svg class="icon" aria-hidden="true"><use href="${esc(r.icone)}"/></svg><span class="search-text"><strong>${esc(r.titulo)}</strong>${r.detalhe?`<small>${esc(r.detalhe)}</small>`:''}</span><span class="search-kind">${esc(r.tipo)}</span></button>`).join('')
      :`<p class="search-empty">${q.trim().length<2?'Digite para buscar.':'Nada encontrado para “'+esc(q.trim())+'”.'}</p>`;
    const s=$('searchResults').querySelector('.is-sel');if(s)s.scrollIntoView({block:'nearest'});}
  function buscarCasos(q){const n=q.trim();clearTimeout(BUSCA.timer);if(n.length<2&&!/^\d$/.test(n)){/* 2.26.6: um dígito já busca o caso ("caso 7") */BUSCA.casos=[];BUSCA.casosDe='';return;}if(n===BUSCA.casosDe)return;
    BUSCA.timer=setTimeout(async()=>{const meu=++BUSCA.seq;try{const r=await call('buscarAtendimentosCPT',{busca:n,estado:'',com:'',pagina:0});if(meu!==BUSCA.seq)return;BUSCA.casos=((r&&r.itens)||[]).slice(0,5);BUSCA.casosDe=n;if($('searchDialog').open)desenharBusca();}catch(_){}},300);}
  function escolherBusca(i){const r=BUSCA.itens[i];if(!r)return;fecharBusca();r.ir();}
  /** Depois de trocar de página, espera o elemento aparecer (até 6 s) e clica ou preenche. */
  function quandoAparecer(sel,acao){const t0=Date.now(),tentar=()=>{const el=document.querySelector(sel);if(el){acao(el);return;}if(Date.now()-t0<6000)setTimeout(tentar,120);};tentar();}
  function clicarQuandoAparecer(sel){quandoAparecer(sel,el=>el.click());}
  function preencherQuandoAparecer(sel,valor){quandoAparecer(sel,el=>{el.value=valor;el.dispatchEvent(new Event('input',{bubbles:true}));});}
  $('searchOpen').addEventListener('click',abrirBusca);$('searchClose').addEventListener('click',fecharBusca);
  $('searchDialog').addEventListener('click',e=>{if(e.target.id==='searchDialog'){fecharBusca();return;}const b=e.target.closest('[data-busca]');if(b)escolherBusca(Number(b.dataset.busca));});
  $('searchInput').addEventListener('input',e=>{BUSCA.sel=0;BUSCA.casos=e.target.value.trim()===BUSCA.casosDe?BUSCA.casos:[];desenharBusca();buscarCasos(e.target.value);});
  $('searchInput').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();fecharBusca();return;}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=BUSCA.itens.length;if(!n)return;BUSCA.sel=(BUSCA.sel+(e.key==='ArrowDown'?1:n-1))%n;desenharBusca();}else if(e.key==='Enter'){e.preventDefault();escolherBusca(BUSCA.sel);}});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&String(e.key).toLowerCase()==='k'){e.preventDefault();if(state.perfil)abrirBusca();}});
  // ---------- Ícone da pessoa (2.13.1): o próprio mascote no topo, no lugar de "Minha visão". Guardado no navegador para aparecer já ao abrir. ----------
  function mostrarAvatar(){const b=$('topAvatar');if(!b||!window.CPTMascote)return;let a=null;try{a=JSON.parse(store.get('cpt.avatar')||'null');}catch(_){}
    if(!a||!a.especie){b.hidden=true;return;}b.innerHTML=window.CPTMascote.desenhar(a.especie,a.equipado||{},38,a.nome||'Mascote',a.cor||'');b.setAttribute('aria-label','Meu espaço — '+(a.nome||'mascote'));b.title=a.nome||'Meu espaço';b.hidden=false;}
  window.CPTAvatar={guardar(m){if(!m)return;store.set('cpt.avatar',JSON.stringify({especie:m.especie,cor:m.cor||'',nome:m.nome,equipado:m.equipado||{}}));mostrarAvatar();}};
  // ---------- Menu em grupos: "Dia a dia" sempre aberto; "Consultas e cadastros" recolhível ----------
  // Gestão e Administrativo (que veem tudo) começam com os grupos recolhidos; as demais frentes, abertos. A escolha de cada pessoa fica guardada.
  function preferenciaMenu(){try{return JSON.parse(store.get('cpt.menu')||'{}')||{};}catch(_){return {};}}
  function abrirGrupo(grupo,aberto,salvar){const g=document.querySelector('.nav-group[data-grupo="'+grupo+'"]');if(!g)return;g.classList.toggle('is-closed',!aberto);const h=g.querySelector('.nav-group-head');if(h)h.setAttribute('aria-expanded',String(aberto));
    if(salvar){const p=preferenciaMenu();p[grupo]=aberto;store.set('cpt.menu',JSON.stringify(p));}}
  function ajustarGrupos(){const vis=[...document.querySelectorAll('#navigation .nav-item')].filter(b=>!b.hidden).length,pref=preferenciaMenu();
    document.querySelectorAll('.nav-group').forEach(g=>{const itens=[...g.querySelectorAll('.nav-item')];g.hidden=!itens.some(b=>!b.hidden);const k=g.dataset.grupo;if(!g.querySelector('.nav-group-head'))return;
      const temAtual=itens.some(b=>b.dataset.route===state.route&&!b.hidden);abrirGrupo(k,temAtual||(k in pref?!!pref[k]:!GESTAO.includes(visao())),false);});}

  async function openDetail(kind,id){if(kind==='case'){window.CPTAtendimentos.abrir(id);return;}const ticket=++state.detailRequest;activeDocument=null;$('detailType').textContent=kind==='record'?'REGISTRO DE CAMPO':'ATENDIMENTO';$('detailTitle').textContent='Carregando detalhes';$('detailContent').innerHTML='<div class="loading-label"><span class="spinner"></span>Abrindo as informações…</div>';window.CPTDetalhe.abrir(kind==='record'?document.querySelector('#recordResults .list-row[data-record="'+String(id).replace(/"/g,'')+'"]'):null);
    try{const d=await call('abrirRegistroCPT',id);if(ticket!==state.detailRequest||!$('detailDialog').open)return;
      if(kind==='record'){const r=d.registro;$('detailTitle').textContent=r.atividade||r.procedimento;
        $('detailContent').innerHTML=readingTools()+summary([['Procedimento',r.procedimento],['Data de realização',date(r.data)],['Bairro',r.bairro],['Responsável',r.responsavel],['Obra de referência',r.obra],['Origem',r.origem],['Público informado',r.publico==null?'Não informado':String(r.publico)]])+`<p class="document-id">Registro: ${esc(r.id)}</p>`+
          (r.conferencia?`<details class="help-note"><summary>Conferência do registro</summary><p>${esc(r.conferencia)}</p><p>ID: ${esc(r.id)}</p></details>`:'')+
          (d.anexos.length?`<h3 class="answers-head">Arquivos e evidências</h3><div class="attachments">${d.anexos.map((a,i)=>`<div class="attachment"><p>${esc(a.titulo||'Anexo '+(i+1))}</p><button class="button secondary" data-preview="${esc(a.id)}">Visualizar</button> <a href="${esc(safeURL(a.url))}" target="_blank" rel="noopener noreferrer">Abrir no Drive</a></div>`).join('')}</div><div id="mediaPreview"></div>`:'')+
          sections(d.campos);
      }
      activeDocument={kind,id,title:$('detailTitle').textContent};
    }catch(e){if(ticket===state.detailRequest)$('detailContent').innerHTML=empty('Não foi possível abrir',e.message);}}

  function readingTools(){return '<div class="reading-tools"><button class="button secondary" data-reading="copy">Copiar conteúdo</button><button class="button secondary" data-reading="print">Imprimir / salvar PDF</button></div>';}
  function sections(campos){const groups=new Map();campos.forEach(x=>{const key=x.secao||'Respostas do registro';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x);});return '<h3 class="answers-head">O que foi registrado</h3>'+([...groups].map(([name,items])=>'<details class="report-section" open><summary>'+esc(name)+' · '+items.length+' respostas</summary>'+items.map(x=>'<section class="answer"><h3>'+esc(x.titulo)+'</h3><p>'+esc(value(x.valor))+'</p></section>').join('')+'</details>').join('')||'<p>Não há campos adicionais neste registro.</p>');}
  function documentClone(){const clone=$('detailContent').cloneNode(true);clone.querySelectorAll('.reading-tools,iframe,#mediaPreview').forEach(e=>e.remove());clone.querySelectorAll('button').forEach(e=>e.remove());clone.querySelectorAll('details').forEach(e=>e.open=true);return clone;}
  document.addEventListener('click',async ev=>{const button=ev.target.closest('[data-reading]');if(!button||!activeDocument)return;const doc=activeDocument;
    if(button.dataset.reading==='copy'){const clone=documentClone();clone.querySelectorAll('h3,p,dt,dd,summary').forEach(e=>e.appendChild(document.createTextNode('\n')));const text=doc.title+'\n\n'+clone.textContent;try{await navigator.clipboard.writeText(text);toast('Conteúdo copiado.');}catch(e){toast('O navegador bloqueou a cópia. Selecione o texto da ficha para copiar.');}return;}
    if(button.dataset.reading==='print'){const old=$('printDetail');if(old)old.remove();const paper=document.createElement('article');paper.id='printDetail';const title=document.createElement('h1');title.textContent=doc.title;paper.append(title,documentClone());document.body.append(paper);document.body.classList.add('printing-detail');$('detailDialog').close();try{window.print();}finally{document.body.classList.remove('printing-detail');paper.remove();if(activeDocument===doc)$('detailDialog').showModal();}return;}
  });
  document.addEventListener('click',async ev=>{const button=ev.target.closest('[data-check-access]');if(!button)return;button.disabled=true;try{const r=await call('conferirMeuAcessoCPT');const box=$('accessResult');if(box)box.textContent=r.etapas.map(x=>(x.ok?'OK':'VERIFICAR')+' · '+x.nome+': '+x.mensagem).join('\n');}catch(e){const box=$('accessResult');if(box)box.textContent=e.message;}finally{button.disabled=false;}});
  function closeDetail(){activeDocument=null;++state.detailRequest;$('detailDialog').close();limparDetalhe();$('detailContent').innerHTML='';}
  document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route,route.dataset.filter);return;}const record=e.target.closest('[data-record]');if(record){openDetail('record',record.dataset.record);return;}
    const preview=e.target.closest('[data-preview]');if(preview&&/^[A-Za-z0-9_-]{10,}$/.test(preview.dataset.preview)){const frame=document.createElement('iframe');frame.className='media-frame';frame.src='https://drive.google.com/file/d/'+encodeURIComponent(preview.dataset.preview)+'/preview';frame.title='Visualização do arquivo';frame.allow='fullscreen';$('mediaPreview').replaceChildren(frame);return;}
    const a=e.target.closest('[data-action]')?.dataset.action;if(a==='more-records')loadRecords(true);if(a==='retry-records')loadRecords();if(a==='retry-home')loadHome();if(a==='retry-boot')bootstrap();if(a==='noform')toast('O link do formulário ainda não está disponível. Confira a aba Início da base.');if(a==='clear'){state.filters={busca:'',procedimento:'',bairro:'',obra:'',pendencia:''};renderRecords();}});
  $('closeDialog').addEventListener('click',closeDetail);$('detailDialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});
  $('theme').addEventListener('change',e=>{aplicarTema(e.target.value);store.set('cpt.theme',e.target.value);toast(e.target.value==='mes'&&window.CPTMascoteV2?'Tema do mês: '+window.CPTMascoteV2.campanha()[0]+'.':'Aparência salva neste navegador.');});
  $('month').addEventListener('change',()=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test($('month').value)){toast('Selecione um mês válido.');return;}const r=ROTAS[state.route];if(r&&r.podeSair&&!r.podeSair()){$('month').value=state.mes;return;}state.mes=$('month').value;state.home=null;++state.listRequest;if(r&&r.mes)r.mes();window.CPTInicio.prefetchAgenda(state.mes);loadHome();});
  $('refresh').addEventListener('click',()=>{const r=ROTAS[state.route];if(r&&r.atualizar){r.atualizar();return;}if(state.route==='inicio')window.CPTInicio.prefetchAgenda(state.mes);loadHome(true);});
  window.addEventListener('offline',()=>notice('Você está sem conexão. As consultas precisam de internet; os dados já exibidos continuam na tela.'));
  window.addEventListener('online',()=>{notice('');toast('Conexão restabelecida. Use Atualizar para consultar novamente.');});
  /** Opção "Mês" na aparência: liberada junto com o elenco novo. Quem não pode e tinha "mes" salvo volta ao Claro. */
  function temaDoMes(pode){const s=$('theme');let o=s.querySelector('option[value=mes]');
    if(pode&&!o){o=document.createElement('option');o.value='mes';s.appendChild(o);}if(o){o.textContent='Mês';o.title=window.CPTMascoteV2?'Cores da campanha do mês: '+window.CPTMascoteV2.campanha()[0]:'';}
    if(!pode){if(o)o.remove();if(document.documentElement.dataset.campanha){aplicarTema('light');store.set('cpt.theme','light');}}
    s.value=document.documentElement.dataset.campanha?'mes':document.documentElement.dataset.theme;}
  function configureProfile(p){if(!p)return;state.perfil=p;window.CPT_MASCOTE_V2=!p.emTeste||(p.papeis||[]).includes('administrador');/* elenco chibi: só o proprietário durante os testes */temaDoMes(window.CPT_MASCOTE_V2);if(window.CPTVisual)window.CPTVisual.aplicar(window.CPT_MASCOTE_V2);/* visual novo: mesma regra */mostrarAvatar();const select=$('roleView'),saved=store.get('cpt.view'),previous=select.value;const views=p.papeis.filter(x=>x!=='administrador');const list=views.length?views:p.papeis;select.innerHTML=list.map(role=>`<option value="${esc(role)}">${esc(window.CPTAgenda.names[role])}</option>`).join('');select.value=list.includes(previous)?previous:list.includes(saved)?saved:list[0];select.disabled=list.length<2;aplicarVisao();$('accountLabel').textContent=p.nome+' · '+p.email;$('accountLabel').title=p.email;}
  function accessError(message){const r=$('roleView');r.innerHTML='<option value="">Sem acesso</option>';r.disabled=true;$('accountLabel').textContent='Acesso não confirmado';document.querySelectorAll('.nav-item').forEach(b=>{b.hidden=b.dataset.route!=='ajuda';});ajustarGrupos();
    $('view').innerHTML=`<div class="page-intro"><div><div class="eyebrow muted">ACESSO</div><h1>Não conseguimos liberar sua entrada</h1><p>${esc(message)}</p></div></div><section class="panel"><p>Nada foi alterado. Você pode tentar de novo ou conferir em qual etapa o acesso parou e enviar o resultado para a administração técnica.</p><div class="dialog-actions"><button class="button" data-action="retry-boot">Tentar novamente</button><button class="button secondary" data-check-access>Conferir meu acesso</button></div><p id="accessResult" style="white-space:pre-line"></p></section>`;}
  async function bootstrap(){if(window.CPT_BOOT)window.CPT_BOOT.stage='verificando acesso';const r=$('roleView');r.innerHTML='<option value="">Verificando acesso…</option>';r.disabled=true;$('accountLabel').textContent='Verificando acesso…';$('view').innerHTML='<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Verificando seu acesso…</div>';
    // A página já chega com o perfil e, quando há cache, com a Visão do mês e a agenda (doGet). Sem isso, pergunta ao servidor.
    const inicial=window.CPT_INICIAL||{};if(inicial.erro){accessError(inicial.erro);window.CPT_BOOT?.finish();return;}
    try{const d=inicial.perfil?inicial:await call('carregarPerfilCPT');if(!d||!d.perfil||!Array.isArray(d.perfil.papeis))throw new Error('Resposta de acesso inesperada. Confira se todos os arquivos da versão 2.3.0 foram publicados.');configureProfile(d.perfil);
      if(inicial.inicio&&inicial.inicio.mes===state.mes){state.home={...inicial.inicio,perfil:d.perfil};window.CPT_BOOT?.finish();}
      window.CPTInicio.prefetchAgenda(state.mes,inicial.agenda);navigate(entrada());loadHome();
      // Não essencial para a primeira tela: os avisos de recados são pedidos logo depois, sem disputar com os dados do mês.
      setTimeout(()=>window.CPTRecados.contar(false),1200);setInterval(()=>{if(document.visibilityState==='visible')window.CPTRecados.contar(true);},600000);}
    catch(e){accessError(e.message);window.CPT_BOOT?.finish();}}
  function trocarVisao(v){$('roleView').value=v;store.set('cpt.view',v);aplicarVisao();state.route='';navigate(entrada());toast('Agora você vê a tela de '+window.CPTAgenda.names[v]+'. Sua conta e suas permissões não mudam.');}
  $('roleView').addEventListener('change',()=>trocarVisao($('roleView').value));
  document.addEventListener('change',e=>{if(e.target.id==='viewSwitch')trocarVisao(e.target.value);});
  if(!window.CPTAgenda||typeof window.CPTAgenda.init!=='function')throw new Error('O componente Agenda.html está ausente ou não iniciou. Substitua-o pelo arquivo completo da versão 2.3.0.');
  window.CPTAgenda.init({call,esc,date,num,intro,toast,formLink,state,navigate,view:$('view')});
  const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  if(!window.CPTObras||!window.CPTInicio||!window.CPTRelatos)throw new Error('Componentes Inicio.html, Obras.html ou Relatos.html ausentes. Confira os arquivos da versão 2.48.1.');
  window.CPTInicio.init({call,esc,date,num,icon,formLink,state,visao,podeVer,view:$('view')});
  if(!window.CPTAtendimentos)throw new Error('Componente Atendimentos.html ausente. Confira os arquivos da versão 2.3.0.');
  window.CPTAtendimentos.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});
  if(!window.CPTGestao)throw new Error('Componente Gestao.html ausente. Confira os arquivos da versão 2.7.0.');
  window.CPTGestao.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,podeVer,view:$('view')});
  if(!window.CPTComunicacao||!window.CPTRecados)throw new Error('Componentes Comunicacao.html ou Recados.html ausentes. Confira os arquivos da versão 2.8.0.');
  window.CPTComunicacao.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});window.CPTRecados.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});
  if(!window.CPTEspaco)throw new Error('Componente MeuEspaco.html ausente. Confira os arquivos da versão 2.9.0.');window.CPTEspaco.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,podeVer,view:$('view')});
  if(window.CPTSaber)window.CPTSaber.init({call,esc,toast,intro,state,view:$('view')});
  if(window.CPTGraficos)window.CPTGraficos.init({toast,call,state});
  if(window.CPTDiagnosticos)window.CPTDiagnosticos.init({call,esc,num,toast,icon,state,view:$('view')});
  window.CPTRelatos.init({call,esc,date,num,intro,toast,icon,state,view:$('view'),renderRecords,monthLabel});
  if(window.CPTLevantamento)window.CPTLevantamento.init({call,esc,num,intro,toast,icon,state,view:$('view')});
  if(window.CPTOrganograma)window.CPTOrganograma.init({call,esc,toast,intro,state,view:$('view')});
  if(window.CPTVisual)window.CPTVisual.init();
  if(window.CPTJogos)window.CPTJogos.init({call,esc,toast});
  if(window.CPTPlacar)window.CPTPlacar.init({esc,num});
  if(window.CPTMapa)window.CPTMapa.init({call,esc,date,num,intro,toast,icon,norm,state,navigate,view:$('view')});
  // 2.32: campo obrigatório escondido em "Mais detalhes" abre o bloco para a pessoa ver o que falta.
  document.addEventListener('invalid',e=>{const d=e.target&&e.target.closest&&e.target.closest('details.mais-detalhes');if(d)d.open=true;},true);
  window.CPTObras.init({call,esc,date,num,intro,toast,icon,norm,state,navigate,view:$('view')});
  bootstrap();
})();
</script>
