<script>
/* Entregas do mês 2.15.0 — as 4 entregas (situação, responsável, prazo, versão e retrato), conferência da competência,
   base do relatório mensal e pacote de fichas oficiais (ANEXO 4) com .zip. */
window.CPTFechamento = (() => {
  'use strict';
  const ic = (n, e) => window.CPTic ? window.CPTic(n, e) : e; // ícone no visual novo, emoji no atual
  let ui = null, ticket = 0, operacao = null, gerando = false, entregas = null;
  const INTRO = ['Entregas do mês', 'Relatório, anexos, Programa Parceiros e atendimentos: o que falta, quem cuida e o prazo de cada um.'];
  const PASSOS = ['afazer', 'preparo', 'revisao', 'entregue'];
  const hoje = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
  const op = () => 'OP-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  const $ = id => document.getElementById(id);
  const rotulo = {ok: 'OK', atencao: 'Atenção', pendente: 'Pendente'};
  const cor = {ok: 'green', atencao: 'orange', pendente: 'orange'};

  async function render() {
    const mine = ++ticket, mes = ui.state.mes;
    ui.view.innerHTML = ui.intro(...INTRO) + '<div class="loading-label"><span class="spinner"></span>Conferindo a competência…</div><div class="skel-list" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';
    // Os cartões das entregas vêm num pedido à parte: aparecem assim que chegam, sem esperar a conferência.
    const pedidoEntregas = ui.call('carregarEntregasDoMesCPT', mes).then(r => { entregas = r; }, e => { entregas = {erro: e.message}; });
    try { const d = await ui.call('conferirFechamentoCPT', mes); if (mine !== ticket || ui.state.route !== 'fechamento') return; draw(d); }
    catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro(...INTRO) + `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    await pedidoEntregas; if (mine === ticket && ui.state.route === 'fechamento') desenharEntregas();
  }
  function numero(rot, valor, nota) { return `<div class="kpi" style="--accent:#12678f;--tint:#e6f1f7"><div class="kpi-top"><span>${rot}</span></div><div class="kpi-value">${ui.num(valor)}</div><div class="kpi-note">${nota}</div></div>`; }
  function draw(d) {
    const n = d.numeros, s = d.satisfacao;
    ui.view.innerHTML = ui.intro(...INTRO) +
      `<section id="entregasMes" class="entregas-mes" aria-label="As quatro entregas do mês"><div class="entrega-grid">${'<div class="skeleton entrega-skel"></div>'.repeat(4)}</div></section>
      <section class="kpis" aria-label="Números do mês">
        ${numero('Atividades', n.atividades, ui.num(n.participantes) + ' participações · ' + ui.num(n.frentes) + ' frentes')}
        ${numero('Relatos prontos', n.relatosProntos, 'de ' + ui.num(n.relatos) + ' relatos de atividade')}
        ${numero('Pesquisas de satisfação', n.satisfacao, 'meta de ' + s.meta + ' no mês')}
        ${numero('Manifestações', n.casosAbertos, 'em andamento · ' + ui.num(n.casosConcluidos) + ' concluídas no mês')}
      </section>
      <section class="panel"><div class="panel-head"><div><h2>O que conferir antes de gerar</h2><p>Itens “Pendente” afetam números do relatório; “Atenção” pede revisão.</p></div></div>
        <div class="fechamento-lista">${d.verificacoes.map(v => `<div class="fechamento-item"><span class="badge ${cor[v.situacao]}">${rotulo[v.situacao]}</span><div><strong>${ui.esc(v.nome)}</strong><p>${ui.esc(v.detalhe)}</p></div>${v.acao ? `<button class="button ghost" data-fechamento-ir='${ui.esc(JSON.stringify(v.acao))}'>Abrir ${ui.icon('arrow')}</button>` : '<span></span>'}</div>`).join('')}</div>
      </section>
      <section class="panel"><div class="panel-head"><div><h2>Pesquisa de satisfação por semana</h2><p>Meta de 15 por semana e 60 no mês, contadas separadamente. Semanas parciais estão marcadas.</p></div></div>
        <table class="simple-table"><thead><tr><th>Semana</th><th>Realizadas</th><th>Meta semanal</th></tr></thead><tbody>${s.semanas.map(w => `<tr><td>${ui.date(w.de)} a ${ui.date(w.ate)}${w.parcial ? ' (parcial)' : ''}</td><td>${w.total}</td><td>${w.total >= w.meta ? 'Atingida' : 'Faltam ' + (w.meta - w.total)}</td></tr>`).join('')}</tbody><tfoot><tr><th>Mês</th><th>${s.total}</th><th>${s.total >= s.meta ? 'Meta mensal atingida' : 'Faltam ' + (s.meta - s.total) + ' para 60'}</th></tr></tfoot></table>
      </section>
      <section class="panel" id="gerarRelatorio"><div class="panel-head"><div><h2>Gerar base do relatório</h2><p>Cria um Google Docs novo, no formato do Orientador (itens 1 a 13), e a planilha de manifestações. Nada é sobrescrito: cada geração é uma nova versão.</p></div></div>
        <form id="gerarForm" class="gerar-form"><label class="field">Número do relatório<input name="numero" type="number" min="1" max="999" value="${ui.esc(d.numeroSugerido || '')}" placeholder="Ex.: 15"><span class="small muted">Sugerido pela sequência (nº 14 = setembro/2026).</span></label>
        <button class="button" type="submit">Gerar base de ${ui.esc(monthName(d.mes))}</button></form>
        <p class="small muted">Leva de 1 a 4 minutos, conforme a quantidade de fotos. Textos que dependem de análise ficam marcados com [COMPLETAR] no documento.</p>
        <div id="gerarResultado" aria-live="polite"></div>
        ${d.historico.length ? `<h3 class="answers-head">Gerações deste mês</h3>${d.historico.map(h => `<p>Versão ${ui.esc(h.versao)} · ${new Date(h.em).toLocaleString('pt-BR', {dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo'})} · ${ui.esc(h.autor)} · <a href="${ui.esc(h.documento)}" target="_blank" rel="noopener noreferrer">Documento</a> · <a href="${ui.esc(h.planilha)}" target="_blank" rel="noopener noreferrer">Manifestações</a></p>`).join('')}` : ''}
      </section>
      <section class="panel" id="gerarFichas"><div class="panel-head"><div><h2>Fichas oficiais do mês (ANEXO 4)</h2><p>Gera no modelo Sabesp a ficha de cada caso em aberto no fim do mês e de cada caso concluído no mês, e junta os PDFs na pasta do mês. Fichas sem mudança não são refeitas.</p></div></div>
        <div class="dialog-actions"><button class="button secondary" id="pacoteFichas">${ui.icon('file')}Gerar fichas de ${ui.esc(monthName(d.mes))}</button></div><div id="pacoteResultado" aria-live="polite"></div>
      </section>`;
    $('pacoteFichas').onclick = ev => pacote(d.mes, ev.currentTarget, false);
    $('gerarForm').onsubmit = ev => { ev.preventDefault(); gerar(d.mes, ev.target); };
  }
  // ---------- Entregas do mês: 4 cartões ----------
  function desenharEntregas() {
    const box = $('entregasMes'); if (!box || !entregas) return;
    if (entregas.erro) { box.innerHTML = `<div class="notice">${ui.esc(entregas.erro)}</div>`; return; }
    const e = entregas, feitas = e.cartoes.filter(c => c.situacao === 'entregue').length;
    box.innerHTML = `<div class="entregas-topo"><h2>${feitas === 4 ? 'Tudo entregue em ' + ui.esc(monthName(e.mes)) + ' ' + ic('sparkle', '🎉') : ui.num(feitas) + ' de 4 entregas feitas'}</h2>
        <div class="entregas-barra" role="meter" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${feitas}" aria-label="${feitas} de 4 entregues"><span style="width:${feitas * 25}%"></span></div>
        ${e.podeAlterar ? '' : '<p class="small muted">Durante os testes, só a administração técnica altera as entregas. Você acompanha por aqui.</p>'}</div>
      <div class="entrega-grid">${e.cartoes.map(cartao).join('')}</div>`;
  }
  function cartao(c) {
    const e = entregas, nomes = e.nomes, i = PASSOS.indexOf(c.situacao), atrasada = c.situacao !== 'entregue' && c.prazo && c.prazo < hoje();
    const resp = e.pessoas.find(p => p.email === c.responsavel), a = c.arquivo;
    const ir = c.rota ? `<button class="button ghost" data-route="${ui.esc(c.rota)}">Abrir ${ui.icon('arrow')}</button>` : `<button class="button ghost" data-entrega-rolar="${c.tipo === 'relatorio' ? 'gerarRelatorio' : 'gerarFichas'}">Gerar aqui ↓</button>`;
    return `<article class="entrega-card s-${c.situacao}" data-entrega="${ui.esc(c.tipo)}"><div class="entrega-head"><h3>${ui.esc(c.titulo)}</h3><span class="badge ${c.situacao === 'entregue' ? 'green' : c.situacao === 'afazer' ? '' : 'orange'}">${ui.esc(nomes[c.situacao])}</span></div>
      <ol class="entrega-passos" aria-label="Etapas">${PASSOS.map((p, k) => `<li class="${k < i ? 'feito' : k === i ? 'atual' : ''}" title="${ui.esc(nomes[p])}"><span></span>${ui.esc(nomes[p])}</li>`).join('')}</ol>
      <p class="small muted">${ui.esc(c.texto)}</p>
      <p class="entrega-arquivo">${a ? `<a href="${ui.esc(a.url)}" target="_blank" rel="noopener noreferrer">${ui.icon('file')}${ui.esc(a.titulo)}</a>${a.zip ? ` · <a href="${ui.esc(a.zip.url)}" target="_blank" rel="noopener noreferrer">.zip das fichas</a>` : ''}` : '<span class="muted">Ainda não gerado neste mês.</span>'}</p>
      <dl class="entrega-meta"><div><dt>Responsável</dt><dd>${resp ? ui.esc(resp.nome) : '<span class="muted">Ninguém ainda</span>'}</dd></div><div><dt>Prazo</dt><dd class="${atrasada ? 'late-text' : ''}">${ui.date(c.prazo)}${atrasada ? ' · vencido' : ''}</dd></div>${c.entregas ? `<div><dt>Versão</dt><dd>v${c.entregas}</dd></div>` : ''}</dl>
      <div class="entrega-acoes">${ir}${c.tipo === 'atendimentos' && e.podeAlterar ? '<button class="button ghost" data-entrega-zip>Montar .zip</button>' : ''}${e.podeAlterar ? `<button class="button secondary" data-entrega-editar="${ui.esc(c.tipo)}">Atualizar</button>` : ''}</div>
      ${c.retratos.length ? `<details class="entrega-retratos"><summary>Entregas anteriores (${c.retratos.length})</summary><ul>${c.retratos.map(r => `<li>v${r.versao} · ${ui.date(r.em.slice(0, 10))} · ${ui.esc(r.por)}${r.copias.map(x => ` · <a href="${ui.esc(x.url)}" target="_blank" rel="noopener noreferrer">${ui.esc(x.titulo)}</a>`).join('')}${!r.copias.length ? ` · <a href="${ui.esc(r.origem.url)}" target="_blank" rel="noopener noreferrer">link</a>` : ''}</li>`).join('')}</ul></details>` : ''}</article>`;
  }
  function editarEntrega(tipo) {
    const c = entregas.cartoes.find(x => x.tipo === tipo), e = entregas, nomes = e.nomes;
    $('detailType').textContent = 'ENTREGA DO MÊS'; $('detailTitle').textContent = c.titulo;
    $('detailContent').innerHTML = `<form id="entregaForm"><div id="entregaErro" class="notice" hidden></div><div class="editor-grid">
      <label>Situação<select name="situacao">${PASSOS.map(p => `<option value="${p}" ${p === c.situacao ? 'selected' : ''} ${p === 'entregue' && !e.podeEntregar && c.situacao !== 'entregue' ? 'disabled' : ''}>${ui.esc(nomes[p])}</option>`).join('')}</select></label>
      <label>Responsável<select name="responsavel"><option value="">Ninguém ainda</option>${e.pessoas.map(p => `<option value="${ui.esc(p.email)}" ${p.email === c.responsavel ? 'selected' : ''}>${ui.esc(p.nome)}</option>`).join('')}</select></label>
      <label>Prazo<input type="date" name="prazo" value="${ui.esc(c.prazo)}"></label>
      <p class="small muted wide">Ao marcar <strong>Entregue</strong>, uma cópia do arquivo fica guardada na pasta do mês (Entregues). Gerar de novo depois não muda o que foi entregue.${c.tipo === 'atendimentos' ? ' Monte o .zip antes, para ele entrar no retrato.' : ''}</p>
      </div><div class="dialog-actions"><button class="button" type="submit">Salvar</button></div></form>`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
    $('entregaForm').onsubmit = async ev => {
      ev.preventDefault(); const f = new FormData(ev.target), b = ev.target.querySelector('button[type=submit]'), erro = $('entregaErro');
      b.disabled = true; b.textContent = 'Salvando…'; erro.hidden = true;
      try {
        const r = await ui.call('salvarEntregaDoMesCPT', {mes: e.mes, tipo, situacao: f.get('situacao'), responsavel: f.get('responsavel'), prazo: f.get('prazo'), versao: c.versao, operacaoId: op()});
        const k = e.cartoes.findIndex(x => x.tipo === tipo); e.cartoes[k] = r.cartao; $('detailDialog').close(); ui.toast(r.resultado); desenharEntregas();
        if (r.cartao.situacao === 'entregue' && c.situacao !== 'entregue') { const el = document.querySelector(`[data-entrega="${tipo}"]`); if (el) el.classList.add('acabou-de-entregar'); }
      } catch (err) { erro.textContent = err.message; erro.hidden = false; b.disabled = false; b.textContent = 'Salvar'; }
    };
  }
  /** Depois de gerar algo aqui embaixo, o cartão correspondente mostra o arquivo novo. */
  function recarregarEntregas() { if (!entregas || entregas.erro) return; ui.call('carregarEntregasDoMesCPT', entregas.mes).then(r => { entregas = r; desenharEntregas(); }, () => {}); }
  async function montarZip(b) {
    if (gerando) return; gerando = true; const rotulo = b.textContent; b.disabled = true; b.textContent = 'Montando .zip…';
    try { const r = await ui.call('zipFichasDoMesCPT', entregas.mes); ui.toast(r.resultado); entregas = await ui.call('carregarEntregasDoMesCPT', entregas.mes); desenharEntregas(); }
    catch (e) { ui.toast(e.message); b.disabled = false; b.textContent = rotulo; }
    finally { gerando = false; }
  }
  function monthName(m) { return new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}); }
  async function gerar(mes, form) {
    if (gerando) return; gerando = true;
    const b = form.querySelector('button'), box = $('gerarResultado'), numeroRel = form.elements.numero.value;
    if (!operacao || operacao.mes !== mes || operacao.numero !== numeroRel) operacao = {id: 'OP-' + crypto.randomUUID(), mes, numero: numeroRel};
    b.disabled = true; b.textContent = 'Gerando… não feche esta página';
    box.innerHTML = '<div class="loading-label"><span class="spinner"></span>Montando o documento e inserindo as fotos dos relatos preparados…</div>';
    try {
      const r = await ui.call('gerarBaseRelatorioCPT', {mes, numero: numeroRel, operacaoId: operacao.id});
      operacao = null; recarregarEntregas();
      box.innerHTML = `<div class="notice" role="status">${ui.esc(r.resultado)}</div><div class="dialog-actions"><a class="button" href="${ui.esc(r.documento)}" target="_blank" rel="noopener noreferrer">${ui.icon('file')}Abrir documento</a><a class="button secondary" href="${ui.esc(r.planilha)}" target="_blank" rel="noopener noreferrer">Abrir planilha de manifestações</a></div>${r.avisos && r.avisos.length ? `<details><summary>${r.avisos.length} avisos</summary><p>${r.avisos.map(ui.esc).join('<br>')}</p></details>` : ''}`;
    } catch (e) {
      box.innerHTML = `<div class="notice">${ui.esc(e.message)} Se o tempo esgotou, aguarde 2 minutos e reabra o fechamento: a geração pode ter sido concluída e aparecerá em “Gerações deste mês”.</div>`;
    } finally { gerando = false; b.disabled = false; b.textContent = 'Gerar base de ' + monthName(mes); }
  }
  async function pacote(mes, b, continuar) {
    if (gerando) return; gerando = true; const box = $('pacoteResultado'), rotulo = b.innerHTML;
    b.disabled = true; b.textContent = 'Gerando fichas… não feche esta página';
    box.innerHTML = '<div class="loading-label"><span class="spinner"></span>Preenchendo o modelo oficial e convertendo em PDF…</div>';
    try {
      const r = await ui.call('gerarPacoteFichasCPT', {mes, continuar}); recarregarEntregas();
      box.innerHTML = `<div class="notice" role="status">${ui.esc(r.resultado)} ${ui.num(r.prontas)} de ${ui.num(r.total)} prontas (${ui.num(r.novas)} geradas agora).</div>
        <div class="dialog-actions"><a class="button" href="${ui.esc(r.pasta)}" target="_blank" rel="noopener noreferrer">${ui.icon('file')}Abrir pasta das fichas</a>${r.pendentes ? '<button class="button secondary" id="pacoteContinuar">Continuar</button>' : ''}</div>
        ${r.erros.length ? `<details open><summary>${r.erros.length} ficha(s) a corrigir</summary><p>${r.erros.map(x => ui.esc(x.protocolo + ': ' + x.erro)).join('<br>')}</p></details>` : ''}`;
      const c = $('pacoteContinuar'); if (c) c.onclick = () => { gerando = false; pacote(mes, c, true); };
    } catch (e) { box.innerHTML = `<div class="notice">${ui.esc(e.message)} Clique de novo: as fichas já geradas não são refeitas.</div>`; }
    finally { gerando = false; b.disabled = false; b.innerHTML = rotulo; }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', ev => {
      const ed = ev.target.closest('[data-entrega-editar]'); if (ed) { editarEntrega(ed.dataset.entregaEditar); return; }
      const z = ev.target.closest('[data-entrega-zip]'); if (z) { montarZip(z); return; }
      const ro = ev.target.closest('[data-entrega-rolar]'); if (ro) { const alvo = $(ro.dataset.entregaRolar); if (alvo) alvo.scrollIntoView({behavior: document.documentElement.dataset.motion === 'reduce' ? 'auto' : 'smooth', block: 'start'}); return; }
      const ir = ev.target.closest('[data-fechamento-ir]'); if (!ir) return;
      const a = JSON.parse(ir.dataset.fechamentoIr);
      if (a.route === 'registros') ui.state.filters = {busca: '', procedimento: a.procedimento || '', bairro: '', obra: '', pendencia: a.pendencia || ''};
      ui.navigate(a.route);
    });
  }
  return {init, render};
})();
</script>
