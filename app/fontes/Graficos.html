<script>
/* CPTGraficos 2.35.0 — "Copiar imagem" e "Copiar tabela" em todos os gráficos.
   Cada gráfico da tela registra os seus números (CPTGraficos.acoes(dados)) e ganha os dois botões.
   A imagem é desenhada de novo a partir dos números, sempre em fundo claro e em resolução dobrada, com título, mês e fonte:
   fica igual no tema claro ou escuro e cola bem em e-mail, WhatsApp e documentos. Se o navegador não deixar copiar,
   a imagem é baixada. A tabela vai como texto com tabulação e como tabela HTML (cola certinho no Planilhas, Excel e Docs).
   dados: {titulo, subtitulo, fonte?, tipo: 'colunas'|'barras', rotulos: [...], series: [{nome, valores: [...]}], sufixo?, max?,
           eixo?: índices de rótulo mostrados (colunas), tabela?: {cab: [...], linhas: [[...]]}, id?: chave do gráfico, mes?: AAAA-MM}
   2.45: comentários da gestão embaixo de cada gráfico (o que significa, para todos os meses, ou a justificativa do mês).
   Gestão e Administrativo escrevem ("Comentar"); todos leem; o comentário também vai na imagem copiada. */
window.CPTGraficos = (() => {
  let ui = null, seq = 0, notas = null, carregando = false;
  const reg = new Map(), LIMITE = 120;
  // Cores da imagem (fundo claro). Duas séries: azul e laranja, conferidas para daltonismo (validador de paleta).
  const COR = {fundo: '#fffdf8', tinta: '#1f2a26', suave: '#5d6b64', grade: '#e7e2d8', uma: '#2c8669', duas: ['#2672ac', '#c0712f']};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  const fmt = (v, d) => v == null || v === '' ? '—' : new Intl.NumberFormat('pt-BR').format(v) + (d.sufixo || '');
  const slug = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'grafico';
  const mesTexto = m => new Date(m + '-15T12:00:00Z').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric', timeZone: 'UTC'});
  /** Botões para colocar logo abaixo do gráfico, e os comentários da gestão. */
  function acoes(dados) {
    const id = 'g' + (++seq); reg.set(id, dados); if (reg.size > LIMITE) reg.delete(reg.keys().next().value);
    dados.chave = dados.id || slug(dados.titulo); dados.mesNota = dados.mes || (ui && ui.state && ui.state.mes) || '';
    if (!notas) carregarNotas();
    return `<div class="graf-acoes" role="group" aria-label="Levar o gráfico ${esc(dados.titulo)}"><button type="button" class="link-button" data-graf-img="${id}">Copiar imagem</button><span aria-hidden="true">·</span><button type="button" class="link-button" data-graf-tab="${id}">Copiar tabela</button>
      <div class="graf-notas" data-graf-notas="${esc(dados.chave)}" data-graf-mes="${esc(dados.mesNota)}">${htmlNotas(dados.chave, dados.mesNota)}</div></div>`;
  }
  // ---------- Comentários ----------
  const notasDe = (chave, mes) => notas ? notas.lista.filter(n => n.grafico === chave && (!n.mes || n.mes === mes)).sort((a, b) => (a.mes ? 1 : 0) - (b.mes ? 1 : 0)) : [];
  function htmlNotas(chave, mes) {
    if (!notas) return '';
    const l = notasDe(chave, mes).map(n => `<div class="graf-nota${n.mes ? ' is-mes' : ''}"><p>${esc(n.texto)}</p><small>${esc(n.nome)} · ${n.mes ? 'só em ' + esc(mesTexto(n.mes)) : 'vale para todos os meses'}</small></div>`).join('');
    return l + (notas.pode ? `<button type="button" class="link-button graf-comentar" data-graf-comentar="${esc(chave)}" data-mes="${esc(mes)}">${l ? 'Editar comentário' : 'Comentar'}</button>` : '');
  }
  function preencher(chave) {
    document.querySelectorAll('[data-graf-notas]').forEach(el => { if (!chave || el.dataset.grafNotas === chave) el.innerHTML = htmlNotas(el.dataset.grafNotas, el.dataset.grafMes); });
  }
  async function carregarNotas() {
    if (carregando || !ui || !ui.call) return; carregando = true;
    try { const r = await ui.call('listarNotasGraficosCPT'); notas = {lista: r.notas || [], pode: !!r.podeEditar}; preencher(); }
    catch (_) { notas = {lista: [], pode: false}; } finally { carregando = false; }
  }
  function formNota(btn) {
    const chave = btn.dataset.grafComentar, mes = btn.dataset.mes, box = btn.closest('[data-graf-notas]'), achar = m => notas.lista.find(n => n.grafico === chave && n.mes === m);
    const inicial = achar(mes) ? mes : achar('') ? '' : mes, txt = m => (achar(m) || {}).texto || '';
    box.innerHTML = `<form class="graf-nota-form" data-chave="${esc(chave)}" data-mes="${esc(mes)}"><fieldset class="graf-escopo"><legend class="sr-only">Vale para</legend>
        ${mes ? `<label><input type="radio" name="escopo" value="${esc(mes)}" ${inicial === mes ? 'checked' : ''}> Só em ${esc(mesTexto(mes))}</label>` : ''}<label><input type="radio" name="escopo" value="" ${inicial === '' ? 'checked' : ''}> Todos os meses (o que o gráfico mostra)</label></fieldset>
      <textarea name="texto" rows="2" maxlength="600" placeholder="Ex.: julho ficou baixo porque a obra esteve paralisada.">${esc(txt(inicial))}</textarea>
      <div class="graf-nota-botoes"><button type="submit" class="button">Salvar</button><button type="button" class="button ghost" data-graf-cancelar>Cancelar</button></div></form>`;
    const f = box.querySelector('form'); f.texto.focus();
    f.addEventListener('change', e => { if (e.target.name === 'escopo') f.texto.value = txt(e.target.value); });
  }
  async function salvarNota(f) {
    const chave = f.dataset.chave, mes = f.elements.escopo.value, texto = f.elements.texto.value.trim(), b = f.querySelector('[type=submit]'); b.disabled = true;
    try {
      const r = await ui.call('salvarNotaGraficoCPT', {grafico: chave, mes, texto, operacaoId: 'OP-' + crypto.randomUUID()});
      notas.lista = notas.lista.filter(n => !(n.grafico === chave && n.mes === mes)); if (r.nota.texto) notas.lista.push(r.nota);
      ui.toast(r.resultado); preencher(chave);
    } catch (e) { ui.toast(e.message); b.disabled = false; }
  }
  function tabela(d) {
    if (d.tabela) return d.tabela;
    return {cab: [d.rotuloTabela || '', ...d.series.map(s => s.nome)], linhas: d.rotulos.map((r, i) => [r, ...d.series.map(s => s.valores[i] == null ? '' : s.valores[i] + (d.sufixo || ''))])};
  }
  const nomeArquivo = d => (d.titulo + ' ' + (d.subtitulo || '')).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '').slice(0, 60) || 'grafico';
  function baixar(blob, nome) { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = nome; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500); }

  // ---------- Desenho da imagem ----------
  function texto(c, t, x, y, o) { c.font = (o.peso || 400) + ' ' + (o.tam || 13) + 'px ' + o.fam; c.fillStyle = o.cor || COR.tinta; c.textAlign = o.al || 'left'; c.textBaseline = o.base || 'alphabetic'; c.fillText(t, x, y); }
  function cortar(c, t, larg) { if (c.measureText(t).width <= larg) return t; while (t.length > 1 && c.measureText(t + '…').width > larg) t = t.slice(0, -1); return t + '…'; }
  function topoArredondado(c, x, y, w, h, r) { r = Math.min(r, w / 2, h); c.beginPath(); c.moveTo(x, y + h); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h); c.closePath(); c.fill(); }
  function fimArredondado(c, x, y, w, h, r) { r = Math.min(r, h / 2, w); c.beginPath(); c.moveTo(x, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x, y + h); c.closePath(); c.fill(); }
  function desenhar(d) {
    const fam = (getComputedStyle(document.body).fontFamily || 'sans-serif'), W = 960, n = d.rotulos.length, multi = d.series.length > 1;
    // 2.45: comentários da gestão (gerais e do mês) entram no rodapé da imagem.
    const medir = document.createElement('canvas').getContext('2d'); medir.font = 'italic 400 13px ' + fam;
    const quebrar = t => { const out = []; let l = ''; String(t).split(/\s+/).forEach(p => { const x = l ? l + ' ' + p : p; if (medir.measureText(x).width > W - 64 && l) { out.push(l); l = p; } else l = x; }); if (l) out.push(l); return out; };
    const comentarios = notasDe(d.chave, d.mesNota).flatMap(nt => quebrar('Nota: ' + nt.texto));
    const H = (d.tipo === 'barras' ? 150 + n * 36 + (multi ? 26 : 0) : 470) + (comentarios.length ? comentarios.length * 18 + 12 : 0);
    const cv = document.createElement('canvas'), k = 2; cv.width = W * k; cv.height = H * k; const c = cv.getContext('2d'); c.scale(k, k);
    c.fillStyle = COR.fundo; c.fillRect(0, 0, W, H);
    texto(c, d.titulo, 32, 46, {fam, tam: 22, peso: 700}); if (d.subtitulo) texto(c, d.subtitulo, 32, 72, {fam, tam: 14, cor: COR.suave});
    const cores = multi ? COR.duas : [COR.uma];
    let topo = 96;
    if (multi) { let x = 32; d.series.forEach((s, j) => { c.fillStyle = cores[j % cores.length]; c.fillRect(x, topo - 10, 12, 12); texto(c, s.nome, x + 18, topo, {fam, tam: 13, cor: COR.suave}); c.font = '400 13px ' + fam; x += 18 + c.measureText(s.nome).width + 22; }); topo += 22; }
    const todos = d.series.flatMap(s => s.valores).filter(v => v != null), max = d.max || Math.max(1, ...todos);
    if (d.tipo === 'barras') {
      const xRot = 32, larRot = 300, x0 = xRot + larRot + 12, x1 = W - 110, alt = multi ? 12 : 18, passo = 36;
      d.rotulos.forEach((r, i) => {
        const yc = topo + 18 + i * passo; c.font = '400 14px ' + fam; texto(c, cortar(c, String(r), larRot), xRot, yc + 5, {fam, tam: 14});
        c.fillStyle = COR.grade; c.fillRect(x0, yc - alt / 2 - (multi ? alt / 2 + 1 : 0), x1 - x0, multi ? alt * 2 + 2 : alt);
        d.series.forEach((s, j) => { const v = s.valores[i] || 0, w = Math.max(v ? 3 : 0, (x1 - x0) * v / max), y = multi ? yc - alt - 1 + j * (alt + 2) : yc - alt / 2; c.fillStyle = cores[j % cores.length]; if (w) fimArredondado(c, x0, y, w, alt, 4); });
        texto(c, d.series.map(s => fmt(s.valores[i], d)).join(' · '), W - 32, yc + 5, {fam, tam: 14, peso: 700, al: 'right'});
      });
    } else {
      const x0 = 70, x1 = W - 32, base = H - 74, alto = base - topo - 28, passo = (x1 - x0) / n, gw = Math.min(56, passo * 0.7), bw = (gw - (d.series.length - 1) * 2) / d.series.length;
      const marcas = max <= 4 ? [0, max] : [0, Math.round(max / 2), max];
      marcas.forEach(m => { const y = base - m / max * alto; c.fillStyle = COR.grade; c.fillRect(x0, y, x1 - x0, 1); texto(c, fmt(m, d), x0 - 8, y + 4, {fam, tam: 12, cor: COR.suave, al: 'right'}); });
      const eixo = new Set(d.eixo || (n <= 12 ? d.rotulos.map((_, i) => i) : [0, 7, 14, 21, n - 1]));
      const rotularValor = n <= 12, iMax = d.series[0].valores.indexOf(Math.max(...d.series[0].valores.map(v => v || 0)));
      d.rotulos.forEach((r, i) => {
        const gx = x0 + i * passo + (passo - gw) / 2;
        d.series.forEach((s, j) => { const v = s.valores[i] || 0, h = v / max * alto, x = gx + j * (bw + 2); c.fillStyle = cores[j % cores.length]; if (h) topoArredondado(c, x, base - h, bw, h, 4);
          if (v && (rotularValor || (!multi && i === iMax))) texto(c, fmt(v, d), x + bw / 2, base - h - 6, {fam, tam: 12, peso: 700, al: 'center'}); });
        if (eixo.has(i)) texto(c, String(r), x0 + i * passo + passo / 2, base + 20, {fam, tam: 12, cor: COR.suave, al: 'center'});
      });
      c.fillStyle = '#b9b2a6'; c.fillRect(x0, base, x1 - x0, 1);
    }
    const hoje = new Date().toLocaleDateString('pt-BR', {timeZone: 'America/Sao_Paulo'});
    comentarios.forEach((l, i) => texto(c, l, 32, H - 46 - (comentarios.length - 1 - i) * 18, {fam, tam: 13, cor: COR.tinta}));
    texto(c, 'Fonte: ' + (d.fonte || 'Aplicação CPT · registros do Campo 4.0') + ' · gerado em ' + hoje, 32, H - 22, {fam, tam: 12, cor: COR.suave});
    return cv;
  }

  // ---------- Copiar ----------
  async function copiarImagem(d) {
    const cv = desenhar(d), blob = new Promise(r => cv.toBlob(r, 'image/png'));
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('sem área de transferência');
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      ui.toast('Imagem copiada. Cole no e-mail, no WhatsApp ou no documento.');
    } catch (_) { baixar(await blob, nomeArquivo(d) + '.png'); ui.toast('O navegador não deixou copiar: a imagem foi baixada.'); }
  }
  async function copiarTabela(d) {
    const t = tabela(d), tsv = [t.cab].concat(t.linhas).map(l => l.map(v => String(v == null ? '' : v).replace(/[\t\n]+/g, ' ')).join('\t')).join('\n');
    const html = `<table><caption>${esc(d.titulo + (d.subtitulo ? ' · ' + d.subtitulo : ''))}</caption><thead><tr>${t.cab.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${t.linhas.map(l => `<tr>${l.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    try {
      if (!navigator.clipboard) throw new Error('sem área de transferência');
      if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({'text/plain': new Blob([tsv], {type: 'text/plain'}), 'text/html': new Blob([html], {type: 'text/html'})})]);
      else await navigator.clipboard.writeText(tsv);
      ui.toast('Tabela copiada. Cole na planilha ou no documento.'); return;
    } catch (_) {}
    // Plano B (navegador sem permissão de área de transferência): cópia clássica de texto.
    const ta = document.createElement('textarea'); ta.value = tsv; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) { ok = false; } ta.remove();
    if (ok) ui.toast('Tabela copiada. Cole na planilha ou no documento.');
    else { baixar(new Blob(['﻿' + tsv.replace(/\t/g, ';')], {type: 'text/csv;charset=utf-8'}), nomeArquivo(d) + '.csv'); ui.toast('O navegador não deixou copiar: a tabela foi baixada (.csv).'); }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      const cm = e.target.closest('[data-graf-comentar]'); if (cm && notas && notas.pode) { formNota(cm); return; }
      const cc = e.target.closest('[data-graf-cancelar]'); if (cc) { const box = cc.closest('[data-graf-notas]'); box.innerHTML = htmlNotas(box.dataset.grafNotas, box.dataset.grafMes); return; }
      const b = e.target.closest('[data-graf-img],[data-graf-tab]'); if (!b) return;
      const d = reg.get(b.dataset.grafImg || b.dataset.grafTab); if (!d) { ui.toast('Atualize a página para copiar este gráfico.'); return; }
      if (b.dataset.grafImg) copiarImagem(d); else copiarTabela(d);
    });
  }
  document.addEventListener('submit', e => { const f = e.target.closest('.graf-nota-form'); if (f) { e.preventDefault(); salvarNota(f); } });
  return {init, acoes, desenhar, tabela};
})();
</script>
