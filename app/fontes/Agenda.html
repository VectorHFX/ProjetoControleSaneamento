<script>
window.CPTAgenda=(()=>{
  let ui,agenda=null,ticket=0,mode='mes',day='',filter={frente:'',natureza:'',responsavel:'',busca:'',cancelados:false},selected=new Set(),editing=null,saving=false;
  const names={administrador:'Administração técnica',administrativo:'Administrativo',gestao:'Gestão',atendimento:'Atendimento',socioambiental:'Socioambiental',comunicacao:'Comunicação',comercializacao:'Comercialização'};
  const status={planejada:'Planejada',confirmada:'Confirmada',concluida:'Concluída',cancelada:'Cancelada'};
  const $=id=>document.getElementById(id),esc=v=>ui.esc(v),date=v=>ui.date(v),op=()=> 'OP-'+crypto.randomUUID();
  /* 2.28: feriados calculados aqui (sem ler agenda externa): nacionais, estadual de SP e municipais de Santo André.
     Santo André: 8/4 (Lei 4.148/1973) e Corpus Christi (Decreto 16.465/2013). Carnaval é ponto facultativo. */
  const FIXOS=[['01-01','Confraternização Universal','nacional'],['04-08','Aniversário de Santo André','municipal'],['04-21','Tiradentes','nacional'],['05-01','Dia do Trabalho','nacional'],['07-09','Revolução Constitucionalista','estadual'],['09-07','Independência do Brasil','nacional'],['10-12','Nossa Senhora Aparecida','nacional'],['11-02','Finados','nacional'],['11-15','Proclamação da República','nacional'],['11-20','Consciência Negra','nacional'],['12-25','Natal','nacional']];
  const TIPO_FERIADO={nacional:'Feriado nacional',estadual:'Feriado estadual (SP)',municipal:'Feriado municipal (Santo André)',facultativo:'Ponto facultativo'};
  function pascoa(ano){const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return Date.UTC(ano,mes-1,dia);}
  const memoFeriados={};
  /** Feriados do ano: {'2026-10-12': {nome, tipo}}. */
  function feriados(ano){ano=Number(ano);if(memoFeriados[ano])return memoFeriados[ano];const r={},iso=t=>new Date(t).toISOString().slice(0,10),p=pascoa(ano),dia=864e5;
    FIXOS.forEach(([md,nome,tipo])=>{r[ano+'-'+md]={nome,tipo};});
    [[-48,'Carnaval','facultativo'],[-47,'Carnaval','facultativo'],[-2,'Sexta-feira Santa','nacional'],[60,'Corpus Christi','municipal']].forEach(([n,nome,tipo])=>{r[iso(p+n*dia)]={nome,tipo};});
    return memoFeriados[ano]=r;}
  const feriado=d=>d?feriados(d.slice(0,4))[d]:null;
  const FRENTES=['atendimento','socioambiental','comunicacao','comercializacao','gestao','administrativo'];
  /** Nomes curtos para o cartão: "Victor, Andreia, Carlos +5" (a lista inteira fica na dica e no detalhe). */
  function pessoasCurto(e){const l=pessoas(e).split(', ').filter(Boolean).map(n=>n.split(' ')[0]);return l.length>3?l.slice(0,3).join(', ')+' +'+(l.length-3):l.join(', ');}
  const hojeISO=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo'}).format(new Date());
  const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const diaSemana=d=>SEMANA[new Date(d+'T12:00:00Z').getUTCDay()];
  const mesExtenso=m=>new Date(m+'-01T12:00:00Z').toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});
  /** 2.29: o Cronograma fica dentro da Visão do mês (abas no topo). */
  const abasMes=()=>window.CPTGestao&&window.CPTGestao.abas?window.CPTGestao.abas('cronograma'):'';
  function pessoas(e){return e.responsavelNome||e.responsaveis.map(email=>agenda?.pessoas.find(p=>p.email===email)?.nome||email).join(', ');}
  async function render(){const current=++ticket;ui.view.innerHTML=abasMes()+ui.intro('Cronograma compartilhado','Uma atividade, todos os responsáveis. Planeje, acompanhe e selecione o que vai exportar.')+'<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Carregando o cronograma…</div><div class="skel-list" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';try{agenda=await ui.call('carregarCronogramaCPT',{mes:ui.state.mes});if(current!==ticket||ui.state.route!=='cronograma')return;day=day.startsWith(ui.state.mes)?day:ui.state.mes+'-01';selected=new Set();draw();}catch(e){if(current===ticket&&ui.state.route==='cronograma')ui.view.innerHTML=abasMes()+ui.intro('Cronograma compartilhado','Planejamento em equipe.')+'<div class="notice">'+esc(e.message)+'</div><button class="button" data-agenda-action="reload">Tentar novamente</button>';}}
  function visible(){return agenda.itens.filter(e=>(filter.cancelados||e.status!=='cancelada')&&(!filter.frente||e.frentes.includes(filter.frente))&&(!filter.natureza||e.natureza===filter.natureza)&&(!filter.responsavel||(filter.responsavel==='me'?e.responsaveis.includes(agenda.perfil.email):e.responsaveis.includes(filter.responsavel)))&&(!filter.busca||[e.titulo,e.obra,e.bairro,pessoas(e)].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(filter.busca.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase())));}
  function options(arr,current,all){return `<option value="">${all}</option>`+arr.map(([v,t])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(t)}</option>`).join('');}
  function draw(){ui.view.innerHTML=abasMes()+ui.intro('Cronograma compartilhado','Planeje com a equipe. Escolha as atividades antes de exportar.')+`<section class="panel agenda-controls"><div class="agenda-toolbar"><div class="segmented" aria-label="Visualização">${[['mes','Mês'],['semana','Semana'],['lista','Lista']].map(([v,t])=>`<button data-agenda-mode="${v}" class="${mode===v?'chosen':''}" aria-pressed="${mode===v}">${t}</button>`).join('')}</div><div class="agenda-actions"><button class="button secondary" data-agenda-action="export">Exportar seleção <span id="selectionCount">(${selected.size})</span></button><button class="button" data-agenda-action="new">+ Nova atividade</button></div></div><form id="agendaFilters" class="agenda-filters"><label>Frente<select name="frente">${options(['atendimento','socioambiental','comunicacao','comercializacao','gestao','administrativo'].map(x=>[x,names[x]]),filter.frente,'Todas as frentes')}</select></label><label>O que mostrar<select name="natureza">${options([['interno','Interno'],['externo','Externo']],filter.natureza,'Interno e externo')}</select></label><label>Responsável<select name="responsavel">${options([['me','Meus compromissos'],...agenda.pessoas.map(p=>[p.email,p.nome])],filter.responsavel,'Toda a equipe')}</select></label><label>Localizar<input name="busca" value="${esc(filter.busca)}" placeholder="Atividade, obra ou bairro"></label></form><div class="selection-bar"><label><input type="checkbox" id="includeCanceled" ${filter.cancelados?'checked':''}> Incluir canceladas</label><span><button class="text-button" data-agenda-action="select">Selecionar filtradas</button> · <button class="text-button" data-agenda-action="clear">Limpar seleção</button></span></div></section><div id="agendaSurface"></div><p class="small muted">Datas e horários de Brasília. A seleção de exportação segue os filtros.</p>`;
    const form=$('agendaFilters');form.addEventListener('submit',e=>e.preventDefault());form.addEventListener('change',()=>{Object.assign(filter,Object.fromEntries(new FormData(form)));selected.clear();drawSurface();});let debounce;form.elements.busca.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{if(ui.state.route!=='cronograma')return;filter.busca=form.elements.busca.value;selected.clear();drawSurface();},250);});$('includeCanceled').onchange=e=>{filter.cancelados=e.target.checked;selected.clear();drawSurface();};drawSurface();}
  function chip(e){return `<div class="calendar-event st-${esc(e.status)} ${e.status==='cancelada'?'canceled':''}" style="--event-color:var(--front-${esc(e.frentes[0]||'administrativo')})"><label class="event-check"><input type="checkbox" data-agenda-select="${esc(e.id)}" ${selected.has(e.id)?'checked':''} aria-label="Selecionar ${esc(e.titulo)} para exportação"></label><button data-agenda-id="${esc(e.id)}" title="${esc(e.titulo+' · '+pessoas(e))}"><small><span class="event-fronts">${e.frentes.map(f=>`<i class="front-dot f-${esc(f)}" style="background:var(--front-${esc(f)})"></i>`).join('')}</span>${e.inicio||'Dia todo'} · ${status[e.status]}</small><strong>${esc(e.titulo)}</strong><span>${esc(pessoasCurto(e))}</span></button></div>`;}
  function drawSurface(){const rows=visible();const valid=new Set(rows.map(x=>x.id));selected=new Set([...selected].filter(id=>valid.has(id)));$('selectionCount').textContent='('+selected.size+')';let html='';if(mode==='lista'){const fer=Object.entries(feriados(ui.state.mes.slice(0,4))).filter(([d])=>d.startsWith(ui.state.mes)).map(([data,f])=>({feriado:true,data,...f})),itens=rows.concat(fer).sort((a,b)=>(a.data+(a.feriado?'':'1'+(a.inicio||''))).localeCompare(b.data+(b.feriado?'':'1'+(b.inicio||''))));
      html=`<div class="agenda-list">${rows.length?itens.map(e=>e.feriado?`<section class="agenda-list-row is-holiday"><div class="list-day">${date(e.data)}</div><p class="holiday-tag"><strong>${esc(e.nome)}</strong> · ${esc(TIPO_FERIADO[e.tipo])}</p></section>`:`<section class="agenda-list-row"><div class="list-day">${date(e.data)}</div>${chip(e)}<span class="tag ${e.natureza}">${e.natureza==='interno'?'Interno':'Externo'}</span><span class="small">${esc(e.obra||e.bairro||'Local não informado')}</span></section>`).join(''):'<div class="panel empty">Nenhuma atividade com estes filtros. Use “Nova atividade” para começar.</div>'}</div>`;}else{const first=ui.state.mes+'-01',last=new Date(Number(first.slice(0,4)),Number(first.slice(5,7)),0).getDate(),shift=(new Date(first+'T12:00:00Z').getUTCDay()+6)%7;let days=[];if(mode==='mes'){days=Array(shift).fill(null).concat(Array.from({length:last},(_,i)=>ui.state.mes+'-'+String(i+1).padStart(2,'0')));while(days.length%7)days.push(null);}else{const sel=new Date(day+'T12:00:00Z'),offset=(sel.getUTCDay()+6)%7;days=Array.from({length:7},(_,i)=>{const d=new Date(sel);d.setUTCDate(d.getUTCDate()-offset+i);return d.toISOString().slice(0,10);});html+=`<div class="week-picker"><label>Semana de <input id="weekDay" type="date" value="${day}" min="${first}" max="${ui.state.mes}-${last}"></label><p class="small muted">Os dias fora da competência escolhida ficam indisponíveis.</p></div>`;}
    html+=`<div class="calendar-scroll"><div class="calendar-grid ${mode==='semana'?'week':''}">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="weekday">${x}</div>`).join('')}${days.map((d,i)=>{const fds=i%7>4;if(!d||!d.startsWith(ui.state.mes))return `<div class="calendar-cell outside${fds?' weekend':''}"></div>`;const f=feriado(d);return `<section class="calendar-cell${fds?' weekend':''}${f?' holiday':''}${d===hojeISO()?' today':''}"><button class="day-number" data-agenda-newdate="${d}" aria-label="Adicionar atividade em ${date(d)}">${Number(d.slice(8))}<span>+</span></button>${f?`<p class="holiday-tag" title="${esc(TIPO_FERIADO[f.tipo])}">${esc(f.nome)}</p>`:''}${rows.filter(e=>e.data===d).map(chip).join('')}</section>`;}).join('')}</div></div><p class="small mobile-calendar-tip">Deslize o calendário para os lados ou use Lista para uma leitura mais compacta.</p>`;}
    $('agendaSurface').innerHTML=html;if($('weekDay'))$('weekDay').onchange=e=>{if(e.target.value.startsWith(ui.state.mes)){day=e.target.value;drawSurface();}};}
  function modal(title,content){$('detailType').textContent='PLANEJAMENTO';$('detailTitle').textContent=title;$('detailContent').innerHTML=content;if(!$('detailDialog').open)$('detailDialog').showModal();}
  function errorInModal(e){const target=$('agendaError');if(target){target.textContent=e.message;target.hidden=false;}else ui.toast(e.message);}
  function open(id){const e=agenda?.itens.find(x=>x.id===id);if(!e)return;editing=e;modal(e.titulo,`<div class="event-overview"><span class="tag ${e.natureza}">${e.natureza==='interno'?'Interno':'Externo'}</span><span class="badge">${status[e.status]}</span></div><dl class="detail-summary"><div><dt>Quando</dt><dd>${date(e.data)} · ${e.inicio?e.inicio+' às '+e.fim:'Dia todo'}</dd></div><div><dt>Responsáveis</dt><dd>${esc(pessoas(e))}</dd></div><div><dt>Frentes</dt><dd>${e.frentes.map(x=>names[x]).join(', ')}</dd></div><div><dt>Obra e bairro</dt><dd>${esc([e.obra,e.bairro].filter(Boolean).join(' · ')||'Não informado')}</dd></div></dl><section class="answer"><h3>Sobre a atividade</h3><p>${esc(e.descricao||'Sem descrição adicional.')}</p></section><p class="small muted">Versão ${e.versao} · alterada por ${esc(e.alteradoPor)}</p><div class="dialog-actions">${e.podeEditar?'<button class="button" data-agenda-action="edit">Editar atividade</button><button class="button secondary" data-agenda-action="reschedule">Reagendar</button><button class="button secondary" data-agenda-action="cancel">Cancelar atividade</button>':''}<button class="button secondary" data-agenda-action="history">Ver histórico</button></div><div id="eventHistory"></div>`);}
  function editor(event=null,newdate=''){if(!agenda){ui.toast('Abra o cronograma primeiro.');return;}const me=agenda.perfil,role=$('roleView').value,e=event||{id:'',versao:0,data:newdate||day||ui.state.mes+'-01',titulo:'',inicio:'',fim:'',descricao:'',obra:'',bairro:'',frentes:[['administrador','gestao'].includes(role)?'administrativo':role],responsaveis:[me.email],natureza:'externo',status:'planejada'};editing=e;const request=op();modal(e.id?'Editar atividade':'Nova atividade',`<form id="eventForm"><div id="agendaError" class="notice" role="alert" hidden></div><div class="editor-grid"><label class="wide">O que será feito?<input name="titulo" required maxlength="140" value="${esc(e.titulo)}" placeholder="Ex.: sensibilização com moradores"></label><label>Data<input type="date" name="data" required value="${e.data}"></label><label class="check-inline dia-todo"><input type="checkbox" name="diaTodo" ${e.inicio?'':'checked'}> Dia todo</label><label class="hora" ${e.inicio?'':'hidden'}>Início<input type="time" name="inicio" value="${e.inicio}"></label><label class="hora" ${e.inicio?'':'hidden'}>Fim<input type="time" name="fim" value="${e.fim}"></label><fieldset class="wide"><legend>Frentes envolvidas</legend><div class="check-options">${['atendimento','socioambiental','comunicacao','comercializacao','gestao','administrativo'].map(x=>`<label><input type="checkbox" name="frentes" value="${x}" ${e.frentes.includes(x)?'checked':''}> ${names[x]}</label>`).join('')}</div></fieldset><fieldset class="wide"><legend>Quem participa?</legend><div class="check-options">${agenda.pessoas.map(p=>`<label><input type="checkbox" name="responsaveis" value="${esc(p.email)}" ${e.responsaveis.includes(p.email)?'checked':''}> ${esc(p.nome)}</label>`).join('')}</div></fieldset>${e.id?`<label class="wide">Motivo da alteração<textarea name="motivo" rows="2" maxlength="600" placeholder="Explique reagendamentos e cancelamentos; fica no histórico."></textarea></label>`:''}<details class="mais-detalhes" ${e.id&&(e.obra||e.bairro||e.descricao||e.natureza==='interno'||e.status!=='planejada')?'open':''}><summary>Mais detalhes <small>interno ou externo, situação, obra, bairro e descrição</small></summary><div class="mais-detalhes-corpo"><label>Classificação<select name="natureza"><option value="externo" ${e.natureza==='externo'?'selected':''}>Externo</option><option value="interno" ${e.natureza==='interno'?'selected':''}>Interno</option></select></label><label>Situação<select name="status">${Object.entries(status).filter(([v])=>e.id||v!=='cancelada').map(([v,t])=>`<option value="${v}" ${e.status===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Obra de referência<input name="obra" maxlength="200" list="eventWorks" value="${esc(e.obra)}"><datalist id="eventWorks">${(ui.state.home?.filtros?.obras||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label>Bairro<input name="bairro" maxlength="150" value="${esc(e.bairro)}"></label><label class="wide">Descrição<textarea name="descricao" rows="3" maxlength="2500" placeholder="Local de encontro, materiais e orientações">${esc(e.descricao)}</textarea></label></div></details></div><div class="dialog-actions"><button class="button" id="saveEvent" type="submit">Salvar no cronograma</button><button class="button secondary" type="button" data-agenda-action="close">Voltar</button></div><p class="small muted">Ao salvar, a atividade fica visível para a equipe autorizada. Para retirar do planejamento, altere a situação para Cancelada.</p></form>`);
    {const fm=$('eventForm');fm.elements.diaTodo.onchange=()=>{fm.querySelectorAll('.hora').forEach(l=>{l.hidden=fm.elements.diaTodo.checked;});if(!fm.elements.diaTodo.checked&&!fm.elements.inicio.value)fm.elements.inicio.focus();};}
    $('eventForm').onsubmit=async ev=>{ev.preventDefault();if(saving)return;const data=new FormData(ev.target),payload={...Object.fromEntries(data),frentes:data.getAll('frentes'),responsaveis:data.getAll('responsaveis'),id:e.id,versao:e.versao,operacaoId:request};if(payload.diaTodo){payload.inicio='';payload.fim='';}delete payload.diaTodo;saving=true;$('saveEvent').disabled=true;$('saveEvent').textContent='Salvando…';try{const r=await ui.call('salvarAtividadeCPT',payload);ui.toast(r.resultado);$('detailDialog').close();ui.navigate('cronograma');}catch(err){errorInModal(err);if($('saveEvent')){$('saveEvent').disabled=false;$('saveEvent').textContent='Tentar salvar novamente';}}finally{saving=false;}};}
  function exportDialog(){const rows=visible().filter(e=>selected.has(e.id));if(!rows.length){ui.toast('Selecione as atividades que deseja exportar.');return;}const internal=rows.filter(x=>x.natureza==='interno').length;modal('Exportar cronograma',`<p>${rows.length} atividades selecionadas: ${internal} internas e ${rows.length-internal} externas.</p><p class="muted">A exportação contém apenas os itens marcados. Para mudar a seleção, volte ao cronograma.</p><div class="dialog-actions"><button class="button" data-agenda-action="xlsx">Baixar planilha (Excel)</button><button class="button secondary" data-agenda-action="print">Imprimir / salvar PDF</button><button class="button ghost" data-agenda-action="csv">CSV simples</button></div><p class="small muted">A planilha tem duas abas: <b>Calendário</b> (o mês em grade, com as cores das frentes e os feriados) e <b>Atividades</b> (uma linha por atividade, com filtro). Abre no Excel e no Google Planilhas (Arquivo → Importar).</p>`);}
  function exportRows(){return visible().filter(e=>selected.has(e.id));}
  function downloadCSV(){const cells=v=>'"'+String(v??'').replace(/^(?:[\s]*[=+@-]|[\t\r\n])/,"'$&").replace(/"/g,'""')+'"',head=['Data','Início','Fim','Atividade','Frentes','Responsáveis','Natureza','Situação','Obra','Bairro','Descrição'],rows=exportRows().map(e=>[date(e.data),e.inicio,e.fim,e.titulo,e.frentes.map(x=>names[x]).join(', '),pessoas(e),e.natureza,status[e.status],e.obra,e.bairro,e.descricao]);const blob=new Blob(['\uFEFF'+[head,...rows].map(r=>r.map(cells).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Cronograma_CPT_'+ui.state.mes+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);ui.toast('CSV preparado com as atividades selecionadas.');}
  /* ---------- 2.28: planilha .xlsx feita aqui mesmo (sem biblioteca): Calendário + Atividades ---------- */
  const COR_FRENTE={atendimento:['2F6FA3','DCEAF6'],socioambiental:['2C8669','DDF1E8'],comunicacao:['B8502B','FBE4DA'],comercializacao:['A07A1C','F5EDCF'],gestao:['6C5BA7','E9E4F5'],administrativo:['596AA8','E3E7F4']};
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  /** ZIP sem compressão (o .xlsx é um ZIP de arquivos XML). */
  function zip(arquivos){const enc=new TextEncoder(),partes=[],central=[];let pos=0;
    arquivos.forEach(([nome,texto])=>{const n=enc.encode(nome),d=enc.encode(texto),c=crc32(d),h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,33,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
      const ce=new DataView(new ArrayBuffer(46));ce.setUint32(0,0x02014b50,true);ce.setUint16(4,20,true);ce.setUint16(6,20,true);ce.setUint16(8,0x0800,true);ce.setUint16(14,33,true);ce.setUint32(16,c,true);ce.setUint32(20,d.length,true);ce.setUint32(24,d.length,true);ce.setUint16(28,n.length,true);ce.setUint32(42,pos,true);
      partes.push(new Uint8Array(h.buffer),n,d);central.push(new Uint8Array(ce.buffer),n);pos+=30+n.length+d.length;});
    const tam=central.reduce((s,x)=>s+x.length,0),fim=new DataView(new ArrayBuffer(22));fim.setUint32(0,0x06054b50,true);fim.setUint16(8,arquivos.length,true);fim.setUint16(10,arquivos.length,true);fim.setUint32(12,tam,true);fim.setUint32(16,pos,true);
    return new Blob(partes.concat(central,[new Uint8Array(fim.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
  const xe=v=>String(v??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  async function team(){const current=++ticket;ui.view.innerHTML=ui.intro('Equipe e acessos','Cada pessoa entra com sua conta Google e encontra a visão do seu trabalho.')+'<p>Carregando equipe…</p>';try{const d=await ui.call('listarEquipeCPT');if(current!==ticket||ui.state.route!=='equipe')return;ui.view.innerHTML=ui.intro('Equipe e acessos','Cadastre a conta Google e escolha as funções de cada pessoa.')+`<section class="panel"><div class="panel-head"><h2>Pessoas cadastradas</h2><button class="button" id="newPerson">+ Cadastrar pessoa</button></div><div class="team-list">${d.pessoas.map((p,i)=>`<button class="team-row" data-person-index="${i}"><span class="avatar">${esc(p.nome.slice(0,1))}</span><span><strong>${esc(p.nome)}</strong><small>${esc(p.email)}</small><small>${p.papeis.map(x=>names[x]).join(' · ')}</small></span><span class="badge ${p.ativo?'green':'orange'}">${p.ativo?'Ativo':'Inativo'}</span></button>`).join('')}</div><p class="small muted">O cadastro é o que libera a entrada: não é preciso compartilhar planilhas. Use sempre a conta @veolia.com da pessoa. Administrativo tem todas as ferramentas de trabalho; Administração técnica também cadastra acessos.</p></section>`;$('newPerson').onclick=()=>personEditor(null);document.querySelectorAll('[data-person-index]').forEach(b=>b.onclick=()=>personEditor(d.pessoas[Number(b.dataset.personIndex)]));}catch(e){if(current===ticket)ui.view.innerHTML='<div class="notice">'+esc(e.message)+'</div>';}}
  function personEditor(p){p=p||{email:'',nome:'',papeis:[],ativo:true,versao:0};modal('Cadastro da equipe',`<form id="personForm"><div id="agendaError" class="notice" hidden></div><div class="editor-grid"><label class="wide">Nome<input name="nome" value="${esc(p.nome)}" required maxlength="100"></label><label class="wide">Conta Google<input type="email" name="email" value="${esc(p.email)}" ${p.email?'readonly':''} required maxlength="180"></label><fieldset class="wide"><legend>Funções na aplicação</legend><div class="check-options">${['administrativo','gestao','atendimento','socioambiental','comunicacao','comercializacao'].map(x=>`<label><input name="papeis" type="checkbox" value="${x}" ${p.papeis.includes(x)?'checked':''}> ${names[x]}</label>`).join('')}</div></fieldset><label class="check-inline"><input name="ativo" type="checkbox" ${p.ativo?'checked':''}> Acesso ativo</label></div><button class="button" type="submit">Salvar acesso</button></form>`);$('personForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;const f=new FormData(e.target);try{const r=await ui.call('salvarPessoaCPT',{nome:f.get('nome'),email:f.get('email'),papeis:f.getAll('papeis'),ativo:f.has('ativo'),versao:p.versao||0});ui.toast(r.resultado);$('detailDialog').close();team();}catch(err){errorInModal(err);b.disabled=false;}};}
  function init(api){ui=api;document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-agenda-action],[data-agenda-mode],[data-agenda-id],[data-agenda-newdate],[data-pending]');if(!el)return;if(el.dataset.pending){ui.state.filters={busca:'',procedimento:'Relato de atividade',bairro:'',obra:'',pendencia:'publico'};ui.navigate('registros');return;}if(el.dataset.agendaMode){mode=el.dataset.agendaMode;draw();return;}if(el.dataset.agendaId){open(el.dataset.agendaId);return;}if(el.dataset.agendaNewdate){editor(null,el.dataset.agendaNewdate);return;}switch(el.dataset.agendaAction){case 'reload':render();break;case 'new':editor();break;case 'edit':editor(editing);break;case 'reschedule':editor(editing);$('eventForm').elements.data.focus();$('eventForm').elements.motivo.required=true;break;case 'cancel':editor(editing);$('eventForm').elements.status.value='cancelada';$('eventForm').elements.motivo.required=true;$('eventForm').elements.motivo.focus();$('saveEvent').textContent='Confirmar cancelamento';break;case 'close':$('detailDialog').close();break;case 'select':visible().forEach(e=>selected.add(e.id));drawSurface();break;case 'clear':selected.clear();drawSurface();break;case 'export':exportDialog();break;case 'csv':downloadCSV();break;case 'xlsx':downloadXLSX();break;case 'print':print();break;case 'history':{const id=editing.id;try{const r=await ui.call('historicoAtividadeCPT',id);if(editing?.id===id&&$('eventHistory'))$('eventHistory').innerHTML=r.versoes.map(v=>`<section class="answer"><h3>Versão ${v.versao} · ${esc(v.alteradoPor)}</h3><p>${esc(v.acao||'Atualização')} · ${esc(v.alteradoEm||'')}\n${esc(v.titulo)}\n${date(v.data)} · ${esc(v.inicio||'Dia todo')} · ${status[v.status]}\n${esc(v.motivo||'Sem motivo registrado nesta versão.')}\nCampos alterados: ${esc((v.camposAlterados||[]).join(', ')||'Registro anterior')}\n${esc(v.descricao||'')}</p></section>`).join('');}catch(e){ui.toast(e.message);}break;}}});document.addEventListener('change',e=>{const id=e.target.dataset.agendaSelect;if(!id)return;if(e.target.checked)selected.add(id);else selected.delete(id);$('selectionCount').textContent='('+selected.size+')';});}
  /** A Visão geral (Inicio.html) entrega aqui a agenda já carregada, para abrir os detalhes sem nova consulta. */
  function definir(d){if(d&&Array.isArray(d.itens))agenda={pessoas:[],...d};}
  return {init,render,team,definir,names,feriados,arquivoXLSX,xlsxTabelas,baixar};
})();
</script>
