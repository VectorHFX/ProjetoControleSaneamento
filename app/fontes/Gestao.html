<script>
/*
 * Gestão 2.7.0 — Painel da gestão (contrato, frentes de serviço, relatos em resumo) e Conectores.
 * Painel: só leitura, com o que pede atenção primeiro. Frentes e relatos abrem o registro ou a ficha de sempre.
 * 2.27: o Programa Parceiros saiu da aplicação junto com o fechamento do relatório.
 */
window.CPTGestao = (() => {
  'use strict';
  const ic = (n, e) => window.CPTic ? window.CPTic(n, e) : e; // ícone no visual novo, emoji no atual
  let ui = null, ticket = 0, painel = null, aba = 'contrato', relatos = null, filtroFrente = {busca: '', andamento: true}, filtroRelato = {busca: '', item: ''};
  const $ = id => document.getElementById(id);
  const mesCurto = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'short'}).replace('.', '');
  const mesLongo = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;
  const medidor = (v, meta) => `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${v}" aria-label="${v} de ${meta}"><span style="width:${pct(v, meta)}%"></span></div>`;
  const tile = (rotulo, valor, nota, extra = '') => `<div class="stat-tile"><span class="stat-label">${rotulo}</span><span class="stat-value">${valor}</span>${extra}<span class="stat-note">${nota}</span></div>`;

  /** Barras verticais simples (SVG próprio): uma ou duas séries, valor escrito em cima de cada barra. */
  function colunas(serie, campos, titulo) {
    const W = 300, H = 150, base = 118, alto = 92, n = serie.length, passo = W / n, max = Math.max(1, ...serie.flatMap(s => campos.map(c => s[c.k] || 0)));
    const larg = Math.min(26, (passo - 10) / campos.length);
    const barras = serie.map((s, i) => campos.map((c, j) => { const v = s[c.k] || 0, h = Math.round(v / max * alto), x = i * passo + (passo - larg * campos.length) / 2 + j * larg;
      return `<rect class="col-bar ${c.cls || ''}" x="${x}" y="${base - h}" width="${larg - 2}" height="${h}" rx="3"><title>${ui.esc(c.nome + ' em ' + mesLongo(s.mes) + ': ' + v)}</title></rect><text class="col-val" x="${x + (larg - 2) / 2}" y="${base - h - 4}" text-anchor="middle">${v}</text>`; }).join('') +
      `<text class="axis" x="${i * passo + passo / 2}" y="${H - 12}" text-anchor="middle">${mesCurto(s.mes)}</text>`).join('');
    const resumo = serie.map(s => mesLongo(s.mes) + ': ' + campos.map(c => c.nome + ' ' + (s[c.k] || 0)).join(', ')).join('; ');
    return `<figure class="mini-chart"><figcaption>${titulo}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ui.esc(titulo + '. ' + resumo)}"><line class="baseline" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${barras}</svg>${campos.length > 1 ? `<p class="chart-key">${campos.map(c => `<span class="key-swatch ${c.cls || ''}"></span>${c.nome}`).join(' ')}</p>` : ''}</figure>`;
  }
  /** Barras horizontais com rótulo e número (lista acessível, sem gráfico). */
  function barrasH(lista, vazio) {
    if (!lista || !lista.length || !lista.some(x => x.quantidade)) return `<p class="muted">${vazio}</p>`;
    const max = Math.max(...lista.map(x => x.quantidade));
    return `<ul class="hbars">${lista.map(x => `<li><span class="hbar-label">${ui.esc(x.rotulo || x.nome)}</span><span class="hbar-track" aria-hidden="true"><span style="width:${pct(x.quantidade, max)}%"></span></span><strong>${ui.num(x.quantidade)}</strong></li>`).join('')}</ul>`;
  }

  // ---------------- Painel da gestão ----------------
  // 2.11: o painel vive dentro da Visão do mês, em abas (Resumo do mês · Contrato · Frentes · Relatos).
  async function renderPainel(atualizar = false) {
    const mine = ++ticket, mes = ui.state.mes;
    if (atualizar) comparacao = null;
    if (!painel || painel.mes !== mes) { relatos = null; ui.view.innerHTML = abas() + '<div class="loading-label"><span class="spinner"></span>Reunindo os números do mês…</div><div class="stat-row">' + '<div class="skeleton"></div>'.repeat(4) + '</div>'; }
    try {
      const d = await ui.call('carregarPainelGestaoCPT', {mes, atualizar}); if (mine !== ticket || ui.state.route !== 'painel') return;
      painel = d; desenharPainel();
    } catch (e) { if (mine === ticket) ui.view.innerHTML = abas() + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  /** Abas da Visão do mês para a gestão. sel: aba marcada ('resumo' na própria Visão do mês). */
  function abas(sel) {
    const atual = sel || aba;
    return `<div class="segmented painel-tabs mes-tabs" role="tablist" aria-label="Partes da Visão do mês">${[['resumo', 'Resumo do mês'], ['cronograma', 'Cronograma']].concat(ui.state.route === 'painel' || ui.podeVer('painel') ? [['contrato', 'Contrato'], ['frentes', 'Frentes de serviço'], ['relatos', 'Relatos em resumo']] : []).map(([k, n]) => `<button role="tab" aria-selected="${atual === k}" class="${atual === k ? 'chosen' : ''}" data-painel-aba="${k}">${n}</button>`).join('')}</div>`;
  }
  function desenharPainel() {
    const corpo = aba === 'frentes' ? frentes() : aba === 'relatos' ? '<div id="relatosResumo"></div>' : contrato();
    ui.view.innerHTML = abas() + `<div class="painel-body">${corpo}</div><p class="small muted painel-foot">Atualizado às ${new Date(painel.atualizadoEm).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'})}. Use o botão Atualizar no topo para recalcular.</p>`;
    if (aba === 'contrato') carregarControle();
    if (aba === 'relatos') carregarRelatos();
    if (aba === 'frentes') carregarComparacao();
  }
  function contrato() {
    const c = painel.contrato, s = c.pesquisas, k = c.casos;
    const alertas = painel.alertas.length ? `<ul class="alert-list">${painel.alertas.map(a => `<li class="alert-${a.nivel}"><span class="alert-dot" aria-hidden="true"></span><span>${ui.esc(a.texto)}</span>${a.rota ? `<button class="button ghost" data-route="${a.rota}">Abrir</button>` : a.aba ? `<button class="button ghost" data-painel-aba="${a.aba}">Ver</button>` : ''}</li>`).join('')}</ul>` : '<p class="ok-line">Nada pedindo atenção agora. Bom trabalho da equipe.</p>';
    return `<section class="panel controle-contrato" id="controleContrato" aria-live="polite"><div class="loading-label"><span class="spinner"></span>Planilha de controle do contrato…</div></section>
      <section class="panel attention"><div class="panel-head"><div><span class="eyebrow">PEDE ATENÇÃO</span><h2>${painel.alertas.length ? painel.alertas.length + (painel.alertas.length === 1 ? ' ponto' : ' pontos') : 'Tudo em dia'}</h2></div></div>${alertas}</section>
      <section class="stat-row" aria-label="Números do contrato no mês">
        ${tile('Ações socioambientais', ui.num(c.acoes), ui.num(c.pessoas) + ' pessoas alcançadas · ' + ui.num(c.frentes) + ' frentes · ' + ui.num(c.bairros) + ' bairros.')}
        ${tile('Pesquisas de satisfação', ui.num(s.mes) + '<small> / ' + s.meta + '</small>', s.semana ? 'Nesta semana: ' + s.semana.total + ' de ' + s.semana.meta + '.' : 'Meta: 15 por semana, 60 no mês.', medidor(s.mes, s.meta))}
        ${tile('Atendimentos em aberto', ui.num(k.abertos), ui.num(k.recebidosMes) + ' recebidos e ' + ui.num(k.concluidosMes) + ' concluídos no mês' + (k.prazoMedio != null ? ' · prazo médio ' + k.prazoMedio + ' dias' : '') + '.')}
        ${tile('Relatos de atividade', ui.num(c.relatos.total), ui.num(c.diagnosticos) + ' diagnósticos no mês.')}
      </section>
      <div class="painel-grid">
        <section class="panel wide"><div class="panel-head"><div><h2>Últimos seis meses</h2><p>Pela data de realização de cada atividade.</p></div></div><div class="mini-charts">
          ${colunas(painel.serie, [{k: 'acoes', nome: 'Ações'}], 'Ações socioambientais')}${colunas(painel.serie, [{k: 'pessoas', nome: 'Pessoas'}], 'Pessoas alcançadas')}
          ${colunas(painel.serie, [{k: 'pesquisas', nome: 'Pesquisas'}], 'Pesquisas de satisfação')}${colunas(painel.serie, [{k: 'recebidos', nome: 'Recebidos', cls: 'b'}, {k: 'concluidos', nome: 'Concluídos', cls: 'c'}], 'Atendimentos')}</div></section>
        <section class="panel"><div class="panel-head"><div><h2>Ações por eixo</h2><p>Contagem do mês por tipo de atividade.</p></div></div>${barrasH(painel.porItem.map(x => ({rotulo: x.item + ' · ' + x.titulo, quantidade: x.quantidade})), 'Sem ações no mês.')}</section>
        <section class="panel"><div class="panel-head"><div><h2>Tipos de atividade</h2><p>As mais frequentes no mês.</p></div></div>${barrasH(painel.porTipo, 'Sem ações no mês.')}</section>
        <section class="panel"><div class="panel-head"><div><h2>Quem registrou</h2><p>Registros de campo por pessoa no mês.</p></div></div>${barrasH(painel.porPessoa, 'Sem registros no mês.')}</section>
      </div>`;
  }
  function frentes() {
    const b = ui.norm(filtroFrente.busca), lista = painel.frentes.filter(f => (!filtroFrente.andamento || f.situacao === 'Em andamento' || f.acoes || f.casosAbertos) && (!b || ui.norm(f.nome + ' ' + f.bairros.join(' ')).includes(b)));
    const card = (f, i) => {
      const parada = f.situacao === 'Em andamento' && (f.diasSemRegistro === null || f.diasSemRegistro > 14);
      return `<article class="front-card ${parada ? 'is-late' : ''}"><div class="card-top"><span class="badge ${f.situacao === 'Em andamento' ? 'status-concluida' : f.situacao === 'Paralisada' ? 'status-andamento' : ''}">${ui.esc(f.situacao)}</span>${f.impacto ? `<span class="small muted">Impacto ${ui.esc(f.impacto)}</span>` : ''}</div>
        <h3>${ui.esc(f.nome)}</h3><p class="small muted">${ui.esc(f.bairros.join(', ') || f.endereco || 'Bairros não informados')}</p>
        <dl class="front-numbers"><div><dt>Ações</dt><dd>${f.acoes}</dd></div><div><dt>Pessoas</dt><dd>${ui.num(f.pessoas)}</dd></div><div><dt>Diagnósticos</dt><dd>${f.diagnosticos}</dd></div><div><dt>Casos abertos</dt><dd>${f.casosAbertos}</dd></div></dl>
        <p class="small ${parada ? 'late-text' : 'muted'}">${f.ultimo ? 'Último registro em ' + ui.date(f.ultimo) + ' (há ' + f.diasSemRegistro + (f.diasSemRegistro === 1 ? ' dia' : ' dias') + ')' : 'Nenhum registro de atividade ainda'}</p>
        <button class="button ghost" data-frente="${i}">Ver a frente ${ui.icon('arrow')}</button></article>`;
    };
    return `<section class="panel filter-panel"><form id="frenteFiltro" class="filters"><label class="field">Localizar frente<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroFrente.busca)}" placeholder="Nome da obra ou bairro" maxlength="100"></span></label><label class="reduced"><input type="checkbox" name="andamento" ${filtroFrente.andamento ? 'checked' : ''}> Só frentes ativas no mês</label></form></section>
      <section class="panel obras-cmp"><div class="panel-head"><div><h2>Obras ativas × ações</h2><p>Obras confirmadas a cada dia (Obras → Obras de hoje) comparadas com as ações registradas.</p></div></div><div id="obrasComparacao"><div class="skel-list" aria-hidden="true"><div class="skeleton"></div></div></div></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'frente' : 'frentes'}</span><span>Em vermelho: em andamento e sem registro há mais de 14 dias</span></div>
      <div class="cards front-cards">${lista.map(f => card(f, painel.frentes.indexOf(f))).join('') || '<p class="muted">Nenhuma frente com esse filtro.</p>'}</div>`;
  }
  function abrirFrente(i) {
    const f = painel.frentes[i]; if (!f) return;
    $('detailType').textContent = 'FRENTE DE SERVIÇO'; $('detailTitle').textContent = f.nome;
    $('detailContent').innerHTML = `<dl class="detail-summary"><div><dt>Situação</dt><dd>${ui.esc(f.situacao)}</dd></div><div><dt>Bairros</dt><dd>${ui.esc(f.bairros.join(', ') || 'Não informado')}</dd></div><div><dt>Endereço</dt><dd>${ui.esc(f.endereco || 'Não informado')}</dd></div><div><dt>No mês</dt><dd>${f.acoes} ações · ${ui.num(f.pessoas)} pessoas · ${f.diagnosticos} diagnósticos · ${f.casosMes} casos recebidos</dd></div></dl>
      <h3 class="answers-head">Atividades do mês</h3>${f.atividades.length ? `<div class="mini-list">${f.atividades.map(a => `<button class="mini-row" data-record="${ui.esc(a.id)}"><strong>${ui.esc(a.atividade)}${a.diagnostico ? ' (diagnóstico)' : ''}</strong><small>${ui.date(a.data)} · ${ui.esc([a.bairro, a.publico != null ? a.publico + ' pessoas' : 'público não informado', a.responsavel].filter(Boolean).join(' · '))}</small></button>`).join('')}</div>` : '<p class="muted">Nenhuma atividade registrada nesta frente no mês.</p>'}
      <h3 class="answers-head">Atendimentos em aberto</h3>${f.casos.length ? `<div class="mini-list">${f.casos.map(c => `<button class="mini-row" data-case="${ui.esc(c.protocolo)}"><strong>${ui.esc(c.caso ? c.caso + ' (' + c.protocolo + ')' : c.protocolo)} · ${ui.esc(c.assunto || 'Assunto não informado')}</strong><small>${ui.esc(c.status || 'Em aberto')}${c.dias != null ? ' · ' + c.dias + ' dias' : ''}</small></button>`).join('')}</div>` : '<p class="muted">Nenhum atendimento em aberto ligado a esta frente.</p>'}`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
  }
  // ---------- Obras ativas × ações (por dia e no mês) ----------
  let comparacao = null, diaCmp = '';
  async function carregarComparacao() {
    if (!$('obrasComparacao')) return;
    if (!comparacao || comparacao.mesRef !== ui.state.mes) {
      try { const r = await ui.call('compararObrasDoMesCPT', ui.state.mes); comparacao = {...r, mesRef: ui.state.mes}; }
      catch (e) { const box = $('obrasComparacao'); if (box) box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    }
    desenharComparacao();
  }
  function desenharComparacao() {
    const box = $('obrasComparacao'); if (!box || !comparacao) return;
    const m = comparacao.mes, dias = comparacao.dias;
    const tom = x => !x.informado ? 'nd' : x.nenhuma && !x.comAcao ? 'zero' : x.ativasSemAcao.length || x.acaoForaDasAtivas.length ? 'aten' : 'ok';
    const titulo = x => ui.date(x.dia) + ': ' + (!x.informado ? 'não informado' : x.nenhuma ? 'nenhuma obra' : x.ativas + ' ativas, ' + x.comAcao + ' com ação');
    const sel = dias.find(x => x.dia === diaCmp) || dias.filter(x => x.informado).pop() || dias[dias.length - 1];
    const lista = (t, l) => l.length ? `<p><strong>${t}:</strong> ${l.map(ui.esc).join('; ')}</p>` : '';
    box.innerHTML = !dias.length ? '<p class="muted">O mês ainda não começou.</p>' : `<div class="cmp-kpis">
        <div><strong>${ui.num(m.diasInformados)}</strong><span>dias informados</span></div><div class="${m.diasNaoInformados ? 'is-warn' : ''}"><strong>${ui.num(m.diasNaoInformados)}</strong><span>dias não informados</span></div>
        <div class="${m.ativasSemAcao ? 'is-warn' : ''}"><strong>${ui.num(m.ativasSemAcao)}</strong><span>obra-dias ativos sem ação</span></div><div class="${m.acaoForaDasAtivas ? 'is-warn' : ''}"><strong>${ui.num(m.acaoForaDasAtivas)}</strong><span>ações em obra não ativa</span></div></div>
      <div class="cmp-dias" role="list" aria-label="Dias do mês">${dias.map(x => `<button type="button" role="listitem" class="cmp-dia t-${tom(x)} ${sel && x.dia === sel.dia ? 'is-sel' : ''}" data-cmp-dia="${x.dia}" title="${ui.esc(titulo(x))}" aria-label="${ui.esc(titulo(x))}">${Number(x.dia.slice(8))}</button>`).join('')}</div>
      <p class="cmp-legenda small muted"><span class="t-ok"></span>em dia <span class="t-aten"></span>pede atenção <span class="t-nd"></span>não informado</p>
      ${sel ? `<div class="cmp-detalhe"><h3>${ui.esc(titulo(sel))}</h3>${!sel.informado ? '<p class="muted">Ninguém confirmou as obras deste dia. Confirme em Obras → Obras de hoje (dá para escolher um dia anterior).</p>' : lista('Ativas sem ação', sel.ativasSemAcao) + lista('Ação em obra não ativa', sel.acaoForaDasAtivas) || '<p class="muted">Tudo bate: cada obra ativa teve ação e não houve ação fora delas.</p>'}</div>` : ''}`;
  }
  async function carregarRelatos() {
    const box = $('relatosResumo'); if (!box) return;
    if (!relatos || relatos.mes !== ui.state.mes) {
      box.innerHTML = '<div class="loading-label"><span class="spinner"></span>Lendo os relatos do mês…</div>';
      try {
        const [d, dv] = await Promise.all([ui.call('carregarRelatosResumoCPT', ui.state.mes), ui.call('minhasDevolutivasCPT').catch(() => ({devolutivas: [], podeDevolver: false}))]);
        if (ui.state.route !== 'painel' || aba !== 'relatos') return; relatos = d; devolutivas = dv;
      }
      catch (e) { box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }
    }
    desenharRelatos();
  }
  let devolutivas = {devolutivas: [], podeDevolver: false};
  /** Qualidade: o que o relato já tem e o que falta. Sem nota e sem ranking. */
  function qualidade(q) {
    if (!q) return '';
    return `<ul class="qualidade-chips" aria-label="Conferência do relato">${q.itens.map(i => `<li class="${i.ok ? 'ok' : 'falta'}" title="${ui.esc(i.ok ? i.nome + ': ok' : i.dica)}">${i.ok ? ic('tick', '✓') : ic('circle', '○')} ${ui.esc(i.nome)}</li>`).join('')}</ul>`;
  }
  function devolutivaDe(id) { return devolutivas.devolutivas.find(d => d.registroId === id); }
  function abrirDevolver(id) {
    const r = relatos.itens.find(x => x.id === id); if (!r) return;
    const faltam = r.qualidade ? r.qualidade.itens.filter(i => !i.ok) : [];
    $('detailType').textContent = 'COMENTÁRIO PRIVADO'; $('detailTitle').textContent = r.atividade;
    $('detailContent').innerHTML = `<p class="small muted">Só ${ui.esc(r.responsavel || 'quem escreveu')} e a gestão veem. Aparece como missão no Meu espaço da pessoa.</p>
      <form id="devolverForm"><label class="field">Comentário<textarea name="comentario" rows="5" maxlength="1500" required>${ui.esc(faltam.length ? 'Seu relato está bom, dá para completar:\n' + faltam.map(i => '• ' + i.nome + ': ' + i.dica).join('\n') : '')}</textarea></label>
      <div class="dialog-actions"><button class="button" type="submit">Enviar comentário</button></div></form>`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
    $('devolverForm').onsubmit = async ev => {
      ev.preventDefault(); const b = ev.target.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Enviando…';
      try { const x = await ui.call('devolverRelatoCPT', {registroId: id, comentario: ev.target.elements.comentario.value, operacaoId: 'OP-' + crypto.randomUUID()}); ui.toast(x.resultado); devolutivas.devolutivas = devolutivas.devolutivas.filter(d => d.registroId !== id).concat([x.devolutiva]); $('detailDialog').close(); desenharRelatos(); }
      catch (e) { ui.toast(e.message); b.disabled = false; b.textContent = 'Enviar comentário'; }
    };
  }
  function desenharRelatos() {
    const box = $('relatosResumo'); if (!box || !relatos) return;
    const itens = [...new Set(relatos.itens.map(r => r.item))].sort(), b = ui.norm(filtroRelato.busca);
    const lista = relatos.itens.filter(r => (!filtroRelato.item || r.item === filtroRelato.item) && (!b || ui.norm([r.atividade, r.bairro, r.frente, r.responsavel, r.resumo].join(' ')).includes(b)));
    const dias = new Map(); lista.forEach(r => dias.set(r.data, (dias.get(r.data) || []).concat([r])));
    const rot = {pronto: 'Pronto', rascunho: 'Rascunho', revisao: 'Em revisão'};
    box.innerHTML = `<section class="panel filter-panel"><form id="relatoFiltro" class="filters"><label class="field">Procurar nos relatos<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroRelato.busca)}" placeholder="Atividade, bairro, pessoa ou palavra do relato" maxlength="100"></span></label>
      <label class="field">Item do relatório<select name="item"><option value="">Todos</option>${itens.map(i => `<option ${filtroRelato.item === i ? 'selected' : ''}>${ui.esc(i)}</option>`).join('')}</select></label></form></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'relato' : 'relatos'} em ${dias.size} ${dias.size === 1 ? 'dia' : 'dias'}</span><span><button type="button" class="link-button" data-guia-relato>${ic('pencil', '📝')} Guia do bom relato</button></span></div>
      ${[...dias].map(([dia, rs]) => `<section class="relato-day"><h3 class="peek-title">${ui.date(dia)}</h3>${rs.map(r => `<article class="relato-card"><div class="card-top"><span class="badge">Item ${ui.esc(r.item)}</span>${r.situacao ? `<span class="badge ${r.situacao === 'pronto' ? 'status-concluida' : 'status-andamento'}">${rot[r.situacao] || ui.esc(r.situacao)}</span>` : ''}${r.fotos ? `<span class="small muted">${r.fotos} ${r.fotos === 1 ? 'foto' : 'fotos'}</span>` : '<span class="small late-text">sem foto</span>'}</div>
        <h4>${ui.esc(r.atividade)}</h4><p class="small muted">${ui.esc([r.frente || r.bairro, r.publico != null ? r.publico + ' pessoas' : 'público não informado', r.responsavel].filter(Boolean).join(' · '))}</p>
        ${r.resumo ? `<p class="relato-text">${ui.esc(r.resumo)}</p>` : '<p class="small late-text">Relato sem texto no registro.</p>'}${r.objetivo ? `<p class="small"><strong>Objetivo:</strong> ${ui.esc(r.objetivo)}</p>` : ''}
        ${qualidade(r.qualidade)}${(dv => dv ? `<p class="devolutiva-status small"><strong>${dv.situacao === 'vista' ? ic('tick', '✓') + ' Comentário visto' : ic('mail', '✉') + ' Comentário enviado'}</strong>${dv.resposta ? ' · resposta: ' + ui.esc(dv.resposta) : ''}</p>` : '')(devolutivaDe(r.id))}
        <div class="card-bottom"><span>${r.qualidade && devolutivas.podeDevolver ? `<button class="button ghost" data-devolver="${ui.esc(r.id)}">${devolutivaDe(r.id) ? 'Novo comentário' : 'Comentar'}</button>` : ''}</span><span><button class="button ghost" data-record="${ui.esc(r.id)}">Registro completo</button></span></div></article>`).join('')}</section>`).join('') || '<p class="muted">Nenhum relato com esse filtro.</p>'}`;
  }

  // ---------------- Conectores (administração técnica) ----------------
  async function renderConectores() {
    const mine = ++ticket; ui.view.innerHTML = ui.intro('Conectores e pastas', 'De onde a aplicação lê e para onde publica, e quais pastas a equipe precisa enxergar.') + '<div class="loading-label"><span class="spinner"></span>Conferindo cada conector com a conta proprietária…</div>';
    try {
      const d = await ui.call('conferirConectoresCPT'); if (mine !== ticket || ui.state.route !== 'conectores') return;
      ui.view.innerHTML = ui.intro('Conectores e pastas', 'De onde a aplicação lê e para onde publica, e quais pastas a equipe precisa enxergar.') +
        `<section class="panel ${d.travada ? 'lock-on' : ''}"><h2>${d.travada ? 'Período de testes: configuração travada' : 'Configuração liberada'}</h2><p>${d.travada ? 'Só você altera cadastros e papéis, o catálogo de obras, os conectores e publica nas planilhas oficiais. Para liberar obras e publicações à Gestão e ao Administrativo, execute <code>liberarConfiguracaoCPT</code> no editor do Apps Script.' : 'Gestão e Administrativo editam obras e publicam entregas oficiais. Cadastros e papéis continuam só com você. Para travar de novo, execute <code>travarConfiguracaoCPT</code> no editor.'}</p></section>
        <section class="panel"><div class="panel-head"><div><span class="eyebrow">COMPARTILHAR COM A EQUIPE</span><h2>Pastas que a equipe precisa enxergar</h2><p>Fotos e documentos abrem com a conta de cada pessoa. Compartilhe estas pastas com o domínio, como <strong>Leitor</strong>.</p></div></div>
          ${d.pastas.length ? `<ul class="connector-list">${d.pastas.map(p => `<li class="${p.equipeVe ? 'is-ok' : 'is-warn'}"><span class="alert-dot" aria-hidden="true"></span><div><strong>${ui.esc(p.nome)}</strong><small>${ui.esc(p.motivo)} · ${ui.esc(p.texto)}</small></div><a class="button ${p.equipeVe ? 'ghost' : 'secondary'}" href="${ui.esc(ui.safeURL(p.url))}" target="_blank" rel="noopener noreferrer">${p.equipeVe ? 'Abrir' : 'Abrir e compartilhar'}</a></li>`).join('')}</ul>` : '<p class="muted">Nenhuma pasta encontrada nos registros recentes.</p>'}</section>
        <section class="panel"><div class="panel-head"><div><span class="eyebrow">FONTES OFICIAIS</span><h2>Conectores</h2><p>Para trocar, cole o link do arquivo ou da pasta e salve.</p></div></div>
          <ul class="connector-list">${d.conectores.map(c => `<li class="${c.ok ? 'is-ok' : 'is-warn'}"><span class="alert-dot" aria-hidden="true"></span><div><strong>${ui.esc(c.nome)}</strong><small>${ui.esc(c.ok ? (c.titulo + ' · ' + c.compartilhamento) : c.erro)}</small><small class="muted">${ui.esc(c.uso)}${c.configurado ? '' : ' (valor padrão)'}</small>
            <form class="connector-form" data-conector="${ui.esc(c.chave)}"><input name="id" placeholder="Cole o link do ${c.tipo === 'pasta' ? 'Drive (pasta)' : 'arquivo'}" maxlength="300" aria-label="Novo link para ${ui.esc(c.nome)}"><button class="button ghost" type="submit">Salvar</button></form></div>
            <a class="button ghost" href="${ui.esc(ui.safeURL(c.url))}" target="_blank" rel="noopener noreferrer">Abrir</a></li>`).join('')}</ul></section>`;
    } catch (e) { if (mine === ticket) ui.view.innerHTML = ui.intro('Conectores e pastas', '') + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }

  // ---------- Planilha de controle do contrato (2.26): lembrete mensal; a aplicação nunca escreve nela ----------
  let controle = null, controleTicket = 0;
  const dataBr = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
  async function carregarControle() {
    const mine = ++controleTicket; if (controle) desenharControle(); // o último resumo aparece na hora (sem piscar) e se atualiza em seguida
    try { const r = await ui.call('controleContratoCPT', {}); if (mine !== controleTicket) return; controle = r; desenharControle(); }
    catch (e) { const box = $('controleContrato'); if (box && mine === controleTicket) box.innerHTML = `<p class="small muted">Planilha de controle: ${ui.esc(e.message)}</p>`; }
  }
  function desenharControle() {
    const box = $('controleContrato'), c = controle; if (!box || !c) return;
    const quando = iso => new Date(iso).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'});
    const situacao = c.respondida ? `<span class="controle-situacao is-feita">${ic('tick', '✓')} Respondida por ${ui.esc(c.respondida.nome)} em ${ui.esc(quando(c.respondida.em))}</span>`
      : `<span class="controle-situacao ${c.atrasada ? 'is-atrasada' : ''}">${c.atrasada ? 'Atrasada · prazo era ' : 'Pendente · prazo '}${dataBr(c.prazo)}</span>`;
    const nums = (c.indicadores || []).map(x => `<div class="controle-num"><b>${ui.num(x.valor)}</b><span>${ui.esc(x.nome)}</span>${x.nota ? `<small>${ui.esc(x.nota)}</small>` : ''}</div>`).join('');
    box.classList.toggle('is-feita', !!c.respondida);
    box.innerHTML = `<div class="panel-head"><div><span class="eyebrow">PLANILHA DE CONTROLE · PREENCHIDA À MÃO</span><h2>${c.respondida ? 'Planilha de ' + ui.esc(c.mesNome) + ' respondida' : 'Responder a planilha de controle de ' + ui.esc(c.mesNome)}</h2>
      <p>Todo mês a gestão preenche esta planilha à mão. A aplicação não escreve nela: só lembra, abre o link e traz os números do mês para conferir.</p></div>${situacao}</div>
      <div class="controle-acoes"><a class="button" href="${ui.esc(c.url)}" target="_blank" rel="noopener noreferrer">${ic('file', '📄')} Abrir a planilha de controle ↗</a>
        ${c.podeMarcar ? (c.respondida ? '<button class="button secondary" data-controle-marcar="nao">Desfazer “respondida”</button>' : '<button class="button secondary" data-controle-marcar="sim">' + ic('tick', '✓') + ' Já respondi este mês</button>') : ''}
        ${c.ultimaAlteracao ? `<small class="muted">Última alteração no arquivo: ${ui.esc(quando(c.ultimaAlteracao))}</small>` : ''}</div>
      ${nums ? `<details class="controle-indicadores" ${c.respondida ? '' : 'open'}><summary>Indicadores de ${ui.esc(c.mesNome)} para conferir ao preencher</summary><div class="controle-nums">${nums}</div><p class="small muted">Calculados pela aplicação a partir dos registros e atendimentos. Confira antes de transcrever.</p></details>` : ''}`;
  }
  async function marcarControle(sim) {
    if (!controle) return;
    try { const r = await ui.call('marcarControleContratoCPT', {mes: controle.mes, respondida: sim, versao: controle.versao, operacaoId: 'OP-' + crypto.randomUUID()}); controle.respondida = r.respondida; controle.versao = r.versao; controle.atrasada = !r.respondida && controle.hoje > controle.prazo; ui.toast(r.resultado); desenharControle(); }
    catch (e) { ui.toast(e.message); }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-painel-aba]'); if (t) { if (t.dataset.painelAba === 'resumo') { ui.navigate('inicio'); return; } if (t.dataset.painelAba === 'cronograma') { ui.navigate('cronograma'); return; } aba = t.dataset.painelAba; if (ui.state.route !== 'painel') ui.navigate('painel'); else if (painel) desenharPainel(); return; }
      const cm = e.target.closest('[data-controle-marcar]'); if (cm) { marcarControle(cm.dataset.controleMarcar === 'sim'); return; }
      const f = e.target.closest('[data-frente]'); if (f) { abrirFrente(Number(f.dataset.frente)); return; }
      const dv = e.target.closest('[data-devolver]'); if (dv) { abrirDevolver(dv.dataset.devolver); return; }
      const cd = e.target.closest('[data-cmp-dia]'); if (cd) { diaCmp = cd.dataset.cmpDia; desenharComparacao(); return; }
    });
    // Filtros com espera curta (debounce): o painel é redesenhado quando a pessoa para de digitar.
    let buscaTimer = null;
    const redesenhar = (form, desenhar) => {
      const f = $(form); if (!f) return;
      const i = f.elements.busca, foco = document.activeElement === i, pos = foco ? i.selectionStart : null;
      desenhar(f);
      const n = $(form) && $(form).elements.busca; if (n && foco) { n.focus(); n.setSelectionRange(pos, pos); }
    };
    document.addEventListener('input', e => {
      const f = e.target.closest('#frenteFiltro');
      if (f) { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => redesenhar('frenteFiltro', x => { filtroFrente = {busca: x.elements.busca.value, andamento: x.elements.andamento.checked}; desenharPainel(); }), e.target.name === 'busca' ? 220 : 0); return; }
      const r = e.target.closest('#relatoFiltro');
      if (r && e.target.name === 'busca') { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => redesenhar('relatoFiltro', x => { filtroRelato.busca = x.elements.busca.value; desenharRelatos(); }), 220); }
    });
    document.addEventListener('change', e => {
      const f = e.target.closest('#frenteFiltro'); if (f && e.target.name === 'andamento') { filtroFrente.andamento = e.target.checked; desenharPainel(); return; }
      const r = e.target.closest('#relatoFiltro'); if (r && e.target.name === 'item') { filtroRelato.item = e.target.value; desenharRelatos(); }
    });
    document.addEventListener('submit', async e => {
      const f = e.target.closest('.connector-form'); if (!f) return; e.preventDefault();
      const b = f.querySelector('button'); b.disabled = true;
      try { const r = await ui.call('configurarConectorCPT', {chave: f.dataset.conector, id: f.elements.id.value}); ui.toast(r.resultado); renderConectores(); }
      catch (err) { ui.toast(err.message); } finally { b.disabled = false; }
    });
  }
  return {init, renderPainel, renderConectores, colunas, barrasH, abas, irPara: k => { aba = k; }};
})();

/* Guia "Como escrever um bom relato": aberto pelas missões do Meu espaço e pelos relatos da gestão. (2.27: veio da antiga Mesa.) */
window.CPTGuiaRelato = (() => {
  'use strict';
  const PONTOS = [
    ['O quê', 'A atividade e o tema.', 'Roda de conversa sobre descarte correto de óleo de cozinha.'],
    ['Onde', 'Rua, escola, praça ou equipamento, além do bairro.', 'Na EMEF Jardim Ipanema, Rua das Flores, 120 (Vila Linda).'],
    ['Público', 'Quem participou e quantas pessoas, em número.', '22 alunos do 5º ano e 2 professoras.'],
    ['Resultado', 'O que aconteceu: dúvidas, o que entenderam, o que foi entregue.', 'As crianças perguntaram para onde vai o óleo e levaram folhetos para casa.'],
    ['Encaminhamento', 'O que fica para depois. Se nada, escreva "sem encaminhamentos".', 'Ficou combinado o ponto de coleta na escola a partir de 10/11.'],
    ['Tamanho', 'Pelo menos 5 linhas: o relato vira texto do relatório para a Sabesp.', '']];
  function html(faltam) {
    const f = new Set(faltam || []);
    return `<div class="guia-relato"><p>Um bom relato responde a seis perguntas. Escreva como se contasse para alguém que não estava lá.</p>
      <ol class="guia-pontos">${PONTOS.map(([t, d, ex]) => `<li class="${f.has(t) ? 'falta' : ''}"><strong>${t}${f.has(t) ? ' <span class="guia-falta">faltou aqui</span>' : ''}</strong><span>${d}</span>${ex ? `<em>Ex.: ${ex}</em>` : ''}</li>`).join('')}</ol>
      <details><summary>Exemplo completo</summary><p class="guia-exemplo">Realizamos uma roda de conversa sobre descarte correto de óleo de cozinha na EMEF Jardim Ipanema (Rua das Flores, 120, Vila Linda), com 22 alunos do 5º ano e 2 professoras. As crianças perguntaram para onde vai o óleo depois da coleta e por que ele não pode ir para a pia; explicamos o entupimento da rede e a contaminação do córrego. Cada aluno levou um folheto para casa. Ficou combinado com a direção um ponto de coleta na escola a partir de 10/11, que a equipe vai acompanhar.</p></details>
      <p class="small muted">A conferência automática é uma ajuda para escrever. Ninguém recebe nota e não existe ranking.</p></div>`;
  }
  function abrir(faltam) {
    document.getElementById('detailType').textContent = 'GUIA'; document.getElementById('detailTitle').textContent = 'Como escrever um bom relato';
    document.getElementById('detailContent').innerHTML = html(faltam);
    const d = document.getElementById('detailDialog'); if (!d.open) d.showModal();
  }
  document.addEventListener('click', ev => { const g = ev.target.closest('[data-guia-relato]'); if (g) abrir((g.dataset.guiaRelato || '').split('|').filter(Boolean)); });
  return {abrir, html};
})();
