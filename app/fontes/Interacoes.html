<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const num=n=>new Intl.NumberFormat('pt-BR').format(n||0);
  const date=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):d||'Não informado';
  const monthLabel=m=>/^\d{4}-\d{2}$/.test(m)?new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}):'';
  const nowParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const state={route:'inicio',mes:window.CPT_PREVIA?'2026-09':nowParts.year+'-'+nowParts.month,home:null,homeRequest:0,listRequest:0,detailRequest:0,cursor:null,casePage:null,
    filters:{busca:'',procedimento:'',bairro:'',obra:'',pendencia:''},caseFilters:{busca:'',estado:'abertos'},records:[],cases:[],busy:false};
  let debounce,toastTimer;let activeDocument=null,historyCursor=null,historyBusy=false;
  const store={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  const savedTheme=store.get('cpt.theme');document.documentElement.dataset.theme=savedTheme==='dark'?'dark':'light';
  if(store.get('cpt.motion')==='reduce')document.documentElement.dataset.motion='reduce';
  $('theme').value=document.documentElement.dataset.theme;$('month').value=state.mes;
  const pendingReads=new Map();
  function call(nome,arg){
    const read=/^(carregar|buscar|abrir|historico|listar)/.test(nome),key=nome+JSON.stringify(arg??null);
    if(read&&pendingReads.has(key))return pendingReads.get(key);
    const promise=request(nome,arg);if(read){pendingReads.set(key,promise);promise.then(()=>pendingReads.delete(key),()=>pendingReads.delete(key));}return promise;
  }
  function request(nome,arg){
    if(window.CPT_PREVIA)return window.CPT_PREVIA.chamar(nome,arg);
    return new Promise((resolve,reject)=>{
      let done=false;const timer=setTimeout(()=>{done=true;reject(new Error('A conexão demorou mais que o esperado. Tente atualizar novamente.'));},45000);
      const ok=x=>{if(done)return;done=true;clearTimeout(timer);resolve(x);},bad=e=>{if(done)return;done=true;clearTimeout(timer);reject(new Error(e&&e.message||'Não foi possível consultar os dados.'));};
      if(!window.google||!google.script||!google.script.run){bad(new Error('Abra esta aplicação pelo endereço publicado no Apps Script.'));return;}
      try{const runner=google.script.run.withSuccessHandler(ok).withFailureHandler(bad);if(typeof runner[nome]!=='function')throw new Error('Função '+nome+' indisponível na versão publicada. Atualize a implantação.');if(arg===undefined)runner[nome]();else runner[nome](arg);}catch(e){bad(e);}
    });
  }
  function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4300);}
  function notice(text){$('globalNotice').textContent=text;$('globalNotice').hidden=!text;}
  function empty(title,text,action=''){return `<div class="empty">${icon('records')}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;}
  function skeleton(){return `<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Buscando as informações do mês…</div><div class="skeleton hero-loading"></div><div class="kpis">${'<div class="skeleton"></div>'.repeat(4)}</div>`;}
  function intro(title,description){return `<div class="page-intro"><div><div class="eyebrow muted">CAMPO E GESTÃO</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div><span class="date-tag">${esc(monthLabel(state.mes))}</span></div>`;}
  function safeURL(value){try{const u=new URL(value);return u.protocol==='https:'&&['drive.google.com','docs.google.com'].includes(u.hostname)?u.href:'';}catch(_){return '';}}
  function formLink(){const url=safeURL(state.home?.links?.formulario);return url?`<a class="button white" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon('plus')}Registrar procedimento</a>`:`<button class="button white" data-action="noform">${icon('plus')}Registrar procedimento</button>`;}
  function kpi(label,value,note,color,tint,symbol,route,filter=''){return `<button class="kpi" style="--accent:${color};--tint:${tint}" data-route="${route}" ${filter?`data-filter="${filter}"`:''}><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon(symbol)}</span></div><div class="kpi-value">${num(value)}</div><div class="kpi-note">${note}</div></button>`;}
  const colors=['#1985e7','#03a895','#8b80d8','#efa44c','#f18472','#5aadc5'];
  function bars(items){const max=Math.max(1,...items.map(x=>x.quantidade));return items.length?`<div class="bars">${items.slice(0,6).map((x,i)=>`<div><div class="bar-label"><span>${esc(x.nome)}</span><b>${num(x.quantidade)}</b></div><div class="bar-track"><div class="bar-fill" style="--accent:${colors[i%colors.length]};width:${Math.max(1,x.quantidade/max*100)}%"></div></div></div>`).join('')}</div>`:empty('Ainda sem registros','As atividades deste mês aparecerão aqui.');}
  function chart(dias){const last=new Date(Number(state.mes.slice(0,4)),Number(state.mes.slice(5,7)),0).getDate();const porDia=new Map(dias.map(x=>[Number(x.data.slice(-2)),x.quantidade]));const values=Array.from({length:last},(_,i)=>porDia.get(i+1)||0),max=Math.max(1,...values),p=values.map((v,i)=>`${12+i/(last-1)*396},${112-v/max*85}`);return `<svg class="chart" viewBox="0 0 420 132" preserveAspectRatio="none" role="img" aria-label="Registros por dia do mês. ${esc(dias.map(x=>date(x.data)+': '+x.quantidade).join('; ')||'Nenhum registro')}"><defs><linearGradient id="chartFill" x1="0" x2="0" y2="1"><stop stop-color="#1688e9" stop-opacity=".22"/><stop offset="1" stop-color="#1688e9" stop-opacity=".01"/></linearGradient></defs><path d="M12 27H408M12 69H408M12 112H408" stroke="var(--line)" fill="none" stroke-dasharray="3 5"/><path d="M12,112L${p.join('L')}L408,112Z" fill="url(#chartFill)"/><path d="M${p.join('L')}" stroke="#1985e7" stroke-width="2.7" fill="none" stroke-linejoin="round"/></svg><div class="chart-axis"><span>01 ${esc(monthLabel(state.mes).split(' ')[0].slice(0,3))}</span><span>15</span><span>${last}</span></div>`;}
  function recent(r){return `<button class="record" data-record="${esc(r.id)}"><span class="record-symbol">${icon('records')}</span><span><span class="record-title">${esc(r.atividade||r.procedimento)}</span><span class="record-meta"><span>${esc(r.bairro||'Bairro não informado')}</span><span>·</span><span>${esc(r.responsavel||'Responsável não informado')}</span></span></span><span class="record-date"><time>${date(r.data)}</time>${icon('arrow')}</span></button>`;}
  function renderHome(){if(!state.home){$('view').innerHTML=skeleton();return;}const d=state.home,k=d.indicadores,canAtd=!['comunicacao','socioambiental','comercializacao'].includes($('roleView').value);
    $('view').innerHTML=window.CPTAgenda.homeMarkup(d)+
      `<section class="kpis" aria-label="Indicadores">${kpi('Registros do mês',k.registros,'Registros disponíveis neste mês.','#1685df','#eaf4ff','records','registros')}${kpi('Participações',k.participacoes,'Público informado nos relatos.','#039a87','#e6f7f1','people','registros','relatos')}${canAtd?kpi('Casos em aberto',k.abertos,'Carteira atual de atendimentos.','#d58c31','#fff3e4','case','atendimentos','abertos')+kpi('Casos concluídos',k.concluidos,'Acumulado da carteira atual.','#8a70cf','#f1edfc','check','atendimentos','concluidos'):kpi('Bairros com registros',k.bairros||0,'Bairros informados neste mês.','#d58c31','#fff3e4','pin','registros')+kpi('Obras identificadas',k.obras||0,'Referências informadas no mês.','#8a70cf','#f1edfc','check','registros')}</section>`+
      `<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>O trabalho em campo</h2><p>Registros por tipo de procedimento</p></div><span class="badge">${num(k.registros)} registros</span></div>${bars(d.procedimentos)}</section><section class="panel"><div class="panel-head"><div><h2>O mês em movimento</h2><p>Distribuição dos registros pela data de realização</p></div></div><div class="chart-summary"><strong>${num(d.dias.length)}</strong><span>dias com registros no mês</span></div>${chart(d.dias)}<div class="legend"><i></i>Registros de campo por dia</div></section></div>`+
      `<section class="panel"><div class="panel-head"><div><h2>Últimos registros do mês</h2><p>Abra um registro para consultar o relato completo e os anexos.</p></div><button class="button ghost" data-route="registros">Ver todos ${icon('arrow')}</button></div><div class="records-list">${d.recentes.length?d.recentes.map(recent).join(''):empty('O mês está começando','Os novos registros aparecerão nesta visão após o processamento.')}</div></section>`;$('overviewMetrics').append($('view').querySelector(':scope > .kpis'));$('overviewCharts').append($('view').querySelector(':scope > .two-col'));window.CPTAgenda.homeLoad();
  }
  function options(values,chosen,first){return `<option value="">${first}</option>`+values.map(x=>`<option value="${esc(x)}" ${x===chosen?'selected':''}>${esc(x)}</option>`).join('');}
  function renderRecords(){const f=state.filters,op=state.home?.filtros||{procedimentos:[],bairros:[],obras:[]};
    $('view').innerHTML=intro('Registros de campo','Encontre o relato, o território e as evidências de cada procedimento.')+
      `<section class="panel filter-panel"><form id="recordFilters" class="filters"><label class="field">Buscar nos registros<span class="search-input">${icon('search')}<input name="busca" value="${esc(f.busca)}" placeholder="Atividade, responsável, obra ou protocolo" maxlength="200"></span></label><label class="field">Procedimento<select name="procedimento">${options(op.procedimentos,f.procedimento,'Todos os procedimentos')}</select></label><label class="field">Bairro<select name="bairro">${options(op.bairros,f.bairro,'Todos os bairros')}</select></label><label class="field">Obra<select name="obra">${options(op.obras||[],f.obra,'Todas as obras')}</select></label><input type="hidden" name="pendencia" value="${esc(f.pendencia||'')}"><button type="submit" class="button">${icon('search')}Buscar</button></form>${f.pendencia?'<p class="small muted">Filtro ativo: relatos sem público válido informado.</p>':''}</section><div class="results-head"><span id="recordCount">Consultando registros…</span><button class="button ghost" data-action="clear">Limpar filtros</button></div><div id="recordResults" class="cards"></div><div id="moreRecords" class="load-more"></div>`;
    const form=$('recordFilters');form.addEventListener('submit',e=>{e.preventDefault();readFilters();loadRecords();});form.addEventListener('change',()=>{readFilters();loadRecords();});form.elements.busca.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{if(state.route==='registros'){readFilters();loadRecords();}},400);});loadRecords();
  }
  function readFilters(){const f=$('recordFilters');if(f)state.filters=Object.fromEntries(new FormData(f));}
  function entry(r){return `<article class="entry-card"><div class="card-top"><span class="badge">${esc(r.procedimento)}</span><time class="date">${date(r.data)}</time></div><h3>${esc(r.atividade||r.procedimento)}</h3><p>${esc(r.bairro||'Bairro não informado')}${r.obra?'<br>'+esc(r.obra):''}</p><div class="card-bottom"><span>${esc(r.responsavel||'Responsável não informado')}</span><button class="button ghost" data-record="${esc(r.id)}">Abrir registro ${icon('arrow')}</button></div></article>`;}
  async function loadRecords(more=false){const ticket=++state.listRequest;if(!more)state.records=[];const cursor=more?state.cursor:null;$('recordResults').setAttribute('aria-busy','true');$('moreRecords').innerHTML='<span class="loading-label"><span class="spinner"></span>Buscando registros…</span>';
    if(!more)$('recordResults').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
    try{const d=await call('buscarRegistrosCPT',{...state.filters,mes:state.mes,cursor});if(ticket!==state.listRequest||state.route!=='registros')return;state.records.push(...d.itens);state.cursor=d.proximoCursor;
      $('recordResults').innerHTML=state.records.length?state.records.map(entry).join(''):empty('Nenhum registro encontrado',d.proximoCursor?'A busca pode continuar nos registros anteriores.':'Experimente outro bairro, procedimento ou mês.');
      $('recordCount').textContent=num(state.records.length)+' registros exibidos · '+monthLabel(state.mes);$('moreRecords').innerHTML=d.proximoCursor?'<button class="button secondary" data-action="more-records">Continuar carregando '+icon('plus')+'</button>':'';
    }catch(e){if(ticket!==state.listRequest||state.route!=='registros')return;$('recordResults').innerHTML=empty('Não foi possível buscar',e.message,'<button class="button" data-action="retry-records">Tentar novamente</button>');$('recordCount').textContent='Consulta não concluída';$('moreRecords').innerHTML='';}finally{if(ticket===state.listRequest&&$('recordResults'))$('recordResults').removeAttribute('aria-busy');}}
  function renderCases(){const f=state.caseFilters;$('view').innerHTML=intro('Atendimentos','Acompanhe a carteira e encontre a ficha de cada caso.')+
    `<div class="notice">Toda a equipe pode consultar os casos e registrar observações (por exemplo, quando alguém procura você em campo). Alterações oficiais da ficha continuam com o Atendimento.</div><section class="panel filter-panel"><form id="caseFilters" class="filters cases"><label class="field">Localizar atendimento<span class="search-input">${icon('search')}<input name="busca" value="${esc(f.busca)}" placeholder="Protocolo, pessoa, assunto ou endereço" maxlength="200"></span></label><label class="field">Situação<select name="estado"><option value="" ${!f.estado?'selected':''}>Todos os casos</option><option value="abertos" ${f.estado==='abertos'?'selected':''}>Em aberto</option><option value="concluidos" ${f.estado==='concluidos'?'selected':''}>Concluídos</option></select></label><button type="submit" class="button">${icon('search')}Buscar</button></form></section><div class="results-head"><span id="caseCount">Consultando atendimentos…</span><span>Carteira atual</span></div><div id="caseResults" class="cards"></div><div id="moreCases" class="load-more"></div>`;
    const form=$('caseFilters'),read=()=>state.caseFilters=Object.fromEntries(new FormData(form));form.addEventListener('submit',e=>{e.preventDefault();read();loadCases();});form.addEventListener('change',()=>{read();loadCases();});form.elements.busca.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{if(state.route==='atendimentos'){read();loadCases();}},400);});loadCases();}
  function caseCard(r){return `<article class="entry-card"><div class="card-top"><span class="badge ${r.concluido?'green':'orange'}">${esc(r.concluido?'Atendimento concluído':r.status||'Em aberto')}</span><span class="date">${esc(r.protocolo)}</span></div><h3>${esc(r.nome||'Nome não informado')}</h3><p><strong>${esc(r.assunto||'Assunto não informado')}</strong><br>${esc(r.endereco||'Endereço não informado')}</p><div class="card-bottom"><span>${esc(r.area||'Área não informada')}</span><button class="button ghost" data-case="${esc(r.protocolo)}">Consultar ficha ${icon('arrow')}</button></div></article>`;}
  async function loadCases(more=false){const ticket=++state.listRequest;if(!more)state.cases=[];$('moreCases').innerHTML='<span class="loading-label"><span class="spinner"></span>Buscando fichas…</span>';if(!more)$('caseResults').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
    try{const d=await call('buscarAtendimentosCPT',{...state.caseFilters,pagina:more?state.casePage:0});if(ticket!==state.listRequest||state.route!=='atendimentos')return;state.cases.push(...d.itens);state.casePage=d.proximaPagina;$('caseCount').textContent=num(d.total)+' casos encontrados';$('caseResults').innerHTML=state.cases.length?state.cases.map(caseCard).join(''):empty('Nenhum atendimento encontrado','Altere a situação ou o termo da busca.');$('moreCases').innerHTML=d.proximaPagina!==null?'<button class="button secondary" data-action="more-cases">Carregar mais '+icon('plus')+'</button>':'';
    }catch(e){if(ticket!==state.listRequest||state.route!=='atendimentos')return;$('caseResults').innerHTML=empty('Não foi possível buscar',e.message,'<button class="button" data-action="retry-cases">Tentar novamente</button>');$('moreCases').innerHTML='';$('caseCount').textContent='Consulta não concluída';}}
  document.addEventListener('click',async e=>{if(!e.target.closest('#healthCheck'))return;const b=e.target.closest('#healthCheck');b.disabled=true;try{const r=await call('conferirSaudeCPT');$('detailTitle').textContent='Funcionamento da aplicação';$('detailType').textContent='ADMINISTRAÇÃO';$('detailContent').innerHTML='<p class="muted">Conferência sob demanda. Não altera os dados.</p><div class="health-list">'+r.itens.map(x=>'<section class="answer"><h3>'+esc(x.nome)+'</h3><p>'+esc(num(x.quantidade)+' '+x.unidade)+'</p><p>'+esc(x.orientacao)+'</p></section>').join('')+'</div><p class="small muted">Consulta: '+num(r.tempoServidorMs)+' ms no servidor. A velocidade até seu aparelho também depende da rede.</p>';$('detailDialog').showModal();}catch(err){toast(err.message);}finally{b.disabled=false;}});
  function renderHelp(){$('view').innerHTML=(state.perfil?.papeis.includes('administrador')?'<div class="admin-access"><button class="button secondary" id="healthCheck">Conferir funcionamento</button><button class="button" data-route="equipe">Equipe e acessos →</button></div>':'')+intro('Um lugar para se encontrar','Comece pelo que você precisa fazer agora.')+`<div class="help-grid"><section class="panel"><span class="kpi-icon" style="--accent:#0879df;--tint:#eaf4ff">${icon('home')}</span><h2>Entender o mês</h2><p>A visão do mês reúne os procedimentos pela data em que foram realizados. Participações somam o público informado nos relatos; uma pessoa pode participar de mais de uma atividade.</p><button class="button ghost" data-route="inicio">Abrir visão do mês ${icon('arrow')}</button></section><section class="panel"><span class="kpi-icon" style="--accent:#008978;--tint:#e6f7f1">${icon('records')}</span><h2>Encontrar um relato</h2><p>Escolha o mês e use os filtros. Abra um registro para consultar o texto original e seus anexos. Os arquivos carregam quando você pede para visualizar.</p><button class="button ghost" data-route="registros">Consultar registros ${icon('arrow')}</button></section><section class="panel"><span class="kpi-icon" style="--accent:#d58c31;--tint:#fff3e4">${icon('case')}</span><h2>Acompanhar um atendimento</h2><p>Busque por protocolo, pessoa ou endereço. Os concluídos ficam disponíveis no filtro de situação. Quando um protocolo foi incorporado, a consulta leva à ficha principal.</p><button class="button ghost" data-route="atendimentos">Abrir atendimentos ${icon('arrow')}</button></section><section class="panel"><span class="kpi-icon" style="--accent:#8a70cf;--tint:#f1edfc">${icon('plus')}</span><h2>Registrar o trabalho</h2><p>O botão “Registrar procedimento” abre o formulário oficial. Use a data real da atividade e selecione a obra de referência. Após o envio, a automação inclui o registro na base.</p><div class="dialog-actions">${formLink().replace('button white','button secondary')}</div></section></div><section class="panel help-note"><h2>Seu conforto de leitura</h2><label class="mobile-role">Minha visão<select id="mobileRole">${(state.perfil?.papeis||[]).filter(x=>x!=='administrador').map(x=>`<option value="${x}" ${$('roleView').value===x?'selected':''}>${window.CPTAgenda.names[x]}</option>`).join('')}</select></label><p>Os temas Claro e Escuro ficam no topo. No celular, a navegação principal fica na barra inferior.</p><label class="reduced"><input id="reduceMotion" type="checkbox" ${document.documentElement.dataset.motion==='reduce'?'checked':''}>Reduzir movimentos e animações</label><details><summary>O que está disponível nesta versão?</summary><p>Visão do mês, registros de campo com fotos, consulta de atendimentos com observações da equipe, cronograma compartilhado e preparação de relatos para o relatório. Edição oficial de fichas, recados, contatos e caderno chegam nas próximas etapas. Até lá, alterações oficiais de fichas continuam no controle de atendimento.</p></details><details><summary>Não consigo abrir uma foto ou documento</summary><p>Fotos e fichas ficam no Google Drive e abrem com a sua conta @veolia.com. Se aparecer “Você precisa de acesso”, avise a administração técnica informando o registro ou protocolo.</p></details></section>`;$('mobileRole').addEventListener('change',e=>{$('roleView').value=e.target.value;$('roleView').dispatchEvent(new Event('change'));});$('reduceMotion').addEventListener('change',e=>{document.documentElement.dataset.motion=e.target.checked?'reduce':'normal';store.set('cpt.motion',e.target.checked?'reduce':'normal');toast('Preferência de movimento salva.');});}
  function navigate(route,filter){if(!['inicio','registros','atendimentos','ajuda','cronograma','equipe'].includes(route))return;clearTimeout(debounce);state.route=route;++state.listRequest;state.cursor=null;state.casePage=null;
    if(filter==='relatos')state.filters.procedimento='Relato de atividade';if(route==='atendimentos'&&filter)state.caseFilters.estado=filter;
    document.querySelectorAll('.nav-item').forEach(b=>{const active=b.dataset.route===route;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    $('pageLabel').textContent={inicio:'Visão do mês',registros:'Registros',atendimentos:'Atendimentos',ajuda:'Como usar',cronograma:'Cronograma',equipe:'Equipe e acessos'}[route];
    ({inicio:renderHome,registros:renderRecords,atendimentos:renderCases,ajuda:renderHelp,cronograma:window.CPTAgenda.render,equipe:window.CPTAgenda.team}[route])();window.scrollTo({top:0,behavior:'auto'});}
  async function loadHome(){const ticket=++state.homeRequest;const requested=state.mes;notice('');if(window.CPT_BOOT){window.CPT_BOOT.stage='consultando base';} $('refresh').disabled=true;if(state.route==='inicio')$('view').innerHTML=skeleton();
    try{const d=await call('carregarInicioCPT',requested);if(ticket!==state.homeRequest)return;if(!d||!d.indicadores||!d.perfil||!Array.isArray(d.perfil.papeis))throw new Error('A base não retornou os dados esperados. Confira se todos os arquivos são da versão 2.0.0.');state.home=d;if(!state.perfil)configureProfile(d.perfil);$('updated').textContent='Atualizado às '+new Date(d.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});if(state.route==='inicio')renderHome();else if(state.route==='registros')renderRecords();else if(state.route==='ajuda')renderHelp();
      window.CPT_BOOT?.finish();if(window.CPT_PREVIA)notice('Prévia visual com dados fictícios. Nenhuma informação desta tela foi lida ou gravada na sua planilha.');
    }catch(e){if(ticket!==state.homeRequest)return;notice(e.message);if(state.route==='inicio')$('view').innerHTML=empty('Vamos restabelecer a conexão',e.message,'<button class="button" data-action="retry-home">Tentar novamente</button><button class="button secondary" data-check-access>Conferir meu acesso</button><p id="accessResult" style="white-space:pre-line"></p>');window.CPT_BOOT?.finish();}finally{if(ticket===state.homeRequest)$('refresh').disabled=false;}}
  function summary(pairs){return '<dl class="detail-summary">'+pairs.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v||'Não informado')}</dd></div>`).join('')+'</dl>';}
  function value(v){if(Array.isArray(v))return v.map(value).join('\n');if(v&&typeof v==='object')return Object.entries(v).map(([k,x])=>k+': '+value(x)).join('\n');return String(v??'');}
  async function openDetail(kind,id){const ticket=++state.detailRequest;activeDocument=null;historyCursor=null;$('detailType').textContent=kind==='record'?'REGISTRO DE CAMPO':'ATENDIMENTO';$('detailTitle').textContent='Carregando detalhes';$('detailContent').innerHTML='<div class="loading-label"><span class="spinner"></span>Abrindo as informações…</div>';$('detailDialog').showModal();
    try{const d=await call(kind==='record'?'abrirRegistroCPT':'abrirAtendimentoCPT',id);if(ticket!==state.detailRequest||!$('detailDialog').open)return;
      if(kind==='record'){const r=d.registro;$('detailTitle').textContent=r.atividade||r.procedimento;
        $('detailContent').innerHTML=readingTools()+(/relato de atividade/i.test(r.procedimento)&&state.perfil?.papeis.some(p=>['administrador','administrativo','gestao','socioambiental','comunicacao'].includes(p))?`<div class="reading-tools"><button class="button" data-prepare-relato="${esc(r.id)}">Preparar para o relatório</button></div>`:'')+summary([['Procedimento',r.procedimento],['Data de realização',date(r.data)],['Bairro',r.bairro],['Responsável',r.responsavel],['Obra de referência',r.obra],['Origem',r.origem],['Público informado',r.publico==null?'Não informado':String(r.publico)]])+`<p class="document-id">Registro: ${esc(r.id)}</p>`+
          (r.conferencia?`<details class="help-note"><summary>Conferência do registro</summary><p>${esc(r.conferencia)}</p><p>ID: ${esc(r.id)}</p></details>`:'')+
          (d.anexos.length?`<h3 class="answers-head">Arquivos e evidências</h3><div class="attachments">${d.anexos.map((a,i)=>`<div class="attachment"><p>${esc(a.titulo||'Anexo '+(i+1))}</p><button class="button secondary" data-preview="${esc(a.id)}">Visualizar</button> <a href="${esc(safeURL(a.url))}" target="_blank" rel="noopener noreferrer">Abrir no Drive</a></div>`).join('')}</div><div id="mediaPreview"></div>`:'')+
          sections(d.campos);
      }else{const f=d.ficha;$('detailTitle').textContent=f.protocolo+' · '+(f.nome||'Atendimento');const docs=[['Abrir ficha',f.documento],['Abrir PDF',f.pdf]].filter(([,u])=>safeURL(u));
        $('detailContent').innerHTML=readingTools()+`<span class="badge ${f.concluido?'green':'orange'}">${esc(f.concluido?'Atendimento concluído':f.status)}</span><div class="dialog-actions">${docs.map(([l,u])=>`<a class="button secondary" href="${esc(safeURL(u))}" target="_blank" rel="noopener noreferrer">${icon('file')}${l} ${icon('link')}</a>`).join('')}</div>`+
          (d.protocoloConsultado!==f.protocolo?`<div class="notice">O protocolo ${esc(d.protocoloConsultado)} está incorporado à ficha principal ${esc(f.protocolo)}.</div>`:'')+
          summary([['Assunto',f.assunto],['Endereço',f.endereco],['Abertura',date(f.abertura)],['Conclusão',date(f.conclusao)],['Área responsável',f.area],['Responsável',f.responsavel],['Frente de obra',f.obra],['Origem',f.origem]])+
          `<section class="answer"><h3>Próxima ação registrada</h3><p>${esc(f.proximaAcao||'Não informada')}</p></section><section class="answer"><h3>Atualização operacional</h3><p>${esc(value(f.atualizacao)||'Não informada')}</p></section><section class="case-notes" aria-labelledby="notesTitle"><h3 class="answers-head" id="notesTitle">Observações da equipe</h3><p class="small muted">Registre o que você soube sobre este caso. A observação fica com seu nome e não altera a ficha oficial.</p><form id="noteForm" data-protocol="${esc(f.protocolo)}"><div id="noteError" class="notice" hidden></div><label class="field">Por onde a informação chegou<select name="canal" required><option value="">Escolha</option>${['Escritório','Campo / itinerante','Telefone ou WhatsApp','E-mail','Reunião','Outro'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Observação<textarea name="texto" rows="3" maxlength="2000" required placeholder="Ex.: Moradora procurou a equipe na rua e informou que o vazamento voltou."></textarea></label><button class="button" type="submit">Registrar observação</button></form><div id="caseNotes"><p class="muted">Carregando observações…</p></div></section><p class="small muted">Alterações oficiais da ficha continuam com o Atendimento.</p><div class="reading-tools"><button class="button secondary" data-reading="history">Consultar histórico importado</button></div><div id="caseHistory"></div>`;loadNotes(f.protocolo,ticket);
      }
      activeDocument={kind,id,title:$('detailTitle').textContent};
    }catch(e){if(ticket===state.detailRequest)$('detailContent').innerHTML=empty('Não foi possível abrir',e.message);}}

  function readingTools(){return '<div class="reading-tools"><button class="button secondary" data-reading="copy">Copiar conteúdo</button><button class="button secondary" data-reading="print">Imprimir / salvar PDF</button></div>';}
  function sections(campos){const groups=new Map();campos.forEach(x=>{const key=x.secao||'Respostas do registro';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x);});return '<h3 class="answers-head">O que foi registrado</h3>'+([...groups].map(([name,items])=>'<details class="report-section" open><summary>'+esc(name)+' · '+items.length+' respostas</summary>'+items.map(x=>'<section class="answer"><h3>'+esc(x.titulo)+'</h3><p>'+esc(value(x.valor))+'</p></section>').join('')+'</details>').join('')||'<p>Não há campos adicionais neste registro.</p>');}
  function documentClone(){const clone=$('detailContent').cloneNode(true);clone.querySelectorAll('.reading-tools,iframe,#mediaPreview').forEach(e=>e.remove());clone.querySelectorAll('button').forEach(e=>e.remove());clone.querySelectorAll('details').forEach(e=>e.open=true);return clone;}
  document.addEventListener('click',async ev=>{const button=ev.target.closest('[data-reading]');if(!button||!activeDocument)return;const doc=activeDocument;
    if(button.dataset.reading==='copy'){const clone=documentClone();clone.querySelectorAll('h3,p,dt,dd,summary').forEach(e=>e.appendChild(document.createTextNode('\n')));const text=doc.title+'\n\n'+clone.textContent;try{await navigator.clipboard.writeText(text);toast('Conteúdo copiado.');}catch(e){toast('O navegador bloqueou a cópia. Selecione o texto da ficha para copiar.');}return;}
    if(button.dataset.reading==='print'){const old=$('printDetail');if(old)old.remove();const paper=document.createElement('article');paper.id='printDetail';const title=document.createElement('h1');title.textContent=doc.title;paper.append(title,documentClone());document.body.append(paper);document.body.classList.add('printing-detail');$('detailDialog').close();try{window.print();}finally{document.body.classList.remove('printing-detail');paper.remove();if(activeDocument===doc)$('detailDialog').showModal();}return;}
    if(button.dataset.reading==='history'&&!historyBusy){historyBusy=true;button.disabled=true;try{const response=await call('consultarHistoricoFichaCPT',{protocolo:doc.id,cursor:historyCursor});if(activeDocument!==doc||!$('caseHistory'))return;const box=$('caseHistory');if(historyCursor==null)box.innerHTML='';box.insertAdjacentHTML('beforeend',response.itens.map(x=>'<section class="history-item"><h3>'+esc(x.tipo||'Movimentação')+'</h3><p>'+esc(x.data+' · '+x.status)+'</p><p>'+esc(x.resumo||'Sem resumo informado')+'</p><p class="small muted">'+esc(x.protocolo+' · '+(x.autor||'Autor não informado'))+'</p></section>').join(''));if(!response.itens.length&&!historyCursor)box.textContent=response.aviso||'Nenhuma movimentação importada localizada.';historyCursor=response.proximoCursor;button.hidden=historyCursor==null;button.textContent='Carregar mais histórico';}catch(e){toast(e.message);}finally{historyBusy=false;button.disabled=false;}}
  });
  document.addEventListener('click',async ev=>{const button=ev.target.closest('[data-check-access]');if(!button)return;button.disabled=true;try{const r=await call('conferirMeuAcessoCPT');const box=$('accessResult');if(box)box.textContent=r.etapas.map(x=>(x.ok?'OK':'VERIFICAR')+' · '+x.nome+': '+x.mensagem).join('\n');}catch(e){const box=$('accessResult');if(box)box.textContent=e.message;}finally{button.disabled=false;}});
  function closeDetail(){activeDocument=null;++state.detailRequest;$('detailDialog').close();$('detailContent').innerHTML='';}
  document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route,route.dataset.filter);return;}const record=e.target.closest('[data-record]');if(record){openDetail('record',record.dataset.record);return;}const c=e.target.closest('[data-case]');if(c){openDetail('case',c.dataset.case);return;}
    const preview=e.target.closest('[data-preview]');if(preview&&/^[A-Za-z0-9_-]{10,}$/.test(preview.dataset.preview)){const frame=document.createElement('iframe');frame.className='media-frame';frame.src='https://drive.google.com/file/d/'+encodeURIComponent(preview.dataset.preview)+'/preview';frame.title='Visualização do arquivo';frame.allow='fullscreen';$('mediaPreview').replaceChildren(frame);return;}
    const a=e.target.closest('[data-action]')?.dataset.action;if(a==='more-records')loadRecords(true);if(a==='more-cases')loadCases(true);if(a==='retry-records')loadRecords();if(a==='retry-cases')loadCases();if(a==='retry-home')loadHome();if(a==='retry-boot')bootstrap();if(a==='noform')toast('O link do formulário ainda não está disponível. Confira a aba Início da base.');if(a==='clear'){state.filters={busca:'',procedimento:'',bairro:'',obra:'',pendencia:''};renderRecords();}});
  $('closeDialog').addEventListener('click',closeDetail);$('detailDialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});
  $('theme').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;store.set('cpt.theme',e.target.value);toast('Aparência salva neste navegador.');});
  $('month').addEventListener('change',()=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test($('month').value)){toast('Selecione um mês válido.');return;}state.mes=$('month').value;state.home=null;++state.listRequest;if(state.route==='cronograma'){window.CPTAgenda.render();}if(state.route==='registros')$('view').innerHTML=skeleton();loadHome();});
  $('refresh').addEventListener('click',()=>{if(state.route==='cronograma'){window.CPTAgenda.render();}else if(state.route==='equipe'){window.CPTAgenda.team();}else if(state.route==='atendimentos'){loadCases();}else{loadHome();}});
  window.addEventListener('offline',()=>notice('Você está sem conexão. As consultas precisam de internet; os dados já exibidos continuam na tela.'));
  window.addEventListener('online',()=>{notice('');toast('Conexão restabelecida. Use Atualizar para consultar novamente.');});
  function configureProfile(p){if(!p)return;state.perfil=p;const select=$('roleView'),saved=store.get('cpt.view'),previous=select.value;const views=p.papeis.filter(x=>x!=='administrador');const list=views.length?views:p.papeis;select.innerHTML=list.map(role=>`<option value="${esc(role)}">${esc(window.CPTAgenda.names[role])}</option>`).join('');select.value=list.includes(previous)?previous:list.includes(saved)?saved:list[0];select.disabled=list.length<2;document.querySelector('[data-route="equipe"]').hidden=!p.papeis.includes('administrador');$('accountLabel').textContent=p.nome+' · '+p.email;$('accountLabel').title=p.email;}
  async function loadNotes(protocolo,ticket){const box=$('caseNotes');if(!box)return;try{const r=await call('listarObservacoesCPT',{protocolo});if(ticket!==state.detailRequest||!$('caseNotes'))return;$('caseNotes').innerHTML=r.itens.length?r.itens.map(noteItem).join(''):'<p class="muted">Nenhuma observação registrada ainda.</p>';}catch(e){if($('caseNotes'))$('caseNotes').innerHTML='<p class="muted">'+esc(e.message)+'</p>';}}
  function noteItem(x){const quando=x.em?new Date(x.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'}):'';return `<section class="history-item"><h3>${esc(x.nome||x.autor)}</h3><p class="small muted">${esc(quando+' · '+x.canal+(x.consultado&&x.consultado!==x.protocolo?' · protocolo '+x.consultado:''))}</p><p style="white-space:pre-line">${esc(x.texto)}</p></section>`;}
  let noteOp=null,noteSignature='';
  document.addEventListener('submit',async ev=>{const form=ev.target.closest('#noteForm');if(!form)return;ev.preventDefault();const b=form.querySelector('button[type=submit]'),err=$('noteError');const f=new FormData(form),payload={protocolo:form.dataset.protocol,canal:f.get('canal'),texto:String(f.get('texto')||'').trim()};if(!payload.canal||!payload.texto){err.textContent='Escolha o canal e escreva a observação.';err.hidden=false;return;}
    const sig=JSON.stringify(payload);if(sig!==noteSignature){noteOp='OP-'+crypto.randomUUID();noteSignature=sig;}b.disabled=true;b.textContent='Registrando…';err.hidden=true;
    try{const r=await call('adicionarObservacaoCPT',{...payload,operacaoId:noteOp});toast(r.resultado);form.reset();noteSignature='';const box=$('caseNotes');if(box){if(box.querySelector('.muted:only-child'))box.innerHTML='';box.insertAdjacentHTML('afterbegin',noteItem(r.observacao));}}
    catch(e){err.textContent=e.message+' Seu texto continua no campo.';err.hidden=false;}finally{b.disabled=false;b.textContent='Registrar observação';}});
  function accessError(message){const r=$('roleView');r.innerHTML='<option value="">Sem acesso</option>';r.disabled=true;$('accountLabel').textContent='Acesso não confirmado';document.querySelectorAll('.nav-item').forEach(b=>{if(b.dataset.route!=='ajuda')b.hidden=true;});
    $('view').innerHTML=`<div class="page-intro"><div><div class="eyebrow muted">ACESSO</div><h1>Não conseguimos liberar sua entrada</h1><p>${esc(message)}</p></div></div><section class="panel"><p>Nada foi alterado. Você pode tentar de novo ou conferir em qual etapa o acesso parou e enviar o resultado para a administração técnica.</p><div class="dialog-actions"><button class="button" data-action="retry-boot">Tentar novamente</button><button class="button secondary" data-check-access>Conferir meu acesso</button></div><p id="accessResult" style="white-space:pre-line"></p></section>`;}
  async function bootstrap(){if(window.CPT_BOOT)window.CPT_BOOT.stage='verificando acesso';const r=$('roleView');r.innerHTML='<option value="">Verificando acesso…</option>';r.disabled=true;$('accountLabel').textContent='Verificando acesso…';$('view').innerHTML='<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Verificando seu acesso…</div>';
    try{const d=await call('carregarPerfilCPT');if(!d||!d.perfil||!Array.isArray(d.perfil.papeis))throw new Error('Resposta de acesso inesperada. Confira se todos os arquivos da versão 2.0.0 foram publicados.');document.querySelectorAll('.nav-item').forEach(b=>{if(b.dataset.route!=='equipe')b.hidden=false;});configureProfile(d.perfil);navigate('inicio');loadHome();}
    catch(e){accessError(e.message);window.CPT_BOOT?.finish();}}
  $('roleView').addEventListener('change',()=>{store.set('cpt.view',$('roleView').value);navigate('inicio');toast('Visão de '+window.CPTAgenda.names[$('roleView').value]+'. Sua conta permanece a mesma.');});
  if(!window.CPTAgenda||typeof window.CPTAgenda.init!=='function')throw new Error('O componente Agenda.html está ausente ou não iniciou. Substitua-o pelo arquivo completo da versão 2.0.0.');
  window.CPTAgenda.init({call,esc,date,num,intro,toast,formLink,state,navigate,view:$('view')});
  window.CPTEntregas.init({call});
  bootstrap();
})();
</script>
