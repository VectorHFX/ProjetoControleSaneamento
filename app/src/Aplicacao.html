<head><meta charset="utf-8"><script>
(function(){
  var boot=window.CPT_BOOT={stage:'inicializacao',ready:false};
  function show(message){
    if(boot.ready)return;
    boot.stage='erro';
    var draw=function(){
      var account=document.getElementById('accountLabel');if(account)account.textContent='Conexão não concluída';
      var box=document.getElementById('bootError');if(!box){box=document.createElement('section');box.id='bootError';box.setAttribute('role','alert');box.style.cssText='margin:20px;padding:20px;border:1px solid #b54848;border-radius:12px;background:#fff;color:#242c38;font:15px/1.6 system-ui';
        var title=document.createElement('h2');title.textContent='Não foi possível iniciar a aplicação';box.appendChild(title);
        var msg=document.createElement('p');msg.id='bootMessage';box.appendChild(msg);
        var help=document.createElement('p');help.textContent='Se continuar, envie esta mensagem para a administração técnica.';box.appendChild(help);
        var button=document.createElement('button');button.textContent='Tentar novamente';button.style.cssText='padding:12px 18px;cursor:pointer';button.onclick=function(){location.reload();};box.appendChild(button);
        (document.getElementById('view')||document.body).prepend(box);
      }
      document.getElementById('bootMessage').textContent=message;
    };
    if(document.body)draw();else document.addEventListener('DOMContentLoaded',draw,{once:true});
  }
  boot.fail=show;boot.finish=function(){boot.ready=true;boot.stage='pronto';clearTimeout(boot.timer);var b=document.getElementById('bootError');if(b)b.remove();};
  window.addEventListener('error',function(e){if(!boot.ready&&e.message)show('Inicialização: '+e.message);});
  window.addEventListener('unhandledrejection',function(e){if(!boot.ready)show('Inicialização: '+String(e.reason&&e.reason.message||e.reason||'Falha inesperada'));});
  boot.timer=setTimeout(function(){show('A inicialização não terminou. Etapa: '+boot.stage+'. Verifique a versão publicada e a conexão.');},50000);
  try{var t=localStorage.getItem('cpt.theme');document.documentElement.dataset.theme=t==='dark'?'dark':'light';/* 2.22: tema do mês (cores da campanha de saúde do mês) por cima do Claro */if(t==='mes')document.documentElement.dataset.campanha=new Intl.DateTimeFormat('en-US',{month:'numeric',timeZone:'America/Sao_Paulo'}).format(new Date());/* 2.24: visual novo (proprietário nos testes) já na abertura, sem piscar */if(localStorage.getItem('cpt.visual')==='v3'){document.documentElement.dataset.visual='v3';var f=document.createElement('link');f.id='fonteV3';f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap';document.head.appendChild(f);}}catch(e){}
})();
</script><base target="_top"><?!= incluirCPT_('Estilos'); ?></head>
