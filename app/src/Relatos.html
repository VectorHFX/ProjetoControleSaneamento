<script>
window.CPTRelatos=(()=>{let ui=null,dados=null,parte="relatos",ticket=0,filtro={busca:"",bairro:"",meus:false,pontos:false},limite=24,buscaTimer=null;const $=id=>document.getElementById(id),POR_VEZ=24;const norm=v=>String(v==null?"":v).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();function abas(){return"<div class=\"segmented painel-tabs\" role=\"tablist\" aria-label=\"Partes de Relatos\">".concat([["relatos","Relatos"],["outros","Outros registros"]].map(([k,t])=>"<button role=\"tab\" aria-selected=\"".concat(parte===k,"\" class=\"").concat(parte===k?"chosen":"","\" data-rel-parte=\"").concat(k,"\">").concat(t,"</button>")).join(""),"</div>")}function cabecalho(){return ui.intro("Relatos","Os relatos de atividade do m\xEAs. Quem fez a atividade v\xEA aqui o que pode melhorar no texto, com dicas; a Gest\xE3o e o Administrativo veem todos.")}function render(){if((ui.state.filters||{}).pendencia)parte="outros";if(parte==="outros"){ui.renderRecords();return}carregar()}async function carregar(){const mine=++ticket,mes=ui.state.mes;if(!dados||dados.mes!==mes){limite=POR_VEZ;ui.view.innerHTML=cabecalho()+abas()+"<div class=\"loading-label\"><span class=\"spinner\"></span>Reunindo os relatos do m\xEAs\u2026</div><div class=\"skel-list\" aria-hidden=\"true\"><div class=\"skeleton\"></div><div class=\"skeleton\"></div></div>"}try{const d=await ui.call("carregarRelatosCPT",{mes});if(mine!==ticket||ui.state.route!=="registros"||parte!=="relatos")return;dados=d;desenhar()}catch(e){if(mine===ticket&&ui.state.route==="registros"&&parte==="relatos")ui.view.innerHTML=cabecalho()+abas()+"<div class=\"notice\">".concat(ui.esc(e.message),"</div>")}}function lista(){const b=norm(filtro.busca);return dados.itens.filter(r=>(!filtro.bairro||r.bairro===filtro.bairro)&&(!filtro.meus||r.meu)&&(!filtro.pontos||r.pontos&&r.pontos.length)&&(!b||norm([r.atividade,r.bairro,r.frente,r.responsavel,r.apoio,r.resumo].join(" ")).includes(b)))}function pontos(r){if(!r.pontos)return"";if(!r.pontos.length)return"<p class=\"rel-ok small\">".concat(ui.icon("check")," Relato completo: tem o qu\xEA, onde, p\xFAblico, resultado e encaminhamento.</p>");return"<details class=\"rel-pontos\"><summary>".concat(r.pontos.length," ").concat(r.pontos.length===1?"ponto":"pontos"," para melhorar <small>").concat(r.meu?"s\xF3 voc\xEA, quem participou e a gest\xE3o veem":"vis\xEDvel para quem participou e a gest\xE3o","</small></summary><ul>").concat(r.pontos.map(p=>"<li><strong>".concat(ui.esc(p.nome),":</strong> ").concat(ui.esc(p.dica),"</li>")).join(""),"</ul></details>")}function cartao(r){const pessoas=[r.responsavel,r.apoio?"apoio: "+r.apoio:""].filter(Boolean).join(" \xB7 ");return"<article class=\"relato-card rel-card".concat(r.meu?" is-meu":"","\"><div class=\"card-top\"><span class=\"badge\">").concat(ui.esc(ui.date(r.data)),"</span>").concat(r.bairro?"<span class=\"badge\">".concat(ui.esc(r.bairro),"</span>"):"").concat(r.meu?"<span class=\"badge status-concluida\">seu</span>":"","<span class=\"small muted\">").concat(r.publico!=null?ui.num(r.publico)+" pessoas":"p\xFAblico n\xE3o informado").concat(r.fotos?" \xB7 "+r.fotos+(r.fotos===1?" foto":" fotos"):"","</span></div>\n      <h4>").concat(ui.esc(r.atividade),"</h4>").concat(r.frente?"<p class=\"small muted\">".concat(ui.esc(r.frente),"</p>"):"","<p class=\"small\">").concat(ui.esc(pessoas),"</p>\n      ").concat(r.resumo?"<p class=\"relato-text\">".concat(ui.esc(r.resumo),"</p>"):"<p class=\"small late-text\">Relato sem texto no registro.</p>","\n      ").concat(pontos(r)).concat(r.devolutiva?"<p class=\"devolutiva-status small\"><strong>Coment\xE1rio da gest\xE3o".concat(r.devolutiva.situacao==="vista"?" (visto)":"",":</strong> ").concat(ui.esc(r.devolutiva.comentario),"</p>"):"","\n      <div class=\"card-bottom\"><span><button class=\"button ghost\" type=\"button\" data-rel-rdas=\"").concat(ui.esc(r.id),"\">Abrir no RDAS</button></span><span><button class=\"button ghost\" type=\"button\" data-record=\"").concat(ui.esc(r.id),"\">Registro completo</button></span></div></article>")}function desenhar(manterFoco){if(ui.state.route!=="registros"||parte!=="relatos"||!dados)return;const l=lista(),vis=l.slice(0,limite),meus=dados.itens.filter(r=>r.meu).length,pos=manterFoco?document.activeElement.selectionStart:null;const chip=(k,t)=>"<label class=\"chip-opcao\"><input type=\"checkbox\" data-rel-chip=\"".concat(k,"\" ").concat(filtro[k]?"checked":"","><span>").concat(t,"</span></label>");ui.view.innerHTML=cabecalho()+abas()+"<section class=\"panel filter-panel\"><form id=\"relFiltros\" class=\"filters rel-filtros\" onsubmit=\"return false\"><label class=\"field\">Procurar<span class=\"search-input\">".concat(ui.icon("search"),"<input id=\"relBusca\" value=\"").concat(ui.esc(filtro.busca),"\" placeholder=\"Atividade, bairro, pessoa ou palavra do relato\" maxlength=\"100\"></span></label>\n        <label class=\"field\">Bairro<select id=\"relBairro\"><option value=\"\">Todos</option>").concat(dados.bairros.map(b=>"<option ".concat(filtro.bairro===b?"selected":"",">").concat(ui.esc(b),"</option>")).join(""),"</select></label>\n        <div class=\"chip-linha rel-chips\">").concat(meus?chip("meus","Os meus ("+meus+")"):"").concat(dados.gerencia?chip("pontos","Com pontos para melhorar"):"","</div></form></section>\n      <div class=\"results-head\"><span>").concat(l.length," ").concat(l.length===1?"relato":"relatos"," \xB7 ").concat(ui.esc(ui.monthLabel?ui.monthLabel(ui.state.mes):ui.state.mes),"</span></div>\n      <div class=\"rel-cards\">").concat(vis.map(cartao).join("")||"<p class=\"empty-line\">Nenhum relato com esse filtro neste m\xEAs.</p>","</div>\n      ").concat(l.length>vis.length?"<div class=\"load-more\"><button class=\"button secondary\" type=\"button\" data-rel-mais>Mostrar mais (".concat(l.length-vis.length,")</button></div>"):"");if(manterFoco){const i=$("relBusca");if(i){i.focus();i.setSelectionRange(pos,pos)}}}async function abrirRdas(btn){const w=window.open("","_blank"),txt=btn.textContent;btn.disabled=true;btn.textContent="Procurando a ficha\u2026";try{const r=await ui.call("abrirNoRdasCPT",btn.dataset.relRdas);if(w&&!w.closed){try{w.opener=null}catch(_){}w.location.href=r.url}else window.open(r.url,"_blank","noopener");if(!r.achou)ui.toast(r.texto)}catch(e){if(w&&!w.closed)w.close();ui.toast(e.message)}finally{btn.disabled=false;btn.textContent=txt}}function init(api){ui=api;document.addEventListener("click",e=>{if(ui.state.route!=="registros")return;const t=e.target.closest("[data-rel-parte],[data-rel-rdas],[data-rel-mais]");if(!t)return;if(t.dataset.relParte){if(t.dataset.relParte===parte)return;parte=t.dataset.relParte;if(parte==="relatos")ui.state.filters={busca:"",procedimento:"",bairro:"",obra:"",pendencia:""};render();return}if(t.dataset.relRdas){abrirRdas(t);return}if(t.hasAttribute("data-rel-mais")){limite+=POR_VEZ;desenhar()}});document.addEventListener("input",e=>{if(ui.state.route!=="registros"||e.target.id!=="relBusca")return;filtro.busca=e.target.value;limite=POR_VEZ;clearTimeout(buscaTimer);buscaTimer=setTimeout(()=>{if($("relBusca"))desenhar(true)},220)});document.addEventListener("change",e=>{if(ui.state.route!=="registros")return;if(e.target.id==="relBairro"){filtro.bairro=e.target.value;limite=POR_VEZ;desenhar()}else if(e.target.dataset.relChip){filtro[e.target.dataset.relChip]=e.target.checked;limite=POR_VEZ;desenhar()}})}return{init,render,abas,irPara:p=>{parte=p}}})();
</script>
