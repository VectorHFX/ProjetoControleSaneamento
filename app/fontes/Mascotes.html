    return `<g clip-path="url(#${ID}t)"><path d="M30,${y0} H170 V${y1} Q100,${y1 + 10} 30,${y1} Z" fill="${cor}"/>${S.semCorpo ? '' : `<path d="M100,160 L86,120 L114,120 Z" fill="${S.corPeito || S.c[0]}"/>`}<rect x="30" y="${S.semCorpo ? y0 + 14 : 166}" width="140" height="6" rx="3" fill="${faixa}"/></g>`;
  }

  /**
   * SVG do mascote. equipado: {slot: id}. cor: chave de CORES (vazio = cor da espécie). expressao: normal (padrão), feliz, surpreso,
   * pensativo, dormindo, comemorando, triste (2.50). .m-all respira e .m-eyes pisca (CSS; desligado com movimento reduzido).
   */
  function desenhar(especie, equipado, tam, rotulo, cor, expressao) {
    const S = ELENCO[especie] || ELENCO[PADRAO], q = equipado || {}, e = expressao || 'normal', V1 = window.CPTMascoteV1;
    ID = 'mv' + (++seq);
    const base = CORES[cor] || S.c, c = {p: base[0], cl: base[1], e: mix(base[0], '#000000', .35)}, R = S.rosto, P = [];
    const pose = e === 'comemorando' ? 'cima' : e === 'pensativo' ? 'queixo' : 'baixo';
    // pensando: a mão vai ao queixo; com ferramenta na direita, quem pensa é a esquerda (a ferramenta não cobre o rosto)
    const queixo = q.mao ? -1 : 1;
    const S2 = {...S, corPeito: S.peito ? c.cl : c.p};
    P.push(`<defs><linearGradient id="${ID}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity=".18"/></linearGradient>
      <radialGradient id="${ID}r" cx=".36" cy=".26" r=".92" fx=".3" fy=".18"><stop offset="0" stop-color="#fff" stop-opacity=".36"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset=".72" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity=".22"/></radialGradient>
      <radialGradient id="${ID}s"><stop offset="0" stop-color="#2a1a0c" stop-opacity=".2"/><stop offset=".55" stop-color="#2a1a0c" stop-opacity=".09"/><stop offset="1" stop-color="#2a1a0c" stop-opacity="0"/></radialGradient>
      <radialGradient id="${ID}i"><stop offset="0" stop-color="#b07a48" stop-opacity=".95"/><stop offset="1" stop-color="#b07a48" stop-opacity="0"/></radialGradient>
      <radialGradient id="${ID}b"><stop offset="0" stop-color="${BOCHECHA}" stop-opacity=".95"/><stop offset=".6" stop-color="${BOCHECHA}" stop-opacity=".55"/><stop offset="1" stop-color="${BOCHECHA}" stop-opacity="0"/></radialGradient>
      <clipPath id="${ID}t"><path d="${S.semCorpo ? S.cab : S.corpo}"/></clipPath></defs><ellipse cx="100" cy="226" rx="${especie === 'gota' ? 40 : 52}" ry="7" fill="#3a2410" opacity=".12"/>`);
    const xp = {S, c, k: S.capacete, R, n: S.pescoco, m: null};
    // Peça nova (chibi) quando existe; senão, a antiga reposicionada.
    const peca = (slot, tr) => { const id = q[slot]; if (!id) return ''; if (P2[id]) return P2[id](xp); if (!V1) return ''; const svg = V1.peca(id); return svg ? `<g transform="${tr || encaixe(S, slot)}">${svg}</g>` : ''; };
    P.push(peca('costas'));
    if (S.atras) P.push(S.atras(c, e));
    // pezinhos: bota preta e botina mudam a cor do pé
    const corPe = PES[q.pes] || null;
    S.pes.forEach(([x, y, rx, ry, cp]) => P.push(f(ell(x, y, rx, ry), corPe || cp || c.p) + (corPe ? `<path d="M${x - rx + 2},${y + ry - 2} Q${x},${y + ry + 2} ${x + rx - 2},${y + ry - 2}" fill="none" stroke="#00000040" stroke-width="2.4" stroke-linecap="round"/><circle cx="${x}" cy="${y - ry * .35}" r="1.6" fill="#ffffff60"/>`
      : especie === 'gota' ? '' : linha(`M${x - rx * .32},${y - ry * .1} v${ry * .7} M${x + rx * .32},${y - ry * .1} v${ry * .7}`, 1.5, '#00000030'))));
    // corpo, barriga, roupas
    if (!S.semCorpo) { P.push(f(S.corpo, c.p)); if (S.barriga) P.push(`<path d="${S.barriga}" fill="${c.cl}"/>`); if (S.peito) P.push(`<path d="${S.peito}" fill="${c.cl}"/>`); }
    if (S.listras) P.push(`<g clip-path="url(#${ID}t)"><rect x="30" y="160" width="140" height="11" fill="#3b302a"/><rect x="30" y="186" width="140" height="11" fill="#3b302a"/></g>`);
    const roupa = () => COLETES[q.corpo] ? colete(S2, ID, COLETES[q.corpo][0], COLETES[q.corpo][1]) : CAMISAS[q.corpo] ? camisa(q.corpo, S2, c, ID, q.broche === 'laco-do-mes') : q.corpo && V1 ? `<g clip-path="url(#${ID}t)"><g transform="${encaixe(S, 'corpo')}">${V1.camisa(q.corpo)}</g></g>` : '';
    const manga = CAMISAS[q.corpo] ? CAMISAS[q.corpo].manga : null;
    if (!S.semCorpo) P.push(roupa(), `<g clip-path="url(#${ID}t)"><ellipse cx="${S.pescoco[0]}" cy="${S.pescoco[1] + 2}" rx="${((S.caixa[2] - S.caixa[0]) * .46).toFixed(1)}" ry="13" fill="url(#${ID}s)"/></g>`);
    // cabeça
    P.push(f(S.cab, S.corCab || c.p));
    if (S.barriga && S.semCorpo) P.push(`<path d="${S.barriga}" fill="${c.cl}"/>`);
    if (S.semCorpo) P.push(roupa());
    if (S.depoisCab) P.push(S.depoisCab(c, e));
    if (S.olhosFundo) P.push(S.olhosFundo(e));
    P.push(olhos(e, R.x, R.y, R.d, R));
    if (R.forte) P.push(linha(`M${R.x - R.d - 9},${R.y - 13 + (e === 'surpreso' ? -3 : 0)} l14,${e === 'surpreso' ? 0 : 4} M${R.x + R.d + 9},${R.y - 13 + (e === 'surpreso' ? -3 : 0)} l-14,${e === 'surpreso' ? 0 : 4}`, 3));
    if (R.calmo && !['feliz', 'comemorando', 'dormindo', 'surpreso'].includes(e)) P.push(linha(`M${R.x - R.d - 6},${R.y - 4} h12 M${R.x + R.d - 6},${R.y - 4} h12`, 3.4, c.p));
    P.push(bochechas(e, R.x, R.y + (especie === 'sapo' ? 14 : 0), R.d + (especie === 'sapo' ? 6 : 0)));
    P.push(S.focinho(e, c));
    P.push(peca('rosto'), peca('pescoco'));
    if (q.broche === 'laco-do-mes') P.push(lacoDoMes(S));
    // braços na frente do corpo, curvos e gordinhos; luvinha com polegar
    const mao = lado => { const [sx, sy] = S.ombros[lado < 0 ? 0 : 1];
      if (pose === 'cima') return [sx + lado * 20, sy - S.mao * .9]; if (pose === 'queixo' && lado === queixo) return [R.x + lado * 18, R.y + (S.boca ? S.boca - R.y - 2 : 24)]; return [sx + lado * 4, sy + S.mao * .92]; };
    const cotovelo = (lado, sx, sy) => pose === 'cima' ? [sx + lado * 26, sy - S.mao * .15] : pose === 'queixo' && lado === queixo ? [sx + lado * 26, sy + 16] : [sx + lado * 15, sy + S.mao * .38];
    const luva = LUVAS[q.luvas] || '';
    const patinha = (lado, mx, my, w) => { const r = w * .66;
      if (!luva) return f(ell(mx, my, r, r * .92), S.asa ? c.p : c.cl) + (S.asa ? '' : linha(`M${mx - r * .3},${my + r * .2} v${r * .5} M${mx + r * .3},${my + r * .2} v${r * .5}`, 1.3, '#00000026'));
      return f(ell(mx - lado * r * .82, my - r * .15, r * .45, r * .4), luva) + f(ell(mx, my + r * .05, r * 1.1, r), luva) + `<path d="${ell(mx + lado * r * .3, my - r * .35, r * .32, r * .2)}" fill="#fff" opacity=".35"/>`; };
    const braco = lado => { const [sx, sy] = S.ombros[lado < 0 ? 0 : 1], [mx, my] = mao(lado), [cx, cy] = cotovelo(lado, sx, sy);
      if (S.asa) { const g = S.asa, penas = [-1, 0, 1].map(k => f(ell(mx + lado * 3 + k * 4 * lado, my + 6 - Math.abs(k) * 2, 4.2, 7.5), c.p)).join('');
        return penas + f(bracoCurvo(sx, sy, cx, cy, mx, my, 19 * g, 9 * g), c.p) + (luva ? patinha(lado, mx, my, 12) : ''); }
      return f(bracoCurvo(sx, sy, cx, cy, mx, my, S.braco * 1.12, S.braco * .86), c.p) + (manga ? f(bracoCurvo(sx, sy, cx, cy, mx, my, S.braco * 1.12 + 3, S.braco * .86 + 3, .34), manga) : '') + (lado > 0 ? ferramenta() : '') + patinha(lado, mx, my, S.braco * .86); };
    // ferramenta na mão direita, com a patinha por cima (segurando)
    const ferramenta = () => { if (!q.mao) return ''; xp.m = mao(1); const [hx, hy] = xp.m, esc = Math.max(1.1, Math.min(1.35, (S.braco || 14) / 16 * 1.3));
      if (P2[q.mao]) return `<g transform="translate(${hx},${hy}) scale(${esc.toFixed(2)}) translate(${-hx},${-hy})">${P2[q.mao](xp)}</g>`; const svg = V1 && V1.peca(q.mao); return svg ? `<g transform="translate(${xp.m[0]},${xp.m[1]}) scale(1.15) translate(-114,-124)">${svg}</g>` : ''; };
    P.push(braco(-1), braco(1));
    if (S.asa && q.mao) P.push(ferramenta());
    // cabeça: capacete do kit (sob medida) ou peça do guarda-roupa
    const k = S.capacete;
    if (CAPACETES[q.cabeca]) {
      const cor = CAPACETES[q.cabeca];
      const borda = mix(cor, '#000000', .16), aba = mix(cor, '#000000', .07);
      P.push(`<path d="M${k.x - k.r},${k.y} A${k.r},${k.r * .78} 0 0 1 ${k.x + k.r},${k.y} Z" fill="${cor}" stroke="${borda}" stroke-width="1.4"/><path d="M${k.x - k.r},${k.y} A${k.r},${k.r * .78} 0 0 1 ${k.x + k.r},${k.y} Z" fill="url(#${ID}g)"/>` +
        `<path d="M${k.x - k.r * 1.25},${k.y} h${k.r * 2.5} a3,3 0 0 1 0,6 h${-k.r * 2.5} a3,3 0 0 1 0,-6 Z" fill="${aba}" stroke="${borda}" stroke-width="1.2"/><rect x="${k.x - 3}" y="${k.y - k.r * .72}" width="6" height="${k.r * .7}" rx="3" fill="${borda}" opacity=".45"/>` +
        `<path d="M${k.x - k.r * .55},${k.y - k.r * .32} q${k.r * .3},-${k.r * .32} ${k.r * .62},-${k.r * .4}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>` +
        (q.cabeca === 'capacete-dourado' ? linha(`M${k.x - 6},${k.y - k.r * .45} l6,-8 l6,8`, 2, '#fff6c8') : ''));
    } else if (q.cabeca) P.push(peca('cabeca'));
    else if (S.semCabeca) P.push(S.semCabeca(c));
    P.push(extras(e, R.x, k.y - 14));
    const nome = rotulo ? String(rotulo).replace(/[<>"&]/g, '') : 'Mascote';
    return `<svg class="mascot-svg chibi" viewBox="0 0 200 240" width="${tam}" height="${Math.round(tam * 1.2)}" role="img" aria-label="${nome}"><g class="m-all">${P.join('')}</g></svg>`;
  }
  return {desenhar, amostra: chave => (CORES[chave] || [])[0] || '', especies: Object.keys(ELENCO), campanha};
})();

/* O desenho antigo continua disponível para quem ainda não está no elenco novo (período de testes). */
(() => {
  const v1 = window.CPTMascote;
  window.CPTMascoteV1 = v1;
  const v2 = () => window.CPT_MASCOTE_V2 === true;
  window.CPTMascote = {
    desenhar: (e, q, tam, rotulo, cor, expr) => v2() ? window.CPTMascoteV2.desenhar(e, q, tam, rotulo, cor, expr) : v1.desenhar(e, q, tam, rotulo, cor),
    amostra: k => v2() ? window.CPTMascoteV2.amostra(k) : v1.amostra(k),
    temDesenho: id => v1.temDesenho(id) || ['luvas', 'bota-preta', 'camisa-veolia', 'laco-do-mes', 'capacete-azul', 'capacete-verde', 'capacete-laranja', 'colete-amarelo', 'colete-azul',
      'luvas-amarelas', 'luvas-azuis', 'galocha-amarela', 'bota-branca', 'moletom-verde', 'camisa-xadrez', 'jaqueta-jeans'].includes(id)
  };
})();
</script>
