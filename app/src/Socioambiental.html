<script>
window.CPTSocioambiental=(()=>{"use strict";const ic=(n,e)=>window.CPTic?window.CPTic(n,e):e;let ui=null,ticket=0,dados=null;const $=id=>document.getElementById(id);const rotulo={sem:"A preparar",rascunho:"Rascunho",revisao:"Em revis\xE3o",pronto:"Pronto"};const cor={sem:"",rascunho:"status-andamento",revisao:"status-andamento",pronto:"status-concluida"};const INTRO=["Socioambiental","Mesa do relat\xF3rio: cada atividade do m\xEAs no item em que entra, com texto, fotos e documento."];async function render(){const mine=++ticket,mes=ui.state.mes;ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"loading-label\"><span class=\"spinner\"></span>Organizando as atividades do m\xEAs\u2026</div><div class=\"skel-list\" aria-hidden=\"true\"><div class=\"skeleton\"></div><div class=\"skeleton\"></div></div>";try{const d=await ui.call("carregarMesaSocioambientalCPT",mes);if(mine!==ticket||ui.state.route!=="socioambiental")return;dados=d;draw()}catch(e){if(mine===ticket)ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"notice\">".concat(ui.esc(e.message),"</div>")}}function numero(rot,valor,nota){return"<div class=\"stat-tile\"><span class=\"stat-label\">".concat(rot,"</span><span class=\"stat-value\">").concat(ui.num(valor),"</span><span class=\"stat-note\">").concat(nota,"</span></div>")}function linha(x){return"<li class=\"mesa-row\"><span class=\"mesa-date\">".concat(ui.esc(ui.date(x.data)),"</span>\n      <span class=\"mesa-main\"><strong>").concat(ui.esc(x.titulo||x.atividade),"</strong><small>").concat(ui.esc([x.atividade!==(x.titulo||x.atividade)?x.atividade:"",x.frente||x.bairro,x.publico!=null?x.publico+" pessoas":"",x.responsavel].filter(Boolean).join(" \xB7 ")),"</small></span>\n      <span class=\"badge ").concat(cor[x.situacao]||"","\">").concat(rotulo[x.situacao]||ui.esc(x.situacao),"</span>\n      <span class=\"mesa-actions\"><button class=\"button ghost\" data-record=\"").concat(ui.esc(x.id),"\">Registro</button><button class=\"button ").concat(x.situacao==="pronto"?"secondary":"","\" data-prepare-relato=\"").concat(ui.esc(x.id),"\">").concat(x.situacao==="sem"?"Preparar":"Abrir","</button>").concat(x.documento?"<a class=\"button ghost\" href=\"".concat(ui.esc(x.documento),"\" target=\"_blank\" rel=\"noopener noreferrer\">PDF</a>"):"","</span></li>")}function grupo(g){const vazio=!g.itens.length;return"<section class=\"panel mesa-group ".concat(vazio?"is-empty":"","\" id=\"item-").concat(ui.esc(g.item.replace(".","-")),"\"><div class=\"panel-head\"><div><span class=\"eyebrow\">ITEM ").concat(ui.esc(g.item),"</span><h2>").concat(ui.esc(g.titulo),"</h2>\n      <p>").concat(vazio?"Nenhuma atividade no m\xEAs.":ui.num(g.prontos)+" de "+ui.num(g.itens.length)+" pronto"+(g.itens.length===1?"":"s")+".","</p></div></div>\n      ").concat(vazio?g.vazio?"<div class=\"mesa-empty\"><p>".concat(ui.esc(g.vazio),"</p><button class=\"button ghost\" data-copiar-texto=\"").concat(ui.esc(g.vazio),"\">Copiar par\xE1grafo padr\xE3o</button></div>"):"":"<ul class=\"mesa-list\">".concat(g.itens.map(linha).join(""),"</ul>"),"</section>")}function draw(){const d=dados,t=d.totais,ordem=["2","4.1","4.2","4.3","4.4","4.5","7","9"];const grupos=ordem.map(i=>d.grupos.find(g=>g.item===i)).filter(Boolean);const pct=t.proprios?Math.round(t.prontos/t.proprios*100):0;ui.view.innerHTML=ui.intro(...INTRO)+"\n      <section class=\"panel mesa-hero\"><p class=\"home-phrase\">".concat(ui.esc(t.frase),"</p><p class=\"small\"><button type=\"button\" class=\"link-button\" data-guia-relato>").concat(ic("pencil","\uD83D\uDCDD")," Como escrever um bom relato</button></p>\n        <div class=\"meter\" role=\"meter\" aria-valuemin=\"0\" aria-valuemax=\"").concat(t.proprios,"\" aria-valuenow=\"").concat(t.prontos,"\" aria-label=\"").concat(t.prontos," de ").concat(t.proprios," prontos\"><span style=\"width:").concat(pct,"%\"></span></div>\n        <p class=\"small muted\">").concat(ui.num(t.prontos)," de ").concat(ui.num(t.proprios)," relatos e diagn\xF3sticos prontos para o relat\xF3rio.").concat(t.semPublico?" "+ui.num(t.semPublico)+" a\xE7\xF5es sem p\xFAblico informado.":"","</p>\n        <div class=\"dialog-actions\"><button class=\"button secondary\" id=\"gerarAnexos\">").concat(ui.icon("file"),"Gerar relatos do m\xEAs (Docs)</button>").concat(d.anexos?"<span class=\"small\">\xDAltima gera\xE7\xE3o: ".concat(ui.esc(new Date(d.anexos.em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short",timeZone:"America/Sao_Paulo"}))," \xB7 ").concat(ui.num(d.anexos.relatos)," relatos \xB7 <a href=\"").concat(ui.esc(d.anexos.doc),"\" target=\"_blank\" rel=\"noopener noreferrer\">Documento</a> \xB7 <a href=\"").concat(ui.esc(d.anexos.pdf),"\" target=\"_blank\" rel=\"noopener noreferrer\">PDF</a></span>"):"","</div>\n        <p class=\"small muted\">ANEXO 1 (item 4), ANEXO 2 (DDS e complementares) e ANEXO 3 (audiovisual). S\xF3 entram relatos \u201CPronto\u201D; cada um come\xE7a em p\xE1gina pr\xF3pria.</p><div id=\"anexosResultado\" aria-live=\"polite\"></div></section>\n      <section class=\"stat-row\" aria-label=\"N\xFAmeros do m\xEAs\">\n        ").concat(numero("A\xE7\xF5es socioambientais",t.acoes,"Contagem do item 3."),"\n        ").concat(numero("Pessoas alcan\xE7adas",t.pessoas,t.semPublico?ui.num(t.semPublico)+" sem p\xFAblico informado.":"P\xFAblico informado nos relatos."),"\n        ").concat(numero("Frentes acompanhadas",t.frentes,"Obras com atividade no m\xEAs."),"\n        ").concat(numero("Diagn\xF3sticos",t.diagnosticos,"Item 2 do relat\xF3rio."),"\n      </section>\n      ").concat(grupos.map(grupo).join(""),"\n      <section class=\"panel\" id=\"item-3\"><div class=\"panel-head\"><div><span class=\"eyebrow\">ITEM 3 E 3.1</span><h2>Atividades por frente de servi\xE7o</h2><p>Todas as a\xE7\xF5es entram na tabela do m\xEAs. No 3.1, cada frente ganha um par\xE1grafo e fotos 2 por linha.</p></div><button class=\"button ghost\" data-route=\"registros\" data-filter=\"relatos\">Consultar relatos ").concat(ui.icon("arrow"),"</button></div>\n        ").concat(d.frentes.length?"<table class=\"simple-table\"><thead><tr><th>Frente</th><th>Bairros</th><th>A\xE7\xF5es</th><th>Pessoas</th></tr></thead><tbody>".concat(d.frentes.map(f=>"<tr class=\"".concat(f.semObra?"muted":"","\"><td>").concat(ui.esc(f.frente),"</td><td>").concat(ui.esc(f.bairros),"</td><td>").concat(ui.num(f.acoes),"</td><td>").concat(ui.num(f.pessoas),"</td></tr>")).join(""),"</tbody></table>"):"<p class=\"muted\">Nenhuma a\xE7\xE3o no m\xEAs.</p>","</section>")}function init(api){ui=api;document.addEventListener("cpt:entrega-salva",()=>{if(ui.state.route==="socioambiental")render()});document.addEventListener("click",async ev=>{if(ev.target.closest("#gerarAnexos")){const btn=$("gerarAnexos");if(btn.disabled)return;btn.disabled=true;$("anexosResultado").innerHTML="<p class=\"loading-label\"><span class=\"spinner\"></span>Montando os anexos. Leva de 1 a 5 minutos, conforme as fotos\u2026</p>";try{const r=await ui.call("gerarAnexosDoMesCPT",ui.state.mes);$("anexosResultado").innerHTML="<div class=\"notice\">".concat(ui.esc(r.resultado)," <a href=\"").concat(ui.esc(r.doc),"\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir documento</a> \xB7 <a href=\"").concat(ui.esc(r.pdf),"\" target=\"_blank\" rel=\"noopener noreferrer\">PDF</a>").concat(r.avisos.length?"<br>"+r.avisos.map(ui.esc).join("<br>"):"","</div>")}catch(e){$("anexosResultado").innerHTML="<div class=\"notice\">".concat(ui.esc(e.message),"</div>")}finally{if($("gerarAnexos"))$("gerarAnexos").disabled=false}return}const b=ev.target.closest("[data-copiar-texto]");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copiarTexto);ui.toast("Par\xE1grafo padr\xE3o copiado.")}catch(_){ui.toast("C\xF3pia bloqueada pelo navegador.")}})}return{init,render}})();window.CPTGuiaRelato=(()=>{"use strict";const PONTOS=[["O qu\xEA","A atividade e o tema.","Roda de conversa sobre descarte correto de \xF3leo de cozinha."],["Onde","Rua, escola, pra\xE7a ou equipamento, al\xE9m do bairro.","Na EMEF Jardim Ipanema, Rua das Flores, 120 (Vila Linda)."],["P\xFAblico","Quem participou e quantas pessoas, em n\xFAmero.","22 alunos do 5\xBA ano e 2 professoras."],["Resultado","O que aconteceu: d\xFAvidas, o que entenderam, o que foi entregue.","As crian\xE7as perguntaram para onde vai o \xF3leo e levaram folhetos para casa."],["Encaminhamento","O que fica para depois. Se nada, escreva \"sem encaminhamentos\".","Ficou combinado o ponto de coleta na escola a partir de 10/11."],["Tamanho","Pelo menos 5 linhas: o relato vira texto do relat\xF3rio para a Sabesp.",""]];function html(faltam){const f=new Set(faltam||[]);return"<div class=\"guia-relato\"><p>Um bom relato responde a seis perguntas. Escreva como se contasse para algu\xE9m que n\xE3o estava l\xE1.</p>\n      <ol class=\"guia-pontos\">".concat(PONTOS.map(([t,d,ex])=>"<li class=\"".concat(f.has(t)?"falta":"","\"><strong>").concat(t).concat(f.has(t)?" <span class=\"guia-falta\">faltou aqui</span>":"","</strong><span>").concat(d,"</span>").concat(ex?"<em>Ex.: ".concat(ex,"</em>"):"","</li>")).join(""),"</ol>\n      <details><summary>Exemplo completo</summary><p class=\"guia-exemplo\">Realizamos uma roda de conversa sobre descarte correto de \xF3leo de cozinha na EMEF Jardim Ipanema (Rua das Flores, 120, Vila Linda), com 22 alunos do 5\xBA ano e 2 professoras. As crian\xE7as perguntaram para onde vai o \xF3leo depois da coleta e por que ele n\xE3o pode ir para a pia; explicamos o entupimento da rede e a contamina\xE7\xE3o do c\xF3rrego. Cada aluno levou um folheto para casa. Ficou combinado com a dire\xE7\xE3o um ponto de coleta na escola a partir de 10/11, que a equipe vai acompanhar.</p></details>\n      <p class=\"small muted\">A confer\xEAncia autom\xE1tica \xE9 uma ajuda para escrever. Ningu\xE9m recebe nota e n\xE3o existe ranking.</p></div>")}function abrir(faltam){document.getElementById("detailType").textContent="GUIA";document.getElementById("detailTitle").textContent="Como escrever um bom relato";document.getElementById("detailContent").innerHTML=html(faltam);const d=document.getElementById("detailDialog");if(!d.open)d.showModal()}document.addEventListener("click",ev=>{const g=ev.target.closest("[data-guia-relato]");if(g)abrir((g.dataset.guiaRelato||"").split("|").filter(Boolean))});return{abrir,html}})();
</script>
