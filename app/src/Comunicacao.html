ia-live=\"polite\"></div><div class=\"dialog-actions\"><button class=\"button\" type=\"submit\">Enviar</button></div></form>"))}function reduzir(file){return new Promise((ok,bad)=>{const img=new Image,url=URL.createObjectURL(file);img.onload=()=>{const e=Math.min(1,2000/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok({mime:"image/jpeg",base64:c.toDataURL("image/jpeg",0.85).split(",")[1]})};img.onerror=()=>{URL.revokeObjectURL(url);bad(new Error("N\xE3o foi poss\xEDvel ler "+file.name+"."))};img.src=url})}async function enviarFotos(f){const b=f.querySelector("[type=submit]"),base={data:f.elements.data.value,atividade:f.elements.atividade.value,local:f.elements.local.value},arquivos=[...f.elements.arquivos.files],link=f.elements.link.value.trim();if(!arquivos.length&&!link){erro("galErro",new Error("Escolha fotos ou cole um link do Drive."));return}if(arquivos.length>20){erro("galErro",new Error("Envie at\xE9 20 fotos por vez."));return}b.disabled=true;let feitos=0;const falhas=[];const passo=async(chave,conteudo)=>{const r=await ui.call("enviarFotoGaleriaCPT",{...base,...conteudo,operacaoId:opId(chave,{...base,chave})});ops.delete(chave);feitos++;$("galProgresso").textContent="Enviadas "+feitos+" de "+(arquivos.length+(link?1:0))+"\u2026";return r};for(const[i,file]of arquivos.entries()){try{await passo("gal"+file.name+file.size+i,await reduzir(file))}catch(e){falhas.push(file.name+": "+e.message)}}if(link)try{await passo("gal-link"+link,{link})}catch(e){falhas.push("Link: "+e.message)}b.disabled=false;if(falhas.length){erro("galErro",new Error(feitos+(feitos===1?" enviada":" enviadas")+". N\xE3o foram: "+falhas.join(" | ")+" Clique em Enviar de novo para repetir s\xF3 as que faltaram."));return}ui.toast(feitos===1?"Foto guardada na galeria.":feitos+" fotos guardadas na galeria.");fechar();if(ui.state.route==="galeria")renderGaleria()}async function baixar(botao){botao.disabled=true;ui.toast("Montando o pacote\u2026");try{const r=await ui.call("baixarPacoteGaleriaCPT",{mes:ui.state.mes,ids:[...selecionadas]}),bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/zip"}));a.download=r.nome;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);ui.toast("Pacote baixado: "+r.nome)}catch(e){ui.toast(e.message)}finally{botao.disabled=false}}async function copiar(texto){try{await navigator.clipboard.writeText(texto);ui.toast("Copiado.")}catch(_){ui.toast("O navegador bloqueou a c\xF3pia.")}}function init(api){ui=api;window.CPTMiniaturas.ligar(ui.call,()=>ui.state.mes);document.addEventListener("click",e=>{if(e.target.closest("[data-mat-novo]")){formMaterial();return}const mc=e.target.closest("[data-mat-concluir]");if(mc){const go=async()=>{if(!mat)mat=await ui.call("listarMateriaisCPT",ui.state.mes);formMaterial(mat.itens.find(x=>x.id===mc.dataset.matConcluir),true)};go().catch(err=>ui.toast(err.message));return}const me=e.target.closest("[data-mat-editar]");if(me){formMaterial(mat.itens.find(x=>x.id===me.dataset.matEditar));return}const mr=e.target.closest("[data-mat-recado]");if(mr){const m=mat.itens.find(x=>x.id===mr.dataset.matRecado);window.CPTRecados.novo({tipo:"link",id:m.id,titulo:m.titulo,url:m.url},{assunto:m.titulo,texto:m.observacao||"Segue o material."});return}const mf=e.target.closest("[data-mat-filtro]");if(mf){filtroMat.situacao=mf.dataset.matFiltro;desenharMateriais();return}if(e.target.closest("[data-mat-arquivar]")&&confirm("Arquivar este material? Ele sai da lista, mas continua no hist\xF3rico.")){salvarMaterial($("matForm"),true);return}if(e.target.closest("[data-gal-enviar]")){formEnvio();return}const go=e.target.closest("[data-gal-origem]");if(go){filtroGal.origem=go.dataset.galOrigem;filtroGal.limite=24;desenharGaleria();return}if(e.target.closest("[data-gal-mais]")){filtroGal.limite+=24;desenharGaleria();return}const ga=e.target.closest("[data-gal-abrir]");if(ga){abrirFoto(ga.dataset.galAbrir);return}const gc=e.target.closest("[data-gal-copiar]");if(gc){copiar((gal.itens.find(x=>x.fileId===gc.dataset.galCopiar)||{}).legenda||"");return}const gb=e.target.closest("[data-gal-baixar]");if(gb){baixar(gb);return}if(e.target.closest("[data-gal-legendas]")){copiar(gal.itens.filter(x=>selecionadas.has(x.fileId)).map(x=>x.legenda).join("\n"));return}if(e.target.closest("[data-gal-limpar]")){selecionadas.clear();desenharGaleria()}});const semMiniatura=t=>{if(!t.isConnected)return;const x=document.createElement("span");x.className="photo-missing";x.textContent="Sem acesso \xE0 miniatura";t.replaceWith(x)};document.addEventListener("error",e=>{const t=e.target;if(t&&t.matches&&t.matches(".photo img")){if(window.CPTMiniaturas)window.CPTMiniaturas.tentar(t,()=>semMiniatura(t));else semMiniatura(t)}},true);document.addEventListener("change",e=>{if(e.target.matches&&e.target.matches("#matForm [name=situacao]")){const fs=$("matForm").querySelector(".done-fields");if(fs)fs.hidden=fs.disabled=e.target.value!=="concluido";return}const m=e.target.closest("[data-gal-marcar]");if(!m)return;if(m.checked&&selecionadas.size>=15){m.checked=false;ui.toast("Escolha at\xE9 15 fotos por pacote.");return}if(m.checked)selecionadas.add(m.dataset.galMarcar);else selecionadas.delete(m.dataset.galMarcar);m.closest(".photo").classList.toggle("is-picked",m.checked);$("galSel").textContent=selecionadas.size;document.querySelectorAll("#galBar button").forEach(b=>b.disabled=!selecionadas.size)});let buscaTimer=null;const focado=id=>!!document.activeElement&&document.activeElement.id===id;document.addEventListener("input",e=>{if(e.target.id==="matBusca"){filtroMat.busca=e.target.value;clearTimeout(buscaTimer);buscaTimer=setTimeout(()=>{if($("matBusca"))desenharMateriais(focado("matBusca"))},220)}if(e.target.id==="galBusca"){filtroGal.busca=e.target.value;filtroGal.limite=24;clearTimeout(buscaTimer);buscaTimer=setTimeout(()=>{if($("galBusca"))desenharGaleria(focado("galBusca"))},220)}});document.addEventListener("submit",e=>{const f=e.target;if(!["matForm","galForm"].includes(f.id))return;e.preventDefault();if(f.id==="matForm")salvarMaterial(f);else enviarFotos(f)})}return{init,render,atualizar:()=>{if(ui.state.route==="galeria")renderGaleria(true);else render()}}})();
</script>
