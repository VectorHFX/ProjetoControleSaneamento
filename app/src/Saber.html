<script>
window.CPTSaber=(()=>{"use strict";const ic=(n,e)=>window.CPTic?window.CPTic(n,e):e;let ui=null,s=null,aoMudar=()=>{},enviando=false;const $=id=>document.getElementById(id);const op=()=>"OP-"+crypto.randomUUID();const LETRAS=["A","B","C","D"];const fonte=f=>f?"<a class=\"saber-fonte\" href=\"".concat(ui.esc(f.url),"\" target=\"_blank\" rel=\"noopener\">Fonte: ").concat(ui.esc(f.nome),"</a>"):"";const revisar=x=>x&&x.revisar?"<span class=\"saber-revisar\" title=\"S\xF3 voc\xEA v\xEA este conte\xFAdo at\xE9 a revis\xE3o\">a revisar</span>":"";function balao(x){s=x;const c=x&&x.curiosidade;if(!c)return"";return"<div class=\"saber-balao\" role=\"note\"><span class=\"saber-kicker\">".concat(ic("bulb","\uD83D\uDCA1")," Voc\xEA sabia? <small>").concat(ui.esc(c.tema),"</small>").concat(revisar(c),"</span><p>").concat(ui.esc(c.texto),"</p>").concat(fonte(c.fonte),"</div>")}function opcoes(q,tipo,resposta){return"<div class=\"quiz-opcoes\" role=\"group\" aria-label=\"Alternativas\">".concat(q.opcoes.map((o,i)=>{const estado=!resposta?"":i===resposta.certa?"is-certa":i===resposta.escolha?"is-errada":"is-apagada";return"<button class=\"quiz-opcao ".concat(estado,"\" ").concat(resposta?"disabled":"data-quiz-responder=\"".concat(tipo,"\" data-quiz-id=\"").concat(ui.esc(q.id),"\" data-quiz-escolha=\"").concat(i,"\""),"><b>").concat(LETRAS[i],"</b><span>").concat(ui.esc(o),"</span></button>")}).join(""),"</div>")}const explicacao=r=>"<div class=\"quiz-resultado ".concat(r.acertou?"is-ok":"is-nao","\" aria-live=\"polite\"><strong>").concat(r.acertou?ic("tick","\u2713")+" Acertou!":ic("x","\u2717")+" N\xE3o foi dessa vez.","</strong> ").concat(ui.esc(r.explica)," ").concat(fonte(r.fonte),"</div>");function blocoDia(){const q=s.quiz.dia,rg=s.quiz.regras;if(!q)return"<p class=\"empty-line\">A pergunta do dia volta em breve.</p>";const x=q.pergunta||q.resposta;return"<div class=\"quiz-dia\" id=\"quizDia\"><span class=\"saber-kicker\">".concat(ic("question","\u2753")," Pergunta do dia \xB7 ").concat(ui.esc(x.tema)," ").concat(revisar(x),"<small>").concat(rg.pontosDia," pontos se acertar</small></span>\n      <p class=\"quiz-pergunta\">").concat(ui.esc(x.pergunta),"</p>").concat(opcoes(x,"dia",q.resposta)).concat(q.resposta?explicacao(q.resposta)+"<p class=\"small muted\">Amanh\xE3 tem outra!</p>":"","</div>")}function blocoSemana(){const w=s.quiz.semana,rg=s.quiz.regras;if(!w)return"";const fim=w.respondidas>=w.total;return"<div class=\"quiz-semana\"><div><span class=\"saber-kicker\">".concat(ic("flag","\uD83C\uDFC1")," Quiz da semana <small>").concat(rg.porSemana," perguntas \xB7 ").concat(rg.pontosPergunta," pontos por acerto</small></span>\n      <p class=\"small\">").concat(fim?"Feito! ".concat(w.acertos," de ").concat(w.total," certas \xB7 +").concat(w.pontos," pontos. Na segunda tem outro."):w.respondidas?"".concat(w.respondidas," de ").concat(w.total," respondidas \xB7 ").concat(w.acertos," certas at\xE9 aqui."):"Teste o que voc\xEA sabe sobre \xE1gua, esgoto e res\xEDduos.","</p></div>\n      <span class=\"meter\" role=\"meter\" aria-valuemin=\"0\" aria-valuemax=\"").concat(w.total,"\" aria-valuenow=\"").concat(w.respondidas,"\" aria-label=\"Quiz da semana\"><span style=\"width:").concat(w.respondidas/w.total*100,"%\"></span></span>\n      <button class=\"button ").concat(fim?"ghost":"","\" data-quiz-semana>").concat(fim?"Ver respostas":w.respondidas?"Continuar":"Come\xE7ar","</button></div>")}function painel(x){s=x;if(!s)return"";const m=s.mes;return"<section class=\"panel home-saber\" id=\"espSaber\"><div class=\"panel-head\"><div><span class=\"card-kicker\">".concat(ic("bulb","\uD83E\uDDE0")," Saber mais</span><h2>Saneamento no dia a dia</h2></div></div>\n      <p class=\"saber-mes\"><i class=\"saber-laco\" aria-hidden=\"true\" ").concat(window.CPTMascoteV2?"style=\"--laco:".concat(ui.esc(window.CPTMascoteV2.campanha()[1]),"\""):"","></i><span><strong>").concat(ui.esc(m.campanha),"</strong> \xB7 ").concat(ui.esc(m.tema),"</span></p>\n      ").concat(m.datas.map(d=>"<p class=\"saber-data\"><strong>".concat(d.dia,"/").concat(new Date().toLocaleDateString("pt-BR",{month:"2-digit",timeZone:"America/Sao_Paulo"})," \xB7 ").concat(ui.esc(d.titulo),"</strong> ").concat(ui.esc(d.texto)," ").concat(fonte(d.fonte),"</p>")).join(""),"\n      ").concat(blocoDia()).concat(blocoSemana(),"</section>")}function redesenhar(){const p=$("espSaber");if(p)p.outerHTML=painel(s)}function janela(ultima){const w=s.quiz.semana,fim=w.respondidas>=w.total;$("detailType").textContent="QUIZ DA SEMANA";$("detailTitle").textContent=fim?"Resultado: ".concat(w.acertos," de ").concat(w.total):"Pergunta ".concat(w.indice+1," de ").concat(w.total);let html="";if(ultima)html+="<p class=\"quiz-pergunta\">".concat(ui.esc(ultima.pergunta),"</p>").concat(opcoes(ultima,"semana",ultima)).concat(explicacao(ultima));if(ultima&&!fim)html+="<div class=\"dialog-actions\"><button class=\"button\" data-quiz-proxima>Pr\xF3xima pergunta</button></div>";else if(!ultima&&!fim)html+="<p class=\"small muted\">".concat(ui.esc(w.proxima.tema)," ").concat(revisar(w.proxima),"</p><p class=\"quiz-pergunta\">").concat(ui.esc(w.proxima.pergunta),"</p>").concat(opcoes(w.proxima,"semana"));if(fim)html+="<p class=\"quiz-placar\">".concat(ic("star","\u2B50")," +").concat(w.pontos," pontos nesta semana</p><details class=\"quiz-revisao\" ").concat(ultima?"":"open","><summary>Ver todas as respostas</summary>").concat(w.respostas.map((r,i)=>"<div class=\"quiz-item\"><p><strong>".concat(i+1,".</strong> ").concat(ui.esc(r.pergunta),"</p><p class=\"small\">").concat(r.acertou?ic("tick","\u2713"):ic("x","\u2717")," Certa: <strong>").concat(ui.esc(r.opcoes[r.certa]),"</strong>").concat(r.acertou?"":" \xB7 voc\xEA marcou "+ui.esc(r.opcoes[r.escolha]),"</p><p class=\"small muted\">").concat(ui.esc(r.explica)," ").concat(fonte(r.fonte),"</p></div>")).join(""),"</details>");$("detailContent").innerHTML=html;if(!$("detailDialog").open)$("detailDialog").showModal()}async function responder(b){if(enviando)return;enviando=true;const tipo=b.dataset.quizResponder;const grupo=b.closest(".quiz-opcoes");grupo.querySelectorAll("button").forEach(x=>{x.disabled=true});b.classList.add("is-enviando");const versao=tipo==="dia"?s.quiz.dia.versao:s.quiz.semana.versao;try{const r=await ui.call("responderQuizCPT",{tipo,id:b.dataset.quizId,escolha:Number(b.dataset.quizEscolha),versao,operacaoId:op()});s.quiz=r.estado;ui.toast(r.resultado);aoMudar({pontos:r.pontos,acertou:r.resposta.acertou});if(tipo==="dia")redesenhar();else{redesenhar();janela(r.resposta)}}catch(e){ui.toast(e.message);grupo.querySelectorAll("button").forEach(x=>{x.disabled=false});b.classList.remove("is-enviando")}finally{enviando=false}}function init(api){ui=api;document.addEventListener("click",e=>{const b=e.target.closest("[data-quiz-responder]");if(b){responder(b);return}if(e.target.closest("[data-quiz-semana]")||e.target.closest("[data-quiz-proxima]")){if(s&&s.quiz.semana)janela()}})}return{init,balao,painel,aoMudar:fn=>{aoMudar=fn},pendente:()=>!!(s&&s.quiz&&s.quiz.dia&&s.quiz.dia.pergunta)}})();
</script>
