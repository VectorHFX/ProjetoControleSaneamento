<script>
window.CPTSaber=(()=>{"use strict";const ic=(n,e)=>window.CPTic?window.CPTic(n,e):e;let ui=null,s=null,aoMudar=()=>{},enviando=false;const $=id=>document.getElementById(id);const op=()=>"OP-"+crypto.randomUUID();const LETRAS=["A","B","C","D"];const fonte=f=>!f?"":f.url?"<a class=\"saber-fonte\" href=\"".concat(ui.esc(f.url),"\" target=\"_blank\" rel=\"noopener\">Fonte: ").concat(ui.esc(f.nome),"</a>"):"<span class=\"saber-fonte is-equipe\">Pr\xE1tica da equipe</span>";const revisar=x=>x&&x.revisar?"<span class=\"saber-revisar\" title=\"S\xF3 voc\xEA v\xEA este conte\xFAdo at\xE9 a revis\xE3o\">a revisar</span>":"";function balao(x){s=x;const c=x&&x.curiosidade;if(!c)return"";return"<div class=\"saber-balao\" role=\"note\"><span class=\"saber-kicker\">".concat(ic("bulb","\uD83D\uDCA1")," Voc\xEA sabia? <small>").concat(ui.esc(c.tema),"</small>").concat(revisar(c),"</span><p>").concat(ui.esc(c.texto),"</p>").concat(c.importa?"<p class=\"saber-importa\"><strong>Por que importa:</strong> ".concat(ui.esc(c.importa),"</p>"):"").concat(fonte(c.fonte),"</div>")}function opcoes(q,tipo,resposta){return"<div class=\"quiz-opcoes\" role=\"group\" aria-label=\"Alternativas\">".concat(q.opcoes.map((o,i)=>{const estado=!resposta?"":i===resposta.certa?"is-certa":i===resposta.escolha?"is-errada":"is-apagada";return"<button class=\"quiz-opcao ".concat(estado,"\" ").concat(resposta?"disabled":"data-quiz-responder=\"".concat(tipo,"\" data-quiz-id=\"").concat(ui.esc(q.id),"\" data-quiz-escolha=\"").concat(i,"\""),"><b>").concat(LETRAS[i],"</b><span>").concat(ui.esc(o),"</span></button>")}).join(""),"</div>")}const explicacao=r=>"<div class=\"quiz-resultado ".concat(r.acertou?"is-ok":"is-nao","\" aria-live=\"polite\"><strong>").concat(r.acertou?ic("tick","\u2713")+" Acertou!":ic("x","\u2717")+" N\xE3o foi dessa vez.","</strong> ").concat(ui.esc(r.explica)," ").concat(fonte(r.fonte),"</div>");function blocoDia(){const q=s.quiz.dia,rg=s.quiz.regras;if(!q)return"<p class=\"empty-line\">A pergunta do dia volta em breve.</p>";const x=q.pergunta||q.resposta;return"<div class=\"quiz-dia\" id=\"quizDia\"><span class=\"saber-kicker\">".concat(ic("question","\u2753")," Pergunta do dia \xB7 ").concat(ui.esc(x.tema)," ").concat(revisar(x),"<small>").concat(rg.pontosDia," pontos se acertar</small></span>\n      <p class=\"quiz-pergunta\">").concat(ui.esc(x.pergunta),"</p>").concat(opcoes(x,"dia",q.resposta)).concat(q.resposta?explicacao(q.resposta)+"<p class=\"small muted\">Amanh\xE3 tem outra!</p>":"","</div>")}function blocoSemana(){const w=s.quiz.semana,rg=s.quiz.regras;if(!w)return"";const fim=w.respondidas>=w.total;return"<div class=\"quiz-semana\"><div><span class=\"saber-kicker\">".concat(ic("flag","\uD83C\uDFC1")," Quiz da semana <small>").concat(rg.porSemana," perguntas \xB7 ").concat(rg.pontosPergunta," pontos por acerto</small></span>\n      <p class=\"small\">").concat(fim?"Feito! ".concat(w.acertos," de ").concat(w.total," certas \xB7 +").concat(w.pontos," pontos. Na segunda tem outro."):w.respondidas?"".concat(w.respondidas," de ").concat(w.total," respondidas \xB7 ").concat(w.acertos," certas at\xE9 aqui."):"Teste o que voc\xEA sabe sobre \xE1gua, esgoto e res\xEDduos.","</p></div>\n      <span class=\"meter\" role=\"meter\" aria-valuemin=\"0\" aria-valuemax=\"").concat(w.total,"\" aria-valuenow=\"").concat(w.respondidas,"\" aria-label=\"Quiz da semana\"><span style=\"width:").concat(w.respondidas/w.total*100,"%\"></span></span>\n      <button class=\"button ").concat(fim?"ghost":"","\" data-quiz-semana>").concat(fim?"Ver respostas":w.respondidas?"Continuar":"Come\xE7ar","</button></div>")}function painel(x){s=x;if(!s)return"";const m=s.mes;return"<section class=\"panel home-saber\" id=\"espSaber\"><div class=\"panel-head\"><div><span class=\"card-kicker\">".concat(ic("bulb","\uD83E\uDDE0")," Saber mais</span><h2>Saneamento no dia a dia</h2></div></div>\n      <p class=\"saber-mes\"><i class=\"saber-laco\" aria-hidden=\"true\" ").concat(window.CPTMascoteV2?"style=\"--laco:".concat(ui.esc(window.CPTMascoteV2.campanha()[1]),"\""):"","></i><span><strong>").concat(ui.esc(m.campanha),"</strong> \xB7 ").concat(ui.esc(m.tema),"</span></p>\n      ").concat(m.datas.map(d=>"<p class=\"saber-data\"><strong>".concat(d.dia,"/").concat(new Date().toLocaleDateString("pt-BR",{month:"2-digit",timeZone:"America/Sao_Paulo"})," \xB7 ").concat(ui.esc(d.titulo),"</strong> ").concat(ui.esc(d.texto)," ").concat(fonte(d.fonte),"</p>")).join(""),"\n      ").concat(blocoDia()).concat(blocoSemana(),"</section>")}function redesenhar(){const p=$("espSaber");if(p)p.outerHTML=painel(s)}function janela(ultima){const w=s.quiz.semana,fim=w.respondidas>=w.total;$("detailType").textContent="QUIZ DA SEMANA";$("detailTitle").textContent=fim?"Resultado: ".concat(w.acertos," de ").concat(w.total):"Pergunta ".concat(w.indice+1," de ").concat(w.total);let html="";if(ultima)html+="<p class=\"quiz-pergunta\">".concat(ui.esc(ultima.pergunta),"</p>").concat(opcoes(ultima,"semana",ultima)).concat(explicacao(ultima));if(ultima&&!fim)html+="<div class=\"dialog-actions\"><button class=\"button\" data-quiz-proxima>Pr\xF3xima pergunta</button></div>";else if(!ultima&&!fim)html+="<p class=\"small muted\">".concat(ui.esc(w.proxima.tema)," ").concat(revisar(w.proxima),"</p><p class=\"quiz-pergunta\">").concat(ui.esc(w.proxima.pergunta),"</p>").concat(opcoes(w.proxima,"semana"));if(fim)html+="<p class=\"quiz-placar\">".concat(ic("star","\u2B50")," +").concat(w.pontos," pontos nesta semana</p><details class=\"quiz-revisao\" ").concat(ultima?"":"open","><summary>Ver todas as respostas</summary>").concat(w.respostas.map((r,i)=>"<div class=\"quiz-item\"><p><strong>".concat(i+1,".</strong> ").concat(ui.esc(r.pergunta),"</p><p class=\"small\">").concat(r.acertou?ic("tick","\u2713"):ic("x","\u2717")," Certa: <strong>").concat(ui.esc(r.opcoes[r.certa]),"</strong>").concat(r.acertou?"":" \xB7 voc\xEA marcou "+ui.esc(r.opcoes[r.escolha]),"</p><p class=\"small muted\">").concat(ui.esc(r.explica)," ").concat(fonte(r.fonte),"</p></div>")).join(""),"</details>");$("detailContent").innerHTML=html;if(!$("detailDialog").open)$("detailDialog").showModal()}async function responder(b){if(enviando)return;enviando=true;const tipo=b.dataset.quizResponder;const grupo=b.closest(".quiz-opcoes");grupo.querySelectorAll("button").forEach(x=>{x.disabled=true});b.classList.add("is-enviando");const versao=tipo==="dia"?s.quiz.dia.versao:s.quiz.semana.versao;try{const r=await ui.call("responderQuizCPT",{tipo,id:b.dataset.quizId,escolha:Number(b.dataset.quizEscolha),versao,operacaoId:op()});s.quiz=r.estado;ui.toast(r.resultado);aoMudar({pontos:r.pontos,acertou:r.resposta.acertou});if(tipo==="dia")redesenhar();else{redesenhar();janela(r.resposta)}}catch(e){ui.toast(e.message);grupo.querySelectorAll("button").forEach(x=>{x.disabled=false});b.classList.remove("is-enviando")}finally{enviando=false}}let rv=null,filtro={situacao:"pendente",tipo:"",eixo:"",busca:""},mostrar=20,rticket=0;const NOMES={aprovado:"Aprovado",suspenso:"Suspenso",pendente:"A revisar"};const INTRO_REV=["Revis\xE3o do conte\xFAdo","Decida item a item o que a equipe vai ver no Meu espa\xE7o. Suspenso some para todos; aprovado aparece para a equipe quando os testes forem liberados. S\xF3 voc\xEA v\xEA esta p\xE1gina."];function resumo(){const r=rv.resumo,barra=e=>"<div class=\"rev-eixo\"><span>".concat(ui.esc(e.nome),"</span><span class=\"meter\" aria-hidden=\"true\"><span style=\"width:").concat(Math.round(e.n/r.total*100),"%\"></span></span><b>").concat(Math.round(e.n/r.total*100),"%</b></div>");return"<section class=\"panel rev-resumo\" id=\"revResumo\"><div class=\"rev-contas\">".concat(["pendente","aprovado","suspenso"].map(k=>"<button class=\"rev-conta is-".concat(k," ").concat(filtro.situacao===k?"is-on":"","\" data-rev-situacao=\"").concat(k,"\"><b>").concat(r[k],"</b><span>").concat(NOMES[k],"</span></button>")).join(""),"<button class=\"rev-conta ").concat(filtro.situacao===""?"is-on":"","\" data-rev-situacao=\"\"><b>").concat(r.total,"</b><span>Todos</span></button></div>\n      <div class=\"rev-eixos\"><span class=\"small muted\">Equil\xEDbrio do banco</span>").concat(r.eixos.map(barra).join(""),"</div></section>")}const lista=()=>{return rv.itens.filter(x=>(!filtro.situacao||x.situacao===filtro.situacao)&&(!filtro.tipo||x.tipo===filtro.tipo)&&(!filtro.eixo||x.eixo===filtro.eixo)&&(!filtro.busca||(x.id+" "+x.texto+" "+(x.importa||"")+" "+x.tema).toLowerCase().includes(filtro.busca)))};function cartaoRev(x){const opc=x.opcoes?"<ol class=\"rev-opcoes\">".concat(x.opcoes.map((o,i)=>"<li class=\"".concat(i===x.certa?"is-certa":"","\">").concat(ui.esc(o)).concat(i===x.certa?" <span class=\"rev-certa\">certa</span>":"","</li>")).join(""),"</ol><p class=\"small muted\">").concat(ui.esc(x.explica),"</p>"):"";return"<article class=\"rev-item is-".concat(x.situacao,"\" data-rev=\"").concat(ui.esc(x.id),"\"><header><b>").concat(ui.esc(x.id),"</b><span class=\"rev-chip\">").concat(x.tipo==="pergunta"?"Pergunta":"Curiosidade","</span><span class=\"rev-chip is-").concat(x.eixo,"\">").concat(ui.esc(rv.eixos[x.eixo]),"</span><span class=\"small muted\">").concat(ui.esc(x.tema),"</span><span class=\"rev-estado\">").concat(NOMES[x.situacao],"</span></header>\n      <p class=\"rev-texto\">").concat(ui.esc(x.texto),"</p>").concat(x.importa?"<p class=\"small\"><strong>Por que importa:</strong> ".concat(ui.esc(x.importa),"</p>"):"").concat(opc,"\n      ").concat(x.correcao?"<p class=\"rev-correcao\">".concat(ic("pencil","\u270E")," Corrigido nesta vers\xE3o: ").concat(ui.esc(x.correcao),"</p>"):"","<p class=\"small\">").concat(fonte(x.fonte),"</p>\n      <div class=\"rev-acoes\"><label class=\"rev-nota\"><span class=\"sr-only\">Observa\xE7\xE3o</span><input maxlength=\"500\" placeholder=\"Observa\xE7\xE3o (opcional)\" value=\"").concat(ui.esc(x.nota),"\"></label>\n        ").concat(x.situacao!=="aprovado"?"<button class=\"button\" data-rev-decidir=\"aprovado\">Aprovar</button>":"").concat(x.situacao!=="suspenso"?"<button class=\"button ghost\" data-rev-decidir=\"suspenso\">Suspender</button>":"").concat(x.situacao!=="pendente"?"<button class=\"button ghost\" data-rev-decidir=\"pendente\">Voltar para revis\xE3o</button>":"","</div></article>")}function desenharLista(){const l=lista(),el=$("revLista");if(!el)return;el.innerHTML=l.length?l.slice(0,mostrar).map(cartaoRev).join("")+(l.length>mostrar?"<div class=\"dialog-actions\"><button class=\"button ghost\" data-rev-mais>Mostrar mais (".concat(l.length-mostrar,")</button></div>"):""):"<p class=\"empty-line\">Nada com esses filtros.</p>";$("revQuantos").textContent=l.length+(l.length===1?" item":" itens")}function desenharRevisao(){ui.view.innerHTML=ui.intro(...INTRO_REV)+resumo()+"<section class=\"panel rev-filtros\"><label class=\"field\">Tipo<select data-rev-filtro=\"tipo\"><option value=\"\">Todos</option><option value=\"curiosidade\" ".concat(filtro.tipo==="curiosidade"?"selected":"",">Curiosidades</option><option value=\"pergunta\" ").concat(filtro.tipo==="pergunta"?"selected":"",">Perguntas</option></select></label>\n      <label class=\"field\">Eixo<select data-rev-filtro=\"eixo\"><option value=\"\">Todos</option>").concat(Object.entries(rv.eixos).map(([k,n])=>"<option value=\"".concat(k,"\" ").concat(filtro.eixo===k?"selected":"",">").concat(ui.esc(n),"</option>")).join(""),"</select></label>\n      <label class=\"field rev-busca\">Buscar<input type=\"search\" data-rev-filtro=\"busca\" value=\"").concat(ui.esc(filtro.busca),"\" placeholder=\"ID, palavra ou tema\"></label><span class=\"small muted\" id=\"revQuantos\"></span></section><div class=\"rev-lista\" id=\"revLista\"></div>");desenharLista()}async function revisao(){const mine=++rticket;ui.view.innerHTML=ui.intro(...INTRO_REV)+"<div class=\"loading-label\"><span class=\"spinner\"></span>Abrindo o banco\u2026</div>";try{const r=await ui.call("carregarRevisaoConteudoCPT");if(mine!==rticket||ui.state.route!=="revisao")return;rv=r;mostrar=20;desenharRevisao()}catch(e){if(mine===rticket)ui.view.innerHTML=ui.intro(...INTRO_REV)+"<div class=\"notice\">".concat(ui.esc(e.message),"</div>")}}async function decidir(b){if(enviando)return;const card=b.closest("[data-rev]"),x=rv.itens.find(i=>i.id===card.dataset.rev);if(!x)return;enviando=true;card.querySelectorAll("button").forEach(z=>{z.disabled=true});try{const r=await ui.call("decidirConteudoCPT",{id:x.id,situacao:b.dataset.revDecidir,nota:card.querySelector("input").value,versao:x.versao,operacaoId:op()});rv.resumo[x.situacao]--;Object.assign(x,r.item);rv.resumo[x.situacao]++;ui.toast(r.resultado);card.outerHTML=cartaoRev(x);const res=$("revResumo");if(res)res.outerHTML=resumo()}catch(e){ui.toast(e.message);card.querySelectorAll("button").forEach(z=>{z.disabled=false})}finally{enviando=false}}function init(api){ui=api;document.addEventListener("click",e=>{if(ui.state.route!=="revisao"||!rv)return;const d=e.target.closest("[data-rev-decidir]");if(d){decidir(d);return}const s=e.target.closest("[data-rev-situacao]");if(s){filtro.situacao=s.dataset.revSituacao;mostrar=20;desenharRevisao();return}if(e.target.closest("[data-rev-mais]")){mostrar+=20;desenharLista()}});document.addEventListener("input",e=>{const f=e.target.closest("[data-rev-filtro]");if(!f||ui.state.route!=="revisao"||!rv)return;filtro[f.dataset.revFiltro]=f.dataset.revFiltro==="busca"?f.value.trim().toLowerCase():f.value;mostrar=20;desenharLista()});document.addEventListener("click",e=>{const b=e.target.closest("[data-quiz-responder]");if(b){responder(b);return}if(e.target.closest("[data-quiz-semana]")||e.target.closest("[data-quiz-proxima]")){if(s&&s.quiz.semana)janela()}})}return{init,balao,painel,revisao,aoMudar:fn=>{aoMudar=fn},pendente:()=>!!(s&&s.quiz&&s.quiz.dia&&s.quiz.dia.pergunta)}})();
</script>
