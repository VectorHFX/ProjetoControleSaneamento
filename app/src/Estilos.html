html[data-theme=dark][data-visao=comercializacao]{--visao:#b7d58a}
.view-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--visao) 45%,var(--line));background:color-mix(in srgb,var(--visao) 10%,var(--surface));color:var(--ink);font-size:13px;line-height:1.45}

.nav-item.active{box-shadow:inset 3px 0 0 var(--visao)}
.home-hero .eyebrow{color:var(--visao)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 18px}
.shortcut{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--visao);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:64px}

/* Painel da gestão */
.painel-tabs{display:inline-flex;margin:0 0 18px;max-width:100%;overflow-x:auto}

.painel-foot{margin-top:16px}

.attention{margin-bottom:16px;border-left:4px solid var(--visao)}
.alert-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alert-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

.alert-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mint)}
.alert-alto .alert-dot,.is-bad .alert-dot{background:#c2412d}.alert-medio .alert-dot,.is-warn .alert-dot{background:#d18a1f}.alert-baixo .alert-dot{background:var(--muted)}.is-ok .alert-dot{background:var(--mint)}
.ok-line{color:var(--mint);font-weight:600;margin:6px 0}
.stat-value small{font-size:.5em;color:var(--muted);font-weight:600}

.mini-chart{margin:0}.mini-chart figcaption{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}

.col-bar{fill:var(--blue)}.col-bar.b{fill:var(--visao)}.col-bar.c{fill:var(--mint)}
.col-val{font-size:11px;fill:var(--ink);font-weight:650}

.key-swatch{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--blue);margin:0 4px 0 10px;vertical-align:-1px}.key-swatch.b{background:var(--visao)}.key-swatch.c{background:var(--mint)}

.front-cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}

.late-text{color:#b2412d}html[data-theme=dark] .late-text{color:#ff9f8a}
.front-numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.front-numbers div{background:var(--bg);border-radius:10px;padding:6px 8px}.front-numbers dt{font-size:10px;color:var(--muted)}.front-numbers dd{margin:0;font-weight:750;font-size:17px}
.relato-day{margin-bottom:18px}
.relato-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}

/* Programa Parceiros */
.pp-status-main{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}

.pp-main textarea{resize:vertical;line-height:1.5}
.pp-number{display:flex;gap:8px;align-items:center}.pp-number input{max-width:200px}
.small-button{font-size:12px;padding:6px 10px;min-height:36px}
.pp-check{display:flex;gap:8px;align-items:center;font-weight:600}.pp-check input{width:22px;min-height:22px;height:22px}
.pp-hints{display:flex;flex-direction:column;gap:4px;margin-top:8px}

.pp-hint.warn{color:#985919}html[data-theme=dark] .pp-hint.warn{color:#ffcf91}

@media(max-width:800px){.sidebar nav{overflow-x:auto;scrollbar-width:none}.sidebar nav .nav-item{flex:0 0 auto;min-width:72px}.pp-row{grid-template-columns:36px minmax(0,1fr)}.pp-ok{grid-column:2}.front-numbers{grid-template-columns:repeat(2,1fr)}.hbars li{grid-template-columns:minmax(0,1fr) 70px auto}.view-banner{font-size:12px}.pp-bar{bottom:84px}}
@media print{.view-banner,.pp-bar,.shortcuts{display:none!important}}

/* 2.8 — Comunicação, Recados, Contatos e Lembretes: blocos curtos, um verbo por linha, botões grandes. */
.nav-item{position:relative}

.tool-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tool-head .painel-tabs{margin:0}.tool-head>.button{margin-left:auto}
.count-pill{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--bg);font-size:11px;font-weight:750;margin-left:4px}

.stack-form{display:grid;gap:12px}.stack-form .field{display:grid;gap:5px}
.stack-form input:not([type=checkbox]):not([type=radio]),.stack-form select,.stack-form textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;align-items:end}
.choice-group,.big-choice,.done-fields{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;display:flex;flex-wrap:wrap;gap:8px 16px}

.done-fields{display:block}.done-fields .form-row+.form-row{margin-top:10px}
.choice{display:inline-flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}.choice input{width:18px;height:18px}

.big-choice input{margin-top:3px;width:18px;height:18px}.big-choice small{display:block;color:var(--muted)}
.people-pick{border:1px solid var(--line);border-radius:12px;padding:8px 12px}.people-pick summary{cursor:pointer;font-weight:650}.people-pick .choice{margin-right:14px}
.simple-list{display:grid;gap:8px}
.simple-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.simple-row:hover,.simple-row:focus-visible{border-color:var(--visao)}
.row-dot{width:10px;height:10px;border-radius:50%;background:transparent;flex:none}.is-new .row-dot{background:var(--visao)}.is-new .row-main strong{font-weight:800}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.row-main small{color:var(--muted)}
.tag-important{color:#b2412d;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.link-chip{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--visao) 8%,var(--surface));border:1px solid var(--line);margin:0 0 10px}
.message{background:var(--bg);border-radius:12px;padding:12px 14px;margin:8px 0;white-space:pre-line;line-height:1.5}.message p{margin:4px 0 0}
.message.reply{background:var(--surface);border:1px solid var(--line)}.message small{color:var(--muted)}
.contact-cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}

.gallery-bar>span:last-child{display:flex;gap:6px;flex-wrap:wrap}

/* 2.9 — Meu espaço: mascote, checklist e caderno. */
.space-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start}
.space-main{display:grid;gap:16px;min-width:0}.space-main .today-hello{margin:0}
.mascot-stage{text-align:center;position:sticky;top:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--visao) 12%,var(--surface)),var(--surface) 60%)}
.mascot-art{display:flex;justify-content:center;padding-top:6px}
.mascot-art .mascot-svg{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
@media(prefers-reduced-motion:reduce){.mascot-art .mascot-svg{animation:none}}html[data-motion=reduce] .mascot-art .mascot-svg{animation:none}
.mascot-name{margin:4px 0 0;font-size:24px}.mascot-name .link-button{font-size:12px;font-weight:600}
.gift{display:block;width:100%;margin:12px 0;padding:12px;border-radius:12px;border:2px dashed #d18a1f;background:#fff4df;color:#6b4300;font:inherit;font-weight:750;cursor:pointer;animation:pulse 2.4s ease-in-out infinite}
html[data-theme=dark] .gift{background:#3a2c17;color:#ffd99a}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d18a1f33}50%{box-shadow:0 0 0 6px #d18a1f22}}@media(prefers-reduced-motion:reduce){.gift{animation:none}}
.mascot-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 8px;font-size:14px}
.dialog-actions.center{justify-content:center}
.day-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.day-nav>div{flex:1;min-width:160px}.day-nav h2{margin:0;font-size:18px}
.inline-add{display:flex;gap:8px;align-items:flex-end;margin:10px 0;flex-wrap:wrap}.inline-add input{flex:1 1 220px;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.inline-add .field{flex:1 1 220px;display:grid;gap:5px}
.check-list{list-style:none;margin:6px 0;padding:0;display:grid;gap:6px}
.check-list li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.check-list label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-height:32px}.check-list input{width:20px;height:20px;flex:none;accent-color:var(--visao)}
.check-list li.is-done span{text-decoration:line-through;color:var(--muted)}
.pts{font-size:13px}.small-x{width:30px;height:30px;font-size:18px;line-height:1}
.notebook{width:100%;min-height:180px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:15px;line-height:1.7;color:var(--ink);resize:vertical;
  background:repeating-linear-gradient(var(--surface),var(--surface) 25px,color-mix(in srgb,var(--visao) 14%,var(--surface)) 26px);background-attachment:local}
.notebook-past{margin-top:10px}.notebook-past summary{cursor:pointer;font-weight:650}
.welcome-pets{text-align:center}.welcome-pets h1{margin:6px 0}
.pet-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:16px 0}
.pet-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.pet-option:hover,.pet-option:focus-visible,.pet-option.is-picked{border-color:var(--visao);background:color-mix(in srgb,var(--visao) 8%,var(--surface))}
.welcome-pets .inline-add{justify-content:center;max-width:520px;margin:0 auto}
.wardrobe-tabs{display:flex;flex-wrap:wrap;margin-bottom:6px}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wardrobe-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;text-align:center}
.wardrobe-item small{color:var(--muted)}.wardrobe-item.is-on{border-color:var(--visao);background:color-mix(in srgb,var(--visao) 9%,var(--surface))}.wardrobe-item[aria-disabled=true]{opacity:.55}
@media(max-width:900px){.space-grid{grid-template-columns:1fr}.mascot-stage{position:static}}
/* ============================================================
   Tema 2.10 "Água clara" — camada final (vence as anteriores).
   Paleta calma: verde-água + areia, sem rosa/ameixa saturado. Mais respiro entre blocos.
   ============================================================ */
:root,[data-theme=light]{color-scheme:light;
  --bg:#f2f6f4;--surface:#ffffff;--ink:#1d2b29;--muted:#566763;--line:#e0e8e4;--blue:#0e7369;--pale:#e2f2ee;--navy:#123e39;--mint:#2b7a52;--soft:#edf6f2;--focus:#0e7369;--orange:#c96f1e;
  --accent:#f2b23b;--coral:#e8735a;--sky1:#d9f0f2;--sky2:#f3f9f4;--sun:#ffd36b;--hill1:#bfe3cf;--hill2:#d9eedf;--water1:#7fcfc3;--water2:#3ea596;--house:#ffffff;--roof:#e8735a;--tree:#7cc39a;--cloud:#ffffff;
  --art-main:#0e7369;--art-secondary:#58b8a8;--art-accent:#f2b23b;--art-ink:#123e39;--art-paper:#ffffff;--art-soft:#d7eee8;--wave1:#a7ddd2;--wave2:#4fb0a1;--wave3:#17756b;
  --tile1:#edf7f4;--tile2:#f2f7ea;--tile3:#fff5e2;
  --front-atendimento:#2f6fa3;--front-socioambiental:#2e8b57;--front-comunicacao:#c96f1e;--front-gestao:#6c5ba7;--front-administrativo:#4a6fa5;
  --chart-1:#0e7369;--chart-2:#58b8a8;--chart-3:#f2b23b;--chart-4:#e8735a;--action-ink:#fff;
  --radius:20px;--radius-control:12px;--shadow:0 1px 2px #12302b0a,0 8px 28px #12302b0d;--shadow-hover:0 2px 4px #12302b10,0 14px 36px #12302b17;
  --font-display:ui-rounded,'SF Pro Rounded','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;--font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--aside:248px}
html[data-theme=dark]{color-scheme:dark;
  --bg:#0f1716;--surface:#16211f;--ink:#e6f0ed;--muted:#a3b5b0;--line:#283633;--blue:#6fd1c2;--pale:#1b3430;--navy:#cdeee7;--mint:#83d4ab;--soft:#192b28;--focus:#f2b23b;--orange:#f0a35e;
  --accent:#f2c25b;--coral:#f08f78;--sky1:#14302f;--sky2:#16211f;--sun:#f2c25b;--hill1:#1f3d35;--hill2:#1a332d;--water1:#2a6d65;--water2:#1d5850;--house:#d9e6e2;--roof:#d97a63;--tree:#3d7d61;--cloud:#2b4743;
  --art-main:#6fd1c2;--art-secondary:#3f9a8d;--art-accent:#f2c25b;--art-ink:#0f1716;--art-paper:#e6f0ed;--art-soft:#1f3a36;--wave1:#2e6f67;--wave2:#21564f;--wave3:#173f3a;
  --tile1:#182b28;--tile2:#1b2c25;--tile3:#2a2618;--chart-1:#6fd1c2;--chart-2:#3f9a8d;--chart-3:#f2c25b;--chart-4:#f08f78;--action-ink:#0f1716;--shadow:0 1px 0 #ffffff08;--shadow-hover:0 0 0 1px #ffffff14}
body{background:var(--bg);font-family:var(--font-ui);color:var(--ink)}
h1,.welcome h2,.space-hero .hero-title{font-family:var(--font-display);font-weight:750;letter-spacing:-.6px}
.page-intro h1{font-size:clamp(26px,2.4vw,34px)}

/* ---------- Lateral ---------- */
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:26px 14px 18px;transition:width .22s ease,transform .25s ease;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.identity{padding:0 12px 22px;position:relative}
.identity-name{color:var(--navy);gap:8px}
.brand-drop{width:26px;height:30px;background:linear-gradient(160deg,var(--art-secondary),var(--blue));border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:path('M13 0 C13 0 0 14 0 20 A13 10 0 0 0 26 20 C26 14 13 0 13 0Z');flex:none}
.version{background:var(--pale);color:var(--blue)}
.nav-caption{padding:4px 14px 10px;letter-spacing:1.4px}
.nav-item{position:relative;gap:12px;padding:10px 12px;margin:3px 0;border-radius:14px;color:var(--muted);font-weight:600;font-size:14px;min-height:46px;box-shadow:none}
.nav-item .icon{width:34px;height:34px;padding:7px;border-radius:11px;background:var(--bg);color:var(--muted);transition:background .18s,color .18s}
.nav-item:hover{background:var(--soft);color:var(--ink)}.nav-item:hover .icon{background:var(--pale);color:var(--blue)}
.nav-item.active{background:var(--pale);color:var(--navy);box-shadow:none}.nav-item.active .icon{background:var(--blue);color:#fff}
html[data-theme=dark] .nav-item.active .icon{color:var(--bg)}
.nav-badge{position:static;margin-left:auto;background:var(--coral);color:#fff;min-width:20px;height:20px;font-size:11px}
.role-label{padding:0 12px}
.sidebar-water{opacity:.7}
.drawer-close{display:none}
.nav-item{min-height:42px;padding:6px 10px;margin:2px 0}.nav-item .icon{width:30px;height:30px;padding:6px;border-radius:10px}
@media(min-width:801px){.sidebar-water{height:120px}.sidebar-foot{margin-bottom:64px}}
/* Recolhido (botão ☰ no computador): só ícones */
@media(min-width:801px){
  body.nav-compact{--aside:84px}
  body.nav-compact .sidebar{padding:22px 12px}
  body.nav-compact .identity{padding:0 0 18px;align-items:center}
  body.nav-compact .identity>span:not(.identity-name),body.nav-compact .identity-name .version,body.nav-compact .role-label,body.nav-compact .nav-caption,body.nav-compact .sidebar-foot,body.nav-compact .sidebar-art{display:none}
  body.nav-compact .identity-name{font-size:0;justify-content:center}
  body.nav-compact .nav-item{justify-content:center;padding:6px}
  body.nav-compact .nav-item>span:not(.nav-badge){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  body.nav-compact .nav-item .nav-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;font-size:9px;padding:0 4px}
  .workspace{transition:margin-left .22s ease}
}

/* ---------- Topo ---------- */
.topbar{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);height:70px;padding:0 32px;gap:16px}
.topbar .breadcrumb{flex:1}
.menu-toggle{flex:none}
.icon-button{border-radius:12px;background:var(--surface);border-color:var(--line)}
.icon-button:hover{background:var(--pale);color:var(--blue)}
#month,#theme{border-radius:12px}

/* ---------- Conteúdo: mais respiro ---------- */
main{padding:36px 40px 48px;max-width:1440px}
.page-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;margin:0 0 32px;padding:26px 30px;border-radius:24px;background:linear-gradient(120deg,var(--surface) 0%,var(--surface) 55%,var(--tile1) 100%);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.page-intro p{max-width:62ch;font-size:14px;line-height:1.65;margin-top:8px;color:var(--muted)}
.page-intro .eyebrow{color:var(--blue);letter-spacing:1.6px;font-weight:750}
.page-intro .date-tag{display:inline-block;margin-top:14px;background:var(--pale);color:var(--navy);border:0;font-weight:650}
.intro-art{width:210px;height:140px;flex:none}
.page-art{width:100%;height:100%;overflow:visible}
.ia-s{fill:var(--art-soft)}.ia-s2{fill:var(--art-soft)}.ia-a{fill:var(--art-main)}.ia-b{fill:var(--art-secondary)}.ia-c{fill:var(--art-accent)}.ia-c2{fill:color-mix(in srgb,var(--art-accent) 70%,#000)}.ia-p{fill:var(--art-paper);stroke:var(--line);stroke-width:1.5}
.ia-l{stroke:var(--line);stroke-width:5;stroke-linecap:round;fill:var(--line)}.ia-l-w{stroke:#fff;stroke-width:5;stroke-linecap:round;fill:none;opacity:.85}.ia-l-c{stroke:var(--art-accent);stroke-width:6;stroke-linecap:round;fill:none}.ia-l-a{stroke:var(--art-main);stroke-width:6;stroke-linecap:round;fill:none}
.ia-c[stroke-width]{stroke:var(--art-accent);stroke-linecap:round}
.panel{padding:28px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.panel-head{margin-bottom:22px}
.panel-head h2{font-size:17px;font-weight:700}
.filter-panel{padding:22px 24px;background:var(--surface)}
.filters{gap:16px}
.results-head{margin:28px 4px 14px;font-size:12px}
.cards{gap:20px}
.entry-card{padding:24px;gap:14px;border-radius:18px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.entry-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.entry-card h3{font-size:16px}
.entry-card p{font-size:13px;line-height:1.6}
.badge{background:var(--pale);color:var(--navy);padding:5px 10px;font-size:11px}
.button{border-radius:var(--radius-control);min-height:44px;padding:10px 18px;font-size:13px;font-weight:650;background:var(--blue);color:var(--action-ink)}
.button:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 28%,transparent)}
.button.secondary{background:var(--surface);color:var(--blue);border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line))}
.button.secondary:hover{background:var(--pale)}
.button.ghost{background:transparent;color:var(--blue)}
.button.ghost:hover{box-shadow:none;text-decoration:underline}
input,select,textarea{border-radius:12px;border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.notice{border-radius:16px;border-color:color-mix(in srgb,var(--blue) 25%,var(--line));background:var(--pale);color:var(--ink);padding:14px 18px}
.view-banner{border-radius:16px;padding:10px 16px;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.skeleton{background:linear-gradient(100deg,var(--soft) 20%,var(--surface) 45%,var(--soft) 70%);background-size:220% 100%}
.footer{padding:0 40px 28px}
.kpis{border-radius:20px;box-shadow:var(--shadow)}
.toast{background:var(--navy);color:var(--surface);border-radius:14px}
dialog{border-radius:24px}
.empty{border-radius:20px;background:var(--surface)}

/* ---------- Página inicial (Meu espaço) ---------- */
.space-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:28px;align-items:end;min-height:330px;padding:34px 40px 30px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:28px;text-align:left;background:var(--sky2)}
.space-hero>*{position:relative;z-index:1}
.hero-scene{position:absolute!important;inset:0;width:100%;height:100%;z-index:0!important}
.sc-sky1{stop-color:var(--sky1)}.sc-sky2{stop-color:var(--sky2)}.sc-sun{fill:var(--sun)}.sc-cloud{fill:var(--cloud);opacity:.9}.sc-hill1{fill:var(--hill1)}.sc-hill2{fill:var(--hill2)}
.sc-house rect{fill:var(--house)}.sc-house path{fill:var(--roof)}.sc-tree{fill:var(--tree)}.sc-water1{fill:var(--water1);opacity:.8}.sc-water2{fill:var(--water2);opacity:.8}
.space-hero .hero-pet{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:end}
.space-hero .hero-pet .mascot-art{filter:drop-shadow(0 10px 18px #12302b22)}
.space-hero .pet-plate{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:8px 16px;text-align:center;box-shadow:var(--shadow)}
.space-hero .pet-plate .mascot-name{font-size:20px;font-family:var(--font-display);margin:0}
.space-hero .pet-plate p{color:var(--muted);margin:0}
.space-hero .hero-copy{display:flex;flex-direction:column;gap:12px;align-self:center;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:22px;padding:24px 26px;box-shadow:var(--shadow);max-width:640px}
.space-hero .hero-date{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue)}
.space-hero .hero-title{font-size:clamp(28px,3vw,40px);line-height:1.1;margin:0;color:var(--navy)}
.space-hero .hero-sub{color:var(--muted);font-size:15px;margin:0}
.space-hero .home-chips{display:flex;flex-wrap:wrap;gap:8px}
.space-hero .home-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--ink);min-height:34px;font-weight:550}
.space-hero .home-chip.is-alert{background:color-mix(in srgb,var(--coral) 16%,var(--surface));border-color:color-mix(in srgb,var(--coral) 40%,var(--line));color:var(--ink);cursor:pointer}
.space-hero .quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 0}
.space-hero .gift{margin:4px 0 0;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent);color:var(--ink)}
.space-hero .pet-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.pill-button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pill-button:hover{background:var(--pale);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.space-hero .pet-meter{display:flex;flex-direction:column;gap:4px;margin-left:auto;min-width:180px}
.space-hero .pet-meter small{color:var(--muted);font-size:11px}
.meter{background:var(--soft)}.meter span{background:linear-gradient(90deg,var(--art-secondary),var(--blue))}
.home-cards{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.home-notebook{grid-column:1/-1}
.card-kicker{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.home-cards .panel-head h2{font-size:20px;font-family:var(--font-display)}
.agenda-today{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.agenda-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--art-secondary)}
.agenda-item.is-mine{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.agenda-time{font-weight:750;font-size:13px;color:var(--navy);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.agenda-time b{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue)}
.agenda-what{display:flex;flex-direction:column;gap:3px;min-width:0}
.agenda-what strong{font-size:15px}
.agenda-what small{color:var(--muted);font-size:12px}
.agenda-fronts{display:flex;align-items:center;gap:5px;margin-top:4px}
.agenda-fronts em{font-style:normal;font-size:11px;font-weight:700;color:var(--orange);margin-left:4px}
.front-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.f-atendimento{background:var(--front-atendimento)}.f-socioambiental{background:var(--front-socioambiental)}.f-comunicacao{background:var(--front-comunicacao)}.f-gestao{background:var(--front-gestao)}.f-administrativo{background:var(--front-administrativo)}.f-comercializacao{background:#6b8e23}
.agenda-today.is-next .agenda-item{border-left-color:var(--line);background:var(--surface)}
.agenda-empty{display:flex;align-items:center;gap:16px;padding:12px 4px;color:var(--muted)}
.agenda-empty strong{color:var(--ink)}
.empty-art{width:96px;height:72px;flex:none}.ea-paper{fill:var(--surface);stroke:var(--line);stroke-width:2}.ea-top{fill:var(--art-secondary)}.ea-ring{fill:var(--art-main)}.ea-check{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.home-check .day-nav{margin-bottom:10px}
.check-list li{border-radius:12px;padding:8px 10px}
.check-list li:hover{background:var(--soft)}
.notebook{border-radius:16px;background:var(--bg);line-height:1.8;padding:16px 18px}
.color-picker .swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #0002}
.pet-option{border-radius:18px;transition:border-color .15s,transform .15s}.pet-option:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.pet-option.is-picked{border-color:var(--blue);background:var(--pale)}
.welcome-pets{background:linear-gradient(180deg,var(--tile1),var(--surface) 55%)}
/* Mascote vivo: balança e pisca (desligado com movimento reduzido) */

/* 2.14 · Obras de hoje, "outra obra", missões e obras ativas × ações. */
.obra-tabs{margin:0 0 18px;width:max-content;max-width:100%;overflow-x:auto}
.obras-hoje .panel-head{align-items:flex-end;flex-wrap:wrap;gap:12px}.field.compact{display:grid;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.hoje-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:14px 0}
.hoje-obra{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .18s,background .18s,transform .18s}
.hoje-obra:hover{transform:translateY(-1px)}.hoje-obra input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--blue)}
.hoje-obra>span{display:grid;gap:3px;flex:1;min-width:0}.hoje-obra strong{font-size:13px}.hoje-obra small{font-size:11px;color:var(--muted)}
.hoje-obra.is-on{border-color:var(--blue);background:var(--pale)}
.hoje-sugerida{font-style:normal;font-size:10px;font-weight:700;color:var(--blue);background:var(--surface);border:1px dashed var(--blue);border-radius:20px;padding:2px 8px;white-space:nowrap}
.hoje-nenhuma{margin:4px 0 0}
.vinculo-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:12px}
.vinculo-obs{margin:8px 0;padding:8px 12px;border-left:3px solid var(--orange,#d58c31);background:var(--bg);border-radius:0 8px 8px 0;font-size:12px;line-height:1.5}
.vinculo-acao{display:flex;gap:8px;margin-top:10px;align-items:stretch}.vinculo-acao select{flex:1;min-width:0}.vinculo-acao .button{flex:none;padding:0 18px}
#obrasVincular .results-head{align-items:center}
.missoes{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
.missao{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,var(--pale),transparent);border:1px solid var(--line)}
.missao-alvo{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--blue);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 11px var(--blue)}
.missao-texto{display:grid;gap:2px;flex:1;min-width:0}.missao-texto strong{font-size:13px}.missao-texto small{font-size:11px;color:var(--muted);line-height:1.45}
.missao .button{flex:none;font-size:12px}
@media (max-width:640px){.missao{flex-wrap:wrap}.missao .button{width:100%}}
.obras-cmp{margin-bottom:18px}
.cmp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 16px}
.cmp-kpis>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}.cmp-kpis strong{font-size:22px;line-height:1.1}.cmp-kpis span{font-size:11px;color:var(--muted)}
.cmp-kpis .is-warn strong{color:var(--orange,#c17a1f)}
.cmp-dias{display:flex;flex-wrap:wrap;gap:5px}
.cmp-dia{width:34px;height:34px;border-radius:9px;font-size:12px;font-weight:650;border:1px solid transparent;transition:transform .15s}
.cmp-dia:hover{transform:translateY(-2px)}.cmp-dia.is-sel{outline:2px solid var(--ink);outline-offset:2px}
.t-ok{background:#d9f2e6;color:#175747}.t-aten{background:#fbe7c8;color:#7a4a0c}.t-nd{background:var(--bg);color:var(--muted);border-color:var(--line)!important;border-style:dashed!important}.t-zero{background:var(--bg);color:var(--ink)}
html[data-theme=dark] .t-ok{background:#233c35;color:#99dcc5}html[data-theme=dark] .t-aten{background:#443a2f;color:#f4c184}
.cmp-legenda{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;margin:10px 0 0}.cmp-legenda span{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid transparent;vertical-align:middle;margin-right:4px}
.cmp-detalhe{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.cmp-detalhe h3{font-size:14px;margin-bottom:6px}.cmp-detalhe p{font-size:12px;line-height:1.55;margin:4px 0}
@media (max-width:640px){.cmp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 2.15 · Entregas do mês: 4 cartões com etapas. */
.entregas-mes{margin-bottom:22px}
.entregas-topo{display:grid;gap:8px;margin-bottom:14px}.entregas-topo h2{font-size:18px}
.entregas-barra{height:8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.entregas-barra span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--front-socioambiental,#2e9e7d));border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.entrega-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}@media (max-width:1250px){.entrega-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:640px){.entrega-grid{grid-template-columns:1fr}}
.entrega-skel{height:250px;border-radius:var(--radius,16px)}
.entrega-card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--radius,16px);background:var(--surface);transition:transform .2s,box-shadow .2s}
.entrega-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #17273712}
.entrega-card.s-entregue{border-color:#9fd8bf;background:linear-gradient(180deg,#f1fbf6,var(--surface) 60%)}
html[data-theme=dark] .entrega-card.s-entregue{border-color:#2f5a4b;background:linear-gradient(180deg,#1d332b,var(--surface) 60%)}
.entrega-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.entrega-head h3{font-size:15px;line-height:1.3}
.entrega-passos{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:9px;color:var(--muted);text-align:center}
.entrega-passos li{display:grid;gap:4px;justify-items:center}.entrega-passos span{display:block;width:100%;height:5px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.entrega-passos li.feito span{background:var(--blue);border-color:var(--blue)}.entrega-passos li.atual span{background:var(--blue);border-color:var(--blue);opacity:.55}
.entrega-passos li.atual{color:var(--ink);font-weight:700}
.entrega-card.s-entregue .entrega-passos span{background:#2e9e7d;border-color:#2e9e7d;opacity:1}
.entrega-arquivo{font-size:12px}.entrega-arquivo a{display:inline-flex;gap:5px;align-items:center;color:var(--blue);font-weight:600}.entrega-arquivo .icon{width:14px;height:14px}
.entrega-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0}.entrega-meta dt{font-size:10px;color:var(--muted);font-weight:600}.entrega-meta dd{font-size:12px;margin:0}
.entrega-acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.entrega-acoes .button{font-size:12px;min-height:34px;padding:0 12px}
.entrega-retratos{font-size:11px}.entrega-retratos summary{cursor:pointer;color:var(--muted)}.entrega-retratos ul{margin:6px 0 0;padding-left:16px;line-height:1.6}
.entrega-card.acabou-de-entregar{animation:entregaPop .7s cubic-bezier(.2,.9,.3,1.3)}
.entrega-card.acabou-de-entregar::after{content:'✓';position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#2e9e7d;color:#fff;font-weight:800;box-shadow:0 4px 12px #2e9e7d55;animation:entregaSelo .6s .15s both cubic-bezier(.2,.9,.3,1.4)}
@keyframes entregaPop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes entregaSelo{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
html[data-motion=reduce] .entrega-card,html[data-motion=reduce] .entrega-card::after,html[data-motion=reduce] .entregas-barra span{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.entrega-card,.entrega-card::after,.entregas-barra span{animation:none!important;transition:none!important}}

/* 2.16 · Qualidade dos relatos, devolutiva e guia. */
.qualidade-chips{list-style:none;padding:0;margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:4px}
.qualidade-chips li{font-size:10px;font-weight:650;padding:3px 8px;border-radius:20px;border:1px solid var(--line);cursor:help}
.qualidade-chips li.ok{background:#e4f5ec;color:#175747;border-color:#bfe5d1}.qualidade-chips li.falta{background:var(--surface);color:var(--muted);border-style:dashed}
html[data-theme=dark] .qualidade-chips li.ok{background:#233c35;color:#99dcc5;border-color:#2f5a4b}
.qualidade-lista{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}.qualidade-lista li{display:grid;gap:2px;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.qualidade-lista li.ok{color:#175747}.qualidade-lista li.falta{background:var(--pale)}.qualidade-lista span{font-size:12px;color:var(--ink)}
.devolutiva-texto{margin:10px 0 14px;padding:12px 14px;border-left:3px solid var(--blue);background:var(--pale);border-radius:0 10px 10px 0;white-space:pre-wrap;line-height:1.55}
.devolutiva-status{color:var(--blue);margin:6px 0 0}
.relato-card .card-bottom{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.relato-card .card-bottom>span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guia-pontos{padding-left:20px;display:grid;gap:10px;margin:12px 0}.guia-pontos li{display:grid;gap:2px;line-height:1.45}.guia-pontos em{font-size:12px;color:var(--muted)}
.guia-pontos li.falta{background:var(--pale);border-radius:8px;padding:6px 8px;margin-left:-8px}
.guia-falta{font-size:10px;font-weight:700;color:var(--blue);border:1px dashed var(--blue);border-radius:20px;padding:1px 7px;margin-left:6px}
.guia-exemplo{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.6;font-size:13px}
.missao.t-devolutiva .missao-alvo{border-color:#c17a1f;box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 11px #c17a1f}

/* 2.17 · Mapa de Santo André. */
.mapa-barra{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:14px}
.mapa-camadas{display:flex;flex-wrap:wrap;gap:6px 14px}.mapa-camada{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}.mapa-camada input{accent-color:var(--blue)}
.bola{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--cor);opacity:.85;vertical-align:middle;margin-right:4px;flex:none}
.mapa-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mapa-canvas{height:min(68vh,640px);min-height:380px;border-radius:var(--radius,16px);border:1px solid var(--line);overflow:hidden;background:var(--bg);position:relative;z-index:0}
.mapa-canvas.is-posicionando,.mapa-canvas.is-posicionando .leaflet-container{cursor:crosshair}
.mapa-canvas.is-posicionando{outline:3px solid var(--blue);outline-offset:-3px}
.mapa-carregando{display:flex;gap:8px;align-items:center;justify-content:center;height:100%;color:var(--muted)}
.mapa-lista{padding:16px;overflow:auto;height:100%}
.mapa-lado{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius,16px);padding:16px;display:grid;gap:10px}
.mapa-totais{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}.mapa-totais dt{font-size:10px;color:var(--muted);font-weight:650}.mapa-totais dd{font-size:22px;font-weight:750;margin:0}
.mapa-sub{font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mapa-mini{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:12px}.mapa-mini li{display:flex;gap:6px;align-items:center}.mapa-mini li strong{margin-left:auto}
.mapa-posicionar summary{cursor:pointer;display:grid;gap:2px;font-size:12px}.mapa-posicionar select{width:100%;font-size:12px}.mapa-posicionar .button{font-size:12px;width:100%;margin-top:6px}
.leaflet-container{font:inherit}.mapa-fundo{filter:saturate(.75) brightness(1.02)}html[data-theme=dark] .mapa-fundo{filter:invert(.92) hue-rotate(180deg) saturate(.6) brightness(.9)}.leaflet-tooltip{font-size:12px;border-radius:8px}
.mapa-obra-hoje{animation:mapaPulso 2.4s ease-in-out infinite}
@keyframes mapaPulso{0%,100%{stroke-width:2;stroke-opacity:1}50%{stroke-width:7;stroke-opacity:.35}}
html[data-motion=reduce] .mapa-obra-hoje{animation:none}@media (prefers-reduced-motion:reduce){.mapa-obra-hoje{animation:none}}
@media (max-width:1000px){.mapa-wrap{grid-template-columns:1fr}.mapa-canvas{height:60vh}}

/* 2.18 · Elenco chibi: respira a partir dos pés (quadro 200×240) e um pulinho ao comemorar. */
.mascot-svg.chibi .m-all{transform-origin:100px 226px}
.hero-pet .mascot-svg.chibi{filter:drop-shadow(0 6px 10px #3a241014)}
/* 2.19 · Saber mais: balão "Você sabia?", campanha do mês, pergunta do dia e quiz da semana. */
.saber-balao{position:relative;margin:10px 0 4px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:560px}
.saber-balao::before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.saber-balao p{margin:4px 0 6px;font-size:14px;line-height:1.5}
.saber-kicker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--blue)}.saber-kicker small{font-weight:600;color:var(--muted)}
.saber-fonte{font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;word-break:break-word}.saber-fonte:hover{color:var(--blue)}
.saber-revisar{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--accent);color:#3b2a00}
.home-saber{grid-column:1/-1;display:grid;gap:14px}
.saber-mes{display:flex;gap:10px;align-items:center;margin:0;font-size:14px}.saber-laco{width:14px;height:14px;border-radius:50%;flex:none;background:var(--laco,var(--coral));box-shadow:0 0 0 3px var(--soft)}
.saber-data{margin:0;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.5}
.quiz-dia,.quiz-semana{padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,var(--pale),transparent 70%)}
.quiz-pergunta{font-size:16px;font-weight:700;margin:8px 0 10px;line-height:1.4;font-family:var(--font-display)}
.quiz-opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quiz-opcao{display:flex;gap:10px;align-items:center;text-align:left;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.quiz-opcao b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none;background:var(--soft);color:var(--blue);font-size:12px}
.quiz-opcao:not([disabled]):hover{border-color:var(--blue);transform:translateY(-1px)}.quiz-opcao:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.quiz-opcao[disabled]{cursor:default}.quiz-opcao.is-enviando{border-color:var(--blue);background:var(--pale)}
.quiz-opcao.is-certa{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 16%,var(--surface))}.quiz-opcao.is-certa b{background:var(--mint);color:#fff}
.quiz-opcao.is-errada{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--surface))}.quiz-opcao.is-errada b{background:var(--coral);color:#fff}
.quiz-opcao.is-apagada{opacity:.55}
.quiz-resultado{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;background:var(--soft)}.quiz-resultado.is-ok strong{color:var(--mint)}.quiz-resultado.is-nao strong{color:var(--coral)}
.quiz-semana{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:14px;align-items:center}.quiz-semana p{margin:4px 0 0}
.quiz-placar{font-size:18px;font-weight:800;font-family:var(--font-display);margin:14px 0 6px}
.quiz-revisao summary{cursor:pointer;font-weight:700;font-size:13px}.quiz-item{padding:10px 0;border-top:1px solid var(--line)}.quiz-item p{margin:2px 0}
@media (max-width:640px){.quiz-opcoes{grid-template-columns:1fr}.quiz-semana{grid-template-columns:1fr}.saber-balao::before{display:none}}
@media (prefers-reduced-motion:reduce){.quiz-opcao{transition:none}.quiz-opcao:not([disabled]):hover{transform:none}}
/* 2.20 · Álbum da equipe: fotos favoritas, álbum do mês e Fotos da semana. */
.album-topo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.album-topo h2{margin:2px 0;font-family:var(--font-display)}.album-topo p{margin:0}
.album-vagas{padding:8px 14px;border-radius:999px;background:var(--pale);color:var(--blue);font-weight:700;font-size:13px}
.album-bloco{margin-top:22px}
.album-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.album-mes{margin:18px 0 10px;font-size:15px;font-weight:700}
.album-bloco .panel-head+.album-mes{margin-top:4px}
.album-grade.is-destaque{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.album-skel{aspect-ratio:4/3;border-radius:16px}
.album-foto{margin:0;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.album-foto:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}.album-foto.is-meu{border-color:var(--coral)}
.album-ver{position:relative;display:block;padding:0;border:0;background:var(--soft);cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}
.album-ver img{width:100%;height:100%;object-fit:cover;display:block}
.album-sem{display:none;position:absolute;inset:0;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--pale),var(--soft))}
.album-foto.sem-imagem .album-ver img{visibility:hidden}.album-foto.sem-imagem .album-sem{display:grid}
.album-foto figcaption{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px}
.album-legenda{display:grid;min-width:0}.album-legenda strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album-legenda small{font-size:11px;color:var(--muted)}
.album-coracao{display:inline-flex;gap:4px;align-items:center;min-height:36px;min-width:44px;justify-content:center;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--coral);font:inherit;font-size:16px;cursor:pointer;transition:transform .15s,background .15s}
.album-coracao b{font-size:12px;color:var(--ink)}.album-coracao.is-on{background:color-mix(in srgb,var(--coral) 16%,var(--surface));border-color:var(--coral)}
.album-coracao:hover{transform:scale(1.06)}.album-coracao[aria-disabled=true]{opacity:.5}.album-coracao.is-enviando{opacity:.6}.album-coracao:focus-visible,.album-ver:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.album-grande{margin:0}.album-grande img{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:var(--soft)}.album-grande figcaption{margin-top:8px;font-size:13px;color:var(--muted)}
@media (max-width:640px){.album-grade,.album-grade.is-destaque{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.album-legenda small{display:none}}
@media (prefers-reduced-motion:reduce){.album-foto,.album-coracao{transition:none}.album-foto:hover,.album-coracao:hover{transform:none}}
/* 2.21 · Joguinhos: forca do saneamento e quebra-cabeça. */
.home-jogos{grid-column:1/-1}
.jogos-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.jogo-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,var(--pale),transparent 75%)}
.jogo-card h3{margin:0 0 4px;font-family:var(--font-display);font-size:17px}.jogo-card p{margin:4px 0 8px}.jogo-card .meter{display:block;margin:6px 0 4px}
.jogo-card.is-travado{background:var(--soft)}.jogo-card.is-travado h3{color:var(--muted)}
.jogo-icone{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--surface);font-size:28px;flex:none;box-shadow:var(--shadow)}
.forca-dica{margin:0 0 14px;font-size:14px;line-height:1.5}
.forca-palavra{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.forca-casa{display:grid;place-items:center;width:30px;height:40px;border-bottom:3px solid var(--blue);font:800 22px var(--font-display);color:var(--ink)}
.forca-espaco{width:16px}
.forca-gotas{display:flex;gap:6px;justify-content:center;font-size:22px;margin-bottom:14px}.forca-gota.is-seca{filter:grayscale(.3);opacity:.75}
.forca-teclado{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.forca-tecla{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--font-ui);cursor:pointer}
.forca-tecla:not([disabled]):hover{border-color:var(--blue)}.forca-tecla.is-certa{background:color-mix(in srgb,var(--mint) 22%,var(--surface));border-color:var(--mint)}
.forca-tecla.is-errada{background:var(--soft);color:var(--muted);text-decoration:line-through}.forca-tecla:focus-visible,.quebra-peca:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.quebra-tabuleiro{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(100%,420px);aspect-ratio:1;margin:8px auto 12px;padding:4px;border-radius:14px;background:var(--line)}
.quebra-tabuleiro.is-pronto{gap:0;padding:0;overflow:hidden}
.quebra-peca{position:relative;border:0;border-radius:8px;background-color:var(--soft);background-size:300% 300%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.quebra-tabuleiro.is-pronto .quebra-peca{border-radius:0}.quebra-peca small{position:absolute;left:5px;top:3px;font:700 11px var(--font-ui);color:#fff;text-shadow:0 1px 2px #0009}
.quebra-tabuleiro.is-pronto .quebra-peca small{display:none}
.quebra-peca.is-marcada{box-shadow:0 0 0 4px var(--accent);transform:scale(.95);z-index:1}
@media (max-width:640px){.jogos-grade{grid-template-columns:1fr}.forca-teclado{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.quebra-peca{transition:none}}
/* 2.22 · Tema do mês: o Claro com as cores da campanha de saúde do mês (data-campanha = mês 1–12). Contraste do destaque ≥ 4,5:1. */
html[data-theme=light][data-campanha="1"]{--blue:#4f6a82;--soft:#f5f7fa;--focus:#4f6a82;--pale:#edf1f5;--navy:#2f4458;--bg:#f6f8fa;--wave1:#dfe6ec;--wave2:#b9c7d3;--wave3:#8ea3b6;--art-main:#4f6a82;--art-secondary:#b9c7d3;--art-soft:#edf1f5;--water1:#b9c7d3;--water2:#8ea3b6;--hill1:#dfe6ec;--hill2:#edf1f5} /* Janeiro Branco */

html[data-theme=light][data-campanha="7"]{--blue:#835c00;--soft:#fef8e6;--focus:#835c00;--pale:#fdf3d1;--navy:#4f3800;--bg:#fdfaf0;--wave1:#f8e08a;--wave2:#f2c230;--wave3:#c99a12;--art-main:#835c00;--art-secondary:#f2c230;--art-soft:#fdf3d1;--water1:#f2c230;--water2:#c99a12;--hill1:#f8e08a;--hill2:#fdf3d1} /* Julho Amarelo */

html[data-theme=light][data-campanha="12"]{--blue:#b02a2e;--soft:#fdf2f1;--focus:#b02a2e;--pale:#fbe7e6;--navy:#6e1a1c;--bg:#fdf6f5;--wave1:#f4c4c2;--wave2:#e5807b;--wave3:#c0393d;--art-main:#b02a2e;--art-secondary:#e5807b;--art-soft:#fbe7e6;--water1:#e5807b;--water2:#c0393d;--hill1:#f4c4c2;--hill2:#fbe7e6} /* Dezembro Vermelho */
/* 2.23 · Placar da equipe: só totais da equipe, meta da semana e as últimas 4 semanas. */
.home-placar{grid-column:1/-1}
.placar-topo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.placar-total strong{display:block;font:800 44px/1 var(--font-display);color:var(--blue)}.placar-total>span{font-size:13px;color:var(--muted)}
.placar-meta{display:block;height:12px;margin:12px 0 6px}.placar-total p{margin:6px 0 0}
.placar-itens{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.placar-itens li{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px}.placar-itens strong{font-size:17px;font-family:var(--font-display)}
.placar-semanas{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;height:150px;margin-top:18px;padding-top:6px}
.placar-semana{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.placar-semana b{font-size:12px}
.placar-barra{display:flex;align-items:flex-end;width:min(56px,100%);height:62%;border-radius:8px 8px 4px 4px;background:var(--soft)}
.placar-barra span{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--art-secondary,var(--blue));opacity:.55}
.placar-semana.is-atual .placar-barra span{background:var(--blue);opacity:1}.placar-semana small{font-size:11px;color:var(--muted)}.placar-semana.is-atual small{color:var(--blue);font-weight:700}
@media (max-width:640px){.placar-topo{grid-template-columns:1fr}.placar-total strong{font-size:36px}}
/* ============ 2.24 · Visual "Veolia acolhedor" (v3) — só com html[data-visual=v3] (proprietário durante os testes) ============
   Referência: a recepção e o escritório da Veolia — parede verde ripada, parede de plantas, balcão branco com luz quente embaixo,
   piso de madeira clara, cadeiras terracota e o vermelho Veolia só como destaque. Cores pelos tokens: o resto do app acompanha. */
html[data-visual=v3]{
  --font-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:20px;--radius-control:12px;--ease:cubic-bezier(.2,.8,.2,1);
  --veolia:#e2231a;--terracota:#c4552f;--luz:#f2b45a;
  --madeira1:#f4e9d6;--madeira2:#e8d4b2;--madeira3:#cfae80;
  --parede:#2f4f37;--ripa-clara:#36593e;--ripa-escura:#284430;--parede-tinta:#eef3e6;--parede-suave:#c9d8bf}
html[data-visual=v3][data-theme=light]{
  --surface:#fffdf8;--ink:#1f2a24;--muted:#56645b;--line:#e8e0d2;
  --mint:#2f7d4f;--coral:#d7261e;--orange:#c4552f;--accent:#e9a23b;
  --house:#fffdf8;--roof:#c4552f;--tree:#5e8f4a;--cloud:#fffdf8;--art-ink:#1e3d2f;--art-paper:#fffdf8;--art-accent:#e9a23b;
  --tile1:#eef3e8;--tile2:#f6eedf;--tile3:#fbece4;--chart-3:#e9a23b;--chart-4:#c4552f;--action-ink:#fff;
  --front-atendimento:#2f6e9b;--front-socioambiental:#3f7d45;--front-comunicacao:#b8502b;--front-gestao:#76598f;--front-administrativo:#8a6a4a;
  --shadow:0 1px 2px #3a2a1a0d,0 10px 28px -8px #3a2a1a17;--shadow-hover:0 2px 6px #3a2a1a14,0 22px 44px -14px #3a2a1a2e}
html[data-visual=v3][data-theme=light]:not([data-campanha]){
  --bg:#f5f0e6;--blue:#2d6a4f;--focus:#2d6a4f;--pale:#e3eee2;--navy:#1e3d2f;--soft:#eef2e7;
  --art-main:#2d6a4f;--art-secondary:#7fa36b;--art-soft:#e6eddc;--wave1:#a7c77f;--wave2:#5e8f4a;--wave3:#2f5d34;--chart-1:#2d6a4f;--chart-2:#8db870;
  --sky1:#efe5d3;--sky2:#f8f3ea;--sun:#f2c46d;--hill1:#cfe0c3;--hill2:#e3ecd7;--water1:#8dbfa8;--water2:#5e9c86}
/* Tema do mês: a parede ganha o tom escuro da campanha (as plantas continuam verdes) */
html[data-visual=v3][data-campanha]{--parede:var(--navy);--ripa-clara:color-mix(in srgb,var(--navy) 88%,#fff);--ripa-escura:color-mix(in srgb,var(--navy) 82%,#000);--parede-suave:color-mix(in srgb,var(--pale) 80%,#fff)}
html[data-visual=v3][data-theme=dark]{
  --bg:#101812;--surface:#17211a;--ink:#edf2ea;--muted:#a9b8ac;--line:#2a382e;--blue:#93cfa2;--pale:#203527;--navy:#d5e8d6;--mint:#8fd6a7;--soft:#1b281f;--focus:#f2b45a;
  --coral:#f0786a;--orange:#e58a5f;--accent:#f2b45a;--art-main:#93cfa2;--art-secondary:#5e8f4a;--art-accent:#f2b45a;--art-ink:#101812;--art-paper:#edf2ea;--art-soft:#22362a;
  --tile1:#1b281f;--tile2:#252119;--tile3:#2b201b;--chart-1:#93cfa2;--chart-2:#5e8f4a;--chart-3:#f2b45a;--chart-4:#e58a5f;--action-ink:#0f1a12;
  --sky1:#1a2a20;--sky2:#17211a;--sun:#f2b45a;--hill1:#22392b;--hill2:#1c2f23;--water1:#2a5a4a;--water2:#1f4a3c;--house:#d9e3d8;--roof:#c4552f;--tree:#3f6f3a;--cloud:#2a3b30;
  --wave1:#3f6f3a;--wave2:#2f5d34;--wave3:#20412a;--madeira1:#2a241b;--madeira2:#3a3124;--madeira3:#57472f;
  --parede:#1b2e21;--ripa-clara:#203628;--ripa-escura:#16261b;
  --front-atendimento:#8fbfe6;--front-socioambiental:#8fd6a7;--front-comunicacao:#f0a37f;--front-gestao:#c3a8e0;--front-administrativo:#d8b48a;
  --shadow:0 1px 0 #ffffff08,0 14px 32px -14px #000000a6;--shadow-hover:0 0 0 1px #ffffff14,0 22px 44px -16px #000000b8}

/* ---------- Base: luz quente das luminárias sobre o piso claro ---------- */
html[data-visual=v3] body{font-family:var(--font-ui);background:radial-gradient(900px 420px at 72% -120px,#fff3da 0%,transparent 70%),var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[data-visual=v3][data-theme=dark] body{background:radial-gradient(900px 420px at 72% -120px,#3a2e1855 0%,transparent 70%),var(--bg)}
html[data-visual=v3] :is(h1,h2,h3,.hero-title,.welcome h2,.page-intro h1){font-family:var(--font-display);letter-spacing:-.02em}
html[data-visual=v3] :is(h1,.page-intro h1,.home-hero h1){font-weight:800}
html[data-visual=v3] ::selection{background:color-mix(in srgb,var(--blue) 26%,transparent)}
html[data-visual=v3] :focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px}

/* ---------- Lateral: a parede verde ripada, com a sanca de luz em cima e o jardim embaixo ---------- */
html[data-visual=v3] .sidebar{background:linear-gradient(180deg,#ffd9a024 0,transparent 120px),repeating-linear-gradient(90deg,var(--ripa-clara) 0 14px,var(--ripa-escura) 14px 16px),var(--parede);border-right:0;color:var(--parede-tinta);box-shadow:inset -1px 0 0 #0000002e,6px 0 24px -12px #0000003d;scrollbar-color:#ffffff40 transparent}
html[data-visual=v3] .identity-name{color:#fffdf8}
html[data-visual=v3] .identity>span:not(.identity-name){color:var(--parede-suave)}
/* Gota d'água (azul, com brilho) — a vermelha parecia sangue */
html[data-visual=v3] .brand-drop{background:radial-gradient(circle at 36% 62%,#ffffffcc 0 11%,transparent 12%),linear-gradient(165deg,#bfeaf7 0%,#5bb6dc 45%,#2a86b8 100%);box-shadow:none}
html[data-visual=v3] .version{background:#ffffff1f;color:#f7efe0}
html[data-visual=v3] .nav-group-head,html[data-visual=v3] .nav-caption{color:color-mix(in srgb,var(--parede-tinta) 70%,transparent)}
html[data-visual=v3] .nav-group-head:hover{background:#ffffff12;color:#fff}
html[data-visual=v3] .nav-item{color:var(--parede-tinta);font-weight:600;border-radius:12px;transition:background .2s var(--ease),color .2s,transform .2s var(--ease)}
html[data-visual=v3] .nav-item .icon{background:#ffffff14;color:var(--parede-tinta);transition:background .2s,color .2s,transform .25s var(--ease)}
html[data-visual=v3] .nav-item:hover{background:#ffffff16;color:#fff}html[data-visual=v3] .nav-item:hover .icon{background:#ffffff26;color:#fff;transform:scale(1.06)}
html[data-visual=v3] .nav-item.active{background:linear-gradient(180deg,#fffaf0,#f3e6cf);color:#1e3d2f;box-shadow:0 10px 18px -12px #00000080,inset 0 -2px 0 #e3cba6}
html[data-visual=v3] .nav-item.active .icon{background:var(--blue);color:var(--action-ink)}
html[data-visual=v3][data-theme=dark] .nav-item.active{background:linear-gradient(180deg,#f3ead8,#e3d3b4);color:#14251b}
html[data-visual=v3] .nav-badge{background:var(--veolia);color:#fff;box-shadow:0 0 0 2px var(--parede)}
html[data-visual=v3] .sidebar-water{display:none}
/* Só a lista de páginas rola; o jardim e a conta ficam fixos embaixo (o esmaecido mostra que há mais itens) */
html[data-visual=v3] .sidebar{display:flex;flex-direction:column;overflow:hidden}
html[data-visual=v3] .sidebar nav{flex:1 1 auto;min-height:0;overflow-y:auto!important;overflow-x:hidden;padding:6px 0 22px;scrollbar-width:thin;-webkit-mask:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 30px),transparent);mask:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 30px),transparent)}
html[data-visual=v3] .sidebar-art{display:block;flex:none;order:3;position:relative;height:92px;margin:0 -14px;pointer-events:none}
html[data-visual=v3] .sidebar-foot{flex:none;order:4;position:relative;z-index:2}
html[data-visual=v3] body.nav-compact .sidebar-art{display:none}
html[data-visual=v3] .sidebar-art::before{content:"";position:absolute;left:0;right:0;bottom:-18px;height:128px;background:var(--v3-jardim) center bottom/cover no-repeat;-webkit-mask:linear-gradient(180deg,transparent,#000 45%);mask:linear-gradient(180deg,transparent,#000 45%);pointer-events:none;transform-origin:50% 100%;animation:v3-brisa 9s ease-in-out infinite}
html[data-visual=v3][data-theme=dark] .sidebar-art::before{filter:brightness(.72) saturate(.9)}
html[data-visual=v3][data-theme=dark] .home-hero{filter:none}
html[data-visual=v3] .sidebar-foot{background:transparent!important;border-color:#ffffff22!important;box-shadow:none!important}
html[data-visual=v3] .account{color:var(--parede-suave);border-top-color:#ffffff22}html[data-visual=v3] .account-dot{background:#8fd6a7}
html[data-visual=v3] .sidebar .icon-button{background:#ffffff14;border-color:#ffffff22;color:#fff}

/* ---------- Topo: vidro claro sobre o piso ---------- */
html[data-visual=v3] .topbar{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
html[data-visual=v3] .breadcrumb strong{color:var(--navy);font-weight:750}
html[data-visual=v3] .search-trigger{background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 2px #3a2a1a0a;transition:border-color .2s,box-shadow .2s}
html[data-visual=v3] .search-trigger:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line));box-shadow:0 6px 16px -10px #3a2a1a40}
html[data-visual=v3] :is(.icon-button,#month,#theme){background:var(--surface);border-color:var(--line);border-radius:12px;transition:background .2s,color .2s,transform .2s var(--ease)}
html[data-visual=v3] .icon-button:hover{background:var(--pale);color:var(--blue)}html[data-visual=v3] .icon-button:active{transform:scale(.94)}
html[data-visual=v3] .top-avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--blue) 35%,transparent)}

/* ---------- Cabeçalho das páginas: o balcão claro com painel de madeira ripada e um ramo de plantas ---------- */
html[data-visual=v3] .page-intro{background:linear-gradient(90deg,var(--surface) 0 52%,color-mix(in srgb,var(--surface) 0%,transparent) 78%),repeating-linear-gradient(90deg,var(--madeira1) 0 10px,var(--madeira2) 10px 12px) right/40% 100% no-repeat,var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow),0 22px 30px -26px #e9a23b99;overflow:hidden}

html[data-visual=v3] .page-intro .date-tag{position:relative;z-index:1;background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--navy);border:1px solid var(--line);backdrop-filter:blur(4px)}

/* ---------- Visão do mês: a parede de plantas da recepção, com a gota vermelha da marca ---------- */

html[data-visual=v3] .home-hero .eyebrow{color:#f6d6a6}

html[data-visual=v3] :is(.kpi,.stat-tile){border-radius:18px;transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
html[data-visual=v3] :is(.stat-tile,.entry-card,.shortcut,.jogo-card,.album-foto,.entrega-card):hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}

html[data-visual=v3] .button{border-radius:12px;font-weight:700;letter-spacing:.005em;transition:transform .18s var(--ease),box-shadow .2s,background .2s,filter .2s}
html[data-visual=v3] .button:not(.secondary):not(.ghost):not(.white){box-shadow:inset 0 1px 0 #ffffff2e,0 8px 16px -10px color-mix(in srgb,var(--blue) 80%,#000)}

html[data-visual=v3] .button.secondary{background:var(--surface);border-color:color-mix(in srgb,var(--blue) 32%,var(--line))}
html[data-visual=v3] .pill-button{transition:transform .18s var(--ease),background .2s,border-color .2s}html[data-visual=v3] .pill-button:active{transform:scale(.96)}

/* ---------- Listas e tabelas ---------- */

html[data-visual=v3] .list-row:not(.list-head){transition:background .18s}html[data-visual=v3] .list-row:not(.list-head):hover{background:color-mix(in srgb,var(--pale) 55%,var(--surface))}

/* ---------- Janelas, aviso e busca ---------- */
html[data-visual=v3] dialog{border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 40px 90px -30px #1e3d2f66}

html[data-visual=v3] .toast{background:#1e3d2f;color:#fffdf8;border-radius:14px;border-left:4px solid var(--veolia);box-shadow:0 18px 36px -16px #1e3d2f99}

/* ---------- Meu espaço: o mascote na recepção (parede ripada, plantas, luminárias e piso de madeira) ---------- */
html[data-visual=v3] .space-hero{border:0;border-radius:26px;box-shadow:0 30px 44px -34px #e9a23bcc,var(--shadow);background:var(--parede)}
html[data-visual=v3] .v3-parede{fill:var(--parede)}html[data-visual=v3] .v3-ripas rect{fill:var(--ripa-clara)}
html[data-visual=v3] .v3-musgo{fill:#2b4a2e}html[data-visual=v3] .v3-piso1{stop-color:var(--madeira2)}html[data-visual=v3] .v3-piso2{stop-color:var(--madeira3)}
html[data-visual=v3] .v3-espinha{stroke:#00000014;stroke-width:1.2;fill:none}html[data-visual=v3] .v3-rodape{stroke:#00000026;stroke-width:3}
html[data-visual=v3] .v3-lumi line{stroke:#d9d2c3;stroke-width:1.5}html[data-visual=v3] .v3-lumi path{fill:#fffdf8;opacity:.94}html[data-visual=v3] .v3-lumi-luz{fill:#ffd58a;opacity:.9}
html[data-visual=v3] .space-hero .hero-copy{background:color-mix(in srgb,var(--surface) 90%,transparent);border-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 24px 40px -24px #00000059}

html[data-visual=v3] .v3-camada{transform:translate(calc(var(--px,0) * var(--k,0) * 1px),calc(var(--py,0) * var(--k,0) * .5px));transition:transform .5s var(--ease)}
html[data-visual=v3] .v3-cena-host .hero-pet{transform:translate(calc(var(--px,0) * 10px),calc(var(--py,0) * 4px));transition:transform .5s var(--ease)}

html[data-visual=v3] .v3-brisa{transform-box:fill-box;transform-origin:50% 100%}
html[data-visual=v3] .v3-brisa-1{animation:v3-brisa-folhas 13s ease-in-out infinite}html[data-visual=v3] .v3-brisa-2{animation:v3-brisa-folhas 10s ease-in-out infinite reverse}html[data-visual=v3] .v3-brisa-3{animation:v3-brisa-frente 7.5s ease-in-out infinite}
html[data-visual=v3] .v3-lumi{animation:v3-pendulo 7s ease-in-out infinite}html[data-visual=v3] .v3-lumi:nth-of-type(2){animation-duration:8.5s;animation-delay:-2s}

/* ---------- Celular: barra de atalhos de vidro claro e gaveta verde ---------- */

html[data-visual=v3] .tab-item.active{color:var(--blue)}html[data-visual=v3] .tab-item.active .icon{background:var(--pale);color:var(--blue)}

/* ---------- Movimento com significado ---------- */
@keyframes v3-sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes v3-janela{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes v3-balanca{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@keyframes v3-pendulo{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes v3-brisa{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-1.6deg)}}
@keyframes v3-brisa-folhas{0%,100%{transform:rotate(-.35deg)}50%{transform:rotate(.45deg)}}
@keyframes v3-brisa-frente{0%,100%{transform:rotate(-.8deg) translateX(-2px)}50%{transform:rotate(.9deg) translateX(2px)}}
@keyframes v3-pulso{0%{transform:scale(1)}35%{transform:scale(1.28);color:var(--accent)}100%{transform:scale(1)}}
@keyframes v3-voa{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 140px)) scale(1) rotate(var(--rot));opacity:0}}
@keyframes v3-marca{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
html[data-visual=v3] #view[data-entrando]>*{animation:v3-sobe .46s var(--ease) both}
html[data-visual=v3] #view .v3-novo{animation:v3-sobe .42s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
html[data-visual=v3] #view[data-entrando]>*:nth-child(2){animation-delay:.05s}html[data-visual=v3] #view[data-entrando]>*:nth-child(3){animation-delay:.1s}html[data-visual=v3] #view[data-entrando]>*:nth-child(n+4){animation-delay:.15s}
html[data-visual=v3] #view[data-entrando] :is(.kpi,.stat-tile,.home-cards>.panel,.album-foto,.jogo-card,.entry-card,.list-row:not(.list-head),.entrega-card,.missao,.wardrobe-item){animation:v3-sobe .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 120ms)}
html[data-visual=v3] .v3-pulso{display:inline-block;animation:v3-pulso .6s var(--ease)}
html[data-visual=v3] .check-list input:checked{animation:v3-marca .32s var(--ease)}
html[data-visual=v3] .check-list li span{transition:color .3s,opacity .3s}
.v3-folhas{position:fixed;inset:0;pointer-events:none;z-index:2147483000}
.v3-folhas span{position:absolute;width:18px;height:18px;animation:v3-voa 1.45s cubic-bezier(.2,.7,.3,1) both}.v3-folhas svg{width:100%;height:100%;display:block}
/* Quem pede menos movimento (no app ou no sistema) não vê nada se mexendo */
html[data-visual=v3][data-motion=reduce] :is(.v3-folha,.v3-brisa,.v3-lumi,#view[data-entrando] *,#view[data-entrando]>*,.v3-novo,.v3-pulso,dialog[open],.check-list input){animation:none!important}
html[data-visual=v3][data-motion=reduce] .sidebar-art::before,html[data-visual=v3][data-motion=reduce] .page-intro::after{animation:none!important}
html[data-visual=v3][data-motion=reduce] :is(.button,.stat-tile,.entry-card,.album-foto,.jogo-card,.nav-item .icon){transition:none!important;transform:none!important}
html[data-visual=v3][data-motion=reduce] :is(.v3-camada,.hero-pet){transform:none!important}
@media (prefers-reduced-motion:reduce){
  html[data-visual=v3] :is(.v3-folha,.v3-brisa,.v3-lumi,#view[data-entrando] *,#view[data-entrando]>*,.v3-novo,.v3-pulso,dialog[open],.check-list input),html[data-visual=v3] .sidebar-art::before,html[data-visual=v3] .page-intro::after{animation:none!important}
  html[data-visual=v3] :is(.v3-camada,.hero-pet){transform:none!important}
  html[data-visual=v3] :is(.button,.stat-tile,.entry-card,.album-foto,.jogo-card,.nav-item .icon){transition:none!important;transform:none!important}}
/* ============ 2.25 · Acabamento do visual novo: ícones de traço (no lugar dos emojis) e cores harmonizadas ============ */
html[data-visual=v3] .ic{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;stroke-width:1.9;flex:none}

/* Meu espaço · cartão de boas-vindas: selos neutros com ícone colorido */

html[data-visual=v3] .saber-kicker{color:var(--blue)}

html[data-visual=v3] .quiz-opcao b{background:var(--pale);color:var(--blue)}

/* Checklist e missões */

/* ============ 2.26 · Banco revisto, revisão do conteúdo, caderno, quadro, anexos, controle e organograma ============ */
/* O "i" de informação abre por cima do conteúdo, mesmo durante a entrada da página (cada cartão animado vira uma camada própria) */

/* Revisão do conteúdo */
.rev-resumo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center;margin-bottom:16px}
.rev-contas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rev-conta{display:grid;gap:2px;justify-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;min-height:0}
.rev-conta b{font-size:24px;line-height:1.1;letter-spacing:-.5px}.rev-conta span{font-size:12px;color:var(--muted)}
.rev-conta.is-on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--pale)}
.rev-conta.is-aprovado b{color:var(--mint)}.rev-conta.is-suspenso b{color:#a4482f}
.rev-eixos{display:grid;gap:7px}.rev-eixo{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12px}.rev-eixo b{text-align:right}
.rev-filtros{display:grid;grid-template-columns:repeat(2,minmax(0,180px)) minmax(0,1fr) auto;gap:12px;align-items:end;margin-bottom:16px;padding:16px 20px}
.rev-lista{display:grid;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px;box-shadow:var(--shadow)}
.rev-item.is-aprovado{border-left-color:var(--mint)}.rev-item.is-suspenso{border-left-color:#c0593d;opacity:.85}
.rev-item header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rev-item header b{font-size:13px}
.rev-chip{font-size:11px;font-weight:650;padding:3px 9px;border-radius:20px;background:var(--pale);color:var(--blue)}
.rev-chip.is-pratica{background:var(--soft);color:var(--mint)}.rev-chip.is-curiosidade{background:#fff3e4;color:#8a5413}
.rev-estado{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.rev-item.is-aprovado .rev-estado{color:var(--mint)}.rev-item.is-suspenso .rev-estado{color:#a4482f}
.rev-texto{font-size:14px;line-height:1.55}
.rev-opcoes{margin:0;padding-left:22px;list-style:upper-alpha;font-size:13px;display:grid;gap:3px}.rev-opcoes .is-certa{font-weight:650;color:var(--mint)}
.rev-certa{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--soft);color:var(--mint);border-radius:10px;padding:1px 7px}
.rev-correcao{font-size:12px;color:#7a5418;background:#fff7e9;border-radius:10px;padding:6px 10px}.rev-correcao .ic{width:14px;height:14px;vertical-align:-2px}
.rev-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rev-nota{flex:1 1 220px}.rev-nota input{width:100%}
.rev-acoes .button.ghost{padding:8px 12px;border:1px solid var(--line)}
@media (max-width:800px){.rev-resumo{grid-template-columns:1fr}.rev-contas{grid-template-columns:repeat(2,minmax(0,1fr))}.rev-filtros{grid-template-columns:1fr 1fr}.rev-busca{grid-column:1/-1}}
/* Organograma: o desenho é um "documento" claro (o mesmo do arquivo baixado), dentro de um quadro que rola */
.org-acoes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.org-acoes .ic{width:17px;height:17px}
.org-quadro{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fbfaf6;max-height:72vh;-webkit-overflow-scrolling:touch}
.org-quadro svg{display:block;max-width:100%;height:auto;margin:0 auto}.org-quadro.pode-editar svg .org-no{cursor:pointer}.org-quadro.pode-editar svg .org-no:hover rect:first-child{stroke:#2d6a4f;stroke-width:2}
.org-painel .small.muted{margin-top:10px}
.org-lista{margin-top:16px}.org-lista summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.org-lista table{margin-top:10px}
.org-ponto{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}

  @page{size:A4 landscape;margin:10mm}}

.pet-quadro{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;min-height:0;cursor:default;color:inherit;transform:rotate(-1.4deg);transition:transform .5s var(--ease,ease)}
button.pet-quadro{cursor:pointer}button.pet-quadro:hover .quadro-moldura{box-shadow:0 20px 28px -14px #000000b8,inset 0 0 0 2px #00000030,inset 0 2px 0 #ffffff30}
.quadro-moldura{position:relative;display:block;padding:10px;border-radius:5px;background:linear-gradient(135deg,#a0703f,#6e4526 55%,#8f5f37);box-shadow:0 16px 24px -14px #000000a8,inset 0 0 0 2px #00000030,inset 0 2px 0 #ffffff30}
.quadro-moldura::before{content:"";position:absolute;left:50%;top:-24px;width:64px;height:25px;transform:translateX(-50%);background:linear-gradient(to top right,transparent 47%,#5a4632 48% 52%,transparent 53%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 47%,#5a4632 48% 52%,transparent 53%) right/50% 100% no-repeat}
.quadro-moldura::after{content:"";position:absolute;left:50%;top:-29px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#c9a75a;box-shadow:0 1px 2px #0006}
.quadro-tela{position:relative;display:block;width:206px;height:146px;overflow:hidden;background:#f6f1e6;box-shadow:inset 0 0 0 1px #00000020}
.quadro-tela svg,.quadro-tela img{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:cover;display:block;box-shadow:0 0 0 1px #00000014}
.pet-quadro{position:relative}.quadro-placa{position:absolute;right:-18px;bottom:22px;z-index:2;transform:rotate(3deg);max-width:170px;padding:2px 10px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#4a3a22;background:linear-gradient(#ecd596,#c9a75a);box-shadow:0 1px 2px #0000004d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:800px){
  html[data-visual=v3] .space-hero.com-quadro{grid-template-columns:minmax(0,1fr)}
  html[data-visual=v3] .space-hero.com-quadro .hero-pet{flex-direction:column;gap:6px}

/* Meu caderno (visual novo): caderninho de capa marrom, folha pautada com margem; a capa abre na primeira vez e o dia vira a página */
html[data-visual=v3] .home-notebook.caderno{position:relative;padding:14px 14px 16px 32px;border:0;border-radius:16px 22px 22px 16px;background:radial-gradient(120% 90% at 30% 10%,#8b5a35,#6f4224 70%);box-shadow:0 22px 34px -24px #3a1f0dcc,inset 0 0 0 2px #00000026;perspective:1800px;overflow:visible}

html[data-visual=v3] .home-notebook.caderno::after{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;border-radius:16px 0 0 16px;background:linear-gradient(90deg,#4f2c15,#7a4a2b);box-shadow:inset -2px 0 3px #00000040}

html[data-visual=v3] .caderno .caderno-folha::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:#eaa7a2}
html[data-visual=v3] .caderno .caderno-folha::after{content:"";position:absolute;top:-8px;right:26px;width:14px;height:48px;background:#c0453a;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);box-shadow:0 2px 4px #0003}
html[data-visual=v3] .caderno .panel-head{margin-bottom:6px}html[data-visual=v3] .caderno h2{color:#3a2f25}html[data-visual=v3] .caderno .card-kicker{color:#8a5a34}
html[data-visual=v3] .caderno .caderno-data{margin:0 0 4px;font-size:13px;color:#8a5a34}html[data-visual=v3] .caderno .muted,html[data-visual=v3] .caderno .small.muted{color:#8a7a66}
html[data-visual=v3] .caderno textarea.notebook{display:block;width:100%;min-height:226px;margin:0;padding:1px 4px 0;border:0;border-radius:0;box-shadow:none;resize:vertical;font-size:15px;line-height:28px;color:#2f2a24;background:transparent repeating-linear-gradient(to bottom,transparent 0 27px,#c9dae8 27px 28px);background-attachment:local}

html[data-visual=v3] .caderno .caderno-rodape{margin-top:8px}
html[data-visual=v3] .caderno .notebook-past summary{color:#6f4224;font-weight:650;cursor:pointer}
html[data-visual=v3] .caderno .notebook-past .mini-row{background:#fff3df;border-color:#ead8b8;color:#3a2f25}html[data-visual=v3] .caderno .notebook-past .mini-row small{color:#7a6a56}
html[data-visual=v3] .caderno .caderno-capa{display:none;position:absolute;inset:0;z-index:4;align-items:center;justify-content:center;border-radius:16px 22px 22px 16px;transform-origin:left center;backface-visibility:hidden;
  background:radial-gradient(120% 90% at 30% 10%,#9a6640,#6f4224 70%);box-shadow:inset 0 0 0 2px #00000030,inset 22px 0 0 #4f2c15}
html[data-visual=v3] .caderno .caderno-etiqueta{padding:10px 22px;border-radius:6px;background:#f6ecd6;color:#5a3a1e;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 2px #c9a76e,0 4px 10px #0003}
html[data-visual=v3] .caderno .caderno-elastico{position:absolute;top:0;bottom:0;right:38px;width:11px;background:linear-gradient(90deg,#2a2018,#4a3a2c,#2a2018);box-shadow:0 0 4px #0006}
html[data-visual=v3] .caderno.is-abrindo .caderno-capa{display:flex;animation:caderno-abre 1s cubic-bezier(.55,.05,.3,1) .18s both}

@keyframes caderno-vira{0%{transform:rotateY(0)}40%{transform:rotateY(-14deg);opacity:.55}100%{transform:none;opacity:1}}
html[data-visual=v3][data-motion=reduce] .caderno .caderno-capa{display:none!important}html[data-visual=v3][data-motion=reduce] .caderno .caderno-folha{animation:none!important}
@media (prefers-reduced-motion:reduce){html[data-visual=v3] .caderno .caderno-capa{display:none!important}html[data-visual=v3] .caderno .caderno-folha{animation:none!important}}
