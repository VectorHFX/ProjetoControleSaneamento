<script>
window.CPTEntregas=(()=>{
 let ui,loaded=null,dirty=false,busy=false,requestId='',lastPayload='',session=0;
 const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function flatten(v){if(Array.isArray(v))return v.map(flatten).join('\n');if(v&&typeof v==='object')return Object.entries(v).map(([k,v])=>k+': '+flatten(v)).join('\n');return String(v??'');}
 function note(text){$('deliveryNotice').textContent=text;}
 function close(){if(busy){note('Aguarde a confirmação do salvamento.');return;}if(dirty&&!confirm('Há alterações não salvas. Deseja fechar sem salvar?'))return;++session;loaded=null;dirty=false;$('deliveryDialog').close();$('deliveryBody').innerHTML='';}
 async function open(id){if(busy)return;const ticket=++session;loaded=null;dirty=false;$('deliveryDialog').showModal();$('deliveryBody').innerHTML='<p>Carregando o registro e suas revisões…</p>';try{const r=await ui.call('carregarEntregaRelatoCPT',id);if(ticket!==session)return;loaded=r;draw();}catch(e){if(ticket===session)$('deliveryBody').textContent=e.message;}}
 function draw(){const r=loaded.fonte.registro,e=loaded.entrega||{titulo:r.atividade||r.procedimento,texto:'',situacao:'rascunho',fotos:[],versao:0};$('deliveryBody').innerHTML=`<p class="muted">Prepare o texto da entrega. O preenchimento original permanece preservado.</p><p class="document-id">${esc(r.id)} · ${esc(r.data)} · ${esc(r.bairro)} · ${esc(r.obra)}</p><p id="deliveryNotice" class="notice" role="status">${loaded.fonteAlterada?'O registro original mudou desde a última revisão. Confira as respostas antes de salvar.':e.versao?'Revisão '+e.versao+' · '+esc(e.alteradoPor):'Nenhuma revisão salva ainda.'}</p><form id="deliveryForm"><div class="editor-grid"><label class="wide">Título da entrega<input name="titulo" maxlength="180" required value="${esc(e.titulo)}"></label><label class="wide">Texto para o relatório<textarea name="texto" required maxlength="12000" rows="10" placeholder="Descreva a execução, o público, os resultados e as ocorrências a partir do registro.">${esc(e.texto)}</textarea></label><div class="reading-tools wide"><button type="button" class="button secondary" data-delivery="base">Trazer texto do registro</button></div><label>Situação<select name="situacao"><option value="rascunho" ${e.situacao==='rascunho'?'selected':''}>Rascunho</option><option value="pronto" ${e.situacao==='pronto'?'selected':''}>Pronto para entrega</option></select></label></div><h3 class="answers-head">Fotos da entrega · até duas</h3><p class="muted small">Confira o arquivo antes de marcar. Os anexos podem incluir documentos que não são fotos.</p><div class="delivery-photos">${loaded.fonte.anexos.map(a=>{const f=e.fotos.find(f=>f.id===a.id);return `<section class="attachment"><label><input type="checkbox" name="foto" value="${esc(a.id)}" ${f?'checked':''}> ${esc(a.titulo||'Foto')}</label><a href="https://drive.google.com/file/d/${esc(a.id)}/view" target="_blank" rel="noopener noreferrer">Conferir original ↗</a><label>Legenda<input data-caption="${esc(a.id)}" maxlength="300" value="${esc(f?.legenda||'')}"></label></section>`;}).join('')||'<p>Nenhum anexo disponível neste registro.</p>'}</div><div class="dialog-actions"><button class="button" type="submit" id="saveDelivery">Salvar revisão</button><button class="button secondary" type="button" data-delivery="preview">Ver entrega</button><button class="button secondary" type="button" data-delivery="copy">Copiar texto</button></div></form><details class="report-section"><summary>Consultar respostas originais</summary>${loaded.fonte.campos.map(c=>`<section class="answer"><h3>${esc(c.titulo)}</h3><p>${esc(flatten(c.valor))}</p></section>`).join('')}</details><details class="report-section"><summary>Últimas revisões salvas</summary>${loaded.historico.map(h=>`<p>Versão ${h.versao} · ${esc(h.situacao)} · ${esc(h.autor)} · ${esc(h.data)}</p>`).join('')||'<p>Nenhuma revisão salva.</p>'}</details><section id="deliveryPreview" hidden></section>`;
 $('deliveryForm').addEventListener('input',()=>{dirty=true;if($('deliveryPreview'))$('deliveryPreview').hidden=true;});$('deliveryForm').addEventListener('change',ev=>{dirty=true;if($('deliveryPreview'))$('deliveryPreview').hidden=true;if(ev.target.name==='foto'&&$('deliveryForm').querySelectorAll('[name=foto]:checked').length>2){ev.target.checked=false;note('Escolha até duas fotos.');}});$('deliveryForm').onsubmit=save;
 }
 function payload(){const form=$('deliveryForm');return {id:loaded.fonte.registro.id,versao:loaded.entrega?.versao||0,fonteHash:loaded.hash,titulo:form.elements.titulo.value,texto:form.elements.texto.value,situacao:form.elements.situacao.value,fotos:[...form.querySelectorAll('[name=foto]:checked')].map(c=>({id:c.value,legenda:[...form.querySelectorAll('[data-caption]')].find(x=>x.dataset.caption===c.value).value}))};}
 async function save(ev){ev.preventDefault();if(busy)return;const p=payload(),signature=JSON.stringify(p);if(signature!==lastPayload){requestId='OP-'+crypto.randomUUID();lastPayload=signature;}p.operacaoId=requestId;busy=true;[...$('deliveryForm').elements].forEach(e=>e.disabled=true);note('Salvando revisão…');try{const res=await ui.call('salvarEntregaRelatoCPT',p);loaded.entrega=res.entrega;loaded.historico.unshift({versao:res.entrega.versao,autor:res.entrega.alteradoPor,data:res.entrega.alteradoEm,situacao:res.entrega.situacao});dirty=false;loaded.fonteAlterada=false;lastPayload='';draw();note(res.resultado);}catch(e){note(e.message);}finally{busy=false;if($('deliveryForm'))[...$('deliveryForm').elements].forEach(e=>e.disabled=false);}}
 function preview(){const p=payload(),r=loaded.fonte.registro;const el=$('deliveryPreview');el.hidden=false;el.innerHTML=`<div class="reading-tools"><button class="button secondary" data-delivery="print">Imprimir / salvar PDF</button></div><article id="deliveryPaper"><p class="small">${p.situacao==='pronto'?'Texto marcado como pronto':'Rascunho'}${dirty?' · alterações ainda não salvas':''}</p><h1>${esc(p.titulo)}</h1><p>${esc(r.data)} · ${esc(r.bairro)} · ${esc(r.obra)}</p><p>Equipe: ${esc(r.responsavel||'Não informada')}</p><p class="delivery-text">${esc(p.texto)}</p><div class="delivery-photo-output">${p.fotos.map(f=>`<figure><img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(f.id)}&sz=w1000" alt="${esc(f.legenda||'Foto selecionada')}" referrerpolicy="no-referrer"><figcaption>${esc(f.legenda)}</figcaption></figure>`).join('')}</div><p class="document-id">Registro ${esc(r.id)} · revisão salva ${loaded.entrega?.versao||0}</p></article>`;el.scrollIntoView({behavior:'auto',block:'start'});}
 async function print(){const imgs=[...$('deliveryPaper').querySelectorAll('img')];if(imgs.some(i=>!i.complete||!i.naturalWidth)){note('Uma foto ainda não carregou ou não está acessível. Aguarde, confira o original ou desmarque a foto antes de imprimir.');return;}const article=$('deliveryPaper').cloneNode(true);article.id='printDetail';document.body.append(article);document.body.classList.add('printing-detail');const parent=$('detailDialog'),wasOpen=parent.open;$('deliveryDialog').close();if(wasOpen)parent.close();try{window.print();}finally{article.remove();document.body.classList.remove('printing-detail');if(wasOpen)parent.showModal();$('deliveryDialog').showModal();}}
 function init(api){ui=api;const dialog=document.createElement('dialog');dialog.id='deliveryDialog';dialog.setAttribute('aria-labelledby','deliveryTitle');dialog.innerHTML='<div class="dialog-head"><h2 id="deliveryTitle">Preparar relato para entrega</h2><button class="icon-button" id="closeDelivery" aria-label="Fechar preparação">×</button></div><div class="dialog-body" id="deliveryBody"></div>';document.body.append(dialog);$('closeDelivery').onclick=close;dialog.addEventListener('cancel',ev=>{ev.preventDefault();close();});window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue='';}});document.addEventListener('click',async ev=>{const start=ev.target.closest('[data-prepare-relato]');if(start){open(start.dataset.prepareRelato);return;}const button=ev.target.closest('[data-delivery]');if(!button||!loaded||busy)return;switch(button.dataset.delivery){case 'base':{if($('deliveryForm').elements.texto.value&&!confirm('Substituir o texto em edição pelos trechos originais?'))return;const fields=loaded.fonte.campos.filter(c=>/relato|descri|desenvolvimento|objetivo|resultado|ocorr[eê]ncia/i.test(c.titulo)&&!/(foto|imagem|arquivo)/i.test(c.titulo));const text=fields.map(c=>c.titulo+'\n'+flatten(c.valor)).join('\n\n');if(!text){note('Não identifiquei um campo textual de relato. Consulte as respostas originais abaixo e componha o texto.');return;}if(text.length>12000){note('Os trechos excedem 12.000 caracteres. Selecione os trechos relevantes nas respostas originais.');return;}$('deliveryForm').elements.texto.value=text;dirty=true;note('Trechos originais copiados. Revise e amarre o texto antes de marcar como pronto.');break;}case 'preview':preview();break;case 'copy':{const p=payload();try{await navigator.clipboard.writeText(p.titulo+'\n\n'+p.texto);note('Texto copiado. Fotos não são incluídas na cópia.');}catch(e){note('Cópia bloqueada pelo navegador. Selecione o texto no campo para copiar.');}break;}case 'print':await print();break;}});}
 return {init};
})();
</script>
