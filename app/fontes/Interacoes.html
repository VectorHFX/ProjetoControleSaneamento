<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const num=n=>new Intl.NumberFormat('pt-BR').format(n||0);
  // Sempre devolve texto seguro para HTML: o valor fora do padrão vem da planilha e é escapado.
  const date=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):esc(d||'Não informado');
  const monthLabel=m=>/^\d{4}-\d{2}$/.test(m)?new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}):'';
  const nowParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const state={route:'inicio',mes:window.CPT_PREVIA?'2026-09':nowParts.year+'-'+nowParts.month,home:null,homeRequest:0,listRequest:0,detailRequest:0,cursor:null,
    filters:{busca:'',procedimento:'',bairro:'',obra:'',pendencia:''},records:[],busy:false};
  let debounce,toastTimer;let activeDocument=null;
  const store={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  const savedTheme=store.get('cpt.theme');document.documentElement.dataset.theme=savedTheme==='dark'?'dark':'light';
  if(store.get('cpt.motion')==='reduce')document.documentElement.dataset.motion='reduce';
  $('theme').value=document.documentElement.dataset.theme;$('month').value=state.mes;
  const pendingReads=new Map();
  function call(nome,arg){
    const read=/^(carregar|buscar|abrir|historico|listar)/.test(nome),key=nome+JSON.stringify(arg??null);
    if(read&&pendingReads.has(key))return pendingReads.get(key);
    const promise=request(nome,arg);if(read){pendingReads.set(key,promise);promise.then(()=>pendingReads.delete(key),()=>pendingReads.delete(key));}return promise;
  }
  function request(nome,arg){
    if(window.CPT_PREVIA)return window.CPT_PREVIA.chamar(nome,arg);
    return new Promise((resolve,reject)=>{
      let done=false;const limite=/^(gerarBaseRelatorioCPT|gerarPacoteFichasCPT|gerarFichaOficialCPT|gerarDocumentoSocioambientalCPT|gerarAnexosDoMesCPT)$/.test(nome)?360000:45000;const timer=setTimeout(()=>{done=true;reject(new Error('A conexão demorou mais que o esperado. Tente atualizar novamente.'));},limite);
      const ok=x=>{if(done)return;done=true;clearTimeout(timer);resolve(x);},bad=e=>{if(done)return;done=true;clearTimeout(timer);reject(new Error(e&&e.message||'Não foi possível consultar os dados.'));};
      if(!window.google||!google.script||!google.script.run){bad(new Error('Abra esta aplicação pelo endereço publicado no Apps Script.'));return;}
      try{const runner=google.script.run.withSuccessHandler(ok).withFailureHandler(bad);if(typeof runner[nome]!=='function')throw new Error('Função '+nome+' indisponível na versão publicada. Atualize a implantação.');if(arg===undefined)runner[nome]();else runner[nome](arg);}catch(e){bad(e);}
    });
  }
  function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4300);}
  function notice(text){$('globalNotice').textContent=text;$('globalNotice').hidden=!text;}
  function empty(title,text,action=''){return `<div class="empty">${icon('records')}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;}
  function skeleton(){return `<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Buscando as informações do mês…</div><div class="skeleton hero-loading"></div><div class="kpis">${'<div class="skeleton"></div>'.repeat(4)}</div>`;}
  function intro(title,description){return `<div class="page-intro"><div><div class="eyebrow muted">CAMPO E GESTÃO</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div><span class="date-tag">${esc(monthLabel(state.mes))}</span></div>`;}
  function safeURL(value){try{const u=new URL(value);return u.protocol==='https:'&&['drive.google.com','docs.google.com'].includes(u.hostname)?u.href:'';}catch(_){return '';}}
  function formLink(){const url=safeURL(state.home?.links?.formulario);return url?`<a class="button white" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon('plus')}Registrar procedimento</a>`:`<button class="button white" data-action="noform">${icon('plus')}Registrar procedimento</button>`;}
  // Visão geral: componente Inicio.html.
  function renderHome(){window.CPTInicio.render(state.home);}
  function options(values,chosen,first){return `<option value="">${first}</option>`+values.map(x=>`<option value="${esc(x)}" ${x===chosen?'selected':''}>${esc(x)}</option>`).join('');}
  function renderRecords(){const f=state.filters,op=state.home?.filtros||{procedimentos:[],bairros:[],obras:[]};
    $('view').innerHTML=intro('Registros de campo','Encontre o relato, o território e as evidências de cada procedimento.')+
      `<section class="panel filter-panel"><form id="recordFilters" class="filters"><label class="field">Buscar nos registros<span class="search-input">${icon('search')}<input name="busca" value="${esc(f.busca)}" placeholder="Atividade, responsável, obra ou protocolo" maxlength="200"></span></label><label class="field">Procedimento<select name="procedimento">${options(op.procedimentos,f.procedimento,'Todos os procedimentos')}</select></label><label class="field">Bairro<select name="bairro">${options(op.bairros,f.bairro,'Todos os bairros')}</select></label><label class="field">Obra<select name="obra">${options(op.obras||[],f.obra,'Todas as obras')}</select></label><input type="hidden" name="pendencia" value="${esc(f.pendencia||'')}"><button type="submit" class="button">${icon('search')}Buscar</button></form>${f.pendencia?'<p class="small muted">Filtro ativo: relatos sem público válido informado.</p>':''}</section><div class="results-head"><span id="recordCount">Consultando registros…</span><button class="button ghost" data-action="clear">Limpar filtros</button></div><div id="recordResults" class="cards"></div><div id="moreRecords" class="load-more"></div>`;
    const form=$('recordFilters');form.addEventListener('submit',e=>{e.preventDefault();readFilters();loadRecords();});form.addEventListener('change',()=>{readFilters();loadRecords();});form.elements.busca.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{if(state.route==='registros'){readFilters();loadRecords();}},400);});loadRecords();
  }
  function readFilters(){const f=$('recordFilters');if(f)state.filters=Object.fromEntries(new FormData(f));}
  function entry(r){return `<article class="entry-card"><div class="card-top"><span class="badge">${esc(r.procedimento)}</span><time class="date">${date(r.data)}</time></div><h3>${esc(r.atividade||r.procedimento)}</h3><p>${esc(r.bairro||'Bairro não informado')}${r.obra?'<br>'+esc(r.obra):''}</p><div class="card-bottom"><span>${esc(r.responsavel||'Responsável não informado')}</span><button class="button ghost" data-record="${esc(r.id)}">Abrir registro ${icon('arrow')}</button></div></article>`;}
  async function loadRecords(more=false){const ticket=++state.listRequest;if(!more)state.records=[];const cursor=more?state.cursor:null;$('recordResults').setAttribute('aria-busy','true');$('moreRecords').innerHTML='<span class="loading-label"><span class="spinner"></span>Buscando registros…</span>';
    if(!more)$('recordResults').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
    try{const d=await call('buscarRegistrosCPT',{...state.filters,mes:state.mes,cursor});if(ticket!==state.listRequest||state.route!=='registros')return;state.records.push(...d.itens);state.cursor=d.proximoCursor;
      $('recordResults').innerHTML=state.records.length?state.records.map(entry).join(''):empty('Nenhum registro encontrado',d.proximoCursor?'A busca pode continuar nos registros anteriores.':'Experimente outro bairro, procedimento ou mês.');
      $('recordCount').textContent=num(state.records.length)+' registros exibidos · '+monthLabel(state.mes);$('moreRecords').innerHTML=d.proximoCursor?'<button class="button secondary" data-action="more-records">Continuar carregando '+icon('plus')+'</button>':'';
    }catch(e){if(ticket!==state.listRequest||state.route!=='registros')return;$('recordResults').innerHTML=empty('Não foi possível buscar',e.message,'<button class="button" data-action="retry-records">Tentar novamente</button>');$('recordCount').textContent='Consulta não concluída';$('moreRecords').innerHTML='';}finally{if(ticket===state.listRequest&&$('recordResults'))$('recordResults').removeAttribute('aria-busy');}}
  document.addEventListener('click',async e=>{if(!e.target.closest('#healthCheck'))return;const b=e.target.closest('#healthCheck');b.disabled=true;try{const r=await call('conferirSaudeCPT');$('detailTitle').textContent='Funcionamento da aplicação';$('detailType').textContent='ADMINISTRAÇÃO';$('detailContent').innerHTML='<p class="muted">Conferência sob demanda. Não altera os dados.</p><div class="health-list">'+r.itens.map(x=>'<section class="answer"><h3>'+esc(x.nome)+'</h3><p>'+esc(num(x.quantidade)+' '+x.unidade)+'</p><p>'+esc(x.orientacao)+'</p></section>').join('')+'</div><p class="small muted">Consulta: '+num(r.tempoServidorMs)+' ms no servidor. A velocidade até seu aparelho também depende da rede.</p>';$('detailDialog').showModal();}catch(err){toast(err.message);}finally{b.disabled=false;}});
  function renderHelp(){$('view').innerHTML=(state.perfil?.papeis.includes('administrador')?'<div class="admin-access"><button class="button secondary" id="healthCheck">Conferir funcionamento</button><button class="button secondary" data-route="conectores">Conectores e pastas</button><button class="button" data-route="equipe">Equipe e acessos →</button></div>':'')+intro('Um lugar para se encontrar','Comece pelo que você precisa fazer agora.')+`<div class="help-grid"><section class="panel"><span class="kpi-icon" style="--accent:#0879df;--tint:#eaf4ff">${icon('home')}</span><h2>Entender o mês</h2><p>A visão do mês reúne os procedimentos pela data em que foram realizados. Participações somam o público informado nos relatos; uma pessoa pode participar de mais de uma atividade.</p><button class="button ghost" data-route="inicio">Abrir visão do mês ${icon('arrow')}</button></section><section class="panel"><span class="kpi-icon" style="--accent:#008978;--tint:#e6f7f1">${icon('records')}</span><h2>Encontrar um relato</h2><p>Escolha o mês e use os filtros. Abra um registro para consultar o texto original e seus anexos. Os arquivos carregam quando você pede para visualizar.</p><button class="button ghost" data-route="registros">Consultar registros ${icon('arrow')}</button></section><section class="panel"><span class="kpi-icon" style="--accent:#d58c31;--tint:#fff3e4">${icon('case')}</span><h2>Acompanhar um atendimento</h2><p>Busque por protocolo, pessoa ou endereço. Os concluídos ficam disponíveis no filtro de situação. Quando um protocolo foi incorporado, a consulta leva à ficha principal.</p><button class="button ghost" data-route="atendimentos">Abrir atendimentos ${icon('arrow')}</button></section><section class="panel"><span class="kpi-icon" style="--accent:#8a70cf;--tint:#f1edfc">${icon('plus')}</span><h2>Registrar o trabalho</h2><p>O botão “Registrar procedimento” abre o formulário oficial. Use a data real da atividade e selecione a obra de referência. Após o envio, a automação inclui o registro na base.</p><div class="dialog-actions">${formLink().replace('button white','button secondary')}</div></section></div><section class="panel help-note"><h2>Seu conforto de leitura</h2><label class="mobile-role">Minha visão<select id="mobileRole">${(state.perfil?.papeis||[]).filter(x=>x!=='administrador').map(x=>`<option value="${x}" ${$('roleView').value===x?'selected':''}>${window.CPTAgenda.names[x]}</option>`).join('')}</select></label><p>Os temas Claro e Escuro ficam no topo. No celular, a navegação principal fica na barra inferior.</p><label class="reduced"><input id="reduceMotion" type="checkbox" ${document.documentElement.dataset.motion==='reduce'?'checked':''}>Reduzir movimentos e animações</label><details><summary>O que está disponível nesta versão?</summary><p>Visão do mês, registros de campo com fotos, consulta de atendimentos com observações da equipe, cronograma compartilhado e preparação de relatos para o relatório. Edição oficial de fichas, recados, contatos e caderno chegam nas próximas etapas. Até lá, alterações oficiais de fichas continuam no controle de atendimento.</p></details><details><summary>Não consigo abrir uma foto ou documento</summary><p>Fotos e fichas ficam no Google Drive e abrem com a sua conta @veolia.com. Se aparecer “Você precisa de acesso”, avise a administração técnica informando o registro ou protocolo.</p></details></section>`;$('mobileRole').addEventListener('change',e=>{$('roleView').value=e.target.value;$('roleView').dispatchEvent(new Event('change'));});$('reduceMotion').addEventListener('change',e=>{document.documentElement.dataset.motion=e.target.checked?'reduce':'normal';store.set('cpt.motion',e.target.checked?'reduce':'normal');toast('Preferência de movimento salva.');});}
  /*
   * Visões por cargo (2.7). A visão escolhida decide as páginas da lateral e o que a Visão do mês destaca, para cada
   * pessoa ver só o seu trabalho. É só a tela: a conta e as permissões continuam as mesmas e são conferidas no servidor.
   * Quem tem vários papéis (como o proprietário) troca a visão para ver exatamente o que cada colega vê.
   */
  const COMUNS=['inicio','recados','contatos','cronograma','registros','atendimentos','obras','ajuda'];
  const VISOES={atendimento:COMUNS,comercializacao:COMUNS,socioambiental:[...COMUNS,'lembretes','socioambiental','fechamento'],comunicacao:[...COMUNS,'comunicacao','socioambiental','fechamento'],
    gestao:[...COMUNS,'comunicacao','painel','parceiros','socioambiental','fechamento','equipe','conectores'],administrativo:[...COMUNS,'comunicacao','painel','parceiros','socioambiental','fechamento','equipe','conectores']};
  const RESUMO_VISAO={atendimento:'Casos, auditoria das fichas e números do atendimento, mais as ferramentas comuns.',comercializacao:'Ferramentas comuns: obras e endereços, cronograma, registros e consulta de atendimentos.',
    socioambiental:'Mesa do relatório, lembretes com a Comunicação, preparo de relatos e diagnósticos, fechamento e as ferramentas comuns.',comunicacao:'Seu dia (recados, lembretes, materiais e galeria), mesa do relatório, fechamento e as ferramentas comuns.',
    gestao:'Tudo: painel do contrato e das frentes, Programa Parceiros, mesa do relatório, fechamento e auditoria.',administrativo:'Tudo: painel do contrato e das frentes, Programa Parceiros, mesa do relatório, fechamento e auditoria.'};
  /** Permissão real (papéis da conta). A visão só pode esconder; nunca mostra o que a conta não tem. */
  function permitido(route){const p=state.perfil?.papeis||[],tem=l=>p.some(x=>l.includes(x));
    if(route==='equipe'||route==='conectores')return p.includes('administrador');
    if(['painel','parceiros'].includes(route))return tem(['administrador','administrativo','gestao']);
    if(['socioambiental','fechamento','lembretes'].includes(route))return tem(['administrador','administrativo','gestao','socioambiental','comunicacao']);
    if(route==='comunicacao')return tem(['administrador','administrativo','gestao','comunicacao']);
    return true;}
  function visao(){return $('roleView').value||'atendimento';}
  function podeVer(route){return permitido(route)&&(VISOES[visao()]||COMUNS).includes(route);}
  function aplicarVisao(){const v=visao(),varias=$('roleView').options.length>1;document.documentElement.dataset.visao=v;
    document.querySelectorAll('.nav-item').forEach(b=>{b.hidden=!podeVer(b.dataset.route);});
    const banner=$('viewBanner');if(banner){banner.hidden=!varias;banner.innerHTML=varias?'<span class="view-dot" aria-hidden="true"></span><span><strong>Tela de '+esc(window.CPTAgenda.names[v])+'</strong> · '+esc(RESUMO_VISAO[v]||'')+'</span><label class="view-switch">Ver como<select id="viewSwitch" aria-label="Ver a aplicação como">'+[...$('roleView').options].map(o=>'<option value="'+esc(o.value)+'" '+(o.value===v?'selected':'')+'>'+esc(o.textContent)+'</option>').join('')+'</select></label>':'';}}
  /** Página de entrada de cada visão: a Comunicação começa pelo "Hoje" (uma coisa de cada vez). */
  function entrada(){return visao()==='comunicacao'&&podeVer('comunicacao')?'comunicacao':'inicio';}
  function navigate(route,filter){if(!['inicio','registros','atendimentos','ajuda','cronograma','equipe','obras','fechamento','socioambiental','painel','parceiros','conectores','comunicacao','lembretes','recados','contatos'].includes(route))return;
    if(state.perfil&&!podeVer(route)){toast(permitido(route)?'Esta página não faz parte da tela de '+window.CPTAgenda.names[visao()]+'. Troque a visão para abri-la.':'Seu acesso não inclui esta página.');return;}
    if(state.route==='parceiros'&&route!=='parceiros'&&!window.CPTGestao.sair())return;clearTimeout(debounce);state.route=route;++state.listRequest;state.cursor=null;
    if(filter==='relatos')state.filters.procedimento='Relato de atividade';if(route==='comunicacao'&&filter)window.CPTComunicacao.irPara(filter);if(route==='atendimentos'&&filter)window.CPTAtendimentos.filtrar(filter);
    document.querySelectorAll('.nav-item').forEach(b=>{const active=b.dataset.route===route;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    $('pageLabel').textContent={inicio:'Visão do mês',registros:'Registros',atendimentos:'Atendimentos',ajuda:'Como usar',cronograma:'Cronograma',equipe:'Equipe e acessos',obras:'Obras',fechamento:'Fechamento do mês',socioambiental:'Socioambiental',painel:'Painel da gestão',parceiros:'Programa Parceiros',conectores:'Conectores e pastas',comunicacao:'Comunicação',lembretes:'Lembretes',recados:'Recados',contatos:'Contatos'}[route];
    ({inicio:renderHome,registros:renderRecords,atendimentos:window.CPTAtendimentos.render,ajuda:renderHelp,cronograma:window.CPTAgenda.render,equipe:window.CPTAgenda.team,obras:window.CPTObras.render,fechamento:window.CPTFechamento.render,socioambiental:window.CPTSocioambiental.render,painel:()=>window.CPTGestao.renderPainel(),parceiros:window.CPTGestao.renderParceiros,conectores:window.CPTGestao.renderConectores,comunicacao:window.CPTComunicacao.render,lembretes:window.CPTComunicacao.render,recados:window.CPTRecados.render,contatos:window.CPTRecados.renderContatos}[route])();window.scrollTo({top:0,behavior:'auto'});}
  /** atualizar=true ignora o cache do servidor. Se já há dados do mês na tela, atualiza em segundo plano sem esqueleto. */
  async function loadHome(atualizar=false){const ticket=++state.homeRequest;const requested=state.mes;notice('');if(window.CPT_BOOT){window.CPT_BOOT.stage='consultando base';}$('refresh').disabled=true;const silencioso=!!(state.home&&state.home.mes===requested)&&!atualizar;if(state.route==='inicio'&&!silencioso)renderHome();
    try{const d=await call('carregarInicioCPT',{mes:requested,atualizar});if(ticket!==state.homeRequest)return;if(!d||!d.indicadores||!d.perfil||!Array.isArray(d.perfil.papeis))throw new Error('A base não retornou os dados esperados. Confira se todos os arquivos são da versão 2.3.0.');const mudou=!state.home||state.home.atualizadoEm!==d.atualizadoEm||state.home.mes!==d.mes;state.home=d;if(!state.perfil)configureProfile(d.perfil);$('updated').textContent='Atualizado às '+new Date(d.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});if(state.route==='inicio'&&mudou)renderHome();else if(state.route==='registros')renderRecords();else if(state.route==='ajuda')renderHelp();
      window.CPT_BOOT?.finish();if(window.CPT_PREVIA)notice('Prévia visual com dados fictícios. Nenhuma informação desta tela foi lida ou gravada na sua planilha.');
    }catch(e){if(ticket!==state.homeRequest)return;notice(e.message);if(state.route==='inicio'&&!silencioso)$('view').innerHTML=empty('Vamos restabelecer a conexão',e.message,'<button class="button" data-action="retry-home">Tentar novamente</button><button class="button secondary" data-check-access>Conferir meu acesso</button><p id="accessResult" style="white-space:pre-line"></p>');window.CPT_BOOT?.finish();}finally{if(ticket===state.homeRequest)$('refresh').disabled=false;}}
  function summary(pairs){return '<dl class="detail-summary">'+pairs.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v||'Não informado')}</dd></div>`).join('')+'</dl>';}
  function value(v){if(Array.isArray(v))return v.map(value).join('\n');if(v&&typeof v==='object')return Object.entries(v).map(([k,x])=>k+': '+value(x)).join('\n');return String(v??'');}
  async function openDetail(kind,id){if(kind==='case'){window.CPTAtendimentos.abrir(id);return;}const ticket=++state.detailRequest;activeDocument=null;$('detailType').textContent=kind==='record'?'REGISTRO DE CAMPO':'ATENDIMENTO';$('detailTitle').textContent='Carregando detalhes';$('detailContent').innerHTML='<div class="loading-label"><span class="spinner"></span>Abrindo as informações…</div>';$('detailDialog').showModal();
    try{const d=await call('abrirRegistroCPT',id);if(ticket!==state.detailRequest||!$('detailDialog').open)return;
      if(kind==='record'){const r=d.registro;$('detailTitle').textContent=r.atividade||r.procedimento;
        $('detailContent').innerHTML=readingTools()+(/relato de atividade|diagn[oó]stico/i.test(r.procedimento)&&state.perfil?.papeis.some(p=>['administrador','administrativo','gestao','socioambiental','comunicacao'].includes(p))?`<div class="reading-tools"><button class="button" data-prepare-relato="${esc(r.id)}">${/diagn[oó]stico/i.test(r.procedimento)?'Preparar diagnóstico':'Preparar para o relatório'}</button></div>`:'')+summary([['Procedimento',r.procedimento],['Data de realização',date(r.data)],['Bairro',r.bairro],['Responsável',r.responsavel],['Obra de referência',r.obra],['Origem',r.origem],['Público informado',r.publico==null?'Não informado':String(r.publico)]])+`<p class="document-id">Registro: ${esc(r.id)}</p>`+
          (r.conferencia?`<details class="help-note"><summary>Conferência do registro</summary><p>${esc(r.conferencia)}</p><p>ID: ${esc(r.id)}</p></details>`:'')+
          (d.anexos.length?`<h3 class="answers-head">Arquivos e evidências</h3><div class="attachments">${d.anexos.map((a,i)=>`<div class="attachment"><p>${esc(a.titulo||'Anexo '+(i+1))}</p><button class="button secondary" data-preview="${esc(a.id)}">Visualizar</button> <a href="${esc(safeURL(a.url))}" target="_blank" rel="noopener noreferrer">Abrir no Drive</a></div>`).join('')}</div><div id="mediaPreview"></div>`:'')+
          sections(d.campos);
      }
      activeDocument={kind,id,title:$('detailTitle').textContent};
    }catch(e){if(ticket===state.detailRequest)$('detailContent').innerHTML=empty('Não foi possível abrir',e.message);}}

  function readingTools(){return '<div class="reading-tools"><button class="button secondary" data-reading="copy">Copiar conteúdo</button><button class="button secondary" data-reading="print">Imprimir / salvar PDF</button></div>';}
  function sections(campos){const groups=new Map();campos.forEach(x=>{const key=x.secao||'Respostas do registro';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x);});return '<h3 class="answers-head">O que foi registrado</h3>'+([...groups].map(([name,items])=>'<details class="report-section" open><summary>'+esc(name)+' · '+items.length+' respostas</summary>'+items.map(x=>'<section class="answer"><h3>'+esc(x.titulo)+'</h3><p>'+esc(value(x.valor))+'</p></section>').join('')+'</details>').join('')||'<p>Não há campos adicionais neste registro.</p>');}
  function documentClone(){const clone=$('detailContent').cloneNode(true);clone.querySelectorAll('.reading-tools,iframe,#mediaPreview').forEach(e=>e.remove());clone.querySelectorAll('button').forEach(e=>e.remove());clone.querySelectorAll('details').forEach(e=>e.open=true);return clone;}
  document.addEventListener('click',async ev=>{const button=ev.target.closest('[data-reading]');if(!button||!activeDocument)return;const doc=activeDocument;
    if(button.dataset.reading==='copy'){const clone=documentClone();clone.querySelectorAll('h3,p,dt,dd,summary').forEach(e=>e.appendChild(document.createTextNode('\n')));const text=doc.title+'\n\n'+clone.textContent;try{await navigator.clipboard.writeText(text);toast('Conteúdo copiado.');}catch(e){toast('O navegador bloqueou a cópia. Selecione o texto da ficha para copiar.');}return;}
    if(button.dataset.reading==='print'){const old=$('printDetail');if(old)old.remove();const paper=document.createElement('article');paper.id='printDetail';const title=document.createElement('h1');title.textContent=doc.title;paper.append(title,documentClone());document.body.append(paper);document.body.classList.add('printing-detail');$('detailDialog').close();try{window.print();}finally{document.body.classList.remove('printing-detail');paper.remove();if(activeDocument===doc)$('detailDialog').showModal();}return;}
  });
  document.addEventListener('click',async ev=>{const button=ev.target.closest('[data-check-access]');if(!button)return;button.disabled=true;try{const r=await call('conferirMeuAcessoCPT');const box=$('accessResult');if(box)box.textContent=r.etapas.map(x=>(x.ok?'OK':'VERIFICAR')+' · '+x.nome+': '+x.mensagem).join('\n');}catch(e){const box=$('accessResult');if(box)box.textContent=e.message;}finally{button.disabled=false;}});
  function closeDetail(){activeDocument=null;++state.detailRequest;$('detailDialog').close();$('detailContent').innerHTML='';}
  document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route,route.dataset.filter);return;}const record=e.target.closest('[data-record]');if(record){openDetail('record',record.dataset.record);return;}
    const preview=e.target.closest('[data-preview]');if(preview&&/^[A-Za-z0-9_-]{10,}$/.test(preview.dataset.preview)){const frame=document.createElement('iframe');frame.className='media-frame';frame.src='https://drive.google.com/file/d/'+encodeURIComponent(preview.dataset.preview)+'/preview';frame.title='Visualização do arquivo';frame.allow='fullscreen';$('mediaPreview').replaceChildren(frame);return;}
    const a=e.target.closest('[data-action]')?.dataset.action;if(a==='more-records')loadRecords(true);if(a==='retry-records')loadRecords();if(a==='retry-home')loadHome();if(a==='retry-boot')bootstrap();if(a==='noform')toast('O link do formulário ainda não está disponível. Confira a aba Início da base.');if(a==='clear'){state.filters={busca:'',procedimento:'',bairro:'',obra:'',pendencia:''};renderRecords();}});
  $('closeDialog').addEventListener('click',closeDetail);$('detailDialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});
  $('theme').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;store.set('cpt.theme',e.target.value);toast('Aparência salva neste navegador.');});
  $('month').addEventListener('change',()=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test($('month').value)){toast('Selecione um mês válido.');return;}if(state.route==='parceiros'&&!window.CPTGestao.sair()){$('month').value=state.mes;return;}state.mes=$('month').value;state.home=null;++state.listRequest;if(state.route==='cronograma'){window.CPTAgenda.render();}if(state.route==='fechamento')window.CPTFechamento.render();if(state.route==='socioambiental')window.CPTSocioambiental.render();if(state.route==='painel')window.CPTGestao.renderPainel();if(state.route==='parceiros')window.CPTGestao.renderParceiros();if(state.route==='comunicacao')window.CPTComunicacao.render();if(state.route==='registros')$('view').innerHTML=skeleton();window.CPTInicio.prefetchAgenda(state.mes);loadHome();});
  $('refresh').addEventListener('click',()=>{if(state.route==='cronograma'){window.CPTAgenda.render();}else if(state.route==='equipe'){window.CPTAgenda.team();}else if(state.route==='atendimentos'){window.CPTAtendimentos.atualizar();}else if(state.route==='painel'){window.CPTGestao.renderPainel(true);}else if(state.route==='parceiros'){if(window.CPTGestao.sair())window.CPTGestao.renderParceiros();}else if(state.route==='conectores'){window.CPTGestao.renderConectores();}else if(state.route==='comunicacao'||state.route==='lembretes'){window.CPTComunicacao.atualizar();}else if(state.route==='recados'){window.CPTRecados.render();}else if(state.route==='contatos'){window.CPTRecados.renderContatos();}else if(state.route==='obras'){window.CPTObras.render();}else if(state.route==='fechamento'){window.CPTFechamento.render();}else if(state.route==='socioambiental'){window.CPTSocioambiental.render();}else{if(state.route==='inicio')window.CPTInicio.prefetchAgenda(state.mes);loadHome(true);}});
  window.addEventListener('offline',()=>notice('Você está sem conexão. As consultas precisam de internet; os dados já exibidos continuam na tela.'));
  window.addEventListener('online',()=>{notice('');toast('Conexão restabelecida. Use Atualizar para consultar novamente.');});
  function configureProfile(p){if(!p)return;state.perfil=p;const select=$('roleView'),saved=store.get('cpt.view'),previous=select.value;const views=p.papeis.filter(x=>x!=='administrador');const list=views.length?views:p.papeis;select.innerHTML=list.map(role=>`<option value="${esc(role)}">${esc(window.CPTAgenda.names[role])}</option>`).join('');select.value=list.includes(previous)?previous:list.includes(saved)?saved:list[0];select.disabled=list.length<2;aplicarVisao();$('accountLabel').textContent=p.nome+' · '+p.email;$('accountLabel').title=p.email;}
  function accessError(message){const r=$('roleView');r.innerHTML='<option value="">Sem acesso</option>';r.disabled=true;$('accountLabel').textContent='Acesso não confirmado';document.querySelectorAll('.nav-item').forEach(b=>{if(b.dataset.route!=='ajuda')b.hidden=true;});
    $('view').innerHTML=`<div class="page-intro"><div><div class="eyebrow muted">ACESSO</div><h1>Não conseguimos liberar sua entrada</h1><p>${esc(message)}</p></div></div><section class="panel"><p>Nada foi alterado. Você pode tentar de novo ou conferir em qual etapa o acesso parou e enviar o resultado para a administração técnica.</p><div class="dialog-actions"><button class="button" data-action="retry-boot">Tentar novamente</button><button class="button secondary" data-check-access>Conferir meu acesso</button></div><p id="accessResult" style="white-space:pre-line"></p></section>`;}
  async function bootstrap(){if(window.CPT_BOOT)window.CPT_BOOT.stage='verificando acesso';const r=$('roleView');r.innerHTML='<option value="">Verificando acesso…</option>';r.disabled=true;$('accountLabel').textContent='Verificando acesso…';$('view').innerHTML='<div class="loading-label"><span class="spinner" aria-hidden="true"></span>Verificando seu acesso…</div>';
    // A página já chega com o perfil e, quando há cache, com a Visão do mês e a agenda (doGet). Sem isso, pergunta ao servidor.
    const inicial=window.CPT_INICIAL||{};if(inicial.erro){accessError(inicial.erro);window.CPT_BOOT?.finish();return;}
    try{const d=inicial.perfil?inicial:await call('carregarPerfilCPT');if(!d||!d.perfil||!Array.isArray(d.perfil.papeis))throw new Error('Resposta de acesso inesperada. Confira se todos os arquivos da versão 2.3.0 foram publicados.');configureProfile(d.perfil);
      if(inicial.inicio&&inicial.inicio.mes===state.mes){state.home={...inicial.inicio,perfil:d.perfil};window.CPT_BOOT?.finish();}
      window.CPTInicio.prefetchAgenda(state.mes,inicial.agenda);navigate(entrada());loadHome();window.CPTRecados.contar(false);setInterval(()=>{if(document.visibilityState==='visible')window.CPTRecados.contar(true);},600000);}
    catch(e){accessError(e.message);window.CPT_BOOT?.finish();}}
  function trocarVisao(v){if(state.route==='parceiros'&&!window.CPTGestao.sair()){$('roleView').value=document.documentElement.dataset.visao;aplicarVisao();return;}$('roleView').value=v;store.set('cpt.view',v);aplicarVisao();state.route='';navigate(entrada());toast('Agora você vê a tela de '+window.CPTAgenda.names[v]+'. Sua conta e suas permissões não mudam.');}
  $('roleView').addEventListener('change',()=>trocarVisao($('roleView').value));
  document.addEventListener('change',e=>{if(e.target.id==='viewSwitch')trocarVisao(e.target.value);});
  if(!window.CPTAgenda||typeof window.CPTAgenda.init!=='function')throw new Error('O componente Agenda.html está ausente ou não iniciou. Substitua-o pelo arquivo completo da versão 2.3.0.');
  window.CPTAgenda.init({call,esc,date,num,intro,toast,formLink,state,navigate,view:$('view')});
  window.CPTEntregas.init({call});
  const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  if(!window.CPTObras||!window.CPTFechamento||!window.CPTInicio||!window.CPTSocioambiental)throw new Error('Componentes Inicio.html, Obras.html, Fechamento.html ou Socioambiental.html ausentes. Confira os arquivos da versão 2.6.0.');
  window.CPTInicio.init({call,esc,date,num,icon,formLink,state,visao,podeVer,view:$('view')});
  if(!window.CPTAtendimentos)throw new Error('Componente Atendimentos.html ausente. Confira os arquivos da versão 2.3.0.');
  window.CPTAtendimentos.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});
  if(!window.CPTGestao)throw new Error('Componente Gestao.html ausente. Confira os arquivos da versão 2.7.0.');
  window.CPTGestao.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});
  if(!window.CPTComunicacao||!window.CPTRecados)throw new Error('Componentes Comunicacao.html ou Recados.html ausentes. Confira os arquivos da versão 2.8.0.');
  window.CPTComunicacao.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});window.CPTRecados.init({call,esc,date,num,intro,toast,icon,norm,safeURL,state,navigate,visao,view:$('view')});
  window.CPTObras.init({call,esc,date,num,intro,toast,icon,norm,state,navigate,view:$('view')});window.CPTFechamento.init({call,esc,date,num,intro,toast,icon,norm,state,navigate,view:$('view')});window.CPTSocioambiental.init({call,esc,date,num,intro,toast,icon,norm,state,navigate,view:$('view')});
  bootstrap();
})();
</script>
