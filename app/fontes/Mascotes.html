 */

  const f = (d, cor, liso) => `<path d="${d}" fill="${cor}"/>` + (liso ? '' : `<path d="${d}" fill="url(#${ID}g)"/>`);

  /** Braço curvo que afina do ombro ao punho (curva de Bézier com largura variável). t1 < 1 desenha só o começo (manga). */
  function bracoCurvo(sx, sy, cx, cy, mx, my, w0, w1, t1 = 1) {
    const n = 14, esq = [], dir = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n * t1, u = 1 - t, x = u * u * sx + 2 * u * t * cx + t * t * mx, y = u * u * sy + 2 * u * t * cy + t * t * my;

  }
  // ---------- rosto ----------
  function olhos(e, cx, cy, d, o = {}) {

  // ---------- elenco (cada um com o seu corpo) ----------
  /**
   * cab: cabeça (path); rosto {x,y,d}; corpo (path) e caixa do corpo [x0,y0,x1,y1] para encaixar roupas;

      atras: c => f(circ(56, 46, 16), c.p) + f(circ(144, 46, 16), c.p) + `<circle cx="56" cy="46" r="8" fill="${c.cl}"/><circle cx="144" cy="46" r="8" fill="${c.cl}"/>`,
      focinho: (e, c) => f(ell(100, 104, 18, 12), c.cl, 1) + `<path d="${ell(100, 99, 6, 4)}" fill="${c.e}"/>` + boquinha(e, 100, 105)},

      corpo: 'M50,138 C48,128 152,128 150,138 C152,178 136,212 100,216 C64,212 48,178 50,138 Z', caixa: [48, 128, 152, 216], peito: 'M74,136 Q100,150 126,136 L100,178 Z', pes: [[84, 216, 12, 7, '#f4b94c'], [116, 216, 12, 7, '#f4b94c']], ombros: [[56, 146], [144, 146]], asa: 1.1, mao: 32,

    cachorro: {c: ['#dba46a', '#f8e6cb'], cab: ell(100, 88, 54, 46), rosto: {x: 100, y: 88, d: 25}, capacete: {x: 100, y: 52, r: 30}, pescoco: [100, 132],
      corpo: 'M66,130 C58,160 60,198 72,212 Q100,224 128,212 C140,198 142,160 134,130 Z', caixa: [60, 128, 140, 218], barriga: ell(100, 182, 20, 24), pes: [[84, 216, 13, 8], [116, 216, 13, 8]], ombros: [[66, 150], [134, 150]], braco: 15, mao: 31,

    pato: {c: ['#fbf6ea', '#ffffff'], cab: ell(100, 98, 46, 40), rosto: {x: 100, y: 92, d: 21}, capacete: {x: 100, y: 66, r: 26}, pescoco: [100, 136],

      focinho: (e, c) => f('M74,96 Q74,88 100,88 Q126,88 126,96 L126,110 Q126,124 100,124 Q74,124 74,110 Z', c.cl, 1) + `<ellipse cx="91" cy="100" rx="2.6" ry="4" fill="${c.e}"/><ellipse cx="109" cy="100" rx="2.6" ry="4" fill="${c.e}"/>` + boquinha(e, 100, 112)},
    sapo: {c: ['#93cf72', '#f4f8e6'], semCorpo: true, cab: 'M46,98 C46,70 56,56 70,56 C78,56 84,62 88,66 L112,66 C116,62 122,56 130,56 C144,56 154,70 154,98 L154,170 C154,206 136,216 100,216 C64,216 46,206 46,170 Z',
      rosto: {x: 100, y: 80, d: 30, grande: true}, capacete: {x: 100, y: 60, r: 17}, pescoco: [100, 132], caixa: [46, 134, 154, 214], barriga: 'M66,150 C66,132 134,132 134,150 L134,178 C134,200 66,200 66,178 Z',
      pes: [[78, 218, 16, 7], [122, 218, 16, 7]], ombros: [[56, 140], [144, 140]], braco: 15, mao: 28, boca: 112,
      olhosFundo: e => ['feliz', 'comemorando', 'dormindo'].includes(e) ? '' : `<circle cx="70" cy="80" r="11" fill="#fff"/><circle cx="130" cy="80" r="11" fill="#fff"/>`,
      focinho: e => {
        if (e === 'comemorando') return `<path d="M72,106 Q100,138 128,106 Z" fill="${OLHO}"/><path d="M86,118 q14,10 28,0" fill="#ef7f86"/>`;
        if (e === 'surpreso') return `<path d="${ell(100, 112, 12, 10)}" fill="${OLHO}"/><path d="${ell(100, 116, 7, 4)}" fill="#ef7f86"/>`;
        if (e === 'feliz') return `<path d="M76,104 Q100,126 124,104 Z" fill="${OLHO}"/><path d="M88,114 q12,7 24,0" fill="#ef7f86"/>`;
        return linha(e === 'pensativo' ? 'M80,110 q20,4 40,-4' : 'M82,108 q18,8 36,0', 2.8);
      }},
    gota: {c: ['#7cc0ea', '#d8eefb'], semCorpo: true, cab: 'M100,36 C100,36 154,104 154,150 A54,54 0 0 1 46,150 C46,104 100,36 100,36 Z', rosto: {x: 100, y: 150, d: 22}, capacete: {x: 100, y: 84, r: 22}, pescoco: [100, 176],
      caixa: [46, 172, 154, 204], pes: [[86, 206, 11, 7], [114, 206, 11, 7]], ombros: [[52, 160], [148, 160]], braco: 11, mao: 22, boca: 164,
      depoisCab: () => `<path d="${ell(74, 118, 8, 15)}" fill="#fff" opacity=".55"/><path d="${circ(80, 98, 3.5)}" fill="#fff" opacity=".6"/>`,
      focinho: e => boquinha(e, 100, 166)},
    // Clássicos (mascotes da primeira versão), no mesmo estilo.
    dinossauro: {c: ['#86c97a', '#e6f4d2'], cab: ell(100, 88, 56, 46), rosto: {x: 100, y: 84, d: 26}, capacete: {x: 100, y: 52, r: 30}, pescoco: [100, 132],
      corpo: 'M64,128 C50,156 50,198 66,212 Q100,224 134,212 C150,198 150,156 136,128 Z', caixa: [52, 126, 148, 220], barriga: ell(100, 182, 24, 26), pes: [[82, 216, 15, 8], [118, 216, 15, 8]], ombros: [[62, 150], [138, 150]], braco: 15, mao: 30,

    abelha: {c: ['#f7cf4a', '#fff3c4'], cab: ell(100, 88, 54, 46), rosto: {x: 100, y: 88, d: 25}, capacete: {x: 100, y: 52, r: 30}, pescoco: [100, 132],
      corpo: 'M66,128 C50,156 52,198 68,212 Q100,224 132,212 C148,198 150,156 134,128 Z', caixa: [54, 126, 146, 220], listras: true, pes: [[84, 216, 13, 7, '#3b302a'], [116, 216, 13, 7, '#3b302a']], ombros: [[64, 150], [136, 150]], braco: 14, mao: 30,
      atras: () => `<path d="${ell(56, 140, 22, 13)}" fill="#dff1ff" opacity=".85" transform="rotate(-25 56 140)"/><path d="${ell(144, 140, 22, 13)}" fill="#dff1ff" opacity=".85" transform="rotate(25 144 140)"/>` +
        linha('M84,48 Q76,30 66,26 M116,48 Q124,30 134,26', 2.6, '#3b302a') + `<circle cx="66" cy="26" r="5" fill="#3b302a"/><circle cx="134" cy="26" r="5" fill="#3b302a"/>`,

  const PADRAO = 'gato';

  // ---------- peças do guarda-roupa ----------
  // As peças antigas foram desenhadas num mascote padrão (quadro 160×180): cabeça em (80,66) r33, olhos em y64 (±12),
  // pescoço em (80,96), mão direita em (114,124), corpo na elipse (80,128) 36×38. Aqui elas vão para os pontos de cada corpo.
  const encaixe = (S, slot) => {
    const k = S.capacete, R = S.rosto, [nx, ny] = S.pescoco, [x0, y0, x1, y1] = S.caixa;
    if (slot === 'cabeca') { const s = k.r * 1.25 / 40; return `translate(${k.x},${k.y + 4}) scale(${s}) translate(-80,-58)`; }
    if (slot === 'rosto') { const s = R.d / 16; return `translate(${R.x},${R.y}) scale(${s}) translate(-80,-64)`; }
    if (slot === 'pescoco') return `translate(${nx},${ny}) scale(1.2) translate(-80,-98)`;
    if (slot === 'corpo' || slot === 'costas') return `translate(${(x0 + x1) / 2},${(y0 + y1) / 2}) scale(${(x1 - x0) / 72},${(y1 - y0) / 76}) translate(-80,-128)`;

  };
  function colete(S, ID, cor = EPI.colete, faixa = EPI.faixa) { // o colete da rodada aprovada, sob medida para cada corpo
    const [, y0c, , y1c] = S.caixa, y0 = S.semCorpo ? y0c : 120, y1 = S.semCorpo ? Math.min(y1c, y0 + 34) : 186;

  /**
   * SVG do mascote. equipado: {slot: id}. cor: chave de CORES (vazio = cor da espécie). expressao: normal (padrão), feliz, surpreso,
   * pensativo, dormindo, comemorando. .m-all respira e .m-eyes pisca (CSS; desligado com movimento reduzido).
   */
  function desenhar(especie, equipado, tam, rotulo, cor, expressao) {
    const S = ELENCO[especie] || ELENCO[PADRAO], q = equipado || {}, e = expressao || 'normal', V1 = window.CPTMascoteV1;
    ID = 'mv' + (++seq);
    const base = CORES[cor] || S.c, c = {p: base[0], cl: base[1], e: mix(base[0], '#000000', .35)}, R = S.rosto, P = [];
    const pose = e === 'comemorando' ? 'cima' : e === 'pensativo' ? 'queixo' : 'baixo';
    const S2 = {...S, corPeito: S.peito ? c.cl : c.p};
    P.push(`<defs><linearGradient id="${ID}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity=".18"/></linearGradient>
      <clipPath id="${ID}t"><path d="${S.semCorpo ? S.cab : S.corpo}"/></clipPath></defs><ellipse cx="100" cy="226" rx="${especie === 'gota' ? 40 : 52}" ry="7" fill="#3a2410" opacity=".12"/>`);
    const peca = (slot, tr) => { const id = q[slot]; if (!id || !V1) return ''; const svg = V1.peca(id); return svg ? `<g transform="${tr || encaixe(S, slot)}">${svg}</g>` : ''; };
    P.push(peca('costas'));
    if (S.atras) P.push(S.atras(c, e));
    // pezinhos: bota preta e botina mudam a cor do pé
    const corPe = q.pes === 'bota-preta' ? EPI.bota : q.pes === 'botina' ? EPI.botina : null;
    S.pes.forEach(([x, y, rx, ry, cp]) => P.push(f(ell(x, y, rx, ry), corPe || cp || c.p)));
    // corpo, barriga, roupas
    if (!S.semCorpo) { P.push(f(S.corpo, c.p)); if (S.barriga) P.push(`<path d="${S.barriga}" fill="${c.cl}"/>`); if (S.peito) P.push(`<path d="${S.peito}" fill="${c.cl}"/>`); }
    if (S.listras) P.push(`<g clip-path="url(#${ID}t)"><rect x="30" y="160" width="140" height="11" fill="#3b302a"/><rect x="30" y="186" width="140" height="11" fill="#3b302a"/></g>`);
    const roupa = () => q.corpo === 'colete' ? colete(S2, ID) : q.corpo === 'colete-mestre' ? colete(S2, ID, '#e6b422', '#3b3b3b') : q.corpo && V1 ? `<g clip-path="url(#${ID}t)"><g transform="${encaixe(S, 'corpo')}">${V1.camisa(q.corpo)}</g></g>` : '';
    if (!S.semCorpo) P.push(roupa());
    // cabeça
    P.push(f(S.cab, S.corCab || c.p));
    if (S.barriga && S.semCorpo) P.push(`<path d="${S.barriga}" fill="${c.cl}"/>`);
    if (S.semCorpo) P.push(roupa());
    if (S.depoisCab) P.push(S.depoisCab(c, e));
    if (S.olhosFundo) P.push(S.olhosFundo(e));
    P.push(olhos(e, R.x, R.y, R.d, R));
    if (R.forte) P.push(linha(`M${R.x - R.d - 9},${R.y - 13 + (e === 'surpreso' ? -3 : 0)} l14,${e === 'surpreso' ? 0 : 4} M${R.x + R.d + 9},${R.y - 13 + (e === 'surpreso' ? -3 : 0)} l-14,${e === 'surpreso' ? 0 : 4}`, 3));
    if (R.calmo && !['feliz', 'comemorando', 'dormindo', 'surpreso'].includes(e)) P.push(linha(`M${R.x - R.d - 6},${R.y - 4} h12 M${R.x + R.d - 6},${R.y - 4} h12`, 3.4, c.p));
    P.push(bochechas(e, R.x, R.y + (especie === 'sapo' ? 14 : 0), R.d + (especie === 'sapo' ? 6 : 0)));
    P.push(S.focinho(e, c));
    P.push(peca('rosto'), peca('pescoco'));
    // braços na frente do corpo, curvos e gordinhos; luvinha com polegar
    const mao = lado => { const [sx, sy] = S.ombros[lado < 0 ? 0 : 1];
      if (pose === 'cima') return [sx + lado * 20, sy - S.mao * .9]; if (pose === 'queixo' && lado > 0) return [R.x + 18, R.y + (S.boca ? S.boca - R.y - 2 : 24)]; return [sx + lado * 4, sy + S.mao * .92]; };
    const cotovelo = (lado, sx, sy) => pose === 'cima' ? [sx + lado * 26, sy - S.mao * .15] : pose === 'queixo' && lado > 0 ? [sx + 26, sy + 16] : [sx + lado * 15, sy + S.mao * .38];
    const luva = q.luvas === 'luvas';
    const patinha = (lado, mx, my, w) => { const r = w * .66;
      if (!luva) return f(ell(mx, my, r, r * .92), S.asa ? c.p : c.cl);
      return f(ell(mx - lado * r * .82, my - r * .15, r * .45, r * .4), EPI.luva) + f(ell(mx, my + r * .05, r * 1.1, r), EPI.luva) + `<path d="${ell(mx + lado * r * .3, my - r * .35, r * .32, r * .2)}" fill="#fff" opacity=".35"/>`; };
    const braco = lado => { const [sx, sy] = S.ombros[lado < 0 ? 0 : 1], [mx, my] = mao(lado), [cx, cy] = cotovelo(lado, sx, sy);
      if (S.asa) { const g = S.asa, penas = [-1, 0, 1].map(k => f(ell(mx + lado * 3 + k * 4 * lado, my + 6 - Math.abs(k) * 2, 4.2, 7.5), c.p)).join('');
        return penas + f(bracoCurvo(sx, sy, cx, cy, mx, my, 19 * g, 9 * g), c.p) + (luva ? patinha(lado, mx, my, 12) : ''); }
      return f(bracoCurvo(sx, sy, cx, cy, mx, my, S.braco * 1.12, S.braco * .86), c.p) + patinha(lado, mx, my, S.braco * .86); };
    P.push(braco(-1), braco(1));
    // ferramenta na mão direita
    if (q.mao && V1) { const [mx, my] = mao(1), svg = V1.peca(q.mao); if (svg) P.push(`<g transform="translate(${mx},${my}) scale(1.15) translate(-114,-124)">${svg}</g>`); }
    // cabeça: capacete do kit (sob medida) ou peça do guarda-roupa
    const k = S.capacete;
    if (q.cabeca === 'capacete-branco' || q.cabeca === 'capacete-amarelo' || q.cabeca === 'capacete-dourado') {
      const cor = q.cabeca === 'capacete-branco' ? EPI.capacete : q.cabeca === 'capacete-amarelo' ? '#f6c84c' : '#f2c94c';
      P.push(f(`M${k.x - k.r},${k.y} A${k.r},${k.r * .78} 0 0 1 ${k.x + k.r},${k.y} Z`, cor) + f(`M${k.x - k.r * 1.25},${k.y} h${k.r * 2.5} a3,3 0 0 1 0,6 h${-k.r * 2.5} a3,3 0 0 1 0,-6 Z`, cor) + `<rect x="${k.x - 3}" y="${k.y - k.r * .72}" width="6" height="${k.r * .7}" rx="3" fill="#00000016"/>` +
        (q.cabeca === 'capacete-dourado' ? linha(`M${k.x - 6},${k.y - k.r * .45} l6,-8 l6,8`, 2, '#fff6c8') : ''));
    } else if (q.cabeca) P.push(peca('cabeca'));
    else if (S.semCabeca) P.push(S.semCabeca(c));
    P.push(extras(e, R.x, k.y - 14));
    const nome = rotulo ? String(rotulo).replace(/[<>"&]/g, '') : 'Mascote';
    return `<svg class="mascot-svg chibi" viewBox="0 0 200 240" width="${tam}" height="${Math.round(tam * 1.2)}" role="img" aria-label="${nome}"><g class="m-all">${P.join('')}</g></svg>`;
  }
  return {desenhar, amostra: chave => (CORES[chave] || [])[0] || '', especies: Object.keys(ELENCO)};
})();

/* O desenho antigo continua disponível para quem ainda não está no elenco novo (período de testes). */
(() => {
  const v1 = window.CPTMascote;
  window.CPTMascoteV1 = v1;
  const v2 = () => window.CPT_MASCOTE_V2 === true;
  window.CPTMascote = {
    desenhar: (e, q, tam, rotulo, cor, expr) => v2() ? window.CPTMascoteV2.desenhar(e, q, tam, rotulo, cor, expr) : v1.desenhar(e, q, tam, rotulo, cor),
    amostra: k => v2() ? window.CPTMascoteV2.amostra(k) : v1.amostra(k),
    temDesenho: id => v1.temDesenho(id) || ['luvas', 'bota-preta'].includes(id)
  };
})();
</script>
