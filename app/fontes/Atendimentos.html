<script>
/*
 * Atendimentos 2.3.0 — carteira e ficha do caso, com o ciclo completo na aplicação:
 * consulta e observações (todos) · atualização e finalização (Atendimento/Gestão) · execução (Execução/Atendimento).
 * Textos digitados ficam na tela em caso de erro ou conflito.
 */
window.CPTAtendimentos = (() => {
  'use strict';
  let ui = null, filtro = {busca: '', estado: 'abertos'}, pagina = null, casos = [], ticket = 0, debounce = null;
  let aberto = null, abrirTicket = 0, historico = {cursor: null, ocupado: false};
  const ops = new Map(); // operação idempotente por formulário enquanto o conteúdo não muda
  const $ = id => document.getElementById(id);
  const hoje = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'America/Sao_Paulo'}).format(new Date());
  const corStatus = c => c.concluido ? 'green' : /receb/i.test(c.status) ? 'blue' : 'orange';
  const opId = (chave, conteudo) => { const sig = JSON.stringify(conteudo), atual = ops.get(chave); if (atual && atual.sig === sig) return atual.id; const id = 'OP-' + crypto.randomUUID(); ops.set(chave, {sig, id}); return id; };

  function render() {
    ui.view.innerHTML = ui.intro('Atendimentos', 'Cada ficha nasce do formulário com um protocolo. Acompanhe, registre a execução e finalize por aqui.') +
      `<section class="panel filter-panel"><form id="caseFilters" class="filters cases"><label class="field">Localizar atendimento<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtro.busca)}" placeholder="Protocolo, pessoa, assunto ou endereço" maxlength="200"></span></label>
      <label class="field">Situação<select name="estado"><option value="" ${!filtro.estado ? 'selected' : ''}>Todos os casos</option><option value="abertos" ${filtro.estado === 'abertos' ? 'selected' : ''}>Em aberto</option><option value="concluidos" ${filtro.estado === 'concluidos' ? 'selected' : ''}>Concluídos</option></select></label>
      <button type="submit" class="button">${ui.icon('search')}Buscar</button></form></section><div class="results-head"><span id="caseCount">Consultando atendimentos…</span><span>Protocolos ATD + ano + número</span></div><div id="caseResults" class="cards"></div><div id="moreCases" class="load-more"></div>`;
    const f = $('caseFilters'), ler = () => { filtro = Object.fromEntries(new FormData(f)); };
    f.addEventListener('submit', e => { e.preventDefault(); ler(); carregar(); });
    f.addEventListener('change', () => { ler(); carregar(); });
    f.elements.busca.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(() => { if (ui.state.route === 'atendimentos') { ler(); carregar(); } }, 400); });
    carregar();
  }
  function cartao(r) {
    return `<article class="entry-card"><div class="card-top"><span class="badge ${corStatus(r)}">${ui.esc(r.concluido ? 'Concluído' : r.status || 'Em aberto')}</span><span class="date">${ui.esc(r.protocolo)}</span></div><h3>${ui.esc(r.nome || 'Nome não informado')}</h3>
      <p><strong>${ui.esc(r.assunto || 'Assunto não informado')}</strong><br>${ui.esc(r.endereco || 'Endereço não informado')}</p>${r.proximaAcao && !r.concluido ? `<p class="small muted">Próxima ação: ${ui.esc(r.proximaAcao)}</p>` : ''}
      <div class="card-bottom"><span>${ui.esc(r.abertura ? 'Aberto em ' + ui.date(r.abertura) : r.area || '')}</span><button class="button ghost" data-case="${ui.esc(r.protocolo)}">Abrir ficha ${ui.icon('arrow')}</button></div></article>`;
  }
  async function carregar(mais = false) {
    const mine = ++ticket; if (!mais) casos = [];
    $('moreCases').innerHTML = '<span class="loading-label"><span class="spinner"></span>Buscando fichas…</span>'; if (!mais) $('caseResults').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    try {
      const d = await ui.call('buscarAtendimentosCPT', {...filtro, pagina: mais ? pagina : 0}); if (mine !== ticket || ui.state.route !== 'atendimentos') return;
      casos.push(...d.itens); pagina = d.proximaPagina; $('caseCount').textContent = ui.num(d.total) + ' casos encontrados';
      $('caseResults').innerHTML = casos.length ? casos.map(cartao).join('') : '<p class="muted">Nenhum atendimento encontrado. Altere a situação ou o termo da busca.</p>';
      $('moreCases').innerHTML = d.proximaPagina !== null ? '<button class="button secondary" data-case-mais>Carregar mais</button>' : '';
    } catch (e) { if (mine !== ticket) return; $('caseResults').innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; $('moreCases').innerHTML = ''; $('caseCount').textContent = 'Consulta não concluída'; }
  }

  // ---------- Ficha ----------
  function linhaResumo(pares) { return '<dl class="detail-summary">' + pares.filter(([, v]) => v !== null).map(([k, v]) => `<div><dt>${ui.esc(k)}</dt><dd>${ui.esc(v || 'Não informado')}</dd></div>`).join('') + '</dl>'; }
  async function abrir(protocolo) {
    const mine = ++abrirTicket; aberto = null; historico = {cursor: null, ocupado: false};
    $('detailType').textContent = 'ATENDIMENTO'; $('detailTitle').textContent = 'Abrindo ficha ' + protocolo; $('detailContent').innerHTML = '<div class="loading-label"><span class="spinner"></span>Abrindo a ficha…</div>';
    if (!$('detailDialog').open) $('detailDialog').showModal();
    try { const d = await ui.call('abrirAtendimentoCPT', protocolo); if (mine !== abrirTicket || !$('detailDialog').open) return; aberto = d; desenhar(); }
    catch (e) { if (mine === abrirTicket) $('detailContent').innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  function desenhar(rascunhos = {}) {
    const d = aberto, f = d.ficha, a = d.abertura, conc = f.concluido, docs = [['Abrir ficha', f.documento], ['Abrir PDF', f.pdf]].filter(([, u]) => ui.safeURL(u));
    $('detailTitle').textContent = f.protocolo + ' · ' + (f.nome || 'Atendimento');
    $('detailContent').innerHTML = `<div class="case-status"><span class="badge ${corStatus(f)}">${ui.esc(conc ? 'Concluído' : f.status)}</span><span class="badge">${ui.esc(d.procedencia)}</span>${!conc && f.proximaAcao ? `<span class="small">Próxima ação: <strong>${ui.esc(f.proximaAcao)}</strong> · ${ui.esc(f.area || '')}</span>` : ''}</div>
      ${docs.length ? `<div class="dialog-actions">${docs.map(([l, u]) => `<a class="button secondary" href="${ui.esc(ui.safeURL(u))}" target="_blank" rel="noopener noreferrer">${ui.icon('file')}${l}</a>`).join('')}</div>` : ''}
      ${d.protocoloConsultado !== f.protocolo ? `<div class="notice">O protocolo ${ui.esc(d.protocoloConsultado)} está incorporado à ficha principal ${ui.esc(f.protocolo)}.</div>` : ''}
      <div class="case-actions" role="group" aria-label="Ações do caso">
        ${d.pode.atualizar && !conc ? '<button class="button secondary" data-caso-form="atualizar">Atualizar caso</button>' : ''}
        ${d.pode.executar && !conc ? '<button class="button secondary" data-caso-form="execucao">Registrar execução</button>' : ''}
        ${d.pode.finalizar && !conc ? '<button class="button" data-caso-form="finalizar">Finalizar ficha</button>' : ''}
        ${d.pode.reabrir && conc ? '<button class="button secondary" data-caso-form="reabrir">Reabrir caso</button>' : ''}
      </div><div id="casoForm"></div>
      <h3 class="answers-head">Solicitação</h3><p class="case-text">${ui.esc(a.solicitacao || f.assunto || 'Não informada')}</p>
      ${linhaResumo([['Assunto', f.assunto], ['Tipo de manifestação', a.tipo], ['Canal', a.canal], ['Urgência', a.urgencia], ['Endereço', f.endereco], ['Frente de obra', f.obra],
        ['Telefone', a.telefone || (a.contatoOculto ? 'Visível para Atendimento e Execução' : '')], ['E-mail', a.email || null], ['Abertura', ui.date(f.abertura)], ['Conclusão', f.conclusao ? ui.date(f.conclusao) : null], ['Responsável', f.responsavel], ['Tratativa inicial', a.tratativa || null]])}
      ${a.registroId ? `<p class="small muted">Aberto pelo formulário · registro <button class="link-button" data-record="${ui.esc(a.registroId)}">${ui.esc(a.registroId)}</button></p>` : ''}
      <section class="case-notes"><h3 class="answers-head">Observações da equipe</h3><p class="small muted">Registre o que você soube sobre o caso. Fica com seu nome e não altera a ficha oficial.</p>
        <form id="noteForm"><div id="noteError" class="notice" hidden></div><label class="field">Por onde a informação chegou<select name="canal" required><option value="">Escolha</option>${['Escritório', 'Campo / itinerante', 'Telefone ou WhatsApp', 'E-mail', 'Reunião', 'Outro'].map(x => `<option ${rascunhos.canal === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <label class="field">Observação<textarea name="texto" rows="3" maxlength="2000" required placeholder="Ex.: Moradora procurou a equipe na rua e informou que o vazamento voltou.">${ui.esc(rascunhos.nota || '')}</textarea></label><button class="button secondary" type="submit">Registrar observação</button></form>
        <div id="caseNotes"><p class="muted">Carregando observações…</p></div></section>
      <h3 class="answers-head">Linha do tempo</h3><div id="caseHistory" class="timeline"><p class="muted">Carregando histórico…</p></div><button class="button ghost" id="historyMore" hidden>Carregar mais</button>`;
    carregarNotas(); carregarHistorico(true);
  }
  function formulario(tipo) {
    const d = aberto, f = d.ficha, sel = (nome, lista, atual) => `<select name="${nome}" required>${lista.map(x => `<option ${x === atual ? 'selected' : ''}>${ui.esc(x)}</option>`).join('')}</select>`;
    const eu = (ui.state.perfil && ui.state.perfil.nome) || '';
    const html = {
      atualizar: `<label class="field">Situação${sel('status', d.opcoes.status.filter(x => x !== 'Concluída'), f.status)}</label><label class="field">Procedência${sel('procedencia', d.opcoes.procedencias, d.procedencia)}</label>
        <label class="field">Área responsável pela próxima ação${sel('area', d.opcoes.areas, f.area || 'Atendimento')}</label><label class="field">Responsável<input name="responsavel" maxlength="120" value="${ui.esc(f.responsavel)}"></label>
        <label class="field wide">Próxima ação<input name="proximaAcao" required maxlength="500" value="${ui.esc(f.proximaAcao)}"></label><label class="field wide">Observação da atualização (opcional)<textarea name="observacao" rows="2" maxlength="2000"></textarea></label>`,
      execucao: `<label class="field wide">O que foi feito<textarea name="feito" rows="4" required maxlength="3000" placeholder="Ex.: Reparo da calçada com troca de 3 m² de piso; local limpo e liberado."></textarea></label>
        <label class="field">Data da execução<input type="date" name="data" required max="${hoje()}" value="${hoje()}"></label><label class="field">Executado por<input name="executadoPor" required maxlength="120" value="${ui.esc(eu)}"></label>
        <label class="field wide">Evidências (links de fotos no Drive, opcional)<textarea name="evidencias" rows="2" maxlength="1500" placeholder="https://drive.google.com/…"></textarea></label>`,
      finalizar: `<label class="field wide">Conclusão (como o caso foi resolvido)<textarea name="conclusao" rows="4" required maxlength="3000"></textarea></label>
        <label class="field">Data de conclusão<input type="date" name="data" required max="${hoje()}" value="${hoje()}"></label><label class="field">Procedência final${sel('procedencia', ['Procedente', 'Não procedente'], d.procedencia === 'Não procedente' ? 'Não procedente' : 'Procedente')}</label>
        <label class="check-inline wide"><input type="checkbox" name="semExecucao"> Resolvido sem execução de obra (ex.: orientação ou esclarecimento)</label>`,
      reabrir: `<label class="field wide">Motivo da reabertura<textarea name="motivo" rows="3" required maxlength="1000"></textarea></label><label class="field wide">Próxima ação<input name="proximaAcao" required maxlength="500"></label>`
    }[tipo];
    const titulos = {atualizar: 'Atualizar caso', execucao: 'Registrar execução', finalizar: 'Finalizar ficha', reabrir: 'Reabrir caso'};
    $('casoForm').innerHTML = `<form class="case-form" data-tipo="${tipo}"><h3>${titulos[tipo]}</h3><div id="casoErro" class="notice" hidden></div><div class="editor-grid">${html}</div>
      <div class="dialog-actions"><button class="button" type="submit">${titulos[tipo]}</button><button class="button ghost" type="button" data-caso-cancelar>Cancelar</button></div></form>`;
    $('casoForm').querySelector('textarea, input:not([type=hidden]), select').focus();
  }
  async function enviar(form) {
    const tipo = form.dataset.tipo, dados = Object.fromEntries(new FormData(form)), b = form.querySelector('button[type=submit]'), erro = $('casoErro');
    if (tipo === 'finalizar') dados.semExecucao = form.elements.semExecucao.checked;
    const p = {...dados, protocolo: aberto.ficha.protocolo, versao: aberto.versao}; p.operacaoId = opId(tipo + aberto.ficha.protocolo, p);
    const fn = {atualizar: 'atualizarAtendimentoCPT', execucao: 'registrarExecucaoCPT', finalizar: 'finalizarAtendimentoCPT', reabrir: 'reabrirAtendimentoCPT'}[tipo];
    b.disabled = true; const rotulo = b.textContent; b.textContent = 'Salvando…'; erro.hidden = true;
    try {
      const r = await ui.call(fn, p); ui.toast(r.resultado); ops.delete(tipo + aberto.ficha.protocolo);
      const protocolo = aberto.ficha.protocolo; await abrir(protocolo);
      const i = casos.findIndex(c => c.protocolo === protocolo); if (i >= 0 && aberto) { casos[i] = aberto.ficha; if ($('caseResults')) $('caseResults').innerHTML = casos.map(cartao).join(''); }
    } catch (e) { erro.textContent = e.message + ' Seu texto continua no formulário.'; erro.hidden = false; erro.scrollIntoView({block: 'nearest'}); b.disabled = false; b.textContent = rotulo; }
  }
  // ---------- Observações e histórico ----------
  function nota(x) { const q = x.em ? new Date(x.em).toLocaleString('pt-BR', {dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo'}) : ''; return `<section class="history-item"><h3>${ui.esc(x.nome || x.autor)}</h3><p class="small muted">${ui.esc(q + ' · ' + x.canal + (x.consultado && x.consultado !== x.protocolo ? ' · protocolo ' + x.consultado : ''))}</p><p class="case-text">${ui.esc(x.texto)}</p></section>`; }
  async function carregarNotas() {
    const protocolo = aberto.ficha.protocolo;
    try { const r = await ui.call('listarObservacoesCPT', {protocolo}); if (!aberto || aberto.ficha.protocolo !== protocolo || !$('caseNotes')) return; $('caseNotes').innerHTML = r.itens.length ? r.itens.map(nota).join('') : '<p class="muted">Nenhuma observação registrada ainda.</p>'; }
    catch (e) { if ($('caseNotes')) $('caseNotes').innerHTML = `<p class="muted">${ui.esc(e.message)}</p>`; }
  }
  async function enviarNota(form) {
    const f = new FormData(form), p = {protocolo: aberto.ficha.protocolo, canal: f.get('canal'), texto: String(f.get('texto') || '').trim()}, err = $('noteError'), b = form.querySelector('button');
    if (!p.canal || !p.texto) { err.textContent = 'Escolha o canal e escreva a observação.'; err.hidden = false; return; }
    p.operacaoId = opId('nota' + p.protocolo, p); b.disabled = true; b.textContent = 'Registrando…'; err.hidden = true;
    try { const r = await ui.call('adicionarObservacaoCPT', p); ops.delete('nota' + p.protocolo); ui.toast(r.resultado); form.reset(); const box = $('caseNotes'); if (box) { if (box.querySelector('.muted:only-child')) box.innerHTML = ''; box.insertAdjacentHTML('afterbegin', nota(r.observacao)); } }
    catch (e) { err.textContent = e.message + ' Seu texto continua no campo.'; err.hidden = false; } finally { b.disabled = false; b.textContent = 'Registrar observação'; }
  }
  async function carregarHistorico(inicio) {
    if (historico.ocupado) return; historico.ocupado = true; const protocolo = aberto.ficha.protocolo;
    try {
      const r = await ui.call('consultarHistoricoFichaCPT', {protocolo, cursor: inicio ? null : historico.cursor}); if (!aberto || aberto.ficha.protocolo !== protocolo || !$('caseHistory')) return;
      const html = r.itens.map(x => `<section class="history-item tipo-${ui.esc(ui.norm(x.tipo).replace(/[^a-z]/g, ''))}"><h3>${ui.esc(x.tipo || 'Movimentação')}</h3><p class="small muted">${ui.esc([x.data, x.status, x.autor].filter(Boolean).join(' · '))}</p><p class="case-text">${ui.esc(x.resumo || '')}</p></section>`).join('');
      if (inicio) $('caseHistory').innerHTML = html || '<p class="muted">Sem movimentações registradas.</p>'; else $('caseHistory').insertAdjacentHTML('beforeend', html);
      historico.cursor = r.proximoCursor; $('historyMore').hidden = r.proximoCursor == null;
    } catch (e) { if ($('caseHistory')) $('caseHistory').innerHTML = `<p class="muted">${ui.esc(e.message)}</p>`; } finally { historico.ocupado = false; }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', ev => {
      const c = ev.target.closest('[data-case]'); if (c) { abrir(c.dataset.case); return; }
      if (ev.target.closest('[data-case-mais]')) { carregar(true); return; }
      const f = ev.target.closest('[data-caso-form]'); if (f && aberto) { formulario(f.dataset.casoForm); return; }
      if (ev.target.closest('[data-caso-cancelar]')) { $('casoForm').innerHTML = ''; return; }
      if (ev.target.closest('#historyMore')) carregarHistorico(false);
    });
    document.addEventListener('submit', ev => {
      const cf = ev.target.closest('.case-form'); if (cf) { ev.preventDefault(); enviar(cf); return; }
      const nf = ev.target.closest('#noteForm'); if (nf && aberto) { ev.preventDefault(); enviarNota(nf); }
    });
  }
  return {init, render, abrir, filtrar: estado => { filtro.estado = estado; }};
})();
</script>
