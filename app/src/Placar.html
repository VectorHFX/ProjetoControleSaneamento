<script>
window.CPTPlacar=(()=>{"use strict";let ui=null;const ddmm=x=>x.slice(8,10)+"/"+x.slice(5,7);function painel(p){if(!p||!ui)return"";const pct=Math.min(100,Math.round(p.pontos/p.meta*100)),max=Math.max(p.meta,...p.historico.map(h=>h.pontos))||1;const item=(icone,n,um,varios)=>"<li><span aria-hidden=\"true\">".concat(icone,"</span><strong>").concat(ui.num(n),"</strong> ").concat(n===1?um:varios,"</li>");return"<section class=\"panel home-placar\" id=\"espPlacar\"><div class=\"panel-head\"><div><span class=\"card-kicker\">\uD83C\uDFC6 Placar da equipe</span><h2>Semana de ".concat(ddmm(p.inicio),"</h2></div><span class=\"small muted\">S\xF3 n\xFAmeros da equipe toda</span></div>\n      <div class=\"placar-topo\"><div class=\"placar-total\"><strong>").concat(ui.num(p.pontos),"</strong><span>de ").concat(ui.num(p.meta)," pontos na meta da semana</span>\n        <span class=\"meter placar-meta\" role=\"meter\" aria-valuemin=\"0\" aria-valuemax=\"").concat(p.meta,"\" aria-valuenow=\"").concat(Math.min(p.pontos,p.meta),"\" aria-label=\"Meta da equipe\"><span style=\"width:").concat(pct,"%\"></span></span>\n        <p class=\"small\">").concat(p.atingiu?"\uD83C\uDF89 Meta da semana batida! Bom trabalho, equipe.":"Faltam ".concat(ui.num(p.meta-p.pontos)," pontos. Cada tarefa, acerto e vit\xF3ria conta."),"</p></div>\n      <ul class=\"placar-itens\">").concat(item("\u2705",p.tarefas,"tarefa feita","tarefas feitas")).concat(item("\u2753",p.acertos,"acerto no quiz","acertos no quiz")).concat(item("\uD83C\uDFAE",p.vitorias,"vit\xF3ria nos joguinhos","vit\xF3rias nos joguinhos")).concat(item("\u2764",p.fotos,"foto favoritada","fotos favoritadas"),"</ul></div>\n      <div class=\"placar-semanas\" role=\"img\" aria-label=\"Pontos da equipe nas \xFAltimas ").concat(p.historico.length," semanas: ").concat(p.historico.map(h=>ddmm(h.inicio)+" "+h.pontos).join(", "),"\">\n        ").concat(p.historico.map(h=>"<div class=\"placar-semana ".concat(h.atual?"is-atual":"","\"><b>").concat(ui.num(h.pontos),"</b><span class=\"placar-barra\"><span style=\"height:").concat(Math.max(2,h.pontos/max*100),"%\"></span></span><small>").concat(h.atual?"esta semana":ddmm(h.inicio),"</small></div>")).join(""),"\n</div></section>")}return{init:api=>{ui=api},painel}})();
</script>
