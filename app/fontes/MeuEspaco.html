<script>

 */

  'use strict';
  let seq = 0;
  const PELE = {gato: ['#f2994a', '#fde3c6'], cachorro: ['#c98b55', '#f3dcc2'], pato: ['#ffd84d', '#fff3b0'], aguia: ['#7a5230', '#efe3cf'], dinossauro: ['#6cbf6a', '#d8f0c0'], abelha: ['#ffcf33', '#fff1b8'], capivara: ['#a5714a', '#dcb994']};

  const PECAS = {

      capivara: {atras: '', orelhas: `<ellipse cx="58" cy="40" rx="8" ry="7" fill="${p}"/><ellipse cx="102" cy="40" rx="8" ry="7" fill="${p}"/><ellipse cx="58" cy="41" rx="4" ry="3.5" fill="${esc}"/><ellipse cx="102" cy="41" rx="4" ry="3.5" fill="${esc}"/>`,

  function desenhar(e, equipado, tam, rotulo, cor) {

    const linha = mix(c.p, '#000000', .32), luz = mix(c.p, '#ffffff', .38), luzCab = mix(c.cabeca, '#ffffff', .38), pePato = e === 'pato' ? '#ff9f1c' : c.p;

})();

  /** "Para quem" da tarefa nova: eu, uma frente ou uma pessoa da equipe. */
  function opcoesPara() {
    const NOMES = {atendimento: 'Atendimento', socioambiental: 'Socioambiental', comunicacao: 'Comunicação', comercializacao: 'Comercialização', gestao: 'Gestão', administrativo: 'Administrativo'};
    const eu = (ui.state.perfil || {}).email, pessoas = (d.pessoas || []).filter(p => p.email !== eu);
    return `<option value="">Para mim</option><optgroup label="Para uma frente">${Object.entries(NOMES).map(([k, n]) => `<option value="frente:${k}">${n}</option>`).join('')}</optgroup>${pessoas.length ? `<optgroup label="Para uma pessoa">${pessoas.map(p => `<option value="pessoa:${ui.esc(p.email)}">${ui.esc(p.nome)}</option>`).join('')}</optgroup>` : ''}`;
  }
  /** Tarefa para outra pessoa ou frente: vira um lembrete no dia que está aberto. */
  async function passarTarefa(texto, para, form) {
    const [tipo, valor] = para.split(':'), b = form.querySelector('[type=submit]');
    const dados = {titulo: texto, data: dia, responsavel: tipo === 'pessoa' ? valor : '', frentes: tipo === 'frente' ? [valor] : []};
    b.disabled = true;
    try {
      const r = await ui.call('salvarLembreteCPT', {...dados, operacaoId: op()}); ui.toast(r.resultado); form.reset();
      const nome = tipo === 'pessoa' ? ((d.pessoas || []).find(p => p.email === valor) || {nome: valor}).nome : form.querySelector(`option[value="${para}"]`).textContent;
      (d.lembretes = d.lembretes || []).push({id: r.lembrete.id, titulo: r.lembrete.titulo, data: r.lembrete.data, feito: false, para: nome, de: ''}); desenharLista();
    } catch (e) { ui.toast(e.message); } finally { b.disabled = false; }
  }
  function salvarLista() {
    const pedido = {data: dia, itens: d.lista.itens.filter(t => !t.removido).map(({id, texto, feito, lembrete}) => lembrete ? {id, texto, feito, lembrete} : {id, texto, feito})};
    fila = fila.then(async () => {
      try { const r = await ui.call('salvarChecklistCPT', {...pedido, versao: d.lista.versao, operacaoId: op()}); if (r.lista.data === dia) { d.lista = r.lista; if (r.lembretes) d.lembretes = r.lembretes; desenharLista(); } d.pontos = r.pontos; mostrarPontos(r.pontos.saldo, /pontos!/.test(r.resultado)); if (/pontos!/.test(r.resultado)) { ui.toast(r.resultado); comemorar(); } else atualizarHumor(); }
      catch (e) { ui.toast('Checklist não salvou: ' + e.message); render(true); }
    });
  }
  // ---------- Caderno: salva sozinho (e guarda no navegador até o servidor confirmar) ----------
  const chaveNota = () => 'cpt.caderno.' + dia;
  function recuperarNota() {
    const t = $('espNota'); if (!t) return; const local = store.get(chaveNota());
    if (local !== null && local !== d.nota.texto) { t.value = local; estadoNota('Texto recuperado deste navegador. Salvando…'); agendarNota(10); }
  }
  function estadoNota(t) { const e = $('espNotaEstado'); if (e) e.textContent = t; }
  function agendarNota(ms) { clearTimeout(notaTimer); notaTimer = setTimeout(salvarNota, ms == null ? 1500 : ms); }
  function salvarNota() {
    const t = $('espNota'); if (!t) return; const texto = t.value, data = dia;
    if (texto === d.nota.texto) { store.del(chaveNota()); return; }
    estadoNota('Salvando…');
    fila = fila.then(async () => {
      try {
        const r = await ui.call('salvarNotaCPT', {data, texto, versao: d.nota.data === data ? d.nota.versao : 0, operacaoId: op()});
        if (data === dia) { d.nota = r.nota; if (($('espNota') || {}).value === texto) store.del('cpt.caderno.' + data); }
        d.caderno.dias = r.dias; if ($('espDias')) $('espDias').textContent = r.dias; estadoNota('Salvo às ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}));
        if (r.pendentes.length > d.pendentes.length) { d.pendentes = r.pendentes; ui.toast(r.resultado); desenhar(); }
      } catch (e) { estadoNota('Não salvou: ' + e.message + ' Seu texto continua aqui.'); }
    });
  }
  function irPara(novo) { salvarNota(); dia = novo; render(true); }
  // ---------- Mascote: nome, guarda-roupa, presentes, loja ----------
  async function mascote(dados, okMsg) {
    try { const r = await ui.call('salvarMascoteCPT', {...dados, versao: d.perfil ? d.perfil.versao : 0, operacaoId: op()}); d.perfil = r.perfil; d.pontos = r.pontos; d.pendentes = r.pendentes; ui.toast(okMsg || r.resultado); return true; }
    catch (e) { const b = $('espErro'); if (b) { b.hidden = false; b.textContent = e.message; } else ui.toast(e.message); return false; }
  }
  function guardaRoupa() {
    const m = M(), meus = new Set(d.perfil.pecas.concat(d.kit || [])), it = d.catalogo.filter(x => x.slot === guardaAba);
    const comuns = it.filter(x => !x.preco && meus.has(x.id)), exclusivas = it.filter(x => x.preco);
    const carta = (x, acao) => `<button class="wardrobe-item ${m.equipado[x.slot] === x.id ? 'is-on' : ''}" ${acao}>${window.CPTMascote.desenhar(m.especie, {...m.equipado, [x.slot]: x.id}, 96, x.nome, m.cor)}<span>${ui.esc(x.id === 'laco-do-mes' && window.CPT_MASCOTE_V2 ? 'Laço do mês · ' + window.CPTMascoteV2.campanha()[0] : x.nome)}</span>${x.id === 'laco-do-mes' && window.CPT_MASCOTE_V2 ? `<small>${ui.esc(window.CPTMascoteV2.campanha()[2])}</small>` : ''}${x.preco ? `<small>${meus.has(x.id) ? 'Sua' : ic('star', '⭐') + ' ' + x.preco + ' pontos'}</small>` : ''}</button>`;
    dialogo('GUARDA-ROUPA', 'Guarda-roupa de ' + m.nome, `<div id="espErro" class="notice" hidden></div><div class="segmented painel-tabs wardrobe-tabs">${Object.entries(d.slots).map(([k, n]) => `<button class="${guardaAba === k ? 'chosen' : ''}" data-esp-aba="${k}">${n}</button>`).join('')}</div>
      <h3 class="answers-head">Suas peças</h3><div class="wardrobe">${m.equipado[guardaAba] ? `<button class="wardrobe-item" data-esp-tirar="${guardaAba}">${window.CPTMascote.desenhar(m.especie, {...m.equipado, [guardaAba]: ''}, 84, 'Sem peça', m.cor)}<span>Sem nada</span></button>` : ''}${comuns.concat(exclusivas.filter(x => meus.has(x.id))).map(x => carta(x, `data-esp-vestir="${x.id}"`)).join('') || '<p class="empty-line">Você ainda não tem peças aqui. Ganhe no presente da semana ou no caderno.</p>'}</div>
      ${Object.keys(d.classicos || {}).some(k => !d.perfil.mascotes.some(x => x.especie === k)) ? `<h3 class="answers-head">Clássicos <small class="muted">(os primeiros mascotes do app · ${ic('star', '⭐')} ${d.precoClassico} pontos cada)</small></h3><div class="wardrobe">${Object.entries(d.classicos).filter(([k]) => !d.perfil.mascotes.some(x => x.especie === k)).map(([k, n]) => `<button class="wardrobe-item" data-esp-classico="${k}" ${d.pontos.saldo < d.precoClassico ? 'aria-disabled="true"' : ''}>${window.CPTMascote.desenhar(k, {}, 84, n)}<span>${ui.esc(n)}</span><small>${ic('star', '⭐')} ${d.precoClassico} pontos</small></button>`).join('')}</div>` : ''}
      ${exclusivas.some(x => !meus.has(x.id)) ? `<h3 class="answers-head">Exclusivas por pontos <small class="muted">(você tem ${ic('star', '⭐')} ${ui.num(d.pontos.saldo)})</small></h3><div class="wardrobe">${exclusivas.filter(x => !meus.has(x.id)).map(x => carta(x, `data-esp-comprar="${x.id}" ${d.pontos.saldo < x.preco ? 'aria-disabled="true"' : ''}`)).join('')}</div>` : ''}`);
  }
  function presente(chave, modo) {
    const p = d.pendentes.find(x => x.chave === chave) || d.pendentes[0]; if (!p) return; const meus = new Set(d.perfil.pecas), m = M();
    const especiesNovas = Object.keys(d.especies).filter(k => !d.perfil.mascotes.some(x => x.especie === k));
    const pecas = d.catalogo.filter(x => !x.preco && !meus.has(x.id));
    modo = modo || (p.tipo === 'semana' ? '' : 'peca');
    const escolha = !modo ? `<p>${ui.esc(p.texto)}</p><div class="big-choice"><label><input type="radio" name="m" data-esp-modo="mascote" ${especiesNovas.length ? '' : 'disabled'}><span><strong>Um mascote novo</strong><small>${especiesNovas.length ? 'Escolha a espécie e dê um nome' : 'Você já tem todos!'}</small></span></label><label><input type="radio" name="m" data-esp-modo="peca"><span><strong>Uma peça</strong><small>Roupa, EPI ou acessório</small></span></label></div>`
      : modo === 'mascote' ? `<div class="pet-picker">${especiesNovas.map(k => `<button class="pet-option" data-esp-novo="${k}">${window.CPTMascote.desenhar(k, {}, 90, d.especies[k])}<span>${d.especies[k]}</span></button>`).join('')}</div><form id="espNovoMascote" class="inline-add" hidden><label class="field">Nome<input name="nome" maxlength="30" required></label><button class="button" type="submit">Adotar</button></form>`
      : `<div class="wardrobe">${pecas.map(x => `<button class="wardrobe-item" data-esp-ganhar="${x.id}">${window.CPTMascote.desenhar(m.especie, {...m.equipado, [x.slot]: x.id}, 96, x.nome, m.cor)}<span>${ui.esc(x.id === 'laco-do-mes' && window.CPT_MASCOTE_V2 ? 'Laço do mês · ' + window.CPTMascoteV2.campanha()[0] : x.nome)}</span>${x.id === 'laco-do-mes' && window.CPT_MASCOTE_V2 ? `<small>${ui.esc(window.CPTMascoteV2.campanha()[2])}</small>` : ''}<small>${ui.esc(x.grupo)}</small></button>`).join('') || '<p class="empty-line">Você já tem todas as peças comuns!</p>'}</div>`;
    dialogo('PRESENTE', (window.CPTVisual && window.CPTVisual.ativo() ? '' : '🎁 ') + p.titulo, `<div id="espErro" class="notice" hidden></div>${escolha}`); $('detailContent').dataset.chave = p.chave;
  }
  function init(api) {
    ui = api;
    document.addEventListener('cpt:recado', e => recadoMudou(e.detail));
    // Quadro: foto sem acesso no Drive (ou que não abre) volta para a paisagem.
    // 2.26.3: antes de desistir, pede a miniatura à aplicação (a conta de quem vê pode não ter leitura na pasta do Drive).
    // Escolha do quadro: foto que o navegador não abre no Drive vem pela aplicação; se nem ela abrir, a opção some.
    document.addEventListener('error', e => { const t = e.target; if (!t || !t.closest || !t.closest('.quadro-mini') || !t.dataset.mini) return; const some = () => { const b = t.closest('.quadro-opcao'); if (b) b.remove(); };
      if (window.CPTMiniaturas) window.CPTMiniaturas.tentar(t, some); else some(); }, true);
    document.addEventListener('error', e => { const t = e.target; if (!t || !t.classList || !t.classList.contains('quadro-foto')) return;
      const desistir = () => { const q = t.closest('.pet-quadro'); t.remove();
        if (q) { q.classList.remove('tem-foto'); const pl = q.querySelector('.quadro-placa'); if (pl) pl.textContent = 'Santo André'; } };
      if (window.CPTMiniaturas) window.CPTMiniaturas.tentar(t, desistir); else desistir(); }, true);
    // Quiz (Saber.html): pontos novos atualizam o selo de pontos e o humor do mascote.
    // Joguinhos (Jogos.html): mesma atualização de pontos; o quebra-cabeça sem foto usa o mascote da pessoa.
    if (window.CPTJogos) { window.CPTJogos.aoMudar(r => { if (!d) return; d.pontos = r.pontos; mostrarPontos(r.pontos.saldo, r.venceu && r.pontos.saldo > 0); if (r.venceu) comemorar(); });
      window.CPTJogos.mascote(() => d && d.perfil ? window.CPTMascote.desenhar(M().especie, M().equipado, 300, M().nome, M().cor, 'feliz').replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" ') : '');
      // 2.51: o mascote da pessoa é o personagem do "Caminho do esgoto" (muda de expressão a cada jogada)
      if (window.CPTJogos.personagem) window.CPTJogos.personagem((expr, tam) => d && d.perfil ? window.CPTMascote.desenhar(M().especie, M().equipado, tam, M().nome, M().cor, expr) : ''); }
    if (window.CPTSaber) window.CPTSaber.aoMudar(r => { if (!d) return; d.pontos = r.pontos; mostrarPontos(r.pontos.saldo, r.acertou); if (r.acertou) comemorar(); else atualizarHumor();
      setTimeout(() => { const dot = document.querySelector('#espTab-saber .tab-dot'); if (dot && document.querySelector('#quizDia .quiz-resultado')) dot.remove(); }); });
    document.addEventListener('click', async e => {
      const t = e.target;
      const esp = t.closest('[data-esp-especie]'); if (esp) { boasVindas(esp.dataset.espEspecie); return; }
      const pa = t.closest('[data-esp-parte]'); if (pa) { trocarParte(pa.dataset.espParte); return; }
      const dd = t.closest('[data-esp-dia]'); if (dd) { const n = Number(dd.dataset.espDia); irPara(n ? somaDias(dia, n) : d.hoje); return; }
      const ir = t.closest('[data-esp-ir]'); if (ir) { fechar(); irPara(ir.dataset.espIr); return; }
      const md = t.closest('[data-missao-dica]'); if (md) { abrirDica(md.dataset.missaoDica); return; }
      const mv = t.closest('[data-missao-devolutiva]'); if (mv) { abrirDevolutiva(mv.dataset.missaoDevolutiva); return; }
      const en = t.closest('[data-dica-entendi]'); if (en) { marcarDicaVista(en.dataset.dicaEntendi); $('detailDialog').close(); desenharMissoes(); ui.toast('Boa! Dica guardada.'); return; }
      const lm = t.closest('[data-esp-lem]'); if (lm) { const l = (d.lembretes || []).find(y => y.id === lm.dataset.espLem); if (!l || l.para) return;
        if (d.lista.itens.filter(y => !y.removido).length >= 30) { lm.checked = false; ui.toast('Use até 30 tarefas por dia.'); return; }
        if (lm.checked) folhinha(lm); d.lista.itens.push({id: 'T-L' + crypto.randomUUID().slice(0, 8), texto: l.titulo, feito: lm.checked, lembrete: l.id}); desenharLista(); salvarLista(); return; }
      const rc = t.closest('[data-esp-recado]'); if (rc && window.CPTRecados) { window.CPTRecados.abrir(rc.dataset.espRecado); return; }
      const ck = t.closest('[data-esp-check]'); if (ck) { const x = d.lista.itens.find(y => y.id === ck.dataset.espCheck); x.feito = ck.checked; ck.closest('li').classList.toggle('is-done', ck.checked); if (ck.checked) folhinha(ck); salvarLista(); return; }
      const ap = t.closest('[data-esp-apagar]'); if (ap) { d.lista.itens = d.lista.itens.filter(y => y.id !== ap.dataset.espApagar); desenharLista(); salvarLista(); return; }
      if (t.closest('[data-esp-nomear]')) { const n = prompt('Novo nome para ' + M().nome + ':', M().nome); if (n && n.trim() && n.trim() !== M().nome && await mascote({acao: 'nomear', nome: n.trim()})) desenhar(); return; }
      if (t.closest('[data-esp-guarda]')) { guardaAba = 'cabeca'; guardaRoupa(); return; }
      if (t.closest('[data-esp-cor]')) { cores(); return; }
      if (t.closest('[data-esp-quadro]')) { escolherQuadro(); return; }
      const qp = t.closest('[data-esp-paisagem]'); if (qp) { const k = qp.dataset.espPaisagem; if (await mascote({acao: 'quadro', tipo: 'paisagem', paisagem: k})) { d.quadro = {tipo: 'paisagem', paisagem: k}; fechar(); desenhar(); } return; }
      const qf = t.closest('[data-esp-foto]'); if (qf) { const id = qf.dataset.espFoto, leg = qf.dataset.legenda || '', img = qf.querySelector('img');
        if (await mascote({acao: 'quadro', tipo: 'foto', fileId: id, legenda: leg})) { d.quadro = {tipo: 'foto', fileId: id, legenda: leg, imagem: (window.CPTMiniaturas && window.CPTMiniaturas.daAplicacao(id)) || (img && img.currentSrc) || ''}; fechar(); desenhar(); } return; }
      const cl = t.closest('[data-esp-colorir]'); if (cl) { if ((M().cor || '') !== cl.dataset.espColorir && await mascote({acao: 'colorir', cor: cl.dataset.espColorir})) { fechar(); desenhar(); } else if ((M().cor || '') === cl.dataset.espColorir) fechar(); return; }
      const cc = t.closest('[data-esp-comprar-cor]'); if (cc) { const k = cc.dataset.espComprarCor; if (d.pontos.saldo < d.precoCor) { ui.toast('Faltam ' + (d.precoCor - d.pontos.saldo) + ' pontos. Complete tarefas do checklist.'); return; }
        if (confirm('Usar ' + d.precoCor + ' pontos na cor ' + d.coresEspeciais[k].toLowerCase() + '? Depois de comprada, trocar é livre.') && await mascote({acao: 'comprarCor', cor: k})) { fechar(); desenhar(); } return; }
      const ab = t.closest('[data-esp-aba]'); if (ab) { guardaAba = ab.dataset.espAba; guardaRoupa(); return; }
      const ve = t.closest('[data-esp-vestir]'); if (ve) { const it = d.catalogo.find(x => x.id === ve.dataset.espVestir); if (await mascote({acao: 'vestir', slot: it.slot, item: it.id})) { guardaRoupa(); desenhar(); } return; }
      const cl2 = t.closest('[data-esp-classico]'); if (cl2) { const k = cl2.dataset.espClassico; if (d.pontos.saldo < d.precoClassico) { ui.toast('Faltam ' + (d.precoClassico - d.pontos.saldo) + ' pontos. Complete tarefas do checklist.'); return; }
        const nome = prompt('Nome para o seu ' + d.classicos[k].toLowerCase() + ' (usa ' + d.precoClassico + ' pontos):', SUGESTAO[k] || d.classicos[k]); if (nome && nome.trim() && await mascote({acao: 'comprarClassico', especie: k, nome: nome.trim()})) { fechar(); desenhar(); } return; }
      const ti = t.closest('[data-esp-tirar]'); if (ti) { if (await mascote({acao: 'vestir', slot: ti.dataset.espTirar, item: ''})) { guardaRoupa(); desenhar(); } return; }
      const co = t.closest('[data-esp-comprar]'); if (co) { const it = d.catalogo.find(x => x.id === co.dataset.espComprar); if (d.pontos.saldo < it.preco) { ui.toast('Faltam ' + (it.preco - d.pontos.saldo) + ' pontos. Complete tarefas do checklist.'); return; } if (confirm('Usar ' + it.preco + ' pontos em "' + it.nome + '"?') && await mascote({acao: 'comprar', item: it.id})) { guardaRoupa(); desenhar(); } return; }
      if (t.closest('[data-esp-trocar]')) { dialogo('MASCOTES', 'Seus mascotes', `<div class="pet-picker">${d.perfil.mascotes.map((m, i) => `<button class="pet-option ${i === d.perfil.ativo ? 'is-picked' : ''}" data-esp-ativar="${i}">${desenho(m, 100)}<span>${ui.esc(m.nome)}</span></button>`).join('')}</div>`); return; }
      const at = t.closest('[data-esp-ativar]'); if (at) { if (await mascote({acao: 'ativar', indice: Number(at.dataset.espAtivar)})) { fechar(); desenhar(); } return; }
      if (t.closest('[data-esp-presente]')) { presente(d.pendentes[0].chave); return; }
      const mo = t.closest('[data-esp-modo]'); if (mo) { presente($('detailContent').dataset.chave, mo.dataset.espModo); return; }
      const nv = t.closest('[data-esp-novo]'); if (nv) { document.querySelectorAll('[data-esp-novo]').forEach(b => b.classList.toggle('is-picked', b === nv)); const f = $('espNovoMascote'); f.hidden = false; f.dataset.especie = nv.dataset.espNovo; f.elements.nome.value = SUGESTAO[nv.dataset.espNovo]; f.elements.nome.focus(); f.elements.nome.select(); return; }
      const ga = t.closest('[data-esp-ganhar]'); if (ga) { if (await mascote({acao: 'resgatar', chave: $('detailContent').dataset.chave, escolha: 'peca', item: ga.dataset.espGanhar})) { fechar(); desenhar(); } }
    });
    document.addEventListener('submit', async e => {
      const f = e.target;
      if (f.id === 'espInicio') { e.preventDefault(); if (await mascote({acao: 'iniciar', especie: f.dataset.especie, nome: f.elements.nome.value})) { window.scrollTo({top: 0, behavior: 'auto'}); render(); } }
      else if (f.id === 'espNovoMascote') { e.preventDefault(); if (await mascote({acao: 'resgatar', chave: $('detailContent').dataset.chave, escolha: 'mascote', especie: f.dataset.especie, nome: f.elements.nome.value})) { fechar(); desenhar(); } }
      else if (f.id === 'espNova') { e.preventDefault(); const texto = f.elements.texto.value.trim(); if (!texto) return; if (f.elements.para.value) { passarTarefa(texto, f.elements.para.value, f); return; } if (d.lista.itens.filter(t => !t.removido).length >= 30) { ui.toast('Use até 30 tarefas por dia.'); return; } d.lista.itens.push({id: 'T-' + crypto.randomUUID().slice(0, 8), texto, feito: false}); f.reset(); desenharLista(); salvarLista(); f.elements.texto.focus(); }
    });
    document.addEventListener('input', e => { if (e.target.id === 'espNota') { store.set(chaveNota(), e.target.value); estadoNota('Escrevendo…'); agendarNota(); } });
    document.addEventListener('focusout', e => { if (e.target.id === 'espNota') agendarNota(0); });
  }
  return {init, render, irParte: k => { parte = k; store.set('cpt.espaco.parte', k); }, sair: () => { clearTimeout(notaTimer); salvarNota(); }};
})();
</script>
