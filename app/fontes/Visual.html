<script>
/*
 * Visual 2.24.0 — "Veolia acolhedor": parede verde ripada, plantas, madeira clara, luz quente e o vermelho Veolia como destaque.

/** Ícone de traço no visual novo; no visual atual (equipe, até liberar) continua o emoji. nome = símbolo #i-nome do Aplicacao.html. */

  // ---------- Entrada de página: o conteúdo novo sobe e aparece; os cartões chegam em cascata ----------

  // quando os dados chegam, só o que acabou de entrar sobe (o que já estava na tela não pisca de novo).

  function folhas(origem) {

    if (!raf) raf = requestAnimationFrame(() => { raf = 0; cena.style.setProperty('--px', px.toFixed(3)); cena.style.setProperty('--py', py.toFixed(3)); });
  }
  function soltar(e) { const cena = e.target.closest && e.target.closest('.v3-cena-host'); if (cena && !cena.contains(e.relatedTarget)) { cena.style.setProperty('--px', 0); cena.style.setProperty('--py', 0); } }
  // ---------- Folhagem (parede de plantas): desenhada aqui, só para quem usa o visual novo (não pesa o CSS de ninguém) ----------
  const G = ['#2f5d34', '#3f6f3a', '#4f7f3f', '#5e8f4a', '#6e9e55', '#7fae5f', '#94bf6f'];
  const pFolha = (x, y, s, a, c) => `<g transform="translate(${x} ${y}) rotate(${a}) scale(${s})"><path d="M0 0C-15-12-16-38 0-58C16-38 15-12 0 0Z" fill="${c}"/><path d="M0-3V-52" stroke="#ffffff38" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
  const pCoracao = (x, y, s, a, c) => `<g transform="translate(${x} ${y}) rotate(${a}) scale(${s})"><path d="M0 0C-22-10-26-36-11-46C-4-50 0-45 0-41C0-45 4-50 11-46C26-36 22-10 0 0Z" fill="${c}"/><path d="M0-4V-38" stroke="#ffffff30" stroke-width="1.5" fill="none"/></g>`;
  function pSamambaia(x, y, s, a, c) {
    let out = `<g transform="translate(${x} ${y}) rotate(${a}) scale(${s})"><path d="M0 0Q4-60 -6-120" stroke="${c}" stroke-width="2.4" fill="none"/>`;
    for (let i = 1; i < 12; i++) { const t = i / 12, yy = (-t * 118).toFixed(1), xx = (-6 * t * t + 4 * t).toFixed(1), L = 16 * (1 - t * .6);
      [-62, 58].forEach(r => { out += `<path transform="translate(${xx} ${yy}) rotate(${r})" d="M0 0C-3-4-3-${L.toFixed(1)} 0-${(L * 1.5).toFixed(1)}C3-${L.toFixed(1)} 3-4 0 0Z" fill="${c}"/>`; }); }
    return out + '</g>';
  }
  /** Folhas em três camadas (escuras atrás, claras na frente), em grade com tremor: cobre a área toda, sempre igual. */
  function folhagem(w, hh, n, seed) {
    const partes = [], camadas = [[G.slice(0, 2), 1.25, 0], [G.slice(1, 4), 1.05, .33], [G.slice(3, 7), .85, .66]]; let idx = 0;
    camadas.forEach(([cores, esc, off], ci) => {
      const m = Math.floor(n / 3), nx = Math.floor(Math.sqrt(m * w / hh)) + 1, ny = Math.floor(m / nx) + 1;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        idx++; const k = (idx * 7919 + seed * 104729) % 1000 / 1000, k2 = (idx * 6271 + seed * 7907) % 1000 / 1000, k3 = (idx * 3571 + seed * 15485863) % 1000 / 1000;
        const x = Math.round((i + .5 + (k - .5) * .9 + off) * w / nx), y = Math.round((j + .6 + (k2 - .5) * .9) * hh / ny + 20), s = (esc * (.75 + k3 * .5)).toFixed(2), a = -80 + (idx * 53) % 160, c = cores[idx % cores.length];
        partes.push(idx % 5 === 0 ? pCoracao(x, y, s, a, c) : pFolha(x, y, s, a, c));
        if (idx % 13 === 6 && ci > 0) partes.push(pSamambaia(x, y + 40, (.9 + k3 * .5).toFixed(2), Math.trunc(a / 3), cores[0]));

  }
  const uri = svg => 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';

    if (h.style.getPropertyValue('--v3-folhagem')) return;
    h.style.setProperty('--v3-folhagem', uri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">${folhagem(360, 240, 120, 3)}</svg>`));
    h.style.setProperty('--v3-jardim', uri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" preserveAspectRatio="xMidYMax slice">${folhagem(260, 150, 90, 7)}</svg>`));
  }
  // ---------- Cenário do Meu espaço: parede ripada, parede de plantas atrás do cartão, luminárias, placa da marca e piso ----------
  /** Folhagem em camadas separadas (para a brisa mexer cada camada num ritmo). */
  function camadas(w, hh, n, seed) {
    const out = [[], [], []], conjuntos = [[G.slice(0, 2), 1.25, 0], [G.slice(1, 4), 1.05, .33], [G.slice(3, 7), .85, .66]]; let idx = 0;
    conjuntos.forEach(([cores, esc, off], ci) => {

      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        idx++; const k = (idx * 7919 + seed * 104729) % 1000 / 1000, k2 = (idx * 6271 + seed * 7907) % 1000 / 1000, k3 = (idx * 3571 + seed * 15485863) % 1000 / 1000;
        const x = Math.round((i + .5 + (k - .5) * .9 + off) * w / nx), y = Math.round((j + .6 + (k2 - .5) * .9) * hh / ny + 20), s = (esc * (.75 + k3 * .5) * 1.5).toFixed(2), a = -80 + (idx * 53) % 160, c = cores[idx % cores.length];
        out[ci].push(idx % 5 === 0 ? pCoracao(x, y, s, a, c) : pFolha(x, y, s, a, c));

  }
  let cenaPronta = '';

    if (cenaPronta) return cenaPronta;
    const ripas = Array.from({length: 46}, (_, i) => `<rect x="${i * 22}" y="0" width="16" height="470"/>`).join('');
    const [c1, c2, c3] = camadas(600, 420, 160, 11);

      <path d="M0 471 H1000" class="v3-rodape"/></svg>`;
    return cenaPronta;
  }
  function init() {
    if (ativo()) { fonte(); pintarFolhagem(); }

})();
</script>
