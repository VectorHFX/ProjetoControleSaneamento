<script>
/*
 * Gestão 2.7.0 — Painel da gestão (contrato, frentes de serviço, qualidade dos relatos, entregas do mês) e Conectores.
 * Painel: só leitura, com o que pede atenção primeiro. Frentes abrem o registro ou a ficha de sempre.
 * 2.27: o Programa Parceiros saiu da aplicação junto com o fechamento do relatório.
 * 2.44: gráficos do contrato desde maio (meses antes da aplicação vêm dos Anexos do relatório, marcados), resumo do período
 *      em cada gráfico e "Destaques do contrato".
 * 2.41: aba "Programa Parceiros": números automáticos da máscara (conferir/atualizar), "Copiar prompt" com os depoimentos do
 *      mês (sem nomes) para o Gemini e os textos revisados gravados nas linhas 18 e 20.
 * 2.39: aba "Anexos do relatório": confere (sem gravar) o Controle de manifestações e as linhas automáticas dos Indicadores
 *      e atualiza na hora; a rotina das 12h e 0h faz o mesmo sozinha.
 * 2.49: "Entregas do mês" reúne a planilha de controle, os Anexos do relatório e o Programa Parceiros (antes três lugares);
 *      "Qualidade dos relatos" fica só com os gráficos (a lista e o comentário privado estão na ferramenta Relatos).
 */
window.CPTGestao = (() => {
  'use strict';
  const ic = (n, e) => window.CPTic ? window.CPTic(n, e) : e; // ícone no visual novo, emoji no atual
  let ui = null, ticket = 0, painel = null, aba = 'contrato', pular = '', filtroFrente = {busca: '', andamento: true};
  const $ = id => document.getElementById(id);
  const mesCurto = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'short'}).replace('.', '');
  const mesLongo = m => new Date(m + '-15T12:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;
  const medidor = (v, meta) => `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${v}" aria-label="${v} de ${meta}"><span style="width:${pct(v, meta)}%"></span></div>`;
  /** Abas antigas (Anexos, Programa Parceiros) viraram partes de "Entregas do mês": abre a aba e desce até a parte. */
  const ENTREGAS = {anexos: 'anexosBox', parceiros: 'parceirosBox', controle: 'controleContrato'};
  const marcar = k => { if (ENTREGAS[k]) { aba = 'entregas'; pular = ENTREGAS[k]; } else { aba = k; pular = ''; } };
  const tile = (rotulo, valor, nota, extra = '') => `<div class="stat-tile"><span class="stat-label">${rotulo}</span><span class="stat-value">${valor}</span>${extra}<span class="stat-note">${nota}</span></div>`;

  /** Barras verticais simples (SVG próprio): uma ou duas séries, valor escrito em cima de cada barra. Sem valor (null): sem barra e "—".
   *  o (opcional): {sufixo: '%', max: 100}. 2.35: todo gráfico leva "Copiar imagem" e "Copiar tabela". */
  function colunas(serie, campos, titulo, o = {}) {
    if (!serie || !serie.length) return `<figure class="mini-chart"><figcaption>${titulo}</figcaption><p class="muted small">Sem dados no período.</p></figure>`;
    const W = 300, H = 150, base = 118, alto = 92, n = serie.length, passo = W / n, max = o.max || Math.max(1, ...serie.flatMap(s => campos.map(c => s[c.k] || 0))), suf = o.sufixo || '';
    const larg = Math.min(26, (passo - 10) / campos.length);
    const anexo = s => o.anexos !== false && s.fonte === 'anexos';
    const barras = serie.map((s, i) => campos.map((c, j) => { const v = s[c.k], h = Math.round((v || 0) / max * alto), x = i * passo + (passo - larg * campos.length) / 2 + j * larg, t = v == null ? '—' : v + suf;
      return `<rect class="col-bar ${c.cls || ''} ${anexo(s) ? 'is-anexo' : ''}" x="${x}" y="${base - h}" width="${larg - 2}" height="${h}" rx="3"><title>${ui.esc(c.nome + ' em ' + mesLongo(s.mes) + ': ' + t + (anexo(s) ? ' (Anexos do relatório)' : ''))}</title></rect><text class="col-val" x="${x + (larg - 2) / 2}" y="${base - h - 4}" text-anchor="middle">${n > 8 && String(t).length > 3 ? '' : t}</text>`; }).join('') +
      `<text class="axis" x="${i * passo + passo / 2}" y="${H - 12}" text-anchor="middle">${mesCurto(s.mes)}</text>`).join('');
    const resumo = serie.map(s => mesLongo(s.mes) + ': ' + campos.map(c => c.nome + ' ' + (s[c.k] == null ? 'sem dados' : s[c.k] + suf)).join(', ')).join('; ');
    // 2.44: resumo do período embaixo do gráfico (total, média e melhor mês; ou o total de cada série).
    const vals = c => serie.map(s => s[c.k]).filter(v => v != null), fmt = v => ui.num(v) + suf;
    const rodape = o.resumo === false ? '' : campos.length === 1 ? (() => { const v = vals(campos[0]); if (!v.length) return ''; const tot = v.reduce((a, b) => a + b, 0), top = serie.filter(s => s[campos[0].k] != null).sort((a, b) => b[campos[0].k] - a[campos[0].k])[0];
        // 2.48.1: porcentagem não se soma (era "Total 294%"): mostra só a média.
        const pct = suf === '%', media = o.media || pct;
        return `<p class="chart-resumo">${media ? 'Média ' + fmt(Math.round(tot / v.length * (pct ? 1 : 10)) / (pct ? 1 : 10)) + (pct ? '' : '/mês') : 'Total ' + fmt(tot) + ' · média ' + fmt(Math.round(tot / v.length)) + '/mês'} · melhor: ${mesCurto(top.mes)} (${fmt(top[campos[0].k])})</p>`; })()
      : `<p class="chart-resumo">${campos.map(c => c.nome + ': ' + fmt(vals(c).reduce((a, b) => a + b, 0))).join(' · ')} no período</p>`;
    const copiar = window.CPTGraficos ? window.CPTGraficos.acoes({titulo, subtitulo: o.subtitulo || (n === 6 ? 'Últimos seis meses' : 'De ' + mesLongo(serie[0].mes)) + ' · até ' + mesLongo(serie[serie.length - 1].mes), tipo: 'colunas', sufixo: suf, max: o.max,
      fonte: o.fonte, rotulos: serie.map(s => mesCurto(s.mes)), rotuloTabela: 'Mês', series: campos.map(c => ({nome: c.nome, valores: serie.map(s => s[c.k] == null ? null : s[c.k])})), tabela: o.tabela}) : '';
    return `<figure class="mini-chart"><figcaption>${titulo}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ui.esc(titulo + '. ' + resumo)}"><line class="baseline" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${barras}</svg>${campos.length > 1 ? `<p class="chart-key">${campos.map(c => `<span class="key-swatch ${c.cls || ''}"></span>${c.nome}`).join(' ')}</p>` : ''}${rodape}${copiar}</figure>`;
  }
  /** Barras horizontais com rótulo e número (lista acessível). o (opcional): {titulo, subtitulo, max, sufixo, texto: x => '…', serie, tabela}. */
  function barrasH(lista, vazio, o = {}) {
    if (!lista || !lista.length || !lista.some(x => x.quantidade)) return `<p class="muted">${vazio}</p>`;
    const max = o.max || Math.max(...lista.map(x => x.quantidade)), suf = o.sufixo || '';
    const copiar = o.titulo && window.CPTGraficos ? window.CPTGraficos.acoes({titulo: o.titulo, subtitulo: o.subtitulo || mesLongo(ui.state.mes), tipo: 'barras', sufixo: suf, max: o.max,
      fonte: o.fonte, rotulos: lista.map(x => x.rotulo || x.nome), rotuloTabela: o.rotuloTabela || '', series: [{nome: o.serie || 'Quantidade', valores: lista.map(x => x.quantidade)}], tabela: o.tabela}) : '';
    return `<ul class="hbars">${lista.map(x => `<li><span class="hbar-label">${ui.esc(x.rotulo || x.nome)}</span><span class="hbar-track" aria-hidden="true"><span style="width:${pct(x.quantidade, max)}%"></span></span><strong>${o.texto ? ui.esc(o.texto(x)) : ui.num(x.quantidade) + suf}</strong></li>`).join('')}</ul>${copiar}`;
  }

  // ---------------- Painel da gestão ----------------
  // 2.11: o painel vive dentro da Visão do mês, em abas (Resumo do mês · Contrato · Frentes · Relatos).
  async function renderPainel(atualizar = false) {
    const mine = ++ticket, mes = ui.state.mes;
    if (atualizar) { comparacao = null; anexos = null; parceiros = null; }
    if (!painel || painel.mes !== mes) { ui.view.innerHTML = abas() + '<div class="loading-label"><span class="spinner"></span>Reunindo os números do mês…</div><div class="stat-row">' + '<div class="skeleton"></div>'.repeat(4) + '</div>'; }
    try {
      const d = await ui.call('carregarPainelGestaoCPT', {mes, atualizar}); if (mine !== ticket || ui.state.route !== 'painel') return;
      painel = d; desenharPainel();
    } catch (e) { if (mine === ticket) ui.view.innerHTML = abas() + `<div class="notice">${ui.esc(e.message)}</div>`; }
  }
  /** Abas da Visão do mês para a gestão. sel: aba marcada ('resumo' na própria Visão do mês). */
  function abas(sel) {
    const atual = sel || aba;
    return `<div class="segmented painel-tabs mes-tabs" role="tablist" aria-label="Partes da Visão do mês">${[['resumo', 'Resumo do mês'], ['cronograma', 'Cronograma']].concat(ui.state.route === 'painel' || ui.podeVer('painel') ? [['contrato', 'Contrato'], ['frentes', 'Frentes de serviço'], ['relatos', 'Qualidade dos relatos'], ['entregas', 'Entregas do mês']] : []).map(([k, n]) => `<button role="tab" aria-selected="${atual === k}" class="${atual === k ? 'chosen' : ''}" data-painel-aba="${k}">${n}</button>`).join('')}</div>`;
  }
  function desenharPainel() {
    if (!['contrato', 'frentes', 'relatos', 'entregas'].includes(aba)) aba = 'contrato';
    const corpo = aba === 'frentes' ? frentes() : aba === 'entregas' ? entregas() : aba === 'relatos' ? `<div id="relatosQualidade"></div>
      <section class="panel rel-ir"><div><h2>Os relatos do mês</h2><p>Cartões com o texto de cada relato, os pontos para melhorar e o comentário privado da gestão.</p></div><button class="button secondary" data-route="registros" data-filter="relatos">Ver os relatos ${ui.icon('arrow')}</button></section>` : contrato();
    ui.view.innerHTML = abas() + `<div class="painel-body">${corpo}</div><p class="small muted painel-foot">Atualizado às ${new Date(painel.atualizadoEm).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'})}. Use o botão Atualizar no topo para recalcular.</p>`;
    if (aba === 'relatos') carregarQualidade();
    if (aba === 'frentes') carregarComparacao();
    if (aba === 'entregas') { carregarControle(); carregarAnexos(); carregarParceiros(); }
  }
  /** 2.49: as três entregas mensais num lugar só, cada uma com o seu quadro (carregam juntas). */
  function entregas() {
    const parte = (id, t, d) => `<button type="button" class="entrega-atalho" data-pular="${id}"><strong>${t}</strong><span>${d}</span></button>`;
    return `<nav class="entregas-indice" aria-label="Entregas do mês">${parte('controleContrato', 'Planilha de controle', 'Preenchida à mão pela gestão')}${parte('anexosBox', 'Anexos do relatório', 'Indicadores e Controle de manifestações')}${parte('parceirosBox', 'Programa Parceiros', 'Números da máscara e depoimentos')}</nav>
      <section class="panel controle-contrato" id="controleContrato" aria-live="polite"><div class="loading-label"><span class="spinner"></span>Planilha de controle do contrato…</div></section>
      <div id="anexosBox" class="entrega-parte"></div><div id="parceirosBox" class="entrega-parte"></div>`;
  }
  /** Vindo de uma missão ou da busca (ex.: Anexos), desce até a parte quando ela aparece. */
  function irParaParte(id) { if (pular !== id) return; pular = ''; const el = $(id); if (el) requestAnimationFrame(() => el.scrollIntoView({block: 'start'})); }
  function contrato() {
    const c = painel.contrato, s = c.pesquisas, k = c.casos;
    // 2.48.1: o "Pede atenção" fica só no Resumo do mês. 2.49: a planilha de controle foi para "Entregas do mês".
    return `<section class="stat-row" aria-label="Números do contrato no mês">
        ${tile('Ações socioambientais', ui.num(c.acoes), ui.num(c.pessoas) + ' pessoas alcançadas · ' + ui.num(c.frentes) + ' frentes · ' + ui.num(c.bairros) + ' bairros.')}
        ${tile('Pesquisas de satisfação', ui.num(s.mes) + '<small> / ' + s.meta + '</small>', s.semana ? 'Nesta semana: ' + s.semana.total + ' de ' + s.semana.meta + '.' : 'Meta: 15 por semana, 60 no mês.', medidor(s.mes, s.meta))}
        ${tile('Atendimentos em aberto', ui.num(k.abertos), ui.num(k.recebidosMes) + ' recebidos e ' + ui.num(k.concluidosMes) + ' concluídos no mês' + (k.prazoMedio != null ? ' · prazo médio ' + k.prazoMedio + ' dias' : '') + '.')}
        ${tile('Relatos de atividade', ui.num(c.relatos.total), ui.num(c.diagnosticos) + (c.diagnosticos === 1 ? ' diagnóstico no mês.' : ' diagnósticos no mês.'))}
      </section>
      <div class="painel-grid">
        ${destaques()}<section class="panel wide"><div class="panel-head"><div><h2>${painel.serie.length === 6 && painel.serie[0].mes < '2026-05' ? 'Últimos seis meses' : 'Desde ' + mesLongo(painel.serie[0].mes)}</h2><p>Pela data de realização de cada atividade${painel.destaques && painel.destaques.mesesAnexos.length ? '; meses mais claros vêm dos Anexos do relatório (números já entregues ao cliente)' : ''}.</p></div></div><div class="mini-charts">
          ${colunas(painel.serie, [{k: 'acoes', nome: 'Ações'}], 'Ações socioambientais')}${colunas(painel.serie, [{k: 'pessoas', nome: 'Pessoas'}], 'Pessoas alcançadas')}
          ${colunas(painel.serie, [{k: 'pesquisas', nome: 'Pesquisas'}], 'Pesquisas de satisfação', {anexos: false})}${colunas(painel.serie, [{k: 'recebidos', nome: 'Recebidos', cls: 'b'}, {k: 'concluidos', nome: 'Concluídos', cls: 'c'}], 'Atendimentos')}</div></section>
        <section class="panel"><div class="panel-head"><div><h2>Ações por eixo</h2><p>Contagem do mês por tipo de atividade.</p></div></div>${barrasH(painel.porItem.map(x => ({rotulo: x.item + ' · ' + x.titulo, quantidade: x.quantidade})), 'Sem ações no mês.', {titulo: 'Ações por eixo', serie: 'Ações', rotuloTabela: 'Eixo'})}</section>
        <section class="panel"><div class="panel-head"><div><h2>Tipos de atividade</h2><p>As mais frequentes no mês.</p></div></div>${barrasH(painel.porTipo, 'Sem ações no mês.', {titulo: 'Tipos de atividade', serie: 'Ações', rotuloTabela: 'Tipo'})}</section>
      </div>`;
  }
  /** 2.44: números que contam a história do período. */
  function destaques() {
    const d = painel.destaques; if (!d) return '';
    const pct = v => (v > 0 ? '+' : '') + v + '%', item = (n, t, nota, cls = '') => `<div class="destaque ${cls}"><strong>${n}</strong><span>${t}</span>${nota ? `<small>${nota}</small>` : ''}</div>`;
    const de = mesLongo(d.de).replace(/ de \d{4}$/, ''), itens = [
      item(ui.num(d.acoes), 'ações socioambientais desde ' + de, ui.num(d.pessoas) + ' pessoas alcançadas no período.'),
      d.porAcao != null ? item(String(d.porAcao).replace('.', ','), 'pessoas por ação, em média', d.porAcaoMes != null ? 'Em ' + mesCurto(d.ate) + ': ' + String(d.porAcaoMes).replace('.', ',') + '.' : '') : '',
      d.melhor ? item(mesLongo(d.melhor.mes).split(' de ')[0].replace(/^./, x => x.toUpperCase()), 'mês com mais ações', ui.num(d.melhor.acoes) + ' ações.') : '',
      d.variacao != null ? item(pct(d.variacao), 'ações em ' + mesCurto(d.ate) + ' vs ' + mesCurto(d.anterior), d.variacao >= 0 ? 'Mais ações que no mês anterior.' : 'Menos ações que no mês anterior.', d.variacao >= 0 ? 'is-up' : 'is-down') : '',
      item(ui.num(d.concluidos) + '<small>/' + ui.num(d.recebidos) + '</small>', 'atendimentos concluídos / recebidos', d.saldo >= 0 ? 'A carteira diminuiu no período.' : 'Entraram ' + ui.num(-d.saldo) + ' casos a mais do que saíram.', d.saldo >= 0 ? 'is-up' : 'is-down'),
      d.impressos ? item(ui.num(d.impressos), 'materiais impressos entregues', 'Comunicados, panfletos e cartas (Anexos).') : '',
      d.tenda ? item(ui.num(d.tenda), 'pessoas atendidas na tenda / UMS', 'Soma do período (Anexos).') : '',
      d.parceiros ? item(ui.num(d.parceiros.valor), 'contatos na Matriz da Sabesp', 'Em ' + mesCurto(d.parceiros.mes) + '.') : ''].filter(Boolean);
    return `<section class="panel wide destaques-contrato"><div class="panel-head"><div><span class="eyebrow">DESTAQUES DO CONTRATO</span><h2>De ${ui.esc(mesLongo(d.de))} a ${ui.esc(mesLongo(d.ate))}</h2></div></div><div class="destaques">${itens.join('')}</div></section>`;
  }
  function frentes() {
    const b = ui.norm(filtroFrente.busca), lista = painel.frentes.filter(f => (!filtroFrente.andamento || f.situacao === 'Em andamento' || f.acoes || f.casosAbertos) && (!b || ui.norm(f.nome + ' ' + f.bairros.join(' ')).includes(b)));
    const card = (f, i) => {
      const parada = f.situacao === 'Em andamento' && (f.diasSemRegistro === null || f.diasSemRegistro > 14);
      return `<article class="front-card ${parada ? 'is-late' : ''}"><div class="card-top"><span class="badge ${f.situacao === 'Em andamento' ? 'status-concluida' : f.situacao === 'Paralisada' ? 'status-andamento' : ''}">${ui.esc(f.situacao)}</span>${f.impacto ? `<span class="small muted">Impacto ${ui.esc(f.impacto)}</span>` : ''}</div>
        <h3>${ui.esc(f.nome)}</h3><p class="small muted">${ui.esc(f.bairros.join(', ') || f.endereco || 'Bairros não informados')}</p>
        <dl class="front-numbers"><div><dt>Ações</dt><dd>${f.acoes}</dd></div><div><dt>Pessoas</dt><dd>${ui.num(f.pessoas)}</dd></div><div><dt>Diagnósticos</dt><dd>${f.diagnosticos}</dd></div><div><dt>Casos abertos</dt><dd>${f.casosAbertos}</dd></div></dl>
        <p class="small ${parada ? 'late-text' : 'muted'}">${f.ultimo ? 'Último registro em ' + ui.date(f.ultimo) + ' (há ' + f.diasSemRegistro + (f.diasSemRegistro === 1 ? ' dia' : ' dias') + ')' : 'Nenhum registro de atividade ainda'}</p>
        <button class="button ghost" data-frente="${i}">Ver a frente ${ui.icon('arrow')}</button></article>`;
    };
    return `<section class="panel filter-panel"><form id="frenteFiltro" class="filters"><label class="field">Localizar frente<span class="search-input">${ui.icon('search')}<input name="busca" value="${ui.esc(filtroFrente.busca)}" placeholder="Nome da obra ou bairro" maxlength="100"></span></label><label class="reduced"><input type="checkbox" name="andamento" ${filtroFrente.andamento ? 'checked' : ''}> Só frentes ativas no mês</label></form></section>
      <section class="panel obras-cmp"><div class="panel-head"><div><h2>Obras ativas × ações</h2><p>Obras confirmadas a cada dia (Obras → Obras de hoje) comparadas com as ações registradas.</p></div></div><div id="obrasComparacao"><div class="skel-list" aria-hidden="true"><div class="skeleton"></div></div></div></section>
      <div class="results-head"><span>${lista.length} ${lista.length === 1 ? 'frente' : 'frentes'}</span><span>Em vermelho: em andamento e sem registro há mais de 14 dias</span></div>
      <div class="cards front-cards">${lista.map(f => card(f, painel.frentes.indexOf(f))).join('') || '<p class="muted">Nenhuma frente com esse filtro.</p>'}</div>`;
  }
  function abrirFrente(i) {
    const f = painel.frentes[i]; if (!f) return;
    $('detailType').textContent = 'FRENTE DE SERVIÇO'; $('detailTitle').textContent = f.nome;
    $('detailContent').innerHTML = `<dl class="detail-summary"><div><dt>Situação</dt><dd>${ui.esc(f.situacao)}</dd></div><div><dt>Bairros</dt><dd>${ui.esc(f.bairros.join(', ') || 'Não informado')}</dd></div><div><dt>Endereço</dt><dd>${ui.esc(f.endereco || 'Não informado')}</dd></div><div><dt>No mês</dt><dd>${f.acoes} ações · ${ui.num(f.pessoas)} pessoas · ${f.diagnosticos} diagnósticos · ${f.casosMes} casos recebidos</dd></div></dl>
      <h3 class="answers-head">Atividades do mês</h3>${f.atividades.length ? `<div class="mini-list">${f.atividades.map(a => `<button class="mini-row" data-record="${ui.esc(a.id)}"><strong>${ui.esc(a.atividade)}${a.diagnostico ? ' (diagnóstico)' : ''}</strong><small>${ui.date(a.data)} · ${ui.esc([a.bairro, a.publico != null ? a.publico + ' pessoas' : 'público não informado', a.responsavel].filter(Boolean).join(' · '))}</small></button>`).join('')}</div>` : '<p class="muted">Nenhuma atividade registrada nesta frente no mês.</p>'}
      <h3 class="answers-head">Atendimentos em aberto</h3>${f.casos.length ? `<div class="mini-list">${f.casos.map(c => `<button class="mini-row" data-case="${ui.esc(c.protocolo)}"><strong>${ui.esc(c.caso ? c.caso + ' (' + c.protocolo + ')' : c.protocolo)} · ${ui.esc(c.assunto || 'Assunto não informado')}</strong><small>${ui.esc(c.status || 'Em aberto')}${c.dias != null ? ' · ' + c.dias + ' dias' : ''}</small></button>`).join('')}</div>` : '<p class="muted">Nenhum atendimento em aberto ligado a esta frente.</p>'}`;
    if (!$('detailDialog').open) $('detailDialog').showModal();
  }
  // ---------- Obras ativas × ações (por dia e no mês) ----------
  let comparacao = null, diaCmp = '';
  async function carregarComparacao() {
    if (!$('obrasComparacao')) return;
    if (!comparacao || comparacao.mesRef !== ui.state.mes) {
      try { const r = await ui.call('compararObrasDoMesCPT', ui.state.mes); comparacao = {...r, mesRef: ui.state.mes}; }
      catch (e) { const box = $('obrasComparacao'); if (box) box.innerHTML = `<div class="notice">${ui.esc(e.message)}</div>`; return; }

    const box = $('controleContrato'), c = controle; if (!box || !c) return;

    const situacao = c.respondida ? `<span class="controle-situacao is-feita">${ic('tick', '✓')} Respondida por ${ui.esc(c.respondida.nome)} em ${ui.esc(quando(c.respondida.em))}</span>`
      : `<span class="controle-situacao ${c.atrasada ? 'is-atrasada' : ''}">${c.atrasada ? 'Atrasada · prazo era ' : 'Pendente · prazo '}${dataBr(c.prazo)}</span>`;
    const nums = (c.indicadores || []).map(x => `<div class="controle-num"><b>${ui.num(x.valor)}</b><span>${ui.esc(x.nome)}</span>${x.nota ? `<small>${ui.esc(x.nota)}</small>` : ''}</div>`).join('');
    box.classList.toggle('is-feita', !!c.respondida);
    irParaParte('controleContrato');
    box.innerHTML = `<div class="panel-head"><div><span class="eyebrow">PLANILHA DE CONTROLE · PREENCHIDA À MÃO</span><h2>${c.respondida ? 'Planilha de ' + ui.esc(c.mesNome) + ' respondida' : 'Responder a planilha de controle de ' + ui.esc(c.mesNome)}</h2>
      <p>Todo mês a gestão preenche esta planilha à mão. A aplicação não escreve nela: só lembra, abre o link e traz os números do mês para conferir.</p></div>${situacao}</div>
      <div class="controle-acoes"><a class="button" href="${ui.esc(c.url)}" target="_blank" rel="noopener noreferrer">${ic('file', '📄')} Abrir a planilha de controle ↗</a>
        ${c.podeMarcar ? (c.respondida ? '<button class="button secondary" data-controle-marcar="nao">Desfazer “respondida”</button>' : '<button class="button secondary" data-controle-marcar="sim">' + ic('tick', '✓') + ' Já respondi este mês</button>') : ''}
        ${c.ultimaAlteracao ? `<small class="muted">Última alteração no arquivo: ${ui.esc(quando(c.ultimaAlteracao))}</small>` : ''}</div>
      ${nums ? `<details class="controle-indicadores" ${c.respondida ? '' : 'open'}><summary>Indicadores de ${ui.esc(c.mesNome)} para conferir ao preencher</summary><div class="controle-nums">${nums}</div><p class="small muted">Calculados pela aplicação a partir dos registros e atendimentos. Confira antes de transcrever.</p></details>` : ''}`;
  }
  async function marcarControle(sim) {
    if (!controle) return;
    try { const r = await ui.call('marcarControleContratoCPT', {mes: controle.mes, respondida: sim, versao: controle.versao, operacaoId: 'OP-' + crypto.randomUUID()}); controle.respondida = r.respondida; controle.versao = r.versao; controle.atrasada = !r.respondida && controle.hoje > controle.prazo; ui.toast(r.resultado); desenharControle(); }
    catch (e) { ui.toast(e.message); }
  }
  function init(api) {
    ui = api;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-painel-aba]'); if (t) { if (t.dataset.painelAba === 'resumo') { ui.navigate('inicio'); return; } if (t.dataset.painelAba === 'cronograma') { ui.navigate('cronograma'); return; } marcar(t.dataset.painelAba); if (ui.state.route !== 'painel') ui.navigate('painel'); else if (painel) desenharPainel(); return; }
      const pl = e.target.closest('[data-pular]'); if (pl) { const el = $(pl.dataset.pular); if (el) el.scrollIntoView({block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); return; }
      if (e.target.closest('[data-anexos-atualizar]')) { carregarAnexos(true); return; }
      if (e.target.closest('[data-parceiros-atualizar]')) { carregarParceiros(true); return; }
      if (e.target.closest('[data-parceiros-prompt]')) { copiarPrompt(); return; }
      const cm = e.target.closest('[data-controle-marcar]'); if (cm) { marcarControle(cm.dataset.controleMarcar === 'sim'); return; }
      const f = e.target.closest('[data-frente]'); if (f) { abrirFrente(Number(f.dataset.frente)); return; }
      const cd = e.target.closest('[data-cmp-dia]'); if (cd) { diaCmp = cd.dataset.cmpDia; desenharComparacao(); return; }
    });
    // Filtros com espera curta (debounce): o painel é redesenhado quando a pessoa para de digitar.
    let buscaTimer = null;
    const redesenhar = (form, desenhar) => {
      const f = $(form); if (!f) return;
      const i = f.elements.busca, foco = document.activeElement === i, pos = foco ? i.selectionStart : null;
      desenhar(f);
      const n = $(form) && $(form).elements.busca; if (n && foco) { n.focus(); n.setSelectionRange(pos, pos); }
    };
    document.addEventListener('input', e => {
      const f = e.target.closest('#frenteFiltro');
      if (f) { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => redesenhar('frenteFiltro', x => { filtroFrente = {busca: x.elements.busca.value, andamento: x.elements.andamento.checked}; desenharPainel(); }), e.target.name === 'busca' ? 220 : 0); }
    });
    document.addEventListener('change', e => {
      const f = e.target.closest('#frenteFiltro'); if (f && e.target.name === 'andamento') { filtroFrente.andamento = e.target.checked; desenharPainel(); }
    });
    document.addEventListener('submit', e => { if (e.target.id === 'ppTextos') { e.preventDefault(); gravarTextos(e.target); } });
    document.addEventListener('submit', async e => {
      const f = e.target.closest('.connector-form'); if (!f) return; e.preventDefault();
      const b = f.querySelector('button'); b.disabled = true;
      try { const r = await ui.call('configurarConectorCPT', {chave: f.dataset.conector, id: f.elements.id.value}); ui.toast(r.resultado); renderConectores(); }
      catch (err) { ui.toast(err.message); } finally { b.disabled = false; }
    });
  }
  // Missões e cartões que levam a uma aba do painel (ex.: obras de ontem → Frentes): marca a aba antes de navegar.
  document.addEventListener('click', ev => { const ir = ev.target.closest && ev.target.closest('[data-painel-ir]'); if (ir) marcar(ir.dataset.painelIr); }, true);
  return {init, renderPainel, renderConectores, colunas, barrasH, abas, irPara: marcar};
})();

/* Guia "Como escrever um bom relato": aberto pelas missões do Meu espaço e pela ferramenta Relatos. (2.27: veio da antiga Mesa.) */
window.CPTGuiaRelato = (() => {
  'use strict';
  const PONTOS = [
    ['O quê', 'A atividade e o tema.', 'Roda de conversa sobre descarte correto de óleo de cozinha.'],
    ['Onde', 'Rua, escola, praça ou equipamento, além do bairro.', 'Na EMEF Jardim Ipanema, Rua das Flores, 120 (Vila Linda).'],
    ['Público', 'Quem participou e quantas pessoas, em número.', '22 alunos do 5º ano e 2 professoras.'],
    ['Resultado', 'O que aconteceu: dúvidas, o que entenderam, o que foi entregue.', 'As crianças perguntaram para onde vai o óleo e levaram folhetos para casa.'],
    ['Encaminhamento', 'O que fica para depois. Se nada, escreva "sem encaminhamentos".', 'Ficou combinado o ponto de coleta na escola a partir de 10/11.'],
    ['Tamanho', 'Pelo menos 5 linhas: o relato vira texto do relatório para a Sabesp.', '']];
  function html(faltam) {
    const f = new Set(faltam || []);
    return `<div class="guia-relato"><p>Um bom relato responde a seis perguntas. Escreva como se contasse para alguém que não estava lá.</p>
      <ol class="guia-pontos">${PONTOS.map(([t, d, ex]) => `<li class="${f.has(t) ? 'falta' : ''}"><strong>${t}${f.has(t) ? ' <span class="guia-falta">faltou aqui</span>' : ''}</strong><span>${d}</span>${ex ? `<em>Ex.: ${ex}</em>` : ''}</li>`).join('')}</ol>
      <details><summary>Exemplo completo</summary><p class="guia-exemplo">Realizamos uma roda de conversa sobre descarte correto de óleo de cozinha na EMEF Jardim Ipanema (Rua das Flores, 120, Vila Linda), com 22 alunos do 5º ano e 2 professoras. As crianças perguntaram para onde vai o óleo depois da coleta e por que ele não pode ir para a pia; explicamos o entupimento da rede e a contaminação do córrego. Cada aluno levou um folheto para casa. Ficou combinado com a direção um ponto de coleta na escola a partir de 10/11, que a equipe vai acompanhar.</p></details>
      <p class="small muted">A conferência automática é uma ajuda para escrever. Ninguém recebe nota e não existe ranking.</p></div>`;
  }
  function abrir(faltam) {
    document.getElementById('detailType').textContent = 'GUIA'; document.getElementById('detailTitle').textContent = 'Como escrever um bom relato';
    document.getElementById('detailContent').innerHTML = html(faltam);
    const d = document.getElementById('detailDialog'); if (!d.open) d.showModal();
  }
  document.addEventListener('click', ev => { const g = ev.target.closest('[data-guia-relato]'); if (g) abrir((g.dataset.guiaRelato || '').split('|').filter(Boolean)); });
  return {abrir, html};
})();
