<script>
window.CPTOrganograma=(()=>{"use strict";const ic=(n,e)=>window.CPTic?window.CPTic(n,e):e;let ui=null,d=null,ticket=0,enviando=false;const $=id=>document.getElementById(id);const op=()=>"OP-"+crypto.randomUUID();const INTRO=["Organograma","Quem \xE9 quem na equipe, em que \xE1rea e a quem cada pessoa responde. Baixe em imagem, SVG ou PDF para apresenta\xE7\xF5es e para quem est\xE1 chegando."];const COR={gestao:"#1f5f8b",administrativo:"#55606e",socioambiental:"#2d6a4f",comunicacao:"#b4532f",atendimento:"#2f7cbf",comercializacao:"#9a6a1f",campo:"#5f8a2e",parceiros:"#6f55a3"};const W=240,H=100,GX=26,GY=60,PAD=36,TOPO=104,RECUO=30;const xml=s=>String(s==null?"":s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;","'":"&#39;"})[c]);const corta=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1).trim()+"\u2026":s};const iniciais=nome=>(String(nome||"").replace(/[^\p{L}\s]/gu," ").split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join("")||"?").toUpperCase();const mesAno=iso=>{if(!iso)return"";const s=new Date(iso).toLocaleDateString("pt-BR",{month:"long",year:"numeric",timeZone:"America/Sao_Paulo"});return s.charAt(0).toUpperCase()+s.slice(1)};function arvore(pessoas){const mapa=new Map(pessoas.map(p=>[p.id,{...p,filhos:[]}])),raizes=[];mapa.forEach(n=>{const pai=n.chefia&&n.chefia!==n.id&&mapa.get(n.chefia);if(pai)pai.filhos.push(n);else raizes.push(n)});const ord=(a,b)=>a.ordem-b.ordem||a.nome.localeCompare(b.nome,"pt-BR");mapa.forEach(n=>n.filhos.sort(ord));return raizes.sort(ord)}function medir(n){n.filhos.forEach(medir);n.pilha=n.filhos.length>3&&n.filhos.every(f=>!f.filhos.length);n.w=!n.filhos.length?W:n.pilha?W+RECUO:Math.max(W,n.filhos.reduce((s,f)=>s+f.w,0)+GX*(n.filhos.length-1))}function posicionar(n,x,y,L,todos){todos.push(n);n.y=y;if(n.pilha){n.x=x;n.filhos.forEach((f,i)=>{f.x=x+RECUO;f.y=y+H+20+i*(H+14);f.pilha=false;todos.push(f)});const ult=n.filhos[n.filhos.length-1];L.push("M".concat(x+16,",").concat(y+H," V").concat(ult.y+H/2));n.filhos.forEach(f=>L.push("M".concat(x+16,",").concat(f.y+H/2," H").concat(f.x)));return}n.x=x+(n.w-W)/2;if(!n.filhos.length)return;const soma=n.filhos.reduce((s,f)=>s+f.w,0)+GX*(n.filhos.length-1);let cx=x+(n.w-soma)/2;const meio=y+H+GY/2,centros=[];n.filhos.forEach(f=>{posicionar(f,cx,y+H+GY,L,todos);centros.push(f.x+W/2);cx+=f.w+GX});L.push("M".concat(n.x+W/2,",").concat(y+H," V").concat(meio));if(centros.length>1)L.push("M".concat(centros[0],",").concat(meio," H").concat(centros[centros.length-1]));centros.forEach(c=>L.push("M".concat(c,",").concat(meio," V").concat(y+H+GY)))}function cartaoSVG(n){const cor=COR[n.area]||"#55606e",area=(d.areas[n.area]||"").toUpperCase();return"<g class=\"org-no\" data-org-id=\"".concat(xml(n.id),"\" transform=\"translate(").concat(n.x,",").concat(n.y,")\"><rect width=\"").concat(W,"\" height=\"").concat(H,"\" rx=\"14\" fill=\"#ffffff\" stroke=\"#d9dee3\"/><rect width=\"7\" height=\"").concat(H,"\" fill=\"").concat(cor,"\" clip-path=\"url(#orgCartao)\"/>\n      <circle cx=\"40\" cy=\"").concat(H/2,"\" r=\"22\" fill=\"").concat(cor,"\"/><text x=\"40\" y=\"").concat(H/2+5.5,"\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#ffffff\">").concat(xml(iniciais(n.nome)),"</text>\n      <text x=\"72\" y=\"28\" font-size=\"14.5\" font-weight=\"700\" fill=\"#1d2a33\">").concat(xml(corta(n.nome,22)),"</text><text x=\"72\" y=\"47\" font-size=\"12.5\" fill=\"#3d4a55\">").concat(xml(corta(n.cargo,26)),"</text>\n      <text x=\"72\" y=\"68\" font-size=\"9.5\" font-weight=\"700\" letter-spacing=\".8\" fill=\"").concat(cor,"\">").concat(xml(corta(area,24)),"</text>").concat(n.desde?"<text x=\"72\" y=\"86\" font-size=\"10.5\" fill=\"#7a8691\">desde ".concat(xml(corta(n.desde,20)),"</text>"):"","</g>")}function montar(){const raizes=arvore(d.pessoas);raizes.forEach(medir);const L=[],todos=[];let x=PAD;raizes.forEach(r=>{posicionar(r,x,TOPO,L,todos);x+=r.w+GX*2});const largura=Math.max(760,x-GX*2+PAD),fundo=todos.reduce((m,n)=>Math.max(m,n.y+H),TOPO+H);const usadas=Object.keys(d.areas).filter(k=>d.pessoas.some(p=>p.area===k)),yL=fundo+44;let linhaLeg=0,acum=PAD;const legPos=usadas.map(k=>{const t=d.areas[k]+" ("+d.pessoas.filter(p=>p.area===k).length+")",w=34+t.length*7;if(acum+w>largura-PAD&&acum>PAD){linhaLeg++;acum=PAD}const pos=[acum,yL+linhaLeg*24];acum+=w;return[k,t,pos]});const altura=yL+linhaLeg*24+40,data=mesAno(d.atualizadoEm);const svg="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ".concat(largura," ").concat(altura,"\" width=\"").concat(largura,"\" height=\"").concat(altura,"\" font-family=\"Arial, Helvetica, sans-serif\" role=\"img\" aria-label=\"Organograma da equipe\">\n      <defs><clipPath id=\"orgCartao\"><rect width=\"").concat(W,"\" height=\"").concat(H,"\" rx=\"14\"/></clipPath></defs><rect width=\"").concat(largura,"\" height=\"").concat(altura,"\" fill=\"#fbfaf6\"/><rect x=\"0\" y=\"0\" width=\"").concat(largura,"\" height=\"6\" fill=\"#2d6a4f\"/>\n      <text x=\"").concat(PAD,"\" y=\"46\" font-size=\"24\" font-weight=\"700\" fill=\"#1d2a33\">Organograma da equipe</text>\n      <text x=\"").concat(PAD,"\" y=\"70\" font-size=\"13\" fill=\"#55606e\">Cons\xF3rcio Performance Tamanduate\xED \xB7 Socioambiental, Comunica\xE7\xE3o e Atendimento").concat(data?" \xB7 atualizado em "+xml(data.toLowerCase()):"","</text>\n      <path d=\"").concat(L.join(" "),"\" fill=\"none\" stroke=\"#a9b4bd\" stroke-width=\"2\" stroke-linejoin=\"round\"/>").concat(todos.map(cartaoSVG).join(""),"\n      <text x=\"").concat(PAD,"\" y=\"").concat(yL-22,"\" font-size=\"11.5\" fill=\"#7a8691\">Cada cor \xE9 uma \xE1rea. As linhas mostram a quem cada pessoa responde. ").concat(d.pessoas.length," ").concat(d.pessoas.length===1?"pessoa":"pessoas"," em ").concat(usadas.length," ").concat(usadas.length===1?"\xE1rea":"\xE1reas",".</text>\n      ").concat(legPos.map(([k,t,[px,py]])=>"<g transform=\"translate(".concat(px,",").concat(py,")\"><circle cx=\"7\" cy=\"-4\" r=\"7\" fill=\"").concat(COR[k],"\"/><text x=\"20\" y=\"0\" font-size=\"12.5\" fill=\"#3d4a55\">").concat(xml(t),"</text></g>")).join(""),"</svg>");return{svg,largura,altura}}function baixarBlob(blob,nome){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}const nomeArquivo=ext=>"Organograma CPT "+new Date().toISOString().slice(0,10)+"."+ext;function baixarSVG(){baixarBlob(new Blob([montar().svg],{type:"image/svg+xml"}),nomeArquivo("svg"));ui.toast("SVG baixado: abre no navegador e em editores de imagem.")}function baixarPNG(){const m=montar(),img=new Image,k=2;img.onload=()=>{const c=document.createElement("canvas");c.width=m.largura*k;c.height=m.altura*k;const g=c.getContext("2d");g.scale(k,k);g.drawImage(img,0,0,m.largura,m.altura);c.toBlob(b=>{if(b){baixarBlob(b,nomeArquivo("png"));ui.toast("Imagem baixada (PNG em alta resolu\xE7\xE3o).")}else ui.toast("N\xE3o foi poss\xEDvel gerar a imagem. Use o SVG ou o PDF.")},"image/png")};img.onerror=()=>ui.toast("N\xE3o foi poss\xEDvel gerar a imagem. Use o SVG ou o PDF.");img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(m.svg)}function imprimir(){let box=$("orgImpressao");if(!box){box=document.createElement("div");box.id="orgImpressao";document.body.append(box)}box.innerHTML=montar().svg;document.documentElement.classList.add("org-imprimindo");const fim=()=>{document.documentElement.classList.remove("org-imprimindo");box.innerHTML="";window.removeEventListener("afterprint",fim)};window.addEventListener("afterprint",fim);window.print();setTimeout(fim,60000)}function desenhar(){const vazio=!d.pessoas.length,ed=d.podeEditar;const barra="<div class=\"org-acoes\">".concat(vazio?"":"<button class=\"button\" data-org-png>".concat(ic("photo","\uD83D\uDDBC")," Baixar imagem (PNG)</button><button class=\"button secondary\" data-org-pdf>").concat(ic("file","\uD83D\uDCC4")," PDF (imprimir)</button><button class=\"button secondary\" data-org-svg>SVG</button>"),"\n      ").concat(ed?"<button class=\"button secondary\" data-org-novo>".concat(ic("people","\uD83D\uDC64")," Adicionar pessoa</button>").concat(d.foraDoOrganograma?"<button class=\"button secondary\" data-org-importar>Trazer da equipe (".concat(d.foraDoOrganograma,")</button>"):""):"","</div>");const corpo=vazio?"<div class=\"empty\">".concat(ic("people","\uD83D\uDC65"),"<h3>O organograma ainda est\xE1 vazio</h3><p>").concat(ed?"Comece trazendo as pessoas cadastradas em Equipe e acessos; depois ajuste o cargo e a quem cada uma responde.":"A Gest\xE3o ainda vai montar o organograma da equipe.","</p></div>"):"<div class=\"org-quadro ".concat(ed?"pode-editar":"","\" id=\"orgQuadro\">").concat(montar().svg,"</div><p class=\"small muted\">").concat(ed?"Toque num cart\xE3o para editar. ":"","Dica: o PDF sai em A4 deitado; no di\xE1logo de impress\xE3o, escolha \"Salvar como PDF\".</p>");const lista=ed&&!vazio?"<details class=\"panel org-lista\"><summary><strong>Pessoas no organograma (".concat(d.pessoas.length,")</strong></summary><table class=\"simple-table\"><thead><tr><th>Nome</th><th>Cargo</th><th>\xC1rea</th><th>Responde a</th><th></th></tr></thead><tbody>").concat(d.pessoas.map(p=>"<tr><td>".concat(ui.esc(p.nome),"</td><td>").concat(ui.esc(p.cargo),"</td><td><i class=\"org-ponto\" style=\"background:").concat(COR[p.area],"\"></i>").concat(ui.esc(d.areas[p.area]||""),"</td><td>").concat(ui.esc((d.pessoas.find(x=>x.id===p.chefia)||{}).nome||"\u2014"),"</td><td><button class=\"link-button\" data-org-editar=\"").concat(ui.esc(p.id),"\">Editar</button></td></tr>")).join(""),"</tbody></table></details>"):"";ui.view.innerHTML=ui.intro(...INTRO)+"<section class=\"panel org-painel\">".concat(barra).concat(corpo,"</section>").concat(lista)}async function render(){const mine=++ticket;ui.view.innerHTML=ui.intro(...INTRO)+"<div class=\"loading-label\"><span class=\"spinner\"></span>Montando o organograma\u2026</div><div class= " max=\"99\" value=\"").concat(p.ordem||0,"\"></label></div>\n      <div class=\"dialog-actions\"><button class=\"button\" type=\"submit\">Salvar</button>").concat(p.id?"<button class=\"button ghost\" type=\"button\" data-org-tirar>Tirar do organograma</button>":"","</div></form>");if(!$("detailDialog").open)$("detailDialog").showModal()}async function salvar(form,ativo){if(enviando)return;enviando=true;const f=form.elements,erro=$("orgErro");try{const r=await ui.call("salvarOrganogramaCPT",{id:form.dataset.id||"",versao:Number(form.dataset.versao)||0,nome:f.nome.value,cargo:f.cargo.value,area:f.area.value,chefia:f.chefia.value,desde:f.desde.value,ordem:Number(f.ordem.value)||0,ativo,operacaoId:op()});ui.toast(r.resultado);$("detailDialog").close();await render()}catch(e){erro.hidden=false;erro.textContent=e.message}finally{enviando=false}}async function importar(){if(enviando)return;enviando=true;try{const r=await ui.call("importarOrganogramaCPT",{operacaoId:op()});ui.toast(r.resultado);d=r;desenhar()}catch(e){ui.toast(e.message)}finally{enviando=false}}function init(api){ui=api;document.addEventListener("click",e=>{if(ui.state.route!=="organograma"||!d)return;const t=e.target;if(t.closest("[data-org-png]")){baixarPNG();return}if(t.closest("[data-org-svg]")){baixarSVG();return}if(t.closest("[data-org-pdf]")){imprimir();return}if(t.closest("[data-org-novo]")){editar("");return}if(t.closest("[data-org-importar]")){importar();return}const ed=t.closest("[data-org-editar]");if(ed){editar(ed.dataset.orgEditar);return}const no=t.closest("#orgQuadro .org-no");if(no&&d.podeEditar){editar(no.dataset.orgId);return}if(t.closest("[data-org-tirar]")){const form=$("orgForm");if(form&&confirm("Tirar esta pessoa do organograma? Ela continua no hist\xF3rico."))salvar(form,false)}});document.addEventListener("submit",e=>{if(e.target.id!=="orgForm")return;e.preventDefault();salvar(e.target,true)})}return{init,render,montar:()=>d?montar():null}})();
